<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 430" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" font-size="15">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 Q 6 4 8.5 5 Q 6 6 1 8.5" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="1020" height="430" fill="#fdfcf8"/>
  <text x="24" y="34" font-size="20" fill="#1b2230">How a README block becomes a CI assertion</text>

  <!-- README -->
  <path d="M 30 78 Q 26 74 34 74 L 250 72 Q 259 73 258 81 L 260 220 Q 259 228 251 227 L 34 229 Q 27 228 28 220 Z" fill="#f5f3ee" stroke="#5b6472" stroke-width="2.4" stroke-linecap="round"/>
  <text x="46" y="104" fill="#3a3f47">README.md</text>
  <text x="46" y="132" font-size="12" fill="#4c6b45">marked block -&gt; runs in CI</text>
  <text x="46" y="152" font-size="12" fill="#5b6472">curl .../api/v1/query</text>
  <text x="46" y="170" font-size="12" fill="#5b6472">-H "Authorization: Bearer ..."</text>
  <text x="46" y="198" font-size="12" fill="#a04040">unmarked block -&gt; never run</text>
  <text x="46" y="216" font-size="12" fill="#5b6472">cosign verify --certificate...</text>

  <line x1="262" y1="150" x2="322" y2="150" stroke="#444" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- extractor -->
  <path d="M 326 96 Q 322 92 330 92 L 520 90 Q 529 91 528 99 L 530 196 Q 529 204 521 203 L 330 205 Q 323 204 324 196 Z" fill="#fff" stroke="#0e7c86" stroke-width="2.4" stroke-linecap="round"/>
  <text x="344" y="124" fill="#0e7c86">check-readme-commands.sh</text>
  <text x="344" y="148" font-size="12" fill="#5b6472">extracts only the marked set</text>
  <text x="344" y="166" font-size="12" fill="#5b6472">asserts the documented outcome,</text>
  <text x="344" y="184" font-size="12" fill="#5b6472">not the exit code (curl exits 0 on 401)</text>

  <line x1="532" y1="148" x2="592" y2="148" stroke="#444" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- live stack -->
  <path d="M 596 96 Q 592 92 600 92 L 800 90 Q 809 91 808 99 L 810 196 Q 809 204 801 203 L 600 205 Q 593 204 594 196 Z" fill="#eef3f7" stroke="#31536b" stroke-width="2.4" stroke-linecap="round"/>
  <text x="614" y="124" fill="#31536b">the live compose stack</text>
  <text x="614" y="148" font-size="12" fill="#5b6472">MinIO + ravel-server + collector</text>
  <text x="614" y="166" font-size="12" fill="#5b6472">the same file the reader runs,</text>
  <text x="614" y="184" font-size="12" fill="#5b6472">image swapped for the one below</text>

  <!-- build path -->
  <path d="M 596 262 Q 592 258 600 258 L 800 256 Q 809 257 808 265 L 810 350 Q 809 358 801 357 L 600 359 Q 593 358 594 350 Z" fill="#eaf1ea" stroke="#4c6b45" stroke-width="2.4" stroke-linecap="round"/>
  <text x="614" y="290" fill="#4c6b45">cargo build -p ravel-server + ravel-cli</text>
  <text x="614" y="312" font-size="12" fill="#5b6472">--features sql, on the runner, warm sccache;</text>
  <text x="614" y="330" font-size="12" fill="#5b6472">both binaries, because the prebuilt server</text>
  <text x="614" y="348" font-size="12" fill="#5b6472">target COPYs the CLI too (ADR-0050 qualify)</text>

  <line x1="700" y1="254" x2="700" y2="212" stroke="#4c6b45" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="712" y="238" font-size="12" fill="#4c6b45">this PR's own binary</text>

  <!-- verdict -->
  <path d="M 852 96 Q 848 92 856 92 L 986 90 Q 995 91 994 99 L 996 196 Q 995 204 987 203 L 856 205 Q 849 204 850 196 Z" fill="#fff" stroke="#a04040" stroke-width="2.4" stroke-linecap="round"/>
  <text x="868" y="126" fill="#a04040">port wrong?</text>
  <text x="868" y="150" fill="#a04040">table missing?</text>
  <text x="868" y="174" fill="#a04040">header absent?</text>
  <text x="868" y="196" font-size="12" fill="#5b6472">the job fails, not the reader</text>

  <line x1="812" y1="148" x2="846" y2="148" stroke="#444" stroke-width="2" marker-end="url(#arr2)"/>

  <text x="30" y="392" font-size="13" fill="#5b6472">The per-PR job answers "does the README match this branch". A weekly run of the same script against</text>
  <text x="30" y="412" font-size="13" fill="#5b6472">ghcr.io/nofireai/ravel-server:latest answers the other question: "does it match what a reader actually pulls".</text>
</svg>
