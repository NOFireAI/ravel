# Documentation claims registry (ADR-1658). Checked by
# scripts/check-doc-claims.py; the format and the four rules are in that
# script's docstring.
#
# kind: positive | negative | not-a-claim
# status: verified | contradicted | not-implemented
# A contradicted entry carries issue. A not-implemented entry may bind the
# symbol whose arrival would make the sentence false, so the gate fails when it
# lands; one with binds: [] (no symbol to name yet) never trips STATUS.
# binds: path.rs::Symbol[::Symbol], resolved against definitions only.
#
# Seeded from the ADR-1658 Context contradictions and from every normative-doc
# line the NEGATIVE marker list matched when the registry landed; the
# 2026-09-12 review's claim matrix is not in the repository.

# --- The three contradictions ADR-1658's Context names ---------------------

- id: readme-mcp-ships
  doc: README.md
  quote: "It ships behind the `mcp` cargo feature (`cargo build -p ravel-server --features mcp`) and the runtime `--mcp` flag, both off by default"
  kind: positive
  binds:
    - services/ravel-server/src/mcp/adapter.rs::MCP_PATH
    - crates/ravel-mcp/src/tools/mod.rs::dispatch
  status: verified
  note: "Replaced the sentence saying neither the feature nor the flag exists in a build. The mcp feature is defined in services/ravel-server/Cargo.toml, which a bind cannot name; the adapter's route constant and the tool dispatch are the code it gates."

- id: readme-mcp-one-tool-served
  doc: README.md
