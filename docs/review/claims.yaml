# Documentation claims registry (ADR-1658). Checked by
# scripts/check-doc-claims.py; the format and the four rules are in that
# script's docstring.
#
# kind: positive | negative | not-a-claim
# status: verified | contradicted | not-implemented
# A contradicted entry carries issue. A not-implemented entry may bind the
# symbol whose arrival would make the sentence false, so the gate fails when it
# lands; one with binds: [] (no symbol to name yet) never trips STATUS.
# binds: path.rs::Symbol[::Symbol], resolved against definitions only.
#
# Seeded from the ADR-1658 Context contradictions and from every normative-doc
# line the NEGATIVE marker list matched when the registry landed; the
# 2026-09-12 review's claim matrix is not in the repository.

# --- The three contradictions ADR-1658's Context names ---------------------

- id: readme-mcp-ships
  doc: README.md
  quote: "It ships behind the `mcp` cargo feature (`cargo build -p ravel-server --features mcp`) and the runtime `--mcp` flag, both off by default"
  kind: positive
  binds:
    - services/ravel-server/src/mcp/adapter.rs::MCP_PATH
    - crates/ravel-mcp/src/tools/mod.rs::dispatch
  status: verified
  note: "Replaced the sentence saying neither the feature nor the flag exists in a build. The mcp feature is defined in services/ravel-server/Cargo.toml, which a bind cannot name; the adapter's route constant and the tool dispatch are the code it gates."

- id: readme-mcp-one-tool-served
  doc: README.md
  quote: "One tool is served today, `ravel_capabilities`; the other eight are catalogued and refuse calls until their bodies land."
  kind: positive
  binds:
    - crates/ravel-mcp/src/tools/mod.rs::SERVED_TOOLS
    - crates/ravel-mcp/src/tools/mod.rs::tests::dispatch_routes_every_catalog_name_and_refuses_unknown_names
  status: verified
  note: "SERVED_TOOLS holds ravel_capabilities alone; dispatch answers the other eight catalog names with ToolError::NotShipped, and the bound test pins the list against dispatch."

- id: agents-mcp-ships
  doc: docs/guides/agents.md
  quote: "The tools ship behind the `mcp` cargo feature and the `--mcp` flag, both off by default."
  kind: positive
  binds:
    - services/ravel-server/src/mcp/adapter.rs::MCP_PATH
    - crates/ravel-mcp/src/tools/mod.rs::dispatch
  status: verified
  note: "Replaced the banner saying the POST /mcp route does not exist until the feature ships."

- id: agents-mcp-one-tool-served
  doc: docs/guides/agents.md
  quote: "One tool is served today, `ravel_capabilities`."
  kind: positive
  binds:
    - crates/ravel-mcp/src/tools/mod.rs::SERVED_TOOLS
    - crates/ravel-mcp/src/tools/mod.rs::ToolError
    - crates/ravel-mcp/src/tools/mod.rs::tests::dispatch_routes_every_catalog_name_and_refuses_unknown_names
  status: verified
  note: "The other eight catalog names answer ToolError::NotShipped, which the adapter renders as the method_not_found protocol error the banner names."

- id: progress-audit-pipeline-installed
  doc: PROGRESS.md
  quote: "now spawns a real `ravel_maintain::AuditPipeline` and wires every query surface's audit sink to it under `--mode all` and `--mode query`"
  kind: positive
  binds:
    - crates/ravel-maintain/src/audit_pipeline.rs::AuditPipeline
    - services/ravel-server/src/config.rs::Mode::installs_query_audit_pipeline
  status: verified
  note: "Replaced the paragraph saying nothing constructs the real pipeline. services/ravel-server/src/lib.rs start spawns the pipeline when Mode::installs_query_audit_pipeline holds."

- id: progress-audit-required-fails-closed
  doc: PROGRESS.md
  quote: "`audit_mode=required` (the default) does fail closed"
  kind: positive
  binds:
    - crates/ravel-maintain/src/audit_pipeline.rs::tests::every_submit_in_a_failed_batch_errors_in_required_mode
  status: verified
  note: "The bound test fails every submit of a batch whose flush failed under AuditMode::Required."

- id: query-engine-stamp-write-side
  doc: docs/query-engine.md
  quote: "The logs flush stamps each commit record"
  kind: positive
  binds:
    - crates/ravel-ingest/src/log_shard.rs::run_flush
    - crates/ravel-ingest/src/log_declared_stats.rs::build_stamps
    - crates/ravel-maintain/src/rlog.rs::finalize_part
    - crates/ravel-commit/src/declared_stats.rs::stamp_commit_record
    - crates/ravel-commit/src/declared_stats.rs::stamp_compaction_part
  status: verified
  note: "run_flush calls stamp_commit_record with the stamps build_stamps returns when the tenant declares columns; finalize_part calls stamp_compaction_part with real stamps. The span compaction codec, the RSEG part builder and the logs erasure rewrite (erasure_rewrite.rs) stamp an empty list, compaction stamps only the columns its inputs carry stamps for, and the metrics and span flushes call neither. Corrected by #2082."

