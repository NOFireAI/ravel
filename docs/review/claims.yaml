- id: query-engine-stamp-write-side
  doc: docs/query-engine.md
  quote: "The logs flush stamps each commit record"
  kind: positive
  binds:
    - crates/ravel-ingest/src/log_shard.rs::run_flush
    - crates/ravel-ingest/src/log_declared_stats.rs::build_stamps
    - crates/ravel-maintain/src/rlog.rs::finalize_part
    - crates/ravel-commit/src/declared_stats.rs::stamp_commit_record
    - crates/ravel-commit/src/declared_stats.rs::stamp_compaction_part
  status: verified
  note: "run_flush calls stamp_commit_record with the stamps build_stamps returns when the tenant declares columns; finalize_part calls stamp_compaction_part with real stamps. The span compaction codec, the RSEG part builder and the logs erasure rewrite (erasure_rewrite.rs) stamp an empty list, compaction stamps only the columns its inputs carry stamps for, and the metrics and span flushes call neither. Corrected by #2082."

