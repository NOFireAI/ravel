<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" font-family="system-ui, sans-serif" role="img" aria-label="Kubernetes CI integration: local kind-up and the k8s-integration CI job build container images by two different paths but converge on identical kind-up.sh, kind-demo.sh, and kind-down.sh calls.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#383e46"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="560" fill="#f4f5f7"/>

  <text x="30" y="34" font-size="22" font-weight="bold" fill="#17191c">Same three scripts, two image-build paths</text>
  <text x="30" y="54" font-size="13" fill="#4a4f57">docs/guides/kubernetes.md — local kind-up.sh vs. the k8s-integration CI job; both converge on identical kind-up.sh/kind-demo.sh/kind-down.sh calls</text>

  <!-- Legend -->
  <g>
    <rect x="1145" y="18" width="270" height="86" rx="6" fill="#eceef1" stroke="#454b54" stroke-width="1.5"/>
    <text x="1157" y="34" font-size="12" font-weight="bold" fill="#17191c">Legend</text>
    <rect x="1157" y="42" width="16" height="16" rx="3" fill="#a9c9e6" stroke="#1f4e79" stroke-width="1.5"/>
    <text x="1180" y="54" font-size="11" fill="#17191c">build step (differs by lane)</text>
    <rect x="1157" y="64" width="16" height="16" rx="3" fill="#dde1e7" stroke="#454b54" stroke-width="1.5"/>
    <text x="1180" y="76" font-size="11" fill="#17191c">shared script (identical in both lanes)</text>
  </g>

  <!-- LOCAL lane -->
  <text x="40" y="130" font-size="13" font-weight="bold" fill="#1f4e79">LOCAL (your machine)</text>

  <rect x="40" y="140" width="280" height="70" rx="6" fill="#a9c9e6" stroke="#1f4e79" stroke-width="2"/>
  <text x="180" y="164" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#17191c">docker build (root Dockerfile)</text>
  <text x="180" y="180" font-size="10.5" text-anchor="middle" fill="#17191c">full workspace release build, inside the container,</text>
  <text x="180" y="194" font-size="10.5" text-anchor="middle" fill="#17191c">layer-cached across runs — slow the first time</text>

  <line x1="320" y1="175" x2="360" y2="175" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="360" y="140" width="240" height="70" rx="6" fill="#a9c9e6" stroke="#1f4e79" stroke-width="2"/>
  <text x="480" y="164" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#17191c">distroless/cc-debian12</text>
  <text x="480" y="182" font-size="10.5" text-anchor="middle" fill="#17191c">the shipping runtime base;</text>
  <text x="480" y="196" font-size="10.5" text-anchor="middle" fill="#17191c">what actually gets deployed</text>

  <!-- CI lane -->
  <text x="40" y="290" font-size="13" font-weight="bold" fill="#1f4e79">CI (k8s-integration job, ci.yml)</text>

  <rect x="40" y="300" width="280" height="70" rx="6" fill="#a9c9e6" stroke="#1f4e79" stroke-width="2"/>
  <text x="180" y="322" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#17191c">cargo build --release</text>
  <text x="180" y="338" font-size="10.5" text-anchor="middle" fill="#17191c">on the runner (host), sccache-warmed;</text>
  <text x="180" y="352" font-size="10.5" text-anchor="middle" fill="#17191c">--features sql for server, matching the shipping build</text>

  <line x1="320" y1="335" x2="360" y2="335" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="360" y="300" width="280" height="70" rx="6" fill="#a9c9e6" stroke="#1f4e79" stroke-width="2"/>
  <text x="500" y="322" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#17191c">Dockerfile.prebuilt</text>
  <text x="500" y="338" font-size="10.5" text-anchor="middle" fill="#17191c">runtime-only stage, COPYs the two host binaries</text>
  <text x="500" y="352" font-size="10.5" text-anchor="middle" fill="#17191c">RAVEL_SKIP_IMAGE_BUILD=1 tells kind-up.sh not to rebuild</text>

  <line x1="640" y1="335" x2="680" y2="335" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="680" y="300" width="250" height="70" rx="6" fill="#a9c9e6" stroke="#1f4e79" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="805" y="320" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#17191c">distroless/cc-debian13</text>
  <text x="805" y="338" font-size="10.5" text-anchor="middle" fill="#17191c">host-built binaries need a newer glibc</text>
  <text x="805" y="352" font-size="10.5" text-anchor="middle" fill="#17191c">than debian12 ships — CI-lane-only base</text>

  <line x1="805" y1="370" x2="805" y2="410" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="640" y="410" width="330" height="50" rx="6" fill="#dde1e7" stroke="#454b54" stroke-width="2"/>
  <text x="805" y="432" font-size="12" font-weight="bold" text-anchor="middle" fill="#17191c">docker run --help (both images)</text>
  <text x="805" y="448" font-size="10.5" text-anchor="middle" fill="#17191c">smoke test before touching the cluster at all</text>

  <!-- convergence -->
  <text x="720" y="478" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f4e79">both lanes converge here ↓</text>

  <rect x="120" y="490" width="1200" height="50" rx="6" fill="#dde1e7" stroke="#454b54" stroke-width="2"/>
  <text x="720" y="512" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#17191c">kind-up.sh  →  kind-demo.sh  →  kind-down.sh</text>
  <text x="720" y="528" font-size="10.5" text-anchor="middle" fill="#17191c">identical scripts, identical env vars — only how the two images got built differs above this line</text>

  <path d="M480,210 L480,255 L1000,255 L1000,490" fill="none" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="805" y1="460" x2="900" y2="490" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
