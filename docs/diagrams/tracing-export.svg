<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1015" viewBox="0 0 1200 1015" font-family="system-ui, sans-serif" role="img" aria-label="Tracing export: the six query-path phase spans nested inside the request-level span with their recorded fields and levels, and the subscriber wiring one EnvFilter over both the always-on fmt layer and the off-by-default OpenTelemetry layer through a batch span processor to an OTLP gRPC collector, plus the two export-failure modes.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#383e46"/>
    </marker>
    <marker id="arrowpurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b3a8a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1015" fill="#f4f5f7"/>

  <text x="30" y="30" font-size="20" font-weight="bold" fill="#17191c">Query-path tracing — spans and OTLP export</text>
  <text x="30" y="48" font-size="12" fill="#4a4f57">ADR-0044 decision 5 + ADR-0060 · docs/guides/tracing.md</text>

  <!-- legend -->
  <rect x="960" y="15" width="210" height="128" rx="6" fill="#eceef1" stroke="#454b54" stroke-width="1.5"/>
  <rect x="970" y="24" width="14" height="14" rx="3" fill="#c9b6e4" stroke="#5b3a8a" stroke-width="1.5"/>
  <text x="990" y="35" font-size="9.5" fill="#17191c">tracing span</text>
  <rect x="970" y="44" width="14" height="14" rx="3" fill="#a9c9e6" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="990" y="55" font-size="9.5" fill="#17191c">process / external service</text>
  <rect x="970" y="64" width="14" height="14" rx="3" fill="#dde1e7" stroke="#454b54" stroke-width="1.5"/>
  <text x="990" y="75" font-size="9.5" fill="#17191c">subscriber component</text>
  <rect x="970" y="84" width="14" height="14" rx="3" fill="none" stroke="#5b3a8a" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="990" y="95" font-size="9.5" fill="#17191c">off by default</text>
  <line x1="970" y1="108" x2="984" y2="108" stroke="#383e46" stroke-width="1.5"/>
  <text x="990" y="112" font-size="9.5" fill="#17191c">span nesting / sequence</text>
  <line x1="970" y1="128" x2="984" y2="128" stroke="#5b3a8a" stroke-width="1.5"/>
  <text x="990" y="132" font-size="9.5" fill="#17191c">emit → filter → export</text>

  <!-- ============ Section 1: one query's spans ============ -->
  <text x="30" y="76" font-size="13" font-weight="bold" fill="#17191c">One query's spans</text>

  <!-- outer request-level span -->
  <rect x="40" y="150" width="1120" height="450" rx="8" fill="#f4f7fa" stroke="#1f4e79" stroke-width="2"/>
  <text x="56" y="168" font-size="12" font-weight="bold" fill="#17191c">sql_query span — info level (same shape for analytics_query, flight_sql_statement)</text>
  <text x="56" y="183" font-size="10" fill="#4a4f57">fields: tenant_hash, workload_class, s3_requests, s3_bytes — recorded from the query's accounting handle once it returns</text>

  <!-- phase span 1: catalog_resolve -->
  <rect x="70" y="197" width="1060" height="46" rx="6" fill="#c9b6e4" stroke="#5b3a8a" stroke-width="2"/>
  <text x="86" y="215" font-size="11" font-weight="bold" fill="#17191c">catalog_resolve</text>
  <text x="1120" y="215" font-size="9.5" text-anchor="end" fill="#3d2a5c">debug</text>
  <text x="86" y="232" font-size="10" fill="#17191c">tenant_hash, s3_requests, s3_bytes, segments_pruned — this resolve's own LIST/GET fan-out cost</text>
  <line x1="600" y1="243" x2="600" y2="258" stroke="#383e46" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- phase span 2: segment_open -->
  <rect x="70" y="258" width="1060" height="46" rx="6" fill="#c9b6e4" stroke="#5b3a8a" stroke-width="2"/>
  <text x="86" y="276" font-size="11" font-weight="bold" fill="#17191c">segment_open</text>
  <text x="1120" y="276" font-size="9.5" text-anchor="end" fill="#3d2a5c">debug</text>
  <text x="86" y="293" font-size="10" fill="#17191c">tenant_hash, object_size, s3_requests, s3_bytes — one segment's own GET cost, zero on a warm whole-object cache hit</text>
  <line x1="600" y1="304" x2="600" y2="319" stroke="#383e46" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- phase span 3: catalog_decode -->
  <rect x="70" y="319" width="1060" height="46" rx="6" fill="#c9b6e4" stroke="#5b3a8a" stroke-width="2"/>
  <text x="86" y="337" font-size="11" font-weight="bold" fill="#17191c">catalog_decode</text>
  <text x="1120" y="337" font-size="9.5" text-anchor="end" fill="#3d2a5c">debug</text>
  <text x="86" y="354" font-size="10" fill="#17191c">matcher_count, total_size, series_matched</text>
  <line x1="600" y1="365" x2="600" y2="380" stroke="#383e46" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- phase span 4: page_fetch -->
  <rect x="70" y="380" width="1060" height="46" rx="6" fill="#c9b6e4" stroke="#5b3a8a" stroke-width="2"/>
  <text x="86" y="398" font-size="11" font-weight="bold" fill="#17191c">page_fetch</text>
  <text x="1120" y="398" font-size="9.5" text-anchor="end" fill="#3d2a5c">debug</text>
  <text x="86" y="415" font-size="10" fill="#17191c">page_kind, series_count, s3_requests, s3_bytes — logs-signal variant: signal="logs" instead, no page_kind/series_count</text>
  <line x1="600" y1="426" x2="600" y2="441" stroke="#383e46" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- phase span 5: decode -->
  <rect x="70" y="441" width="1060" height="46" rx="6" fill="#c9b6e4" stroke="#5b3a8a" stroke-width="2"/>
  <text x="86" y="459" font-size="11" font-weight="bold" fill="#17191c">decode</text>
  <text x="1120" y="459" font-size="9.5" text-anchor="end" fill="#3d2a5c">debug</text>
  <text x="86" y="476" font-size="10" fill="#17191c">page_kind, series_count, decompressed_bytes — logs-signal variant: blocks_scanned/blocks_total, not a byte count</text>
  <line x1="600" y1="487" x2="600" y2="502" stroke="#383e46" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- phase span 6: evaluate -->
  <rect x="70" y="502" width="1060" height="46" rx="6" fill="#c9b6e4" stroke="#5b3a8a" stroke-width="2"/>
  <text x="86" y="520" font-size="11" font-weight="bold" fill="#17191c">evaluate</text>
  <text x="1120" y="520" font-size="9.5" text-anchor="end" fill="#3d2a5c">debug</text>
  <text x="86" y="537" font-size="10" fill="#17191c">eval_kind (instant / range) — pure in-memory work over already-fetched data, no byte/request counts</text>

  <text x="56" y="584" font-size="10" fill="#4a4f57">page_fetch and decode each have two call sites (scalar / histogram); the span name is the same at both.</text>

  <!-- ============ Section 2: filter + export ============ -->
  <text x="30" y="624" font-size="13" font-weight="bold" fill="#17191c">Where spans go — one filter, two layers</text>
  <text x="30" y="640" font-size="10.5" fill="#4a4f57">crates/ravel-tracing-export::init(filter, otlp) — shared by ravel-server and ravel-operator</text>

  <!-- emission -->
  <rect x="30" y="662" width="190" height="56" rx="6" fill="#dde1e7" stroke="#454b54" stroke-width="2"/>
  <text x="125" y="684" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#17191c">tracing::info_span! /</text>
  <text x="125" y="699" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#17191c">debug_span! emitted</text>

  <line x1="220" y1="690" x2="270" y2="690" stroke="#5b3a8a" stroke-width="2" marker-end="url(#arrowpurple)"/>

  <!-- filter -->
  <rect x="270" y="662" width="230" height="56" rx="6" fill="#a9c9e6" stroke="#1f4e79" stroke-width="2"/>
  <text x="385" y="682" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#17191c">EnvFilter (RUST_LOG)</text>
  <text x="385" y="698" font-size="9.5" text-anchor="middle" fill="#17191c">one filter gates both layers below</text>
  <text x="385" y="711" font-size="9.5" text-anchor="middle" fill="#17191c">(ADR-0060 decision 2)</text>

  <!-- split -->
  <line x1="385" y1="718" x2="385" y2="732" stroke="#5b3a8a" stroke-width="2"/>
  <line x1="200" y1="732" x2="570" y2="732" stroke="#5b3a8a" stroke-width="2"/>
  <line x1="200" y1="732" x2="200" y2="752" stroke="#5b3a8a" stroke-width="2" marker-end="url(#arrowpurple)"/>
  <line x1="570" y1="732" x2="570" y2="752" stroke="#5b3a8a" stroke-width="2" marker-end="url(#arrowpurple)"/>

  <!-- fmt layer branch (always on) -->
  <rect x="100" y="752" width="200" height="50" rx="6" fill="#dde1e7" stroke="#454b54" stroke-width="2"/>
  <text x="200" y="774" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#17191c">fmt layer</text>
  <text x="200" y="789" font-size="9.5" text-anchor="middle" fill="#17191c">always installed, unconditional</text>

  <line x1="200" y1="802" x2="200" y2="832" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="100" y="832" width="200" height="46" rx="6" fill="#dde1e7" stroke="#454b54" stroke-width="2"/>
  <text x="200" y="859" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#17191c">local process log stream</text>

  <!-- otel layer branch (optional) -->
  <rect x="440" y="752" width="260" height="50" rx="6" fill="none" stroke="#5b3a8a" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="570" y="774" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#17191c">OpenTelemetryLayer</text>
  <text x="570" y="789" font-size="9.5" text-anchor="middle" fill="#17191c">only when --otlp-trace-endpoint is set</text>

  <line x1="570" y1="802" x2="570" y2="827" stroke="#5b3a8a" stroke-width="2" marker-end="url(#arrowpurple)"/>

  <rect x="440" y="827" width="260" height="46" rx="6" fill="#dde1e7" stroke="#454b54" stroke-width="2"/>
  <text x="570" y="849" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#17191c">BatchSpanProcessor</text>
  <text x="570" y="864" font-size="9" text-anchor="middle" fill="#17191c">background task — never blocks the caller (decision 6)</text>

  <line x1="570" y1="873" x2="570" y2="898" stroke="#5b3a8a" stroke-width="2" marker-end="url(#arrowpurple)"/>

  <rect x="440" y="898" width="260" height="46" rx="6" fill="#dde1e7" stroke="#454b54" stroke-width="2"/>
  <text x="570" y="920" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#17191c">OTLP/gRPC SpanExporter</text>
  <text x="570" y="935" font-size="9" text-anchor="middle" fill="#17191c">dials lazily; reuses the tonic 0.14 dependency</text>

  <line x1="700" y1="921" x2="770" y2="921" stroke="#5b3a8a" stroke-width="2" marker-end="url(#arrowpurple)"/>

  <rect x="770" y="898" width="190" height="46" rx="6" fill="#a9c9e6" stroke="#1f4e79" stroke-width="2"/>
  <text x="865" y="920" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#17191c">OTLP collector</text>
  <text x="865" y="935" font-size="9" text-anchor="middle" fill="#17191c">operator-supplied endpoint</text>

  <!-- annotations column on the right of the export path -->
  <rect x="740" y="662" width="430" height="220" rx="6" fill="#eceef1" stroke="#454b54" stroke-width="1.5"/>
  <text x="756" y="682" font-size="10.5" font-weight="bold" fill="#17191c">Failure handling (ADR-0060)</text>
  <text x="756" y="700" font-size="9.5" fill="#17191c">Malformed --otlp-trace-endpoint: build fails, one</text>
  <text x="756" y="713" font-size="9.5" fill="#17191c">startup warning, degrades to the fmt-only subscriber.</text>
  <text x="756" y="732" font-size="9.5" fill="#17191c">Reachable-but-wrong collector: the exporter builds</text>
  <text x="756" y="745" font-size="9.5" fill="#17191c">fine (dialed lazily); a decorator on the exporter warns</text>
  <text x="756" y="758" font-size="9.5" fill="#17191c">once on the first failed background export attempt.</text>
  <text x="756" y="777" font-size="9.5" fill="#17191c">Exported fields are exactly the fields shown in the</text>
  <text x="756" y="790" font-size="9.5" fill="#17191c">span boxes above — no new content, no query text,</text>
  <text x="756" y="803" font-size="9.5" fill="#17191c">no object keys (ADR-0060 decision 4).</text>
  <text x="756" y="822" font-size="9.5" fill="#17191c">service.name (ravel-server / ravel-operator) and</text>
  <text x="756" y="835" font-size="9.5" fill="#17191c">ravel.mode resource attributes are attached to every</text>
  <text x="756" y="848" font-size="9.5" fill="#17191c">exported span, mirroring /metrics' mode label.</text>
  <text x="756" y="867" font-size="9.5" fill="#17191c">Absent flag: byte-identical to the pre-ADR-0060</text>
  <text x="756" y="880" font-size="9.5" fill="#17191c">subscriber — no OTLP object constructed at all.</text>

  <text x="30" y="978" font-size="10" fill="#4a4f57">Illustrates: docs/guides/tracing.md, docs/adrs/0044-query-cost-accounting.md (decision 5), docs/adrs/0060-query-path-otlp-trace-export.md.</text>
</svg>
