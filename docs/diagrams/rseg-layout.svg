<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" font-family="system-ui, sans-serif">
  <rect x="0" y="0" width="1500" height="880" fill="#f4f5f7"/>

  <text x="30" y="30" font-size="20" font-weight="bold" fill="#17191c">RSEG v1 object byte layout</text>
  <text x="30" y="48" font-size="12" fill="#4a4f57">docs/segment-format.md + ADR-0004 + ADR-0010 §4 (checksum coverage)</text>

  <!-- legend -->
  <g>
    <rect x="1220" y="15" width="260" height="112" rx="6" fill="#eceef1" stroke="#454b54" stroke-width="1.5"/>
    <rect x="1232" y="24" width="16" height="16" rx="3" fill="#a9dcae" stroke="#2f6b34" stroke-width="1.5"/>
    <text x="1255" y="36" font-size="11" fill="#17191c">section (Section.crc32c)</text>
    <rect x="1232" y="46" width="16" height="16" rx="3" fill="#dde1e7" stroke="#454b54" stroke-width="1.5"/>
    <text x="1255" y="58" font-size="11" fill="#17191c">footer / trailer metadata</text>
    <rect x="1232" y="68" width="16" height="16" rx="3" fill="#f4c869" stroke="#8a5a10" stroke-width="1.5"/>
    <text x="1255" y="80" font-size="11" fill="#17191c">whole object (blake3-keyed)</text>
    <line x1="1232" y1="98" x2="1248" y2="98" stroke="#1f4e79" stroke-width="2"/>
    <text x="1255" y="102" font-size="11" fill="#17191c">crc coverage bracket</text>
    <rect x="1232" y="108" width="16" height="12" rx="2" fill="none" stroke="#8a2020" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="1255" y="118" font-size="11" fill="#17191c">excluded from that crc</text>
  </g>

  <!-- outer amber frame: one immutable object -->
  <rect x="30" y="95" width="1440" height="165" rx="8" fill="#fbe6b9" stroke="#8a5a10" stroke-width="3"/>
  <text x="46" y="112" font-size="12" font-weight="bold" fill="#17191c">ONE IMMUTABLE RSEG OBJECT — key embeds writer_id.epoch.seq.hash16 (16 hex chars of blake3)</text>

  <!-- bracket above: footer_crc32c over FOOTER block -->
  <line x1="1140" y1="132" x2="1370" y2="132" stroke="#1f4e79" stroke-width="2"/>
  <line x1="1140" y1="132" x2="1140" y2="150" stroke="#1f4e79" stroke-width="2"/>
  <line x1="1370" y1="132" x2="1370" y2="150" stroke="#1f4e79" stroke-width="2"/>
  <text x="1255" y="124" font-size="10.5" text-anchor="middle" fill="#17191c">footer_crc32c covers FooterProto bytes (+ trailer detail below)</text>

  <!-- tape -->
  <g>
    <rect x="50" y="150" width="130" height="60" fill="#a9dcae" stroke="#2f6b34" stroke-width="2"/>
    <text x="115" y="176" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#17191c">LABEL_DICT</text>
    <text x="115" y="192" font-size="9.5" text-anchor="middle" fill="#17191c">kind 1</text>

    <rect x="180" y="150" width="220" height="60" fill="#a9dcae" stroke="#2f6b34" stroke-width="2"/>
    <text x="290" y="176" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#17191c">SERIES_TABLE</text>
    <text x="290" y="192" font-size="9.5" text-anchor="middle" fill="#17191c">kind 2</text>

    <rect x="400" y="150" width="370" height="60" fill="#a9dcae" stroke="#2f6b34" stroke-width="2"/>
    <text x="585" y="176" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#17191c">TS_PAGES</text>
    <text x="585" y="192" font-size="9.5" text-anchor="middle" fill="#17191c">kind 3 — concatenated per-series TS pages</text>

    <rect x="770" y="150" width="370" height="60" fill="#a9dcae" stroke="#2f6b34" stroke-width="2"/>
    <text x="955" y="176" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#17191c">VAL_PAGES</text>
    <text x="955" y="192" font-size="9.5" text-anchor="middle" fill="#17191c">kind 4 — concatenated per-series VAL pages</text>

    <rect x="1140" y="150" width="230" height="60" fill="#dde1e7" stroke="#454b54" stroke-width="2"/>
    <text x="1255" y="176" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#17191c">FOOTER</text>
    <text x="1255" y="192" font-size="9.5" text-anchor="middle" fill="#17191c">FooterProto bytes</text>

    <rect x="1370" y="150" width="80" height="60" fill="#dde1e7" stroke="#454b54" stroke-width="2"/>
    <text x="1410" y="176" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#17191c">TRAILER</text>
    <text x="1410" y="192" font-size="9.5" text-anchor="middle" fill="#17191c">16 B</text>
  </g>

  <!-- bracket below: Section.crc32c over LABEL_DICT -->
  <line x1="50" y1="222" x2="180" y2="222" stroke="#1f4e79" stroke-width="2"/>
  <line x1="50" y1="210" x2="50" y2="222" stroke="#1f4e79" stroke-width="2"/>
  <line x1="180" y1="210" x2="180" y2="222" stroke="#1f4e79" stroke-width="2"/>
  <text x="50" y="237" font-size="10" fill="#17191c">Section.crc32c covers this section's stored bytes</text>
  <text x="50" y="249" font-size="10" fill="#17191c">(same pattern: SERIES_TABLE, TS_PAGES, VAL_PAGES)</text>

  <!-- offsets -->
  <line x1="50" y1="210" x2="50" y2="265" stroke="#9098a3" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="50" y="277" font-size="9.5" text-anchor="middle" fill="#4a4f57">0</text>
  <line x1="1140" y1="210" x2="1140" y2="265" stroke="#9098a3" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="1140" y="277" font-size="9.5" text-anchor="middle" fill="#4a4f57">total_size-16-footer_len</text>
  <line x1="1370" y1="210" x2="1370" y2="265" stroke="#9098a3" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="1370" y="277" font-size="9.5" text-anchor="middle" fill="#4a4f57">total_size-16</text>
  <line x1="1450" y1="210" x2="1450" y2="265" stroke="#9098a3" stroke-width="1" stroke-dasharray="2,3"/>
  <text x="1450" y="277" font-size="9.5" text-anchor="middle" fill="#4a4f57">total_size</text>

  <!-- Panel A: LABEL_DICT format -->
  <rect x="50" y="300" width="440" height="175" rx="6" fill="#eceef1" stroke="#454b54" stroke-width="1.5"/>
  <text x="64" y="320" font-size="13" font-weight="bold" fill="#17191c">LABEL_DICT (uncompressed form)</text>
  <rect x="64" y="330" width="60" height="24" fill="#a9dcae" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="94" y="346" font-size="9" text-anchor="middle" fill="#17191c">count:u32</text>
  <rect x="128" y="330" width="115" height="24" fill="#a9dcae" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="185" y="346" font-size="9" text-anchor="middle" fill="#17191c">len:varint+bytes</text>
  <rect x="247" y="330" width="115" height="24" fill="#a9dcae" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="304" y="346" font-size="9" text-anchor="middle" fill="#17191c">len:varint+bytes</text>
  <rect x="366" y="330" width="60" height="24" fill="#a9dcae" stroke="#2f6b34" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="396" y="346" font-size="9" text-anchor="middle" fill="#17191c">...</text>
  <text x="64" y="378" font-size="10.5" fill="#17191c">ordinal 0 = "__name__" always</text>
  <text x="64" y="394" font-size="10.5" fill="#17191c">remaining ordinals: sorted lexicographic order</text>
  <text x="64" y="410" font-size="10.5" fill="#17191c">out-of-range ordinal / non-UTF-8 -&gt; Corrupted</text>
  <text x="64" y="426" font-size="10.5" fill="#17191c">compressed as a whole section (zstd level 3 default)</text>
  <text x="64" y="442" font-size="10.5" fill="#17191c">count:u32 precedes the string list (not shown above)</text>

  <!-- Panel B: SERIES_TABLE entry format -->
  <rect x="520" y="300" width="460" height="175" rx="6" fill="#eceef1" stroke="#454b54" stroke-width="1.5"/>
  <text x="534" y="320" font-size="13" font-weight="bold" fill="#17191c">SERIES_TABLE entry (sorted by series_id bytes)</text>
  <rect x="534" y="330" width="70" height="22" fill="#a9dcae" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="569" y="345" font-size="8.5" text-anchor="middle" fill="#17191c">series_id 16B</text>
  <rect x="606" y="330" width="70" height="22" fill="#a9dcae" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="641" y="345" font-size="8.5" text-anchor="middle" fill="#17191c">label_count u16</text>
  <rect x="678" y="330" width="110" height="22" fill="#a9dcae" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="733" y="345" font-size="8.5" text-anchor="middle" fill="#17191c">(name_ord,val_ord) × N</text>
  <rect x="790" y="330" width="80" height="22" fill="#a9dcae" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="830" y="345" font-size="8.5" text-anchor="middle" fill="#17191c">sample_count u32</text>
  <rect x="534" y="360" width="90" height="22" fill="#a9dcae" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="579" y="375" font-size="8.5" text-anchor="middle" fill="#17191c">min_ts_ns i64</text>
  <rect x="626" y="360" width="90" height="22" fill="#a9dcae" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="671" y="375" font-size="8.5" text-anchor="middle" fill="#17191c">max_ts_ns i64</text>
  <rect x="718" y="360" width="120" height="22" fill="#a9dcae" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="778" y="375" font-size="8.5" text-anchor="middle" fill="#17191c">ts_page (offset,len)</text>
  <rect x="840" y="360" width="130" height="22" fill="#a9dcae" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="905" y="375" font-size="8.5" text-anchor="middle" fill="#17191c">val_page (offset,len)</text>
  <text x="534" y="408" font-size="10.5" fill="#17191c">page offsets are relative to the TS_PAGES / VAL_PAGES section start</text>
  <text x="534" y="424" font-size="10.5" fill="#17191c">one page pair per series in v1; multi-page chunking is a v2 concern</text>
  <text x="534" y="440" font-size="10.5" fill="#17191c">table-level count:u32 precedes the entry list (not shown above)</text>

  <!-- Panel C: Page format -->
  <rect x="1010" y="300" width="440" height="175" rx="6" fill="#eceef1" stroke="#454b54" stroke-width="1.5"/>
  <text x="1024" y="320" font-size="13" font-weight="bold" fill="#17191c">Page format (one per series, in TS_PAGES / VAL_PAGES)</text>

  <line x1="1022" y1="343" x2="1408" y2="343" stroke="#1f4e79" stroke-width="2"/>
  <line x1="1022" y1="343" x2="1022" y2="352" stroke="#1f4e79" stroke-width="2"/>
  <line x1="1408" y1="343" x2="1408" y2="352" stroke="#1f4e79" stroke-width="2"/>
  <text x="1215" y="336" font-size="9.5" text-anchor="middle" fill="#17191c">page crc32c covers exactly: series_id || enc || comp || payload</text>

  <rect x="1022" y="352" width="90" height="26" fill="none" stroke="#8a5a10" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="1067" y="367" font-size="8" text-anchor="middle" fill="#17191c">series_id 16B</text>
  <text x="1067" y="376" font-size="6.5" text-anchor="middle" fill="#4a4f57">(virtual seed, not stored)</text>

  <rect x="1116" y="352" width="40" height="26" fill="#a9dcae" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="1136" y="369" font-size="8.5" text-anchor="middle" fill="#17191c">enc u8</text>
  <rect x="1160" y="352" width="40" height="26" fill="#a9dcae" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="1180" y="369" font-size="8.5" text-anchor="middle" fill="#17191c">comp u8</text>
  <rect x="1204" y="352" width="60" height="26" fill="#a9dcae" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="1234" y="369" font-size="8.5" text-anchor="middle" fill="#17191c">crc u32</text>
  <rect x="1268" y="352" width="140" height="26" fill="#a9dcae" stroke="#2f6b34" stroke-width="1.5" stroke-dasharray="0"/>
  <text x="1338" y="369" font-size="8.5" text-anchor="middle" fill="#17191c">payload (compressed)</text>

  <text x="1024" y="400" font-size="10.5" fill="#17191c">enc: 1 TS_DELTA_VARINT, 16 VAL_GORILLA, 17 VAL_RAW_F64</text>
  <text x="1024" y="416" font-size="10.5" fill="#17191c">comp: 0=none, 1=lz4 (u32 uncompressed-size prefix)</text>
  <text x="1024" y="432" font-size="10.5" fill="#17191c">flipped enc/comp byte or mis-planned range fails closed</text>
  <text x="1024" y="448" font-size="10.5" fill="#17191c">(ADR-0010 §4) instead of silently misdecoding</text>

  <!-- Panel D: FooterProto fields -->
  <rect x="50" y="500" width="700" height="300" rx="6" fill="#eceef1" stroke="#454b54" stroke-width="1.5"/>
  <text x="64" y="522" font-size="13" font-weight="bold" fill="#17191c">FooterProto — ravel.segment.v1.Footer</text>

  <text x="64" y="548" font-size="11" fill="#17191c">tenant_hash (16 bytes)</text>
  <text x="64" y="566" font-size="11" fill="#17191c">shard</text>
  <text x="64" y="584" font-size="11" fill="#17191c">writer_id, writer_epoch, writer_seq</text>
  <text x="64" y="602" font-size="11" fill="#17191c">min_event_ts_ns, max_event_ts_ns</text>
  <text x="64" y="620" font-size="11" fill="#17191c">min_ingest_ts_ns, max_ingest_ts_ns</text>
  <text x="64" y="638" font-size="11" fill="#17191c">sample_count, series_count</text>

  <text x="400" y="548" font-size="11" font-weight="bold" fill="#17191c">sections: repeated Section</text>
  <text x="400" y="566" font-size="11" fill="#17191c">kind (1 LABEL_DICT..4 VAL_PAGES)</text>
  <text x="400" y="584" font-size="11" fill="#17191c">offset, len (bytes, within object)</text>
  <text x="400" y="602" font-size="11" fill="#17191c">crc32c (over stored bytes)</text>
  <text x="400" y="620" font-size="11" fill="#17191c">comp (0=none, 1=lz4, 2=zstd)</text>
  <text x="400" y="638" font-size="11" fill="#17191c">uncompressed_len</text>

  <rect x="64" y="660" width="670" height="34" rx="5" fill="#a9dcae" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="399" y="674" font-size="10" text-anchor="middle" fill="#17191c">identity fields (tenant_hash, shard, writer_id, epoch, seq) MUST match</text>
  <text x="399" y="688" font-size="10" text-anchor="middle" fill="#17191c">the commit record the reader resolved the segment from (ADR-0010 §7)</text>

  <text x="64" y="716" font-size="10.5" fill="#17191c">at most one section per known kind; LABEL_DICT/SERIES_TABLE/TS_PAGES/VAL_PAGES mandatory in v1</text>
  <text x="64" y="732" font-size="10.5" fill="#17191c">unknown section kinds MUST be skipped by readers (forward compatibility)</text>
  <text x="64" y="748" font-size="10.5" fill="#17191c">uncompressed_len is capped by config; decompressed size must match it exactly</text>
  <text x="64" y="764" font-size="10.5" fill="#17191c">no maps; fields written in tag order by prost (deterministic encoding)</text>

  <!-- Panel E: Trailer breakdown -->
  <rect x="780" y="500" width="670" height="300" rx="6" fill="#eceef1" stroke="#454b54" stroke-width="1.5"/>
  <text x="794" y="522" font-size="13" font-weight="bold" fill="#17191c">Trailer — fixed 16 bytes, ends every RSEG object</text>

  <rect x="810" y="545" width="144" height="34" fill="#dde1e7" stroke="#454b54" stroke-width="1.5"/>
  <text x="882" y="566" font-size="9.5" text-anchor="middle" fill="#17191c">footer_len u32</text>
  <rect x="954" y="545" width="144" height="34" fill="none" stroke="#8a2020" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="1026" y="566" font-size="9.5" text-anchor="middle" fill="#17191c">footer_crc32c u32</text>
  <rect x="1098" y="545" width="72" height="34" fill="#dde1e7" stroke="#454b54" stroke-width="1.5"/>
  <text x="1134" y="566" font-size="9" text-anchor="middle" fill="#17191c">version u16</text>
  <rect x="1170" y="545" width="36" height="34" fill="#dde1e7" stroke="#454b54" stroke-width="1.5"/>
  <text x="1188" y="566" font-size="8" text-anchor="middle" fill="#17191c">signal</text>
  <rect x="1206" y="545" width="36" height="34" fill="#dde1e7" stroke="#454b54" stroke-width="1.5"/>
  <text x="1224" y="566" font-size="8" text-anchor="middle" fill="#17191c">rsvd</text>
  <rect x="1242" y="545" width="144" height="34" fill="#dde1e7" stroke="#454b54" stroke-width="1.5"/>
  <text x="1314" y="566" font-size="9.5" text-anchor="middle" fill="#17191c">magic "RSG1"</text>

  <text x="810" y="592" font-size="8.5" fill="#4a4f57">0</text>
  <text x="954" y="592" font-size="8.5" fill="#4a4f57">4</text>
  <text x="1098" y="592" font-size="8.5" fill="#4a4f57">8</text>
  <text x="1170" y="592" font-size="8.5" fill="#4a4f57">10</text>
  <text x="1206" y="592" font-size="8.5" fill="#4a4f57">11</text>
  <text x="1242" y="592" font-size="8.5" fill="#4a4f57">12</text>
  <text x="1376" y="592" font-size="8.5" fill="#4a4f57">16</text>

  <!-- footer_crc32c bracket over trailer, excluding footer_crc32c field -->
  <line x1="810" y1="605" x2="954" y2="605" stroke="#1f4e79" stroke-width="2"/>
  <line x1="1098" y1="605" x2="1386" y2="605" stroke="#1f4e79" stroke-width="2"/>
  <line x1="810" y1="579" x2="810" y2="605" stroke="#1f4e79" stroke-width="2"/>
  <line x1="954" y1="579" x2="954" y2="605" stroke="#1f4e79" stroke-width="2"/>
  <line x1="1098" y1="579" x2="1098" y2="605" stroke="#1f4e79" stroke-width="2"/>
  <line x1="1386" y1="579" x2="1386" y2="605" stroke="#1f4e79" stroke-width="2"/>
  <text x="1098" y="620" font-size="10" text-anchor="middle" fill="#17191c">footer_crc32c covers: FooterProto bytes + footer_len + version + signal + reserved + magic</text>
  <text x="1098" y="634" font-size="10" text-anchor="middle" fill="#8a2020">(every trailer byte except the crc field itself)</text>

  <text x="794" y="662" font-size="10.5" fill="#17191c">reader protocol: 1) reject objects &lt; 16 bytes as Corrupted</text>
  <text x="794" y="678" font-size="10.5" fill="#17191c">2) suffix-GET (64 KiB default), verify magic/version/signal/reserved</text>
  <text x="794" y="694" font-size="10.5" fill="#17191c">3) require footer_len &gt; 0 and 16+footer_len &lt;= total_size</text>
  <text x="794" y="710" font-size="10.5" fill="#17191c">4) verify footer_crc32c before decoding the footer proto</text>
  <text x="794" y="726" font-size="10.5" fill="#17191c">if the suffix does not cover the footer, issue one more ranged GET</text>

  <text x="30" y="835" font-size="11" fill="#4a4f57">Whole-object blake3 (writer-computed) is recorded in the commit record; first 16 hex chars are embedded in the data key. A reader verifies exactly the bytes it touches.</text>
  <text x="30" y="852" font-size="11" fill="#4a4f57">Suffix fetch default 64 KiB covers footers for expected L0 series counts; SERIES_TABLE lives in a section, not the footer, so the footer stays small even at high cardinality.</text>
</svg>
