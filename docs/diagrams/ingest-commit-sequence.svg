<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="950" viewBox="0 0 1300 950" font-family="system-ui, sans-serif" role="img" aria-label="Ingest commit sequence: one strict-mode flush pins the flush identity, PUTs the data object create-if-absent with a checksum, PUTs the commit record create-if-absent with an idempotency check, then acks with a commit token; the three crash points and what each one leaves behind are marked.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#383e46"/>
    </marker>
    <marker id="arrowret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5f68"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="950" fill="#f4f5f7"/>

  <text x="30" y="30" font-size="20" font-weight="bold" fill="#17191c">Ingest commit sequence: one strict-mode flush</text>
  <text x="30" y="48" font-size="12" fill="#4a4f57">docs/ingest.md + docs/catalog-and-mvcc.md + docs/consistency-model.md crash matrix</text>

  <!-- legend -->
  <g>
    <rect x="990" y="15" width="290" height="98" rx="6" fill="#eceef1" stroke="#454b54" stroke-width="1.5"/>
    <rect x="1002" y="24" width="16" height="16" rx="3" fill="#a9c9e6" stroke="#1f4e79" stroke-width="1.5"/>
    <text x="1025" y="36" font-size="11" fill="#17191c">actor (disposable)</text>
    <rect x="1002" y="46" width="16" height="16" rx="3" fill="#f4c869" stroke="#8a5a10" stroke-width="1.5"/>
    <text x="1025" y="58" font-size="11" fill="#17191c">immutable object written</text>
    <rect x="1002" y="68" width="16" height="16" rx="3" fill="#a9dcae" stroke="#2f6b34" stroke-width="1.5"/>
    <text x="1025" y="80" font-size="11" fill="#17191c">checksum / idempotency check</text>
    <rect x="1002" y="90" width="16" height="16" rx="3" fill="#f2a9a9" stroke="#8a2020" stroke-width="1.5"/>
    <text x="1025" y="102" font-size="11" fill="#17191c">crash point</text>
  </g>

  <!-- lifeline headers -->
  <rect x="40" y="90" width="160" height="50" rx="6" fill="#a9c9e6" stroke="#1f4e79" stroke-width="2"/>
  <text x="120" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#17191c">Client</text>

  <rect x="390" y="90" width="180" height="50" rx="6" fill="#a9c9e6" stroke="#1f4e79" stroke-width="2"/>
  <text x="480" y="114" font-size="14" font-weight="bold" text-anchor="middle" fill="#17191c">Shard actor</text>
  <text x="480" y="130" font-size="10" text-anchor="middle" fill="#17191c">(writer identity)</text>

  <rect x="700" y="90" width="180" height="50" rx="6" fill="#f4c869" stroke="#8a5a10" stroke-width="2.5"/>
  <text x="790" y="114" font-size="14" font-weight="bold" text-anchor="middle" fill="#17191c">Object store</text>
  <text x="790" y="130" font-size="10" text-anchor="middle" fill="#17191c">(durable)</text>

  <!-- lifelines -->
  <line x1="120" y1="140" x2="120" y2="860" stroke="#9098a3" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="480" y1="140" x2="480" y2="860" stroke="#9098a3" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="790" y1="140" x2="790" y2="860" stroke="#9098a3" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Step 1: pin flush identity -->
  <rect x="330" y="155" width="300" height="60" rx="6" fill="#dde1e7" stroke="#454b54" stroke-width="2"/>
  <text x="480" y="172" font-size="12" font-weight="bold" text-anchor="middle" fill="#17191c">1. pin flush identity</text>
  <text x="480" y="187" font-size="10.5" text-anchor="middle" fill="#17191c">seq, ingest_hour_bucket, segment bytes, blake3</text>
  <text x="480" y="201" font-size="10.5" text-anchor="middle" fill="#17191c">fixed for the flush; retries reuse verbatim</text>

  <!-- CRASH A -->
  <line x1="120" y1="240" x2="790" y2="240" stroke="#8a2020" stroke-width="2" stroke-dasharray="8,5"/>
  <circle cx="480" cy="240" r="8" fill="#f2a9a9" stroke="#8a2020" stroke-width="2"/>
  <rect x="900" y="222" width="365" height="72" rx="6" fill="#f2a9a9" stroke="#8a2020" stroke-width="2"/>
  <text x="912" y="238" font-size="11.5" font-weight="bold" fill="#17191c">CRASH A: before data PUT</text>
  <text x="912" y="253" font-size="10.5" fill="#17191c">data: absent   commit: absent   ack: no</text>
  <text x="912" y="268" font-size="10.5" font-weight="bold" fill="#17191c">outcome: nothing stored</text>
  <text x="912" y="282" font-size="10.5" fill="#17191c">client retries; safe, no side effect</text>

  <!-- Step 2: PUT data object -->
  <line x1="480" y1="310" x2="770" y2="310" stroke="#383e46" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500" y="303" font-size="11.5" font-weight="bold" fill="#17191c">2. PUT data object</text>
  <text x="500" y="317" font-size="10" fill="#17191c">CreateIfAbsent + upload checksum</text>
  <rect x="620" y="322" width="150" height="20" rx="10" fill="#f4c869" stroke="#8a5a10" stroke-width="1.5"/>
  <text x="695" y="336" font-size="9.5" text-anchor="middle" fill="#17191c">L0 RSEG object</text>

  <line x1="770" y1="360" x2="480" y2="360" stroke="#5a5f68" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowret)"/>
  <rect x="490" y="365" width="400" height="34" rx="6" fill="#a9dcae" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="690" y="378" font-size="10.5" text-anchor="middle" fill="#17191c">OK, or AlreadyExists: key embeds content hash,</text>
  <text x="690" y="392" font-size="10.5" text-anchor="middle" fill="#17191c">so stored bytes are identical by construction</text>

  <!-- CRASH B -->
  <line x1="120" y1="425" x2="790" y2="425" stroke="#8a2020" stroke-width="2" stroke-dasharray="8,5"/>
  <circle cx="480" cy="425" r="8" fill="#f2a9a9" stroke="#8a2020" stroke-width="2"/>
  <rect x="900" y="405" width="365" height="86" rx="6" fill="#f2a9a9" stroke="#8a2020" stroke-width="2"/>
  <text x="912" y="421" font-size="11.5" font-weight="bold" fill="#17191c">CRASH B: after data PUT, before commit PUT</text>
  <text x="912" y="436" font-size="10.5" fill="#17191c">data: present (orphan)   commit: absent   ack: no</text>
  <text x="912" y="451" font-size="10.5" font-weight="bold" fill="#17191c">outcome: invisible orphan</text>
  <text x="912" y="465" font-size="10.5" fill="#17191c">GC-eligible only after grace (24h)</text>
  <text x="912" y="479" font-size="10.5" fill="#17191c">+ max_flush_lifetime (1h), re-verified</text>

  <!-- Step 3: PUT commit record -->
  <line x1="480" y1="520" x2="770" y2="520" stroke="#383e46" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500" y="513" font-size="11.5" font-weight="bold" fill="#17191c">3. PUT commit record</text>
  <text x="500" y="527" font-size="10" fill="#17191c">PutMode::CreateIfAbsent</text>
  <rect x="620" y="532" width="150" height="20" rx="10" fill="#f4c869" stroke="#8a5a10" stroke-width="1.5"/>
  <text x="695" y="546" font-size="9.5" text-anchor="middle" fill="#17191c">commit record</text>

  <line x1="770" y1="570" x2="480" y2="570" stroke="#5a5f68" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowret)"/>
  <rect x="470" y="575" width="440" height="48" rx="6" fill="#a9dcae" stroke="#2f6b34" stroke-width="1.5"/>
  <text x="690" y="589" font-size="10.5" text-anchor="middle" fill="#17191c">OK, or AlreadyExists -&gt; GET record, compare content_hash:</text>
  <text x="690" y="603" font-size="10.5" text-anchor="middle" fill="#17191c">same = success (idempotent retry landed);</text>
  <text x="690" y="617" font-size="10.5" text-anchor="middle" fill="#17191c">different = fatal split-brain, crash loudly</text>

  <!-- CRASH C -->
  <line x1="120" y1="650" x2="790" y2="650" stroke="#8a2020" stroke-width="2" stroke-dasharray="8,5"/>
  <circle cx="480" cy="650" r="8" fill="#f2a9a9" stroke="#8a2020" stroke-width="2"/>
  <rect x="900" y="628" width="365" height="88" rx="6" fill="#f2a9a9" stroke="#8a2020" stroke-width="2"/>
  <text x="912" y="644" font-size="11.5" font-weight="bold" fill="#17191c">CRASH C: after commit PUT, before ack</text>
  <text x="912" y="659" font-size="10.5" fill="#17191c">data: present   commit: present   ack: no</text>
  <text x="912" y="674" font-size="10.5" font-weight="bold" fill="#17191c">outcome: visible, client retry duplicates</text>
  <text x="912" y="688" font-size="10.5" fill="#17191c">segment already queryable; client retries</text>
  <text x="912" y="702" font-size="10.5" fill="#17191c">and re-ingests -&gt; duplicate samples stored</text>

  <!-- Step 4: ack -->
  <line x1="480" y1="745" x2="140" y2="745" stroke="#383e46" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="180" y="738" font-size="11.5" font-weight="bold" fill="#17191c">4. ack with commit token</text>
  <text x="180" y="765" font-size="10" fill="#17191c">v2:&lt;shard&gt;:&lt;writer_id&gt;:&lt;epoch&gt;:&lt;seq&gt;:&lt;ingest_hour_bucket&gt;</text>

  <!-- final state -->
  <rect x="120" y="800" width="670" height="50" rx="6" fill="#dde1e7" stroke="#454b54" stroke-width="1.5"/>
  <text x="455" y="820" font-size="12" font-weight="bold" text-anchor="middle" fill="#17191c">After ack: data present + commit present + ack sent -&gt; durable and visible.</text>
  <text x="455" y="837" font-size="11" text-anchor="middle" fill="#17191c">No crash of any Ravel process may lose acknowledged data (strict mode).</text>

  <text x="30" y="915" font-size="11" fill="#4a4f57">Duplicates from client retries after CRASH C are harmless if identical; differing values at the same timestamp are last-write-wins per evaluation order.</text>
  <text x="30" y="932" font-size="11" fill="#4a4f57">A flush older than max_flush_lifetime is abandoned: its commit record is never published (GC interlock, ADR-0010 §11).</text>
</svg>
