<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" font-family="system-ui, sans-serif" role="img" aria-label="Ravel Kubernetes operator reconcile loop: one RavelCluster resource reconciles into three Deployments and their Services (ADR-0034).">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#383e46"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="680" fill="#f4f5f7"/>

  <text x="30" y="34" font-size="22" font-weight="bold" fill="#17191c">Ravel Kubernetes operator: the reconcile loop</text>
  <text x="30" y="54" font-size="13" fill="#4a4f57">docs/guides/kubernetes.md, ADR-0034: one RavelCluster in, three Deployments and their Services out</text>

  <!-- Legend -->
  <g>
    <rect x="1145" y="18" width="270" height="192" rx="6" fill="#eceef1" stroke="#454b54" stroke-width="1.5"/>
    <text x="1157" y="34" font-size="12" font-weight="bold" fill="#17191c">Legend</text>

    <rect x="1157" y="42" width="16" height="16" rx="3" fill="#dde1e7" stroke="#454b54" stroke-width="1.5"/>
    <text x="1180" y="54" font-size="11" fill="#17191c">you / Kubernetes control plane</text>

    <rect x="1157" y="64" width="16" height="16" rx="3" fill="#d9c9ec" stroke="#5b3a86" stroke-width="1.5"/>
    <text x="1180" y="76" font-size="11" fill="#17191c">Kubernetes object (etcd, declarative)</text>

    <rect x="1157" y="86" width="16" height="16" rx="3" fill="#f4c869" stroke="#8a5a10" stroke-width="1.5"/>
    <text x="1180" y="98" font-size="11" fill="#17191c">ravel-operator (the controller)</text>

    <rect x="1157" y="108" width="16" height="16" rx="3" fill="#a9c9e6" stroke="#1f4e79" stroke-width="1.5"/>
    <text x="1180" y="120" font-size="11" fill="#17191c">Ravel process (a Deployment's pod)</text>

    <line x1="1159" y1="138" x2="1173" y2="138" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1180" y="142" font-size="11" fill="#17191c">creates/owns (ownerRef, SSA)</text>

    <line x1="1159" y1="158" x2="1173" y2="158" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>
    <text x="1180" y="162" font-size="11" fill="#17191c">read-only (Secrets: get, never watch)</text>

    <line x1="1159" y1="178" x2="1173" y2="178" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="1,3" marker-end="url(#arrowMuted)"/>
    <text x="1180" y="182" font-size="11" fill="#17191c">watch / status feedback</text>
  </g>

  <!-- Top row: user -> API server -> RavelCluster object -->
  <rect x="40" y="100" width="230" height="50" rx="6" fill="#dde1e7" stroke="#454b54" stroke-width="2"/>
  <text x="155" y="122" font-size="13" text-anchor="middle" fill="#17191c">kubectl apply -f</text>
  <text x="155" y="138" font-size="11" text-anchor="middle" fill="#17191c">ravelcluster-dev.yaml</text>

  <line x1="270" y1="125" x2="320" y2="125" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="320" y="100" width="240" height="50" rx="6" fill="#dde1e7" stroke="#454b54" stroke-width="2"/>
  <text x="440" y="122" font-size="13" text-anchor="middle" fill="#17191c">Kubernetes API server</text>
  <text x="440" y="138" font-size="11" text-anchor="middle" fill="#17191c">admission, CEL validation, etcd</text>

  <line x1="560" y1="125" x2="610" y2="125" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="610" y="100" width="270" height="50" rx="6" fill="#d9c9ec" stroke="#5b3a86" stroke-width="2"/>
  <text x="745" y="122" font-size="13" font-weight="bold" text-anchor="middle" fill="#17191c">RavelCluster "dev"</text>
  <text x="745" y="138" font-size="11" text-anchor="middle" fill="#17191c">ravel.nofire.ai/v1alpha1, spec.shards CEL-immutable</text>

  <!-- watch: RavelCluster -> controller -->
  <line x1="700" y1="150" x2="640" y2="228" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="1,3" marker-end="url(#arrowMuted)"/>
  <text x="600" y="190" font-size="11" fill="#4a4f57">watch</text>

  <!-- status feedback: controller -> RavelCluster -->
  <line x1="790" y1="228" x2="830" y2="150" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="1,3" marker-end="url(#arrowMuted)"/>
  <text x="800" y="190" font-size="11" fill="#4a4f57">writes status</text>

  <!-- Controller -->
  <rect x="560" y="230" width="340" height="72" rx="6" fill="#f4c869" stroke="#8a5a10" stroke-width="2"/>
  <text x="730" y="256" font-size="14" font-weight="bold" text-anchor="middle" fill="#17191c">ravel-operator controller</text>
  <text x="730" y="273" font-size="11" text-anchor="middle" fill="#17191c">kube-rs, one process, no leader election</text>
  <text x="730" y="288" font-size="11" text-anchor="middle" fill="#17191c">(safe to crash and restart: reconcile is idempotent)</text>

  <!-- Secrets, read-only -->
  <rect x="1000" y="248" width="220" height="46" rx="6" fill="#eceef1" stroke="#5b3a86" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="1110" y="267" font-size="12" text-anchor="middle" fill="#17191c">Secrets</text>
  <text x="1110" y="282" font-size="10.5" text-anchor="middle" fill="#17191c">s3 credentials, tenant tokens</text>
  <line x1="900" y1="266" x2="995" y2="266" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>
  <text x="905" y="245" font-size="10.5" fill="#4a4f57">get only, checksummed into a</text>
  <text x="905" y="303" font-size="10.5" fill="#4a4f57">pod-template annotation</text>

  <!-- owns arrows down to the three tiers -->
  <line x1="650" y1="302" x2="225" y2="378" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="302" x2="525" y2="378" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="302" x2="825" y2="378" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="345" font-size="10.5" fill="#4a4f57">creates/owns, one Server-Side Apply per object</text>

  <!-- watch owned objects (readyReplicas) back up -->
  <line x1="300" y1="378" x2="620" y2="302" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="1,3" marker-end="url(#arrowMuted)"/>
  <text x="330" y="360" font-size="10.5" fill="#4a4f57">watch (owned only): readyReplicas</text>

  <!-- gateway column -->
  <rect x="100" y="378" width="250" height="55" rx="6" fill="#d9c9ec" stroke="#5b3a86" stroke-width="2"/>
  <text x="225" y="401" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#17191c">dev-gateway Deployment</text>
  <text x="225" y="417" font-size="10.5" text-anchor="middle" fill="#17191c">RollingUpdate, replicas = spec.gateway.replicas</text>

  <rect x="100" y="448" width="250" height="42" rx="6" fill="#d9c9ec" stroke="#5b3a86" stroke-width="2"/>
  <text x="225" y="467" font-size="12" text-anchor="middle" fill="#17191c">dev-gateway Service</text>
  <text x="225" y="482" font-size="10.5" text-anchor="middle" fill="#17191c">:4318 http/otlp/query, :4317 otlp/grpc</text>

  <line x1="225" y1="490" x2="225" y2="510" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="115" y="510" width="90" height="40" rx="5" fill="#a9c9e6" stroke="#1f4e79" stroke-width="2"/>
  <rect x="245" y="510" width="90" height="40" rx="5" fill="#a9c9e6" stroke="#1f4e79" stroke-width="2"/>
  <text x="160" y="528" font-size="10" text-anchor="middle" fill="#17191c">pod</text>
  <text x="160" y="541" font-size="9" text-anchor="middle" fill="#17191c">/healthz /readyz</text>
  <text x="290" y="528" font-size="10" text-anchor="middle" fill="#17191c">pod</text>
  <text x="290" y="541" font-size="9" text-anchor="middle" fill="#17191c">/healthz /readyz</text>

  <!-- query column -->
  <rect x="400" y="378" width="250" height="55" rx="6" fill="#d9c9ec" stroke="#5b3a86" stroke-width="2"/>
  <text x="525" y="401" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#17191c">dev-query Deployment</text>
  <text x="525" y="417" font-size="10.5" text-anchor="middle" fill="#17191c">RollingUpdate, replicas = spec.query.replicas</text>

  <rect x="400" y="448" width="250" height="42" rx="6" fill="#d9c9ec" stroke="#5b3a86" stroke-width="2"/>
  <text x="525" y="467" font-size="12" text-anchor="middle" fill="#17191c">dev-query Service</text>
  <text x="525" y="482" font-size="10.5" text-anchor="middle" fill="#17191c">:4318</text>

  <line x1="525" y1="490" x2="525" y2="510" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="415" y="510" width="90" height="40" rx="5" fill="#a9c9e6" stroke="#1f4e79" stroke-width="2"/>
  <rect x="545" y="510" width="90" height="40" rx="5" fill="#a9c9e6" stroke="#1f4e79" stroke-width="2"/>
  <text x="460" y="528" font-size="10" text-anchor="middle" fill="#17191c">pod</text>
  <text x="460" y="541" font-size="9" text-anchor="middle" fill="#17191c">/healthz /readyz</text>
  <text x="590" y="528" font-size="10" text-anchor="middle" fill="#17191c">pod</text>
  <text x="590" y="541" font-size="9" text-anchor="middle" fill="#17191c">/healthz /readyz</text>

  <!-- maintain column -->
  <rect x="700" y="378" width="250" height="55" rx="6" fill="#d9c9ec" stroke="#5b3a86" stroke-width="2"/>
  <text x="825" y="396" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#17191c">dev-maintain Deployment</text>
  <text x="825" y="411" font-size="10.5" text-anchor="middle" fill="#17191c">Recreate, 1 replica</text>
  <text x="825" y="425" font-size="10.5" text-anchor="middle" fill="#17191c">absent if maintain.enabled=false</text>

  <rect x="765" y="448" width="120" height="42" rx="6" fill="#eceef1" stroke="#8f96a3" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="825" y="473" font-size="10.5" text-anchor="middle" fill="#4a4f57">no Service</text>

  <line x1="825" y1="433" x2="825" y2="510" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="780" y="510" width="90" height="40" rx="5" fill="#a9c9e6" stroke="#1f4e79" stroke-width="2"/>
  <text x="825" y="528" font-size="10" text-anchor="middle" fill="#17191c">pod</text>
  <text x="825" y="541" font-size="9" text-anchor="middle" fill="#17191c">/healthz /readyz</text>

  <!-- bottom notes -->
  <text x="40" y="605" font-size="11.5" fill="#4a4f57">Available=True once gateway and query both report ready replicas: not just "objects created". A failed reconcile (missing Secret, apply</text>
  <text x="40" y="622" font-size="11.5" fill="#4a4f57">error) writes Degraded=True with a reason and flips Available to False, so `kubectl wait --for=condition=Available` fails loudly instead of timing out.</text>
  <text x="40" y="646" font-size="11.5" fill="#4a4f57">Maintain has one replica and no Service because nothing calls it: it runs compaction/retention on its own interval. A second concurrent</text>
  <text x="40" y="663" font-size="11.5" fill="#4a4f57">maintainer during a rollout cannot corrupt state: the CAS commit protocol makes that safe, so Recreate is a cost optimization, not a correctness guard.</text>
</svg>
