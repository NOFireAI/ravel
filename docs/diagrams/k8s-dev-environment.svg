<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" font-family="system-ui, sans-serif" role="img" aria-label="kind local development environment: the ordered steps scripts/kind-up.sh runs to create a cluster, build and load container images, and bring up Ravel.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#383e46"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="620" fill="#f4f5f7"/>

  <text x="30" y="34" font-size="22" font-weight="bold" fill="#17191c">kind local development environment</text>
  <text x="30" y="54" font-size="13" fill="#4a4f57">docs/guides/kubernetes.md: what scripts/kind-up.sh does, in order</text>

  <!-- Legend -->
  <g>
    <rect x="1150" y="18" width="270" height="106" rx="6" fill="#eceef1" stroke="#454b54" stroke-width="1.5"/>
    <text x="1162" y="34" font-size="12" font-weight="bold" fill="#17191c">Legend</text>
    <rect x="1162" y="42" width="16" height="16" rx="3" fill="#dde1e7" stroke="#454b54" stroke-width="1.5"/>
    <text x="1185" y="54" font-size="11" fill="#17191c">host / kind-up.sh's own step</text>
    <rect x="1162" y="64" width="16" height="16" rx="3" fill="#f4c869" stroke="#8a5a10" stroke-width="1.5"/>
    <text x="1185" y="76" font-size="11" fill="#17191c">fake S3 backend (floci / minio)</text>
    <rect x="1162" y="86" width="16" height="16" rx="3" fill="#d9c9ec" stroke="#5b3a86" stroke-width="1.5"/>
    <text x="1185" y="98" font-size="11" fill="#17191c">Kubernetes object</text>
    <rect x="1162" y="108" width="16" height="16" rx="3" fill="#a9c9e6" stroke="#1f4e79" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="1185" y="120" font-size="11" fill="#17191c">conditional step (env-var gated)</text>
  </g>

  <!-- Step 1 -->
  <rect x="40" y="100" width="230" height="60" rx="6" fill="#dde1e7" stroke="#454b54" stroke-width="2"/>
  <text x="155" y="122" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#17191c">1. kind create cluster</text>
  <text x="155" y="138" font-size="10.5" text-anchor="middle" fill="#17191c">RAVEL_KIND_CLUSTER (default ravel-dev)</text>
  <text x="155" y="152" font-size="10.5" text-anchor="middle" fill="#17191c">reused if it already exists</text>

  <line x1="270" y1="130" x2="310" y2="130" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="310" y="100" width="240" height="60" rx="6" fill="#a9c9e6" stroke="#1f4e79" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="430" y="120" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#17191c">2. docker build</text>
  <text x="430" y="136" font-size="10.5" text-anchor="middle" fill="#17191c">root Dockerfile, server + operator targets</text>
  <text x="430" y="150" font-size="10.5" text-anchor="middle" fill="#17191c">skipped if RAVEL_SKIP_IMAGE_BUILD=1</text>

  <line x1="550" y1="130" x2="590" y2="130" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="590" y="100" width="240" height="60" rx="6" fill="#dde1e7" stroke="#454b54" stroke-width="2"/>
  <text x="710" y="120" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#17191c">3. kind load docker-image</text>
  <text x="710" y="136" font-size="10.5" text-anchor="middle" fill="#17191c">both images, into the node's own store</text>
  <text x="710" y="150" font-size="10.5" text-anchor="middle" fill="#17191c">no registry needed</text>

  <line x1="830" y1="130" x2="870" y2="130" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="870" y="100" width="250" height="60" rx="6" fill="#f4c869" stroke="#8a5a10" stroke-width="2"/>
  <text x="995" y="120" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#17191c">4. fake S3 backend</text>
  <text x="995" y="136" font-size="10.5" text-anchor="middle" fill="#17191c">floci (default) or minio, RAVEL_FAKE_S3_BACKEND</text>
  <text x="995" y="150" font-size="10.5" text-anchor="middle" fill="#17191c">waits for the bucket Job to prove the bucket exists</text>

  <line x1="995" y1="160" x2="995" y2="200" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <rect x="870" y="200" width="250" height="60" rx="6" fill="#d9c9ec" stroke="#5b3a86" stroke-width="2"/>
  <text x="995" y="220" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#17191c">5. install CRD, RBAC, operator</text>
  <text x="995" y="236" font-size="10.5" text-anchor="middle" fill="#17191c">deploy/k8s/operator/*.yaml, in that order</text>
  <text x="995" y="250" font-size="10.5" text-anchor="middle" fill="#17191c">CRD and RBAC before the operator Deployment</text>

  <line x1="870" y1="230" x2="605" y2="230" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6 -->
  <rect x="365" y="200" width="240" height="60" rx="6" fill="#d9c9ec" stroke="#5b3a86" stroke-width="2"/>
  <text x="485" y="220" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#17191c">6. apply RavelCluster "dev"</text>
  <text x="485" y="236" font-size="10.5" text-anchor="middle" fill="#17191c">image tags, backend endpoint, both Secrets</text>
  <text x="485" y="250" font-size="10.5" text-anchor="middle" fill="#17191c">created fresh, never committed to git</text>

  <line x1="485" y1="260" x2="485" y2="300" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 7 -->
  <rect x="365" y="300" width="240" height="60" rx="6" fill="#dde1e7" stroke="#454b54" stroke-width="2"/>
  <text x="485" y="320" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#17191c">7. wait --for=condition=Available</text>
  <text x="485" y="336" font-size="10.5" text-anchor="middle" fill="#17191c">gateway and query pods really pass /readyz</text>
  <text x="485" y="350" font-size="10.5" text-anchor="middle" fill="#17191c">against the real fake-S3 backend</text>

  <line x1="605" y1="330" x2="1150" y2="330" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- kind-demo.sh -->
  <rect x="1150" y="200" width="250" height="160" rx="6" fill="#a9c9e6" stroke="#1f4e79" stroke-width="2"/>
  <text x="1275" y="222" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#17191c">kind-demo.sh</text>
  <text x="1275" y="242" font-size="10.5" text-anchor="middle" fill="#17191c">OTLP ingest through</text>
  <text x="1275" y="256" font-size="10.5" text-anchor="middle" fill="#17191c">the gateway Service</text>
  <text x="1275" y="278" font-size="10.5" text-anchor="middle" fill="#17191c">query the value back</text>
  <text x="1275" y="292" font-size="10.5" text-anchor="middle" fill="#17191c">through the query Service</text>
  <text x="1275" y="314" font-size="10.5" text-anchor="middle" fill="#17191c">asserts the round-trip value</text>
  <text x="1275" y="328" font-size="10.5" text-anchor="middle" fill="#17191c">exits nonzero on any mismatch</text>
  <text x="1275" y="348" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#17191c">no separate proof-of-run check needed</text>

  <line x1="1275" y1="360" x2="1275" y2="420" stroke="#383e46" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1150" y="420" width="250" height="50" rx="6" fill="#dde1e7" stroke="#454b54" stroke-width="2"/>
  <text x="1275" y="442" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#17191c">kind-demo.sh</text>
  <text x="1275" y="458" font-size="10.5" text-anchor="middle" fill="#17191c">delete the cluster; safe no-op if already gone</text>

  <!-- failure path note -->
  <rect x="40" y="440" width="1050" height="80" rx="6" fill="#f7d4d0" stroke="#a13d2f" stroke-width="1.5"/>
  <text x="60" y="462" font-size="12" font-weight="bold" fill="#7a2418">On any step failing</text>
  <text x="60" y="480" font-size="11" fill="#7a2418">kind-up.sh dumps the namespace's objects, the RavelCluster's status, pod descriptions, and the operator's logs: then leaves the</text>
  <text x="60" y="496" font-size="11" fill="#7a2418">cluster running instead of tearing it down, so the state that caused the failure is still there to look at.</text>

  <text x="40" y="560" font-size="11.5" fill="#4a4f57">All three scripts read the same env vars (RAVEL_KIND_CLUSTER, RAVEL_SERVER_IMAGE, RAVEL_OPERATOR_IMAGE, RAVEL_FAKE_S3_BACKEND, ...),</text>
  <text x="40" y="577" font-size="11.5" fill="#4a4f57">so there is exactly one place each setting is defined: this is also the exact sequence CI's k8s-integration job drives, see k8s-ci-integration.svg.</text>
</svg>
