<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="system-ui, sans-serif" font-size="15" role="img" aria-label="Ingest-timestamp plausibility window: the accept region between now minus max_ingest_lag and now plus max_future_skew on the event-time axis, the TooOld and FutureSkew reject zones, the per-signal bounded timestamps, and a long-running span admitted because only its bounded end is checked.">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#383e46"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6b34"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="540" fill="#f4f5f7"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#17191c">Ingest-timestamp plausibility window (ADR-0051 amendment)</text>

  <!-- reject: too old -->
  <rect x="60" y="105" width="267" height="200" rx="8" fill="#f6e3e1" stroke="#a3302a" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="80" y="135" font-size="15" font-weight="bold" fill="#a3302a">reject: TooOld</text>
  <text x="80" y="157" font-size="12" fill="#17191c">typed, no commit token,</text>
  <text x="80" y="175" font-size="12" fill="#17191c">never clamped, never bucket 0</text>

  <!-- accept -->
  <rect x="330" y="105" width="395" height="200" rx="8" fill="#e6efe6" stroke="#3f7042" stroke-width="2.4"/>
  <text x="430" y="135" font-size="15" font-weight="bold" fill="#2f6b34">accept (endpoints inclusive)</text>
  <text x="430" y="157" font-size="12" fill="#17191c">normalize, commit, token</text>

  <!-- reject: future skew -->
  <rect x="728" y="106" width="151" height="199" rx="8" fill="#f6e3e1" stroke="#a3302a" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="744" y="135" font-size="15" font-weight="bold" fill="#a3302a">reject:</text>
  <text x="744" y="155" font-size="15" font-weight="bold" fill="#a3302a">FutureSkew</text>

  <!-- time axis -->
  <path d="M45,340 L883,340" fill="none" stroke="#383e46" stroke-width="2" marker-end="url(#arr)"/>
  <text x="838" y="365" font-size="13" fill="#4a4f57">event time</text>

  <!-- edge ticks -->
  <path d="M330,305 L330,348" fill="none" stroke="#2f6b34" stroke-width="2"/>
  <text x="248" y="372" font-size="13" fill="#2f6b34">now - max_ingest_lag (2 h)</text>
  <path d="M640,305 L640,348" fill="none" stroke="#383e46" stroke-width="2"/>
  <text x="629" y="372" font-size="13" fill="#4a4f57">now</text>
  <path d="M726,305 L726,348" fill="none" stroke="#a3302a" stroke-width="2"/>
  <text x="666" y="394" font-size="13" fill="#a3302a">now + max_future_skew (10 m)</text>

  <!-- metric sample: accepted -->
  <circle cx="470" cy="195" r="6" fill="#1f4e79"/>
  <text x="484" y="200" font-size="13" fill="#1f4e79">metric sample ts</text>

  <!-- log record: accepted -->
  <circle cx="520" cy="228" r="6" fill="#1f4e79"/>
  <text x="534" y="233" font-size="13" fill="#1f4e79">log record ts (after fallbacks)</text>

  <!-- rejected old sample -->
  <circle cx="180" cy="225" r="6" fill="none" stroke="#a3302a" stroke-width="2"/>
  <text x="120" y="250" font-size="12" fill="#a3302a">older than the lag</text>

  <!-- rejected future sample -->
  <circle cx="800" cy="215" r="6" fill="none" stroke="#a3302a" stroke-width="2"/>
  <text x="754" y="240" font-size="12" fill="#a3302a">leads now by &gt; skew</text>

  <!-- long-running span: start left of window, end inside; admitted -->
  <path d="M120,272 L596,271" fill="none" stroke="#8a5a10" stroke-width="3"/>
  <circle cx="120" cy="272" r="6" fill="none" stroke="#8a5a10" stroke-width="2"/>
  <circle cx="596" cy="271" r="6" fill="#8a5a10"/>
  <text x="88" y="296" font-size="12" fill="#8a5a10">span START: unbounded</text>
  <text x="88" y="313" font-size="12" fill="#8a5a10">(long-running span admitted)</text>
  <text x="540" y="296" font-size="12" fill="#8a5a10">span END: bounded, both edges</text>

  <!-- annotation arrow from accept caption to span end -->
  <path d="M600,180 L600,260" fill="none" stroke="#2f6b34" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrG)"/>
  <text x="612" y="212" font-size="12" fill="#2f6b34">only the END is checked</text>

  <!-- footnotes -->
  <text x="60" y="435" font-size="13" fill="#17191c">boundary: equality admits; rejection requires strictly exceeding an edge</text>
  <text x="60" y="460" font-size="13" fill="#17191c">"now" = receiver admission clock. The clock itself must pass</text>
  <text x="60" y="482" font-size="13" fill="#17191c">MIN_PLAUSIBLE_INGEST_CLOCK_NS (2020-01-01) and yield a representable</text>
  <text x="60" y="504" font-size="13" fill="#17191c">hour bucket, or the whole request is rejected 503 (reason="clock")</text>
</svg>
