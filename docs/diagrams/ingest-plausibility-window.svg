<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive" font-size="15">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 Q 6 4 8.5 5 Q 6 6 1 8.5" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 Q 6 4 8.5 5 Q 6 6 1 8.5" fill="none" stroke="#4c6b45" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="920" height="540" fill="#fdfcf8"/>
  <text x="24" y="34" font-size="20" fill="#1b2230">Ingest-timestamp plausibility window (ADR-0051 amendment, #905)</text>

  <!-- reject: too old -->
  <path d="M 60 110 Q 58 107 64 107 L 320 105 Q 327 106 326 112 L 327 298 Q 326 304 320 303 L 65 305 Q 59 304 60 298 Z" fill="#f7ecec" stroke="#b3423a" stroke-width="2" stroke-dasharray="7 4" stroke-linecap="round"/>
  <text x="80" y="135" fill="#b3423a">reject: TooOld</text>
  <text x="80" y="157" font-size="12" fill="#5b6472">typed, no commit token,</text>
  <text x="80" y="175" font-size="12" fill="#5b6472">never clamped, never bucket 0</text>

  <!-- accept -->
  <path d="M 330 110 Q 328 107 334 107 L 718 105 Q 725 106 724 112 L 725 298 Q 724 304 718 303 L 335 305 Q 329 304 330 298 Z" fill="#eaf1ea" stroke="#4c6b45" stroke-width="2.4" stroke-linecap="round"/>
  <text x="430" y="135" fill="#4c6b45">accept (endpoints inclusive)</text>
  <text x="430" y="157" font-size="12" fill="#5b6472">normalize, commit, token</text>

  <!-- reject: future skew -->
  <path d="M 728 110 Q 726 107 732 107 L 872 106 Q 879 107 878 113 L 879 298 Q 878 304 872 303 L 733 305 Q 727 304 728 298 Z" fill="#f7ecec" stroke="#b3423a" stroke-width="2" stroke-dasharray="7 4" stroke-linecap="round"/>
  <text x="744" y="135" fill="#b3423a">reject:</text>
  <text x="744" y="155" fill="#b3423a">FutureSkew</text>

  <!-- time axis -->
  <path d="M 45 340 Q 300 336 600 339 Q 780 341 885 338" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
  <text x="838" y="365" font-size="13" fill="#444">event time</text>

  <!-- edge ticks -->
  <path d="M 330 305 Q 331 322 330 348" fill="none" stroke="#4c6b45" stroke-width="2" stroke-linecap="round"/>
  <text x="248" y="372" font-size="13" fill="#4c6b45">now - max_ingest_lag (2 h)</text>
  <path d="M 640 305 Q 639 322 640 348" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round"/>
  <text x="629" y="372" font-size="13" fill="#444">now</text>
  <path d="M 726 305 Q 727 322 726 348" fill="none" stroke="#b3423a" stroke-width="2" stroke-linecap="round"/>
  <text x="666" y="394" font-size="13" fill="#b3423a">now + max_future_skew (10 m)</text>

  <!-- metric sample: accepted -->
  <circle cx="470" cy="195" r="6" fill="#31536b"/>
  <text x="484" y="200" font-size="13" fill="#31536b">metric sample ts</text>

  <!-- log record: accepted -->
  <circle cx="520" cy="228" r="6" fill="#31536b"/>
  <text x="534" y="233" font-size="13" fill="#31536b">log record ts (after fallbacks)</text>

  <!-- rejected old sample -->
  <circle cx="180" cy="225" r="6" fill="none" stroke="#b3423a" stroke-width="2"/>
  <text x="120" y="250" font-size="12" fill="#b3423a">older than the lag</text>

  <!-- rejected future sample -->
  <circle cx="800" cy="215" r="6" fill="none" stroke="#b3423a" stroke-width="2"/>
  <text x="754" y="240" font-size="12" fill="#b3423a">leads now by &gt; skew</text>

  <!-- long-running span: start left of window, end inside; admitted -->
  <path d="M 120 272 Q 300 268 596 271" fill="none" stroke="#8a6d1f" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="272" r="6" fill="none" stroke="#8a6d1f" stroke-width="2"/>
  <circle cx="596" cy="271" r="6" fill="#8a6d1f"/>
  <text x="88" y="296" font-size="12" fill="#8a6d1f">span START: unbounded</text>
  <text x="88" y="313" font-size="12" fill="#8a6d1f">(long-running span admitted)</text>
  <text x="540" y="296" font-size="12" fill="#8a6d1f">span END: bounded, both edges</text>

  <!-- annotation arrow from accept caption to span end -->
  <path d="M 600 175 Q 620 220 601 262" fill="none" stroke="#4c6b45" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrG)" stroke-linecap="round"/>
  <text x="612" y="212" font-size="12" fill="#4c6b45">only the END is checked</text>

  <!-- footnotes -->
  <text x="60" y="435" font-size="13" fill="#1b2230">boundary: equality admits; rejection requires strictly exceeding an edge</text>
  <text x="60" y="460" font-size="13" fill="#1b2230">"now" = receiver admission clock. The clock itself must pass</text>
  <text x="60" y="482" font-size="13" fill="#1b2230">MIN_PLAUSIBLE_INGEST_CLOCK_NS (2020-01-01) and yield a representable</text>
  <text x="60" y="504" font-size="13" fill="#1b2230">hour bucket, or the whole request is rejected 503 (reason="clock")</text>
</svg>
