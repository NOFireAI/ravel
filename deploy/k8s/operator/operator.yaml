# The Ravel operator Deployment and its namespace (ADR-0034 decision 6).
#
# Apply order: namespace, then crd.yaml, then rbac.yaml, then this file. The
# image tag is a placeholder the kind scripts override with the
# locally built tag. For a real (non-kind) cluster, pin the image to a
# digest rather than a moving tag, e.g.
# ghcr.io/nofireai/ravel-operator@sha256:<digest> (ADR-0037): a tag like
# `:latest` can point at a different image after this manifest is reviewed,
# so a digest is what makes the reviewed manifest and the deployed image the
# same thing.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ravel-system
  labels:
    app.kubernetes.io/name: ravel-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ravel-operator
  namespace: ravel-system
  labels:
    app.kubernetes.io/name: ravel-operator
    app.kubernetes.io/managed-by: ravel-operator
spec:
  replicas: 1
  # The operator is not designed for concurrent active instances; a single
  # replica is sufficient for the reconcile load (one CRD, stateless children).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ravel-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ravel-operator
        app.kubernetes.io/managed-by: ravel-operator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: ravel-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ravel-operator
          image: ravel-operator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8080
          env:
            - name: RUST_LOG
              value: info
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
