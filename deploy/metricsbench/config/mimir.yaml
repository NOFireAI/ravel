# Grafana Mimir configuration for the MetricsBench object-storage-native
# comparator (ADR-0927). Monolithic (-target=all) single-instance deployment.
# Written for grafana/mimir:3.2.3. Every field below parses under 3.2.3 with no
# removal or rename from the 2.14.2 config; defaults quoted in comments are the
# 3.2.3 binary's own `mimir -help-all` output.
#
# Every setting that changes what data a query sees, when it becomes durable, or
# how long it is kept is disclosed in a comment next to the setting (ADR-0927
# deliverable: no unpublished tuning, no undisclosed transformation).

# Single-tenant benchmark: no per-request X-Scope-OrgID header required. The
# harness sends the same Remote Write stream it sends every other comparator,
# with no Mimir-specific auth header, so the portable lane stays uniform.
multitenancy_enabled: false

server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  # gRPC message ceilings sized for high-cardinality remote-write batches from
  # the ADR-0927 cardinality profile (1,000,000 series). In 3.2.3 this equals
  # the default (-server.grpc-max-recv-msg-size-bytes and
  # -server.grpc-max-send-msg-size-bytes, default 104857600); it stays pinned
  # so a future default change cannot shrink it. COMMITTED, EXPLAINED tuning to
  # let the benchmark's own load through, not a performance optimisation.
  grpc_server_max_recv_msg_size: 104857600
  grpc_server_max_send_msg_size: 104857600

# Single connection to RustFS shared by every S3-backed storage below.
# DURABILITY: this points Mimir's durable state at S3 (RustFS in this stack).
# See the durability note beside the mimir service in docker-compose.yml and
# ADR-0927 decision 10: a RustFS result is a correctness result, not a
# publishable one.
common:
  storage:
    backend: s3
    s3:
      endpoint: rustfs:9000
      insecure: true
      access_key_id: mimir
      secret_access_key: mimir-dev-secret

blocks_storage:
  s3:
    bucket_name: mimir-blocks
  tsdb:
    dir: /data/tsdb
    # DELAYED OBJECT-STORAGE VISIBILITY / MATERIALISED STATE (disclosed): the
    # ingester keeps recent samples in a local head block plus WAL under this
    # dir (-blocks-storage.tsdb.dir: "TSDBs (including WAL) in the ingesters")
    # and only ships a TSDB block to S3 after each 2h head range closes (TSDB
    # block range period, default 2h, per -blocks-storage.tsdb.retention-period
    # help; shipping scans every 1m per -blocks-storage.tsdb.ship-interval).
    # So an ack is durable on the local WAL, and the S3 copy the store-gateway
    # serves appears later. Left at the 2h default: shortening it would be
    # undisclosed tuning that changes the ack-to-object-storage timing the
    # benchmark is measuring.
    #
    # LOCAL BLOCK RETENTION (disclosed): the ingester deletes its local copy of
    # a block 25h after uploading it (-blocks-storage.tsdb.retention-period,
    # 3.2.3 default 13h, must exceed the 2h block range and
    # -querier.query-store-after, default 12h). This ages only the ingester's
    # local copy; the S3 copy is governed by compactor_blocks_retention_period
    # below.
    retention_period: 25h
  bucket_store:
    sync_dir: /data/tsdb-sync

compactor:
  data_dir: /data/compactor
  # COMPACTION / MATERIALISED STATE (disclosed): the compactor merges shipped
  # blocks in object storage over the default ranges 2h, 12h, 24h
  # (-compactor.block-ranges). NO DOWNSAMPLING: the 3.2.3 binary exposes no
  # downsampling flag in -help-all (unlike Thanos' optional downsampling), so
  # stored resolution is not reduced. Left at defaults; no unpublished tuning.
  sharding_ring:
    kvstore:
      store: memberlist

ingester:
  ring:
    # Single-instance benchmark deployment: one replica, no cross-node
    # replication. A real Mimir cluster runs replication_factor 3; this is a
    # DISCLOSED single-node topology, comparable to the single-node Prometheus
    # and VictoriaMetrics comparators, not to a replicated production cluster.
    replication_factor: 1
    kvstore:
      store: memberlist

store_gateway:
  sharding_ring:
    replication_factor: 1
    kvstore:
      store: memberlist

ruler_storage:
  s3:
    bucket_name: mimir-ruler

alertmanager_storage:
  s3:
    bucket_name: mimir-alertmanager

limits:
  # Raise ingestion ceilings so the ADR-0927 profiles' sample and series volume
  # is admitted rather than rejected. A silent rejection would violate the
  # "ingested == generated minus reported rejections" acceptance gate (ADR-0927
  # bands, clause 4). COMMITTED, EXPLAINED tuning: it enlarges capacity to fit
  # the declared load, it does not make queries faster.
  max_global_series_per_user: 0        # 0 = unlimited active series
  ingestion_rate: 5000000              # samples/sec
  ingestion_burst_size: 20000000       # samples
  # RETENTION (disclosed): the compactor deletes blocks holding samples older
  # than 45d, and the query-frontend does not query beyond it
  # (-compactor.blocks-retention-period; 3.2.3 default is 0, deletion
  # disabled). Set above the history profile's 30d, matching the Prometheus and
  # VictoriaMetrics comparators' 45d, so retention cannot drop benchmark samples
  # mid-run.
  compactor_blocks_retention_period: 45d
  # NATIVE HISTOGRAMS (disclosed): 3.x flipped this default from false to
  # true (-ingester.native-histograms-ingestion-enabled, 2.14.2 help: samples
  # "ignored without an error"; 3.2.3 help: "(default true)"). Pinned true
  # explicitly: the MetricsBench generator emits native histogram samples and
  # the contract wants every receiver to store them, so a run on 2.14.2 and a
  # run on 3.2.3 must not differ silently on what this comparator holds.
  native_histograms_ingestion_enabled: true
