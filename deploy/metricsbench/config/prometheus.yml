# Prometheus configuration for the MetricsBench comparator (ADR-0927).
#
# Deliberately minimal. In the MetricsBench portable lane Prometheus receives
# its samples over Remote Write 1.0 (enabled by --web.enable-remote-write-receiver
# in docker-compose.yml), NOT by scraping, so there are no scrape_configs. Adding
# a scrape job would inject samples the other comparators never see and break the
# "every system receives the same logical samples" contract (ADR-0927 decision 1).
global:
  # Present only because Prometheus requires a global block; it does not scrape
  # anything here. No evaluation_interval / rule_files: recording and alerting
  # rules are out of scope for MetricsBench v1 (ADR-0927 decision 6).
  scrape_interval: 15s
  evaluation_interval: 15s

storage:
  tsdb:
    # OUT-OF-ORDER WINDOW (disclosed, frozen; replaces the 3.13.1 default of 0,
    # which /api/v1/status/config shows as `outofordertimewindow: 0` and which
    # rejects every out-of-order sample). ADR-0927's 2026-10-26 amendment B
    # makes the generator's out-of-order anomaly a shift of one and a half
    # scrape intervals (22.5s at 15s), off the scrape grid, and the window
    # exists so such a sample is stored by every receiver; 1h also covers a
    # bulk historical replay arriving slightly out of time order.
    # Without it the Remote Write 1.0 receiver rejects the WHOLE request with
    # HTTP 400 on the first out-of-window sample, in-order samples included.
    # Matches Mimir's limits.out_of_order_time_window in config/mimir.yaml.
    out_of_order_time_window: 1h
