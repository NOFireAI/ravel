services:
  # MinIO images are pulled from quay.io, not Docker Hub: Docker Hub's
  # anonymous pull allowance is per-IP and shared across every project on a
  # runner, so an unauthenticated pull from there fails unpredictably.
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ravel
      MINIO_ROOT_PASSWORD: ravel-dev-secret
    volumes:
      - ../../minio-data:/data
  createbucket:
    image: quay.io/minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      sleep 2 &&
      mc alias set local http://minio:9000 ravel ravel-dev-secret &&
      mc mb -p local/ravel-dev || true"
