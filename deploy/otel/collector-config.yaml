# OpenTelemetry Collector config for the container-first quickstart
# (ADR-0081 decision 3). Scrapes host metrics and exports them to ravel-server
# over OTLP/HTTP, authenticating with the demo bearer token.
#
# SECURITY: `demo-token` is a fixed development credential, matching the
# `--tenant-token demo-token=demo-tenant` ravel-server runs with in
# deploy/docker-compose/ravel.yml. It is not a secret and is not for any
# network-reachable deployment.
extensions:
  # Injects `Authorization: Bearer demo-token` on the exporter's requests, the
  # same tenant credential ravel-server maps to `demo-tenant`.
  bearertokenauth:
    scheme: Bearer
    token: demo-token

receivers:
  # Only scrapers that read /proc work in a container with no host mounts:
  # cpu (/proc/stat), load (/proc/loadavg), memory (/proc/meminfo), and
  # network (/proc/net/dev). disk/filesystem are omitted deliberately; they
  # need host device mounts the quickstart does not grant.
  hostmetrics:
    collection_interval: 10s
    scrapers:
      cpu:
      load:
      memory:
      network:

processors:
  batch:

exporters:
  # OTLP/HTTP posts to ravel-server's /v1/metrics (the exporter appends the
  # signal path to this base). Protobuf encoding, which is what
  # ExportMetricsServiceRequest::decode expects.
  otlphttp:
    endpoint: http://ravel-server:4318
    auth:
      authenticator: bearertokenauth
    # The exporter defaults to gzip. Ravel's OTLP HTTP ingest does not decode
    # compressed bodies yet (#115), and rejects them with HTTP 400 "invalid
    # OTLP payload". Without this, every export the collector sends is dropped
    # and the quickstart's Grafana dashboard stays empty.
    compression: none

service:
  extensions: [bearertokenauth]
  pipelines:
    metrics:
      receivers: [hostmetrics]
      processors: [batch]
      exporters: [otlphttp]
  # The collector's own delivery counters, on a Prometheus endpoint.
  #
  # This exists so that "is the collector actually delivering?" is a question
  # with a numeric answer. It is the assertion CI needs (#209) and the first
  # thing to read when the Grafana dashboard is empty: a non-zero
  # `otelcol_exporter_send_failed_metric_points` says the collector is running
  # and Ravel is refusing its exports, which is a different fault from the
  # collector not scraping at all.
  #
  # The address must be 0.0.0.0, not the default localhost. localhost binds the
  # container's own loopback, which no port mapping can reach.
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
