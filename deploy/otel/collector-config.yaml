# OpenTelemetry Collector config for the container-first quickstart
# (ADR-0081 decision 3). Scrapes host metrics and tails the collector's own
# log output, exporting both to ravel-server over OTLP/HTTP, authenticating
# with the demo bearer token. This is what makes the README's PromQL-over-logs
# example (`ravel_log_lines`) non-empty on a fresh `docker compose up`: there
# is no other log source in the quickstart (issue #1334).
#
# SECURITY: `demo-token` is a fixed development credential, matching the
# `--tenant-token demo-token=demo-tenant` ravel-server runs with in
# deploy/docker-compose/ravel.yml. It is not a secret and is not for any
# network-reachable deployment.
extensions:
  # Injects `Authorization: Bearer demo-token` on the exporter's requests, the
  # same tenant credential ravel-server maps to `demo-tenant`.
  bearertokenauth:
    scheme: Bearer
    token: demo-token

receivers:
  # Only scrapers that read /proc work in a container with no host mounts:
  # cpu (/proc/stat), load (/proc/loadavg), memory (/proc/meminfo), and
  # network (/proc/net/dev). disk/filesystem are omitted deliberately; they
  # need host device mounts the quickstart does not grant.
  hostmetrics:
    collection_interval: 10s
    scrapers:
      cpu:
      load:
      memory:
      network:

  # Tails the file the collector's own telemetry logs are mirrored to below
  # (service.telemetry.logs.output_paths). It is the one log source every
  # quickstart run has without a host mount or a second container: the
  # collector always logs its own startup and scrape activity.
  filelog:
    include: [/tmp/otelcol-collector.log]
    start_at: beginning

processors:
  batch:

  # Stamps a `service.name` resource attribute on the tailed log records.
  # ravel-otlp turns `service.name` into the `job` label on ingest
  # (crates/ravel-otlp/src/normalize.rs, mirrored for logs in
  # crates/ravel-query/src/log_series.rs), which is what lets the README's
  # `sum by (job) (count_over_time(ravel_log_lines[5m]))` group the result.
  # filelog sets no service.name on its own, so without this the records
  # would ingest with no `job` label and the query would still return empty.
  resource:
    attributes:
      - key: service.name
        value: otel-collector
        action: upsert

exporters:
  # OTLP/HTTP posts to ravel-server's /v1/metrics or /v1/logs (the exporter
  # appends the signal path to this base). Protobuf encoding, which is what
  # ExportMetricsServiceRequest::decode / ExportLogsServiceRequest::decode
  # expect.
  otlphttp:
    endpoint: http://ravel-server:4318
    auth:
      authenticator: bearertokenauth

service:
  extensions: [bearertokenauth]
  pipelines:
    metrics:
      receivers: [hostmetrics]
      processors: [batch]
      exporters: [otlphttp]
    logs:
      receivers: [filelog]
      processors: [resource, batch]
      exporters: [otlphttp]
  telemetry:
    logs:
      # Mirrors the collector's own logs to a file in addition to stdout, so
      # the filelog receiver above has something to tail. Plain text under
      # /tmp needs no directory creation and no host mount.
      output_paths: ["stdout", "/tmp/otelcol-collector.log"]
    # The collector's own delivery counters, on a Prometheus endpoint.
    #
    # This exists so that "is the collector actually delivering?" is a
    # question with a numeric answer. It is the assertion CI needs (#209) and
    # the first thing to read when the Grafana dashboard is empty: a non-zero
    # `otelcol_exporter_send_failed_metric_points` says the collector is
    # running and Ravel is refusing its exports, which is a different fault
    # from the collector not scraping at all.
    #
    # The address must be 0.0.0.0, not the default localhost. localhost binds
    # the container's own loopback, which no port mapping can reach.
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
