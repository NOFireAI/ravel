// Vendored from github.com/prometheus/prometheus, tag v3.13.1, path
// prompb/remote.proto (ADR-0015, docs/ingest-breadth-plan.md track A).
// Two adaptations from the upstream file, matching types.proto:
//   - `import "gogoproto/gogo.proto"` and `[(gogoproto.nullable) = false]`
//     are dropped (Go-only codegen hint, no wire-format effect, no
//     equivalent needed since prost already emits `Vec<T>`).
//   - Read-path messages (`ReadRequest`, `ReadResponse`, `Query`,
//     `QueryResult`, `ChunkedReadResponse`) are omitted: this crate only
//     decodes `WriteRequest`.

syntax = "proto3";
package prometheus;

option go_package = "prompb";

import "types.proto";

message WriteRequest {
  repeated prometheus.TimeSeries timeseries = 1;
  // Cortex uses this field to determine the source of the write request.
  // We reserve it to avoid any compatibility issues.
  reserved  2;
  repeated prometheus.MetricMetadata metadata = 3;
}
