// Metric index: catalog snapshot part and HEAD formats
// (docs/metric-index-plan.md, ADR-0020). Persistent contract: field
// numbers are frozen; only additive changes are allowed.
syntax = "proto3";

package ravel.catalog.v1;

message SnapshotPartHeader {
  uint32 format_version = 1;  // 1; must match envelope version
  bytes tenant_hash = 2;      // 16
  uint32 signal = 3;          // same enum domain as CommitRecord
  uint32 shard_count = 4;     // config at fold time (ADR-0010 §9)
  uint32 watermark_hour = 5;  // unix hours; all entries <= this
  uint64 entry_count = 6;
  uint64 entries_uncompressed_len = 7;
  // Additive, ADR-0063 (multi-part parallel fold). Lowest
  // ingest_hour_bucket any entry in this part may have; the part's hour
  // range is [min_hour, watermark_hour], both inclusive. Absent (proto3
  // zero) means 0, the correct floor for every legacy single-part object:
  // 0 is never itself an error, it is the epoch floor / "not
  // hour-partitioned" sentinel. decode_part additionally validates
  // entry.ingest_hour_bucket >= min_hour and min_hour <= watermark_hour.
  uint32 min_hour = 8;
}

message SnapshotEntry {
  // 0 = L0. Reserved for compaction outputs (docs/metric-index-plan.md
  // section 7); readers reject levels they do not understand.
  uint32 level = 1;
  uint32 shard = 2;
  uint32 ingest_hour_bucket = 3;
  bytes writer_id = 4;  // 16 raw bytes
  uint64 writer_epoch = 5;
  uint64 writer_seq = 6;
  bytes content_hash = 7;  // 32
  uint64 object_size = 8;
  sint64 min_event_ts_ns = 9;
  sint64 max_event_ts_ns = 10;
  uint64 sample_count = 11;
  uint64 series_count = 12;
  uint32 segment_format_version = 13;
  sint64 created_unix_ns = 14;
}

message SnapshotHead {
  uint32 format_version = 1;  // 1
  bytes tenant_hash = 2;      // 16
  uint32 signal = 3;
  uint32 shard_count = 4;
  uint32 watermark_hour = 5;  // max over parts
  repeated SnapshotPartRef parts = 6;
  bytes folder_id = 7;      // 16; UUIDv4 per folder process start
  sint64 created_unix_ns = 8;  // informational
  // Additive, phase P5a (docs/metric-index-plan.md). Absent when no
  // postings index has been built yet, or when the last fold's postings
  // build failed; readers must never treat absence as an error.
  SnapshotPostingsRef postings = 9;
  // Additive, ADR-0052 section 5 (online resharding). Number of shard
  // generations known at fold time. shard_count (field 4) is reinterpreted
  // as the fan-out ceiling at fold time (max scan_count over hours up to the
  // watermark); this field lets a reader tell an older, pre-reshard head
  // (lower generation count, or absent/0 for a head written before ADR-0052)
  // from one that claims more generations than the reader's own provisioning
  // record view. Absent/0 = pre-reshard head; readers must never treat
  // absence as an error.
  uint32 shard_generation_count = 10;
}

message SnapshotPartRef {
  string key = 1;    // full object key of the part
  bytes blake3 = 2;  // 32, of the part's full bytes
  uint64 size = 3;
  uint64 entry_count = 4;
  uint32 watermark_hour = 5;
  // Additive, ADR-0063 (multi-part parallel fold). Mirrors the covering
  // part header's min_hour onto the HEAD-level reference so validate_head
  // can check part ordering and range disjointness without fetching part
  // bytes. Absent (proto3 zero) means 0, matching a legacy single-part
  // ref. See SnapshotPartHeader.min_hour.
  uint32 min_hour = 6;
}

// Reference to a name-postings object (RNP1 envelope), phase P5a
// (docs/metric-index-plan.md). Bound to the exact set of parts it was
// built from: a postings object is only trustworthy against the parts
// whose blake3 hashes it names here, in the same order as
// `SnapshotHead.parts`.
message SnapshotPostingsRef {
  string key = 1;              // full object key of the postings object
  bytes blake3 = 2;             // 32, of the postings object's full bytes
  uint64 size = 3;
  uint32 name_count = 4;
  repeated bytes part_blake3 = 5;  // covered parts' blake3, same order as parts
}

message SnapshotPostingsHeader {
  uint32 format_version = 1;  // 1; must match envelope version
  bytes tenant_hash = 2;      // 16
  uint32 signal = 3;
  repeated bytes part_blake3 = 4;  // covered parts' blake3, binds this
                                    // postings object to an exact part set
  uint64 entry_count = 5;      // total entries across the covered parts
  uint32 name_count = 6;
  uint64 body_uncompressed_len = 7;
}
