[package]
name = "ravel-antithesis-lifecycle-driver"
version = "0.0.0"
edition = "2024"
publish = false
description = "Antithesis driver for Ravel's selective erasure, legal holds and GC"
license = "Apache-2.0"

# Its own workspace, like the other drivers: the repository's workspace never
# builds this crate.
[workspace]

[[bin]]
name = "driver"
path = "src/main.rs"

# The versions the other Antithesis drivers' lock files pin.
[dependencies]
antithesis_sdk = "0.4"
antithesis-instrumentation = "0.1"
hegeltest = { version = "0.52", features = ["static-engine"] }
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "logs", "metrics"] }
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
serde_json = "1"

[profile.release]
debug = 1
