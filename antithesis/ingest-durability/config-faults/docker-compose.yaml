# Ravel ingest-durability workload for Antithesis, fault-switch variant
# (antithesis/ingest-durability/README.md, "Fault-switch variant").
#
# The coverage variant (../config-coverage/docker-compose.yaml) with Ravel's
# own Antithesis-only fault switches turned on in both servers (ADR-4326, the
# 2026-11-19 fault-switch amendment; #4496):
#
# - ingest/encode-cancelled cancels a shard's encode before its data PUT, so
#   the shard actor answers ShardUnavailable for that flush.
# - ingest/data-put-refused makes a metrics or logs shard's data PUT give up,
#   so the flush is abandoned with no commit.
#
# Each fires at the rate given below, independently per call, so most writes
# still succeed and a write that spans shards can commit on some of them and
# fail on others. The rates are read once when ravel-server starts. Because
# ANTITHESIS_STOP_FAULTS does not reach them, the driver's eventually writes
# /control/faults-off and restarts each server through its supervisor, which
# starts every later child without RAVEL_ANTITHESIS_FAULTS.
#
# Everything else matches the coverage config, which this file must repeat in
# full: only this directory ships as the run's config.
#
# No service has a restart policy: Antithesis restarts the containers it
# kills or stops, and a policy would restart them early and cancel the fault.

x-ravel-store: &ravel-store
  RAVEL_S3_ENDPOINT: http://rustfs:9000
  RAVEL_S3_ALLOW_HTTP: "true"
  RAVEL_S3_BUCKET: ravel
  RAVEL_S3_REGION: us-east-1
  RAVEL_S3_ACCESS_KEY: ravel
  RAVEL_S3_SECRET_KEY: ravel-dev-secret

# See ../config/docker-compose.yaml for why the images carry no registry.
x-ravel-server: &ravel-server
  image: ravel-antithesis-server:ingest-durability
  platform: linux/amd64
  # init forwards a container stop to the supervisor, which passes it on to
  # ravel-server; see ../config/docker-compose.yaml for the startup deadline.
  init: true
  entrypoint: ["/usr/local/bin/ravel-antithesis-supervise"]
  command:
    - "--mode"
    - "all"
    - "--store"
    - "s3"
    - "--listen-http"
    - "0.0.0.0:4318"
    - "--listen-grpc"
    - "0.0.0.0:4317"
    - "--shards"
    - "4"
    - "--tenant-token"
    - "wl-token=wl-tenant"
    - "--tenant-hash-unkeyed"
    - "--startup-store-deadline"
    - "300s"
    - "--max-flush-delay"
    - "500ms"
    - "--max-flush-delay-idle"
    - "5s"
    - "--min-flush-bytes"
    - "262144"
    # See ../config-coverage/docker-compose.yaml.
    - "--max-pending-strict-acks"
    - "2"
  environment:
    <<: *ravel-store
    RUST_LOG: info
    # Below one, so each switch both fires and lets calls through.
    RAVEL_ANTITHESIS_FAULTS: "ingest/encode-cancelled=0.05,ingest/data-put-refused=0.05"
  volumes:
    - control:/control
  depends_on:
    init:
      condition: service_completed_successfully

services:
  rustfs:
    container_name: rustfs
    hostname: rustfs
    image: ghcr.io/rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    platform: linux/amd64
    command: ["/data"]
    user: "0:0"
    environment:
      RUSTFS_ACCESS_KEY: ravel
      RUSTFS_SECRET_KEY: ravel-dev-secret
      RUSTFS_DURABILITY_MODE: strict
      RUSTFS_DRIVE_SYNC_ENABLE: "true"

  init:
    container_name: init
    hostname: init
    image: ravel-antithesis-server:ingest-durability
    platform: linux/amd64
    entrypoint: ["/usr/local/bin/ravel-antithesis-init"]
    environment:
      <<: *ravel-store
    depends_on: [rustfs]

  ravel1:
    <<: *ravel-server
    container_name: ravel1
    hostname: ravel1

  ravel2:
    <<: *ravel-server
    container_name: ravel2
    hostname: ravel2

  driver:
    container_name: driver
    hostname: driver
    image: ravel-antithesis-driver:ingest-durability
    platform: linux/amd64
    environment:
      RAVEL_NODES: http://ravel1:4318,http://ravel2:4318
      RAVEL_TOKEN: wl-token
      WORKLOAD_MAX_WRITES: "2500"
      WORKLOAD_COVERAGE: "1"
      WORKLOAD_FAULT_SWITCHES: "1"
      RAVEL_CONTROL_DIR: /control
    volumes:
      - control:/control

volumes:
  control:
