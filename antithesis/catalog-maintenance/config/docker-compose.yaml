# Ravel catalog-maintenance workload for Antithesis
# (antithesis/catalog-maintenance/README.md, ADR-4326).
#
# rustfs is the one durable component. init creates the bucket and qualifies
# it, then exits. The driver then seeds the tenant through `ravel-cli load` and
# writes the seed marker; every ravel-server entrypoint waits for that marker.
# ravel1 and ravel2 are `--mode all`: each ingests, serves queries and runs the
# scheduled fold, but runs no compaction, retention or sweep (those run only in
# `--mode maintain`). maint1 and maint2 are `--mode maintain`: each folds,
# compacts, applies retention and sweeps, sharing the work through the
# maintain-worker registry. driver is the workload and is the only container
# excluded from faults.
#
# No service has a restart policy: Antithesis restarts the containers it
# kills or stops, and a policy would restart them early and cancel the fault.

x-ravel-store: &ravel-store
  RAVEL_S3_ENDPOINT: http://rustfs:9000
  RAVEL_S3_ALLOW_HTTP: "true"
  RAVEL_S3_BUCKET: ravel
  RAVEL_S3_REGION: us-east-1
  RAVEL_S3_ACCESS_KEY: ravel
  RAVEL_S3_SECRET_KEY: ravel-dev-secret

# The workload's own images are named without a registry, as in the
# ingest-durability workload: snouty pushes a local-only image into the tenant
# registry. scripts/build.sh and scripts/import-images.sh tag them.
x-ravel-server: &ravel-server
  image: ravel-antithesis-server:catalog-maintenance
  platform: linux/amd64
  environment:
    <<: *ravel-store
    RUST_LOG: info
  depends_on:
    init:
      condition: service_completed_successfully

services:
  rustfs:
    container_name: rustfs
    hostname: rustfs
    # The same RustFS release and digest the repository's own compose stacks
    # and CI contract lane run (deploy/docker-compose/rustfs.yml).
    image: ghcr.io/rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    platform: linux/amd64
    command: ["/data"]
    user: "0:0"
    environment:
      RUSTFS_ACCESS_KEY: ravel
      RUSTFS_SECRET_KEY: ravel-dev-secret
      # Fsync every acknowledged write before its 200, so a killed rustfs
      # container never loses an acked PUT.
      RUSTFS_DURABILITY_MODE: strict
      RUSTFS_DRIVE_SYNC_ENABLE: "true"

  init:
    container_name: init
    hostname: init
    image: ravel-antithesis-server:catalog-maintenance
    platform: linux/amd64
    entrypoint: ["/usr/local/bin/ravel-antithesis-init"]
    environment:
      <<: *ravel-store
    depends_on: [rustfs]

  ravel1:
    <<: *ravel-server
    container_name: ravel1
    hostname: ravel1
    command: &all-command
      - "--mode"
      - "all"
      - "--store"
      - "s3"
      - "--listen-http"
      - "0.0.0.0:4318"
      - "--listen-grpc"
      - "0.0.0.0:4317"
      - "--shards"
      - "4"
      - "--tenant-token"
      - "cm-token=cm-tenant"
      - "--tenant-hash-unkeyed"
      # A short flush cadence puts many level-0 objects into each live hour,
      # so a sealed live hour has the two inputs compaction needs.
      - "--max-flush-delay"
      - "500ms"
      - "--max-flush-delay-idle"
      - "5s"
      - "--min-flush-bytes"
      - "262144"
      # Fold every 15 s rather than every 300 s, so a timeline sees many
      # scheduled folds race the driver's on-demand ones.
      - "--fold-interval-secs"
      - "15"

  ravel2:
    <<: *ravel-server
    container_name: ravel2
    hostname: ravel2
    command: *all-command

  maint1:
    <<: *ravel-server
    container_name: maint1
    hostname: maint1
    command: &maintain-command
      - "--mode"
      - "maintain"
      - "--store"
      - "s3"
      - "--listen-http"
      - "0.0.0.0:4318"
      - "--shards"
      - "4"
      # The tenant this process maintains; maintain mode serves no ingest, so
      # it takes no tenant token.
      - "--maintain-tenant"
      - "cm-tenant"
      - "--tenant-hash-unkeyed"
      # Generated into the image at build time (ravel/Dockerfile); both
      # maintain containers run the same image, so they share the key.
      - "--maintain-key-file"
      - "/etc/ravel/maintain.key"
      - "--maintain-interval-secs"
      - "20"
      - "--fold-interval-secs"
      - "15"

  maint2:
    <<: *ravel-server
    container_name: maint2
    hostname: maint2
    command: *maintain-command

  driver:
    container_name: driver
    hostname: driver
    image: ravel-antithesis-driver:catalog-maintenance
    platform: linux/amd64
    environment:
      <<: *ravel-store
      RAVEL_NODES: http://ravel1:4318,http://ravel2:4318
      RAVEL_TOKEN: cm-token
      RAVEL_TENANT: cm-tenant
      # Six seeded hours two hours apart, 50 records each.
      SEED_HOURS: "6"
      SEED_HOUR_STRIDE: "2"
      SEED_RECORDS_PER_HOUR: "50"
      WORKLOAD_MAX_WRITES: "3000"
    depends_on:
      init:
        condition: service_completed_successfully
