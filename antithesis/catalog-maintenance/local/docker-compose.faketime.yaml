# The clock spike (README.md, "Clock spike"; scripts/clock-spike.sh), layered
# over ../config/docker-compose.yaml and docker-compose.local.yaml: every
# container runs under libfaketime with ONE wall-clock offset, read from one
# shared file. Rewriting that file moves every container's clock together, so
# hours ingested live become old enough to seal and compact within one run.
#
# The `faketime` service copies libfaketime out of the server image into a
# shared volume (rustfs can load it from there) and writes the offset
# file as "+0". FAKETIME_DONT_FAKE_MONOTONIC keeps monotonic clocks real, so
# timers and timeouts are untouched; only wall-clock reads move.
x-faketime: &faketime
  LD_PRELOAD: /faketime/libfaketimeMT.so.1
  FAKETIME_TIMESTAMP_FILE: /faketime/offset
  FAKETIME_CACHE_DURATION: "2"
  FAKETIME_DONT_FAKE_MONOTONIC: "1"

x-faketime-deps: &faketime-deps
  faketime:
    condition: service_completed_successfully

services:
  faketime:
    container_name: faketime
    image: ravel-antithesis-server:catalog-maintenance
    platform: linux/amd64
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        cp /usr/lib/x86_64-linux-gnu/faketime/libfaketimeMT.so.1 /faketime/
        printf '+0\n' > /faketime/offset
    volumes: [faketime:/faketime]

  rustfs:
    environment: *faketime
    volumes: [faketime:/faketime]
    depends_on: *faketime-deps
  init:
    environment: *faketime
    volumes: [faketime:/faketime]
  ravel1:
    environment: *faketime
    volumes: [faketime:/faketime]
  ravel2:
    environment: *faketime
    volumes: [faketime:/faketime]
  maint1:
    environment: *faketime
    volumes: [faketime:/faketime]
  maint2:
    environment: *faketime
    volumes: [faketime:/faketime]
  driver:
    environment: *faketime
    volumes: [faketime:/faketime]

volumes:
  faketime: {}
