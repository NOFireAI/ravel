[package]
name = "ravel-antithesis-store-contract"
version = "0.0.0"
edition = "2024"
publish = false
description = "Antithesis driver for Ravel's object-store contract over S3Store and RustFS"
license = "Apache-2.0"

# Its own workspace: the repository's workspace never builds this crate, so
# hegel and the driver's other dependencies stay out of the root Cargo.lock.
[workspace]

[[bin]]
name = "driver"
path = "src/main.rs"

[dependencies]
antithesis_sdk = "0.4"
antithesis-instrumentation = "0.1"
async-trait = "0.1"
bytes = "1"
hegeltest = { version = "0.52", features = ["static-engine"] }
ravel-object-store = { path = "../../../crates/ravel-object-store" }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "time"] }

[profile.release]
debug = 1
