[package]
name = "ravel-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ravel-types = { workspace = true }
ravel-proto = { workspace = true }
ravel-object-store = { workspace = true }
ravel-segment = { workspace = true }
ravel-logseg = { workspace = true }
ravel-rspan = { workspace = true }
ravel-commit = { workspace = true }
ravel-catalog = { workspace = true }
ravel-maintain = { workspace = true }
ravel-ingest = { workspace = true }
prost = { workspace = true }
blake3 = { workspace = true }
crc32c = { workspace = true }
clap = { workspace = true, features = ["env"] }
anyhow = { workspace = true }
# Typed `SubmitError` for the `erase submit` conflict path (a reused
# request_id that redefines the erasure must fail loudly, not silently
# report success). Already a workspace pin (ravel-commit uses it); adds no
# new external crate.
thiserror = { workspace = true }
# Humantime durations for the `gc-config set` GC-window flags (ADR-0050
# section 4, EC4), matching ravel-server's `--retention-*` duration convention.
# Already a workspace pin (ravel-server uses it); adds no new external crate.
humantime = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
# Implementing a small `ObjectStoreBackend` test wrapper (hide one key from
# LIST) needs the same async-trait the trait itself uses. Already a workspace
# pin; adds no new external crate.
async-trait = { workspace = true }

[lints]
workspace = true
