[package]
name = "ravel-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ravel-types = { workspace = true }
ravel-proto = { workspace = true }
ravel-object-store = { workspace = true }
ravel-segment = { workspace = true }
ravel-logseg = { workspace = true }
# ravel-rspan (ADR-0041) is new and not yet listed in the workspace
# [workspace.dependencies]; the root Cargo.toml is out of this task's scope, so
# this is a version-pinned path dependency (the pin keeps cargo-deny from
# counting it as a wildcard, matching the workspace's path-dep convention).
ravel-rspan = { path = "../../crates/ravel-rspan", version = "0.1.0" }
ravel-commit = { workspace = true }
ravel-catalog = { workspace = true }
ravel-maintain = { workspace = true }
prost = { workspace = true }
clap = { workspace = true, features = ["env"] }
anyhow = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
bytes = { workspace = true }
blake3 = { workspace = true }

[lints]
workspace = true
