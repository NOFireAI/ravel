[package]
name = "ravel-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ravel-types = { workspace = true }
ravel-object-store = { workspace = true }
ravel-catalog = { workspace = true }
ravel-commit = { workspace = true }
ravel-maintain = { workspace = true }
ravel-ingest = { workspace = true }
ravel-logseg = { workspace = true }
ravel-otlp = { workspace = true }
ravel-remote-write = { workspace = true }
ravel-query = { workspace = true }
ravel-promql = { workspace = true }
ravel-analytics = { workspace = true }
# OTAP (OpenTelemetry Arrow) ingest, linked only by the `otap` feature. It
# pulls the arrow / arrow-ipc dependency tree, so it stays out of the default
# build (docs/otap-ingest.md risk mitigation).
ravel-otap = { workspace = true, optional = true }
# The `otap` gRPC service returns a `BatchStatus` stream; `futures` provides
# the stream combinator that drives one batch to one status. Also a
# dev-dependency (Flight SQL tests), independent of this optional link.
futures = { workspace = true, optional = true }
tokio = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
axum = { workspace = true }
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
humantime = { workspace = true }
clap = { workspace = true, features = ["env"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
# The alert evaluator hashes the RLOG object it writes to build the commit
# record's content_hash, the same hash log ingest computes (ravel-ingest
# log_shard).
blake3 = { workspace = true }
# The webhook and Alertmanager alert sinks POST JSON (ADR-0043 decision 6).
# Already present in the build graph as this crate's test HTTP client; this
# promotes the same pinned version to a normal dependency so the sinks can use
# it, rather than hand-rolling an HTTP/1.1 client with no TLS over
# `tokio::net::TcpStream`.
reqwest = { version = "0.13", features = ["json"] }

# ravel-alerting is declared here as a version-pinned path dependency rather
# than through `[workspace.dependencies]` for the same reason ravel-sql and
# ravel-rspan below are: the workspace root Cargo.toml is outside this task's
# scope. The pin keeps cargo-deny from counting it as a wildcard path
# dependency.
ravel-alerting = { path = "../../crates/ravel-alerting", version = "0.1.0" }

# ravel-sql is declared here as a path dependency rather than through
# `[workspace.dependencies]` because the workspace root Cargo.toml is outside
# ticket B3's scope. The version is pinned so cargo-deny does not count it as
# a wildcard path dependency (finding a11-F07), matching how every other
# internal crate is pinned.
ravel-sql = { path = "../../crates/ravel-sql", version = "0.1.0", optional = true }

# Flight service codegen for the `flight-sql` feature. This is arrow 58's
# arrow-flight, a different arrow major than the `arrow` dev-dependency below;
# the two never exchange types.
arrow-flight = { workspace = true, optional = true }

[features]
# OTAP (OpenTelemetry Arrow) metrics ingest on the gRPC listener: registers
# `ArrowMetricsService` alongside the OTLP gRPC services. Off by default so the
# default server build links neither `ravel-otap` nor the arrow dependency tree
# it carries (docs/otap-ingest.md: "the gateway builds without it by default
# until the bench panel justifies default-on"). Metrics only for now; the OTAP
# logs and traces services are follow-up work.
otap = ["dep:ravel-otap", "dep:futures"]

# `POST /api/v1/sql`. Off by default: enabling it links datafusion into the
# server binary, and the SQL surface is opt-in per deployment
# (docs/arrow-datafusion-plan.md section 3, ADR-0013 structural isolation).
sql = ["dep:ravel-sql"]

# Flight SQL on the gRPC listener. Implies `sql`: both surfaces execute through
# ravel-sql, so there is no deployment that wants Flight without it
# (docs/arrow-datafusion-plan.md section 3 feature matrix). Off by default for
# the same reason `sql` is. Today this registers an unimplemented service so
# the wiring and the version pairing are proven; the real methods arrive with
# ravel-sql's `flight` module under issue #152.
flight-sql = ["sql", "ravel-sql/flight-sql", "dep:arrow-flight"]

[dev-dependencies]
# `query` on top of the normal dependency's `json`: the test client builds
# query strings the server binary itself never needs to.
reqwest = { version = "0.13", features = ["json", "query"] }
# Test-only: `channel` is not in tonic's default feature set, and the Flight
# startup test needs a gRPC client to call the server it just started. The
# server binary itself keeps the default (server-only) tonic.
tonic = { workspace = true, features = ["channel"] }
async-trait = { workspace = true }
snap = { workspace = true }
tower = { workspace = true }
# Test-only: the Flight SQL tests adapt a `tonic::Streaming` into the stream
# `arrow_flight::decode` consumes, which needs the `TryStreamExt` combinators.
futures = { workspace = true }
ravel-segment = { workspace = true }
# Test-only, same reason for spans: the trace ingest end-to-end test decodes the
# RSPAN object the write flushed. ravel-rspan (ADR-0041) is new and not yet
# listed in the workspace [workspace.dependencies]; the root Cargo.toml is out
# of this task's scope, so this is a version-pinned path dependency (the pin
# keeps cargo-deny from counting it as a wildcard).
ravel-rspan = { path = "../../crates/ravel-rspan", version = "0.1.0" }
uuid = { workspace = true }
# Real-authn end-to-end test (tests/real_authn_e2e.rs): mint a JWT and build a
# local oct (HMAC) JWKS so the OIDC resolver runs through a real HTTP request
# with no network. base64url-encodes the signing secret into the JWK.
jsonwebtoken = { workspace = true }
base64 = { workspace = true }
# Test-only: decodes the Arrow IPC response. This is the workspace arrow pin
# (59), not the arrow 58 datafusion carries, so the assertion doubles as a
# check that the IPC bytes the endpoint emits are readable by an independent
# arrow version rather than only by the one that wrote them.
arrow = { workspace = true }

[lints]
workspace = true
