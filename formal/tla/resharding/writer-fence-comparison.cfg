\* module: MCOnlineResharding
\* Probe (not part of any check-tla.sh gate): the positive counterpart to
\* negative/no-writer-fence.cfg, changing only WriterFenceEnabled so the pair
\* isolates the fence flag. negative/no-writer-fence.cfg also carries
\* AppenderSkew = 2 as its enabling condition (the skew is what drives the
\* writer's view past the grace horizon within this small a model; see that
\* file's header), so on its own it shows WriterFenceEnabled = FALSE plus
\* AppenderSkew = 2 together violating StaleWriterFailsClosed, not that the
\* fence flag alone is the cause. This cfg carries identical non-comment settings except
\* WriterFenceEnabled = TRUE, so a difference in outcome can only come from
\* the fence.
\*
\* This arm cannot be run to exhaustive completion: with the fence closing
\* the gap, TLC's full BFS search never finds a violation to stop on, and at
\* these dimensions the reachable space does not converge within an hour
\* (confirmed empirically: full search still climbing past 65M distinct
\* states after 45 minutes at MaxHour = 4, and past 8M distinct states after
\* 6 minutes even at MaxHour = 2 and AppenderSkew = 1, so the growth is not
\* primarily driven by either knob). Since negative/no-writer-fence.cfg's own
\* violation is only ever confirmed by TLC's default error-search stopping
\* early on the first counterexample, this repo has no precedent for driving
\* this dimension class to full completion either way.
\*
\* Result (see results.md "Fence comparison pair"): run instead with TLC
\* random simulation (not exhaustive BFS), at the dimensions above:
\*   tlc2.TLC -config writer-fence-comparison.cfg -simulate num=100000000
\*     -depth 100 MCOnlineResharding
\* 63,203,643 states checked in 300 seconds (budget-bounded, not traversal-
\* bounded: -simulate never terminates on its own short of hitting `num`
\* traces), zero TypeOK or StaleWriterFailsClosed violations. This is
\* strong evidence, not an exhaustive proof, that the fence flag alone
\* (same AppenderSkew = 2, same horizon) is what negative/no-writer-fence.cfg's
\* violation depended on.
CONSTANTS
    Writers = {w1}
    Requesters = {r1}
    TargetCounts = {1}
    InitialShardCount = 2
    MaxHour = 4
    MaxGenerations = 1
    MaxAdmitsPerWriter = 2
    CasAttempts = 1
    C = 1
    MinLeadHours = 2
    HourUnits = 1
    L = 2
    S = 3
    FlushBound = 1
    WriterSkew = 0
    AppenderSkew = 2
    WriterFenceEnabled = TRUE
    TokenValidatedAgainstCount = FALSE

SYMMETRY Symmetry
SPECIFICATION MCSpec

INVARIANT TypeOK
INVARIANT StaleWriterFailsClosed
