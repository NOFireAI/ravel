\* module: MCOnlineResharding
\* Probe (not part of any check-tla.sh gate): the shipped clock-skew value at
\* a model time-unit fine enough to represent it alongside the refresh
\* interval without rounding. Every other cfg here uses HourUnits = 1 (a
\* model time-unit of one hour), which forces the real 60 s refresh interval
\* to round up to C = 1 hour and inflates cached-view staleness sixty fold;
\* smoke.cfg keeps AppenderSkew = 0 specifically to avoid combining that
\* rounding with a nonzero skew. This cfg instead sets HourUnits = 60 (a
\* model time-unit of one minute), so:
\*   - C = 1 represents the real 60 s refresh interval exactly, no rounding.
\*   - MinLeadHours = HourCeil(1) + 60 = 120, i.e. 2 h, matching MIN_LEAD_HOURS
\*     (ceil(60 s) rounds to 1 h regardless of this cfg's finer unit, so the
\*     120 the ASSUME in OnlineResharding.tla derives here is the same real
\*     quantity smoke.cfg hardcodes as 2 at HourUnits = 1).
\*   - L = 120 (2 h), the shipped activation lead, in minutes.
\*   - AppenderSkew = 60 (1 h), the shipped TOLERATED_CLOCK_SKEW_HOURS, in
\*     minutes -- the value smoke.cfg cannot check at HourUnits = 1.
\*   - S = 180 (3 h), the shipped DEFAULT_SCAN_SLACK_HOURS, in minutes.
\*   - FlushBound = 60 (1 h), in minutes.
\* MaxHour must reach past L = 120 for any generation appended near clock 0 to
\* actually activate against router clocks that advance one minute per
\* TickRouters step, so this horizon is at minimum ~40x smoke's (3) and
\* ~30x exhaustive's (4). Minimal actor/generation shape (one writer, one
\* requester, one decrease, two admits so the writer both refreshes and
\* later stale-routes) to keep the branching factor as small as this horizon
\* can tolerate. See results.md "Shipped clock skew at minute granularity"
\* for the outcome of running this.
CONSTANTS
    Writers = {w1}
    Requesters = {r1}
    TargetCounts = {1}
    InitialShardCount = 2
    MaxHour = 125
    MaxGenerations = 1
    MaxAdmitsPerWriter = 2
    CasAttempts = 1
    C = 1
    MinLeadHours = 120
    L = 120
    S = 180
    FlushBound = 60
    WriterSkew = 0
    AppenderSkew = 60
    WriterFenceEnabled = TRUE
    TokenValidatedAgainstCount = FALSE
    HourUnits = 60

SYMMETRY Symmetry
SPECIFICATION MCSpec

INVARIANT TypeOK
INVARIANT StaleReaderFailsClosed
INVARIANT LeadCoversRefreshHorizon
