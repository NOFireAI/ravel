\* module: MCOnlineResharding
\* Negative control: the activation lead is one hour (L = 1) instead of the
\* shipped L = 2 that MIN_LEAD_HOURS demands at C = 1. A generation then
\* activates one hour after it is appended, inside a writer's cached-view
\* horizon, so a writer can hold a view whose newest known generation is
\* already superseded by an active generation at the same route hour. That is
\* exactly what LeadCoversRefreshHorizon forbids: the lead must place every
\* activation at least MinLeadHours past any refresh that could still be
\* serving. This violation needs no clock skew; the one-hour lead is itself
\* short of the refresh horizon. Minimal shape: one writer, one requester, one
\* decrease.
CONSTANTS
    Writers = {w1}
    Requesters = {r1}
    TargetCounts = {1}
    InitialShardCount = 2
    MaxHour = 3
    MaxGenerations = 1
    MaxAdmitsPerWriter = 2
    CasAttempts = 1
    C = 1
    MinLeadHours = 2
    L = 1
    S = 3
    FlushBound = 1
    WriterSkew = 0
    AppenderSkew = 0
    WriterFenceEnabled = TRUE
    TokenValidatedAgainstCount = FALSE

SYMMETRY Symmetry
SPECIFICATION MCSpec

INVARIANT TypeOK
INVARIANT LeadCoversRefreshHorizon
