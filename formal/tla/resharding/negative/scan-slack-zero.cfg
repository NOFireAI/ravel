\* module: MCOnlineResharding
\* Negative control: the read-side scan slack is removed (S = 0 instead of
\* DEFAULT_SCAN_SLACK_HOURS = 3). A generation then stops contributing to the
\* scan set the moment its successor activates, so a straggler admitted on a
\* still-fresh cached view after the decrease activates is outside the set the
\* reader lists. AppenderSkew = 2 is the enabling condition: at skew 0 the
\* activation lead keeps every admitted straggler at an ingest hour the slack
\* would still cover, so S alone is only load bearing once a skewed appender
\* clock pulls the activation earlier in router time. With the shipped slack
\* the same skew stays covered (that case is exercised by the smoke run and by
\* appender-skew-unbounded at a larger skew); here S = 0 removes the only
\* margin that reaches the straggler. Minimal shape: one writer, one requester,
\* one decrease, two admits so the writer both refreshes and stale-routes.
\*
\* Only TypeOK and EveryAdmittedWriteInScanSet are declared below, on
\* purpose: TLC's exit code for "an invariant is violated" (12) does not say
\* which one, and a cfg that also checked StaleReaderFailsClosed (or any
\* other invariant this configuration happens to break) would let the
\* harness's fixed-string match against results.md's expected property race
\* against whichever violation TLC's parallel search reaches first. Keeping
\* the checked set to exactly the two invariants this configuration's
\* narrative is about, of which only EveryAdmittedWriteInScanSet is actually
\* reachable here (TypeOK is basic shape well-formedness, independent of S),
\* makes the match deterministic rather than merely likely. Confirmed by
\* rerun: "Invariant EveryAdmittedWriteInScanSet is violated" is the only
\* violation line the log contains.
CONSTANTS
    Writers = {w1}
    Requesters = {r1}
    TargetCounts = {1}
    InitialShardCount = 2
    MaxHour = 3
    MaxGenerations = 1
    MaxAdmitsPerWriter = 2
    CasAttempts = 1
    C = 1
    MinLeadHours = 2
    HourUnits = 1
    L = 2
    S = 0
    FlushBound = 1
    WriterSkew = 0
    AppenderSkew = 2
    WriterFenceEnabled = TRUE
    TokenValidatedAgainstCount = FALSE

SYMMETRY Symmetry
SPECIFICATION MCSpec

INVARIANT TypeOK
INVARIANT EveryAdmittedWriteInScanSet
