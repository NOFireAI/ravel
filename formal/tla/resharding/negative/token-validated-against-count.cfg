\* module: MCOnlineResharding
\* Negative control: commit-token resolution validates token.shard against the
\* currently active shard count (TokenValidatedAgainstCount = TRUE) instead of
\* being an exact-key GET. After a decrease a straggler token sits at a shard
\* index at or above the new active count; the added check then rejects a token
\* that names durable data, so a read-your-write across the reshard fails and
\* TokenResolvesAcrossReshards is violated. AppenderSkew = 2 and two admits
\* create the straggler token: the writer refreshes, then routes a record at a
\* shard index the post-decrease count no longer includes, and the reader
\* resolves that token after the decrease activates. Minimal shape: one writer,
\* one requester, one decrease.
CONSTANTS
    Writers = {w1}
    Requesters = {r1}
    TargetCounts = {1}
    InitialShardCount = 2
    MaxHour = 3
    MaxGenerations = 1
    MaxAdmitsPerWriter = 2
    CasAttempts = 1
    C = 1
    MinLeadHours = 2
    HourUnits = 1
    L = 2
    S = 3
    FlushBound = 1
    WriterSkew = 0
    AppenderSkew = 2
    WriterFenceEnabled = TRUE
    TokenValidatedAgainstCount = TRUE

SYMMETRY Symmetry
SPECIFICATION MCSpec

INVARIANT TypeOK
INVARIANT TokenResolvesAcrossReshards
