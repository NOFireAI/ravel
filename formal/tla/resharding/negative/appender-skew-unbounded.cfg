\* module: MCOnlineResharding
\* Negative control (the ADR's prime target): the appender's clock may differ
\* from the routers' by more than the tolerated bound (AppenderSkew above
\* TOLERATED_CLOCK_SKEW_HOURS = 1). An activation hour computed on a skewed
\* appender clock lands earlier in router time than the lead assumed, so a
\* writer routing on a still-valid view admits a straggler past the reader's
\* slack window and EveryAdmittedWriteInScanSet is violated with the shipped
\* slack S = 3 in place. Unlike scan-slack-zero, no margin is removed here; the
\* skew itself pushes the straggler past a correct slack.
\*
\* AppenderSkew = 5 at MaxHour = 5 is the config the executor runs: it exhibits
\* the violation in a few seconds. It is not claimed to be the smallest breaking
\* skew. Within the horizons an executor can run, skew 4 also breaks but only at
\* MaxHour = 6 with a multi-million-state search (minutes), and skews 1 through 3
\* produced no counterexample. The true minimum breaking skew at C = 1 is left
\* to the orchestrator's exhaustive run; results.md records what the executor
\* established.
CONSTANTS
    Writers = {w1}
    Requesters = {r1}
    TargetCounts = {1}
    InitialShardCount = 2
    MaxHour = 5
    MaxGenerations = 1
    MaxAdmitsPerWriter = 2
    CasAttempts = 1
    C = 1
    MinLeadHours = 2
    L = 2
    S = 3
    FlushBound = 1
    WriterSkew = 0
    AppenderSkew = 5
    WriterFenceEnabled = TRUE
    TokenValidatedAgainstCount = FALSE

SYMMETRY Symmetry
SPECIFICATION MCSpec

INVARIANT TypeOK
INVARIANT EveryAdmittedWriteInScanSet
