\* module: MCOnlineResharding
\* Negative control: the staleness fence is off (WriterFenceEnabled = FALSE).
\* A writer whose refresh GET fails past the grace horizon then routes on its
\* expired view instead of failing closed with StaleProvisioningView. The fence
\* exists to enforce StaleWriterFailsClosed: a writer that admits on a cached or
\* grace view may only do so while it is still inside MinLeadHours of its last
\* refresh. With the fence off the writer admits arbitrarily far past that
\* horizon, which StaleWriterFailsClosed catches directly. The read-side slack
\* still covers the admitted data at this horizon, so EveryAdmittedWriteInScanSet
\* is not the sharp witness here; the fence's own contract is. AppenderSkew = 2
\* supplies the stale-across-activation route that drives the writer past the
\* grace horizon within a small model. Two admits: the writer refreshes once,
\* then stale-routes.
CONSTANTS
    Writers = {w1}
    Requesters = {r1}
    TargetCounts = {1}
    InitialShardCount = 2
    MaxHour = 4
    MaxGenerations = 1
    MaxAdmitsPerWriter = 2
    CasAttempts = 1
    C = 1
    MinLeadHours = 2
    L = 2
    S = 3
    FlushBound = 1
    WriterSkew = 0
    AppenderSkew = 2
    WriterFenceEnabled = FALSE
    TokenValidatedAgainstCount = FALSE

SYMMETRY Symmetry
SPECIFICATION MCSpec

INVARIANT TypeOK
INVARIANT StaleWriterFailsClosed
