\* Exhaustive safety configuration. Same shipped constants as smoke.cfg, with
\* the three bounds smoke narrows for its time budget widened back out:
\*   - CasAttempts 1 -> 2, so a CAS loser's re-read-and-retry loop is covered,
\*     not just the single-shot race that smoke keeps.
\*   - MaxAdmitsPerWriter 1 -> 2, so a writer both refreshes and then routes a
\*     later admit on the refreshed view (the two-admit straggler shape the
\*     negative controls rely on) is reachable in the safe model too.
\*   - MaxHour 3 -> 4, one more hour of activation and refresh interleaving.
\* Every margin stays at its shipped value, so this run asserts the same eleven
\* safety invariants smoke does, over a strictly larger reachable set.
\*
\* AppenderSkew stays 0. Skew within the tolerated bound (1 hour) is absorbed by
\* the slack term already folded into S; skew above the bound is the domain of
\* the appender-skew-unbounded negative control. A dedicated skew = 1 exhaustive
\* variant would substantiate the tolerated-skew half of the ADR claim directly;
\* the executor's bounded search found no skew = 1 counterexample but did not
\* prove safety at that boundary, so that variant is left to the orchestrator.
\*
\* THE EXECUTOR DOES NOT RUN THIS. It is sized for the orchestrator's run. If it
\* proves intractable at MaxHour = 4, drop MaxHour to 3 first: CasAttempts = 2
\* and MaxAdmitsPerWriter = 2 are the coverage smoke actually sacrifices, and
\* both hold at MaxHour = 3. The bands.tsv row for exhaustive.cfg is an
\* unverified estimate until this run completes once; tighten it from the first
\* real run.
CONSTANTS
    Writers = {w1, w2}
    Requesters = {r1, r2}
    TargetCounts = {3, 1}
    InitialShardCount = 2
    MaxHour = 4
    MaxGenerations = 2
    MaxAdmitsPerWriter = 2
    CasAttempts = 2
    C = 1
    MinLeadHours = 2
    L = 2
    S = 3
    FlushBound = 1
    WriterSkew = 0
    AppenderSkew = 0
    WriterFenceEnabled = TRUE
    TokenValidatedAgainstCount = FALSE

SYMMETRY Symmetry
SPECIFICATION MCSpec

INVARIANT TypeOK
INVARIANT EveryAdmittedWriteInScanSet
INVARIANT DecreaseKeepsStraggler
INVARIANT HistoryDenseAppendOnlyIncreasing
INVARIANT CasAppendNeverDiscards
INVARIANT StaleWriterFailsClosed
INVARIANT StaleReaderFailsClosed
INVARIANT SafelyOldHeadRule
INVARIANT TokenResolvesAcrossReshards
INVARIANT OneCasWinner
INVARIANT LeadCoversRefreshHorizon
