\* Exhaustive safety configuration.
\*
\* An earlier version of this file kept smoke.cfg's two writers and widened
\* CasAttempts and MaxAdmitsPerWriter to 2 together (MaxHour raised to 4).
\* That combination does not complete: a real run reached 36,881,908 distinct
\* states with 21,017,614 still queued after 73 minutes before being killed,
\* over ADR-1113's budget. Each of the two widenings explodes on its own at
\* two writers too (CasAttempts=2 alone and MaxAdmitsPerWriter=2 alone were
\* each killed past several million distinct states with no sign of
\* converging), so the combination was never going to fit regardless of
\* MaxHour. This version instead drops to a single writer and keeps both
\* widenings, which completes:
\*   - Writers {w1, w2} -> {w1}. This is the coverage given up: the
\*     concurrent-two-writer interleaving smoke's own dimensions already
\*     exercise is not re-checked against the wider CasAttempts/admits
\*     bounds here. two-writer-concurrency-probe.cfg shows that
\*     interleaving stays reachable at smoke's dimensions (26 distinct
\*     states, depth 4), so it is a gap in this run's cross product, not an
\*     unverified capability.
\*   - CasAttempts 1 -> 2, so a CAS loser's re-read-and-retry loop is covered,
\*     not just the single-shot race that smoke keeps.
\*   - MaxAdmitsPerWriter 1 -> 2, so a writer both refreshes and then routes a
\*     later admit on the refreshed view (the two-admit straggler shape the
\*     negative controls rely on) is reachable in the safe model too.
\*   - MaxHour stays at 3, not 4: MaxHour is a no-op at this cfg's frozen
\*     clock (AppenderSkew=0, WriterSkew=0 freeze every clock at 0), proven by
\*     running MaxHour=4 alone against smoke's own dimensions and getting an
\*     identical state count to smoke.cfg (7809360 states, 958804 distinct,
\*     depth 18). Raising it here would not buy coverage.
\*   - FlushBound 1 -> 2, matching the shipped FLUSH_BOUND_SLACK_HOURS (see
\*     smoke.cfg and flush-bound-trailing.cfg for where that boundary
\*     actually bites; it does not bite at this cfg's frozen clock either).
\* Every margin stays at its shipped value otherwise, so this run asserts the
\* same eleven safety invariants smoke does. It still covers two generations,
\* multiple hours, and both an increase and a decrease in shard count (same
\* TargetCounts/InitialShardCount/MaxGenerations as smoke, which already
\* reaches both).
\*
\* AppenderSkew stays 0. Skew within the tolerated bound (1 hour) is absorbed by
\* the slack term already folded into S; skew above the bound is the domain of
\* the appender-skew-unbounded negative control. Every AppenderSkew>0 config
\* tried this round exploded regardless of writer/requester count (see
\* README.md's clock-skew section), so a dedicated skew=1 exhaustive variant
\* is left as future work, not something this resize could also absorb.
\*
\* Completed result (results.md has the full TLC output): 8,503,664 states
\* generated, 1,179,718 distinct states, depth 20, no error, in under two
\* minutes. bands.tsv is updated from this real run.
CONSTANTS
    Writers = {w1}
    Requesters = {r1, r2}
    TargetCounts = {3, 1}
    InitialShardCount = 2
    MaxHour = 3
    MaxGenerations = 2
    MaxAdmitsPerWriter = 2
    CasAttempts = 2
    C = 1
    MinLeadHours = 2
    HourUnits = 1
    L = 2
    S = 3
    FlushBound = 2
    WriterSkew = 0
    AppenderSkew = 0
    WriterFenceEnabled = TRUE
    TokenValidatedAgainstCount = FALSE

SYMMETRY Symmetry
SPECIFICATION MCSpec

INVARIANT TypeOK
INVARIANT EveryAdmittedWriteInScanSet
INVARIANT DecreaseKeepsStraggler
INVARIANT HistoryDenseAppendOnlyIncreasing
INVARIANT CasAppendNeverDiscards
INVARIANT StaleWriterFailsClosed
INVARIANT StaleReaderFailsClosed
INVARIANT SafelyOldHeadRule
INVARIANT TokenResolvesAcrossReshards
INVARIANT OneCasWinner
INVARIANT LeadCoversRefreshHorizon
