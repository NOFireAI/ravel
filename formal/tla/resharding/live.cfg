\* Not run by any check-tla.sh gate: no subcommand in that script checks a
\* PROPERTY, so this config is run and its result recorded by hand (see
\* results.md). FairSpec and EventuallyRoutedOnNewGeneration are defined in
\* OnlineResharding.tla but until this file existed no .cfg anywhere
\* referenced either one, so liveness had never actually been checked.
\*
\* Same dimensions as smoke.cfg (frozen clock, two writers, two requesters,
\* an increase and a decrease) so the only thing that changes is what gets
\* checked. No SYMMETRY: TLC's symmetry reduction is not sound in general
\* for a temporal property (see MCOnlineResharding.tla).
\*
\* First result (results.md has the full trace): VIOLATED in 4 seconds, 17193
\* states generated, 6286 distinct, via an infinite WriterCrash / FlushOpen
\* loop that never let a writer complete a flush. FairSpec at the time gave
\* AdmitAfterRefresh only weak fairness, and the crash loop toggles
\* flushes[w].open every step, so the admit action was enabled for one step
\* at a time and never continuously enabled; weak fairness does not force a
\* action with that shape to run.
\*
\* Second result, after widening AdmitAfterRefresh's fairness from WF_vars to
\* SF_vars (see OnlineResharding.tla): PASS. The same crash loop keeps
\* re-enabling the admit action infinitely often (once per reopened flush),
\* which strong fairness does force, so that loop is no longer a behavior
\* FairSpec admits, and TLC found no other violation: 31045026 states
\* generated, 3817433 distinct, depth 18, in 11 minutes 36 seconds. results.md
\* has the full figures.
CONSTANTS
    Writers = {w1, w2}
    Requesters = {r1, r2}
    TargetCounts = {3, 1}
    InitialShardCount = 2
    MaxHour = 3
    MaxGenerations = 2
    MaxAdmitsPerWriter = 1
    CasAttempts = 1
    C = 1
    MinLeadHours = 2
    HourUnits = 1
    L = 2
    S = 3
    FlushBound = 2
    WriterSkew = 0
    AppenderSkew = 0
    WriterFenceEnabled = TRUE
    TokenValidatedAgainstCount = FALSE

SPECIFICATION MCFairSpec
PROPERTY EventuallyRoutedOnNewGeneration
