\* Fast safety configuration, symmetry-reduced. Two writers, two concurrent
\* reshard requests over an increase (3) and a decrease (1) from generation
\* zero's count of 2, so every run holds at least two generations past
\* generation zero in both orders. The constants are the shipped ones scaled
\* to whole hours: C = 1 hour is an over-approximation of the 60 s refresh
\* interval, MinLeadHours = ceil(C) + 1 = 2 = MIN_LEAD_HOURS,
\* S = DEFAULT_SCAN_SLACK_HOURS = 3 and FlushBound = 1 hour of trailing
\* admission.
\*
\* AppenderSkew is 0 here, below the shipped TOLERATED_CLOCK_SKEW_HOURS of 1.
\* The model's time unit is an hour, so the shipped 60 s refresh interval has
\* to be rounded up to C = 1 hour, which inflates cached-view staleness sixty
\* fold. Safety needs the activation lead to exceed skew plus staleness: in
\* wall-clock terms the shipped system has 2 h > 1 h + 60 s and holds with an
\* hour of margin, but at C = 1 h the two terms consume the whole lead.
\* Carrying both roundings at once would model a system that does not exist.
\* AppenderSkew = 1 is exactly the negative control appender-skew-unbounded,
\* and results.md records it as the smallest breaking skew at C = 1 hour.
CONSTANTS
    Writers = {w1, w2}
    Requesters = {r1, r2}
    TargetCounts = {3, 1}
    InitialShardCount = 2
    MaxHour = 3
    MaxGenerations = 2
    MaxAdmitsPerWriter = 1
    CasAttempts = 2
    C = 1
    MinLeadHours = 2
    L = 2
    S = 3
    FlushBound = 1
    WriterSkew = 0
    AppenderSkew = 0
    WriterFenceEnabled = TRUE
    TokenValidatedAgainstCount = FALSE

SYMMETRY Symmetry
SPECIFICATION MCSpec

INVARIANT TypeOK
INVARIANT EveryAdmittedWriteInScanSet
INVARIANT DecreaseKeepsStraggler
INVARIANT HistoryDenseAppendOnlyIncreasing
INVARIANT CasAppendNeverDiscards
INVARIANT StaleWriterFailsClosed
INVARIANT StaleReaderFailsClosed
INVARIANT SafelyOldHeadRule
INVARIANT TokenResolvesAcrossReshards
INVARIANT OneCasWinner
INVARIANT LeadCoversRefreshHorizon
