\* Fast safety configuration, symmetry-reduced. Two writers, two concurrent
\* reshard requests over an increase (3) and a decrease (1) from generation
\* zero's count of 2, so every run holds at least two generations past
\* generation zero in both orders. The constants are the shipped ones scaled
\* to whole hours: C = 1 hour is an over-approximation of the 60 s refresh
\* interval, MinLeadHours = ceil(C) + 1 = 2 = MIN_LEAD_HOURS,
\* S = DEFAULT_SCAN_SLACK_HOURS = 3 and FlushBound = 2 hours of trailing
\* admission, matching the shipped FLUSH_BOUND_SLACK_HOURS. At this cfg's
\* frozen clock (AppenderSkew = 0, see below) FlushBound never binds: results.md
\* records that FlushBound = 1 and FlushBound = 2 produce the identical state
\* count here, so smoke's own run is not where FlushBound's boundary is
\* checked; flush-bound-trailing.cfg is.
\*
\* AppenderSkew is 0 here, below the shipped TOLERATED_CLOCK_SKEW_HOURS of 1.
\* The model's time unit is an hour, so the shipped 60 s refresh interval has
\* to be rounded up to C = 1 hour, which inflates cached-view staleness sixty
\* fold. Safety needs the activation lead to exceed skew plus staleness: in
\* wall-clock terms the shipped system has 2 h > 1 h + 60 s and holds with an
\* hour of margin, but at C = 1 h the two terms consume the whole lead.
\* Carrying both roundings at once would model a system that does not exist.
\* The negative control appender-skew-unbounded raises AppenderSkew well above
\* the tolerated bound to exhibit the data-loss violation; results.md records
\* what the executor established about the breaking skew (skew 4 breaks only at
\* a large horizon, skews 1 through 3 produced no counterexample in the horizons
\* the executor ran, and the true minimum is left to the exhaustive run).
\*
\* CasAttempts = 1 keeps smoke inside its wall-clock budget. Two requesters
\* still race on the same base version (OneCasWinner), and a requester that
\* reads after the other's append commits still creates the second generation
\* past generation zero, so both an increase and a decrease land. The only
\* behavior dropped is the loser's re-read-and-retry loop; exhaustive.cfg
\* raises CasAttempts to 2 to cover it.
CONSTANTS
    Writers = {w1, w2}
    Requesters = {r1, r2}
    TargetCounts = {3, 1}
    InitialShardCount = 2
    MaxHour = 3
    MaxGenerations = 2
    MaxAdmitsPerWriter = 1
    CasAttempts = 1
    C = 1
    MinLeadHours = 2
    HourUnits = 1
    L = 2
    S = 3
    FlushBound = 2
    WriterSkew = 0
    AppenderSkew = 0
    WriterFenceEnabled = TRUE
    TokenValidatedAgainstCount = FALSE

SYMMETRY Symmetry
SPECIFICATION MCSpec

INVARIANT TypeOK
INVARIANT EveryAdmittedWriteInScanSet
INVARIANT DecreaseKeepsStraggler
INVARIANT HistoryDenseAppendOnlyIncreasing
INVARIANT CasAppendNeverDiscards
INVARIANT StaleWriterFailsClosed
INVARIANT StaleReaderFailsClosed
INVARIANT SafelyOldHeadRule
INVARIANT TokenResolvesAcrossReshards
INVARIANT OneCasWinner
INVARIANT LeadCoversRefreshHorizon
