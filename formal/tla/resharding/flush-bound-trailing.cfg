\* Not run by any check-tla.sh gate (matches shipped-skew-minutes.cfg's
\* treatment): a probe config, not a safety sweep. It exists to answer one
\* question smoke.cfg's frozen clock cannot: does the shipped FlushBound=2
\* actually let a trailing admission reach a gap of 2 or more, or does the
\* boundary just sit in the constants unexercised?
\*
\* Single writer and requester, one reshard, AppenderSkew=1 so the writer's
\* clock can move past its flush's pinned ingest hour at all (frozen-clock
\* configs can never approach this boundary; see README.md). L=4 keeps the
\* activation lead comfortably clear of the wider skew so LeadCoversRefreshHorizon
\* is not the thing that fires first.
\*
\* Result (results.md has the full TLC output): FlushBoundNeverBites, a
\* store-grounded probe invariant that is not the FlushBound constant, is
\* VIOLATED here in 2070 states generated / 1040 distinct / depth 7. That is
\* the reachability half of the non-vacuity proof: FlushBound=2 lets a real
\* admitted record trail its ingest hour by 2 hours.
\*
\* The other half, that FlushBound=1 makes the same gap unreachable, is not
\* provable by lowering this same config's FlushBound and rerunning: that
\* run does not complete inside a reasonable budget (results.md records
\* 6.1M states / 1.77M distinct still climbing at depth 13 before being
\* killed), matching this area's general explosion once AppenderSkew > 0
\* unlocks clock movement (see the shipped-skew-minutes.cfg discussion).
\* Instead it is proven algebraically from the guard itself: CanAdmit(w)
\* requires clocks[w] - flushes[w].hour <= FlushBound before DoAdmit stamps
\* routeHour := clocks[w] and ingestHour := flushes[w].hour in that same
\* step, and admitted is append-only afterward, so every member of admitted
\* satisfies routeHour - ingestHour <= FlushBound for all time by
\* construction. At FlushBound=1 that bounds the gap at 1, so a gap of 2 is
\* unreachable regardless of how much of the state space TLC can explore.
CONSTANTS
    Writers = {w1}
    Requesters = {r1}
    TargetCounts = {1}
    InitialShardCount = 2
    MaxHour = 8
    MaxGenerations = 1
    MaxAdmitsPerWriter = 2
    CasAttempts = 1
    C = 1
    MinLeadHours = 2
    HourUnits = 1
    L = 4
    S = 3
    FlushBound = 2
    WriterSkew = 0
    AppenderSkew = 1
    WriterFenceEnabled = TRUE
    TokenValidatedAgainstCount = FALSE

SPECIFICATION MCSpec

INVARIANT FlushBoundNeverBites
