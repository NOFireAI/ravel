\* Not run by any check-tla.sh gate. exhaustive.cfg drops to a single writer
\* for tractability (see its header); this probe proves the two-writer
\* interleaving that drop gives up is still reachable, by checking a "never
\* happens" invariant that a correct model must actually violate.
\*
\* Same dimensions as smoke.cfg, which already completes at 2 writers, so
\* this is expected to resolve fast. See results.md for the TLC line.
CONSTANTS
    Writers = {w1, w2}
    Requesters = {r1, r2}
    TargetCounts = {3, 1}
    InitialShardCount = 2
    MaxHour = 3
    MaxGenerations = 2
    MaxAdmitsPerWriter = 1
    CasAttempts = 1
    C = 1
    MinLeadHours = 2
    HourUnits = 1
    L = 2
    S = 3
    FlushBound = 2
    WriterSkew = 0
    AppenderSkew = 0
    WriterFenceEnabled = TRUE
    TokenValidatedAgainstCount = FALSE

SYMMETRY Symmetry
SPECIFICATION MCSpec

INVARIANT TwoWritersNeverConcurrentlyOpen
