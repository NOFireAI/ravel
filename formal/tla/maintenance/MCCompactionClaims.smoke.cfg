\* Smoke model for CompactionClaims: safety only, full lifecycle (no liveness
\* restriction), small bounds. DeclaredLease = 0 (EffLease 0) so a claim
\* re-expires after each steal within the MaxV write budget, making the
\* two-thieves-one-version race reachable and AtMostOneThiefWinsAVersion
\* non-vacuous. See README (F5) and counterexamples/two-thieves-reachable.md.
CONSTANTS
    Workers = {1, 2}
    Units = {1}
    Variants = {iA, iB}
    NoC = nc
    Corrupt = corrupt
    Scr = scr
    NoRec = norec
    DeclaredLease = 0
    MaxObservedLease = 2
    MaxV = 6
    MaxTime = 2
    LivenessMode = FALSE
    LHolder = 1
    LThief = 2
    CompletionOverwrite = FALSE
    AllowClaimDelete = FALSE
    ClaimIsPublicationAuthority = FALSE
    GuardIgnoresClaim = FALSE
    StealIgnoresCas = FALSE
    DivergeOverwritesRecord = FALSE
    MissingPartReportsConverged = FALSE
SPECIFICATION MCSpec
INVARIANT CTypeOK
INVARIANT ClaimGrantsNoPublicationAuthority
INVARIANT StaleOwnerCannotOverwriteNewerClaim
INVARIANT NoUnconditionalClaimDelete
INVARIANT AtMostOneThiefWinsAVersion
INVARIANT LostClaimNeverPublishesThroughGuardedPath
INVARIANT MergeAttemptsConverge
INVARIANT DivergentInputSetNeverMutates
CHECK_DEADLOCK FALSE
