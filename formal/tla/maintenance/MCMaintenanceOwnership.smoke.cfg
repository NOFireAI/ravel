\* Smoke model for MaintenanceOwnership: safety only, small bounds.
\* MaxT = 2 so a heartbeat stamp can fall more than the staleness window (Factor*H
\* = 1) behind the clock: the is_stale gate is reachable here (a sibling written at
\* clock 0 is stale once now = 2), which it never is at MaxT = 1. See README (F5).
\* AllowCrash = FALSE: at MaxT = 2 a worker that simply stops writing heartbeats
\* has its stamp go stale and is excluded, so the crash-driven staleness path is
\* subsumed by time staleness without the crashed flag. AllowCrash = TRUE at
\* MaxT = 2 exceeds the smoke state budget (over six million distinct states and
\* still growing past the wall-clock cap); the crashed-flag machinery is the
\* explicit-fault switch, off here. See results.md (F5) for the crash-coverage note.
CONSTANTS
    Workers = {1, 2}
    Units = {1}
    Variants = {iA, iB}
    Canon = iA
    NoC = nc
    MaintTok = mt
    NoRec = norec
    H = 1
    Factor = 1
    MaxT = 2
    Phantom = FALSE
    PH = ph
    PhantomWeight = 100000
    AllowCrash = FALSE
    OwnerPublishOverwrite = FALSE
    HeartbeatMemoUsesCas = FALSE
    MemoOverstamp = FALSE
    DivergeOverwritesRecord = FALSE
    MissingPartReportsConverged = FALSE
SPECIFICATION MCSpec
VIEW MCView
INVARIANT OTypeOK
INVARIANT QueryVisibleDataCorrectUnderDuplicateOwnership
INVARIANT HeartbeatAndMemoNeverCas
INVARIANT MemoNeverExtendsFreshnessPastSnapshot
INVARIANT MergeAttemptsConverge
INVARIANT DivergentInputSetNeverMutates
CHECK_DEADLOCK FALSE
