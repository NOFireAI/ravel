\* Exhaustive model for CompactionClaims: safety plus the steal-liveness property
\* under FairSpec. LivenessMode restricts the run to the paused-holder / fair-thief
\* lifecycle that is the named environment for "an expired claim is eventually
\* stolen". No symmetry.
CONSTANTS
    Workers = {1, 2}
    Units = {1}
    Variants = {iA, iB}
    NoC = nc
    Corrupt = corrupt
    Scr = scr
    NoRec = norec
    DeclaredLease = 1
    MaxObservedLease = 2
    MaxV = 6
    MaxTime = 2
    LivenessMode = TRUE
    LHolder = 1
    LThief = 2
    CompletionOverwrite = FALSE
    AllowClaimDelete = FALSE
    ClaimIsPublicationAuthority = FALSE
SPECIFICATION MCFairSpec
INVARIANT CTypeOK
INVARIANT ClaimGrantsNoPublicationAuthority
INVARIANT StaleOwnerCannotOverwriteNewerClaim
INVARIANT NoUnconditionalClaimDelete
INVARIANT AtMostOneThiefWinsAVersion
INVARIANT LostClaimNeverPublishesThroughGuardedPath
INVARIANT MergeAttemptsConverge
PROPERTY ExpiredClaimEventuallyStolen
CHECK_DEADLOCK FALSE
