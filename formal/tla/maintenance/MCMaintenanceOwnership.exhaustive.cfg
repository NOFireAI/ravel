\* Exhaustive model for MaintenanceOwnership: safety plus the two temporal
\* properties under FairSpec. Stable membership (no crash, no phantom) is the
\* named environment the liveness property assumes. No symmetry.
\*
\* Workers = {1}, not {1, 2}: the reachable graph at two workers, with no VIEW
\* (VIEW is unsound under a temporal spec: it can merge stutter-equivalent
\* states and mask a liveness counterexample, see MCMaintenanceOwnership.tla's
\* MCView comment), does not converge in any practical budget -- confirmed
\* past 4,600,000 distinct states at depth 13 of an eventual 20 and still
\* growing. Two workers are exactly what makes the duplicate-ownership race
\* reachable, so this is a real coverage split, not a shortcut: the two-worker
\* race's safety invariants are already covered exhaustively, up to the sound
\* VIEW abstraction, by MCMaintenanceOwnership.smoke.cfg (same invariant list,
\* same constants otherwise). What smoke.cfg cannot check under a VIEW is the
\* two liveness properties below, so this config drops to one worker to keep
\* them exhaustive and genuine. Nothing here exhaustively checks the two
\* liveness properties in the presence of the duplicate-ownership race; see
\* README.md and results.md for the exact split.
CONSTANTS
    Workers = {1}
    Units = {1}
    Variants = {iA, iB}
    Canon = iA
    NoC = nc
    MaintTok = mt
    NoRec = norec
    H = 1
    Factor = 1
    MaxT = 2
    Phantom = FALSE
    PH = ph
    PhantomWeight = 100000
    AllowCrash = FALSE
    OwnerPublishOverwrite = FALSE
    HeartbeatMemoUsesCas = FALSE
    MemoOverstamp = FALSE
    DivergeOverwritesRecord = FALSE
    MissingPartReportsConverged = FALSE
SPECIFICATION MCFairSpec
INVARIANT OTypeOK
INVARIANT QueryVisibleDataCorrectUnderDuplicateOwnership
INVARIANT HeartbeatAndMemoNeverCas
INVARIANT MemoNeverExtendsFreshnessPastSnapshot
INVARIANT MergeAttemptsConverge
INVARIANT DivergentInputSetNeverMutates
PROPERTY EveryEligibleUnitEventuallyAttempted
PROPERTY OwnershipIsNotPublicationAuthority
CHECK_DEADLOCK FALSE
