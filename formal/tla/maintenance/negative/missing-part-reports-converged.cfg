\* module: MCCompactionClaims
\* Negative: a resolution whose winner part vanished and is tombstoned (not
\* re-PUTtable) reports Converged instead of failing closed. It self-reports the
\* "Converged" label while the store witness shows the winner part absent. Must
\* violate (exit 12) MergeAttemptsConverge.
CONSTANTS
    Workers = {1, 2}
    Units = {1}
    Variants = {iA, iB}
    NoC = nc
    Corrupt = corrupt
    Scr = scr
    NoRec = norec
    DeclaredLease = 1
    MaxObservedLease = 2
    MaxV = 6
    MaxTime = 2
    LivenessMode = FALSE
    LHolder = 1
    LThief = 2
    CompletionOverwrite = FALSE
    AllowClaimDelete = FALSE
    ClaimIsPublicationAuthority = FALSE
    GuardIgnoresClaim = FALSE
    DivergeOverwritesRecord = FALSE
    MissingPartReportsConverged = TRUE
SPECIFICATION MCSpec
INVARIANT CTypeOK
INVARIANT ClaimGrantsNoPublicationAuthority
INVARIANT StaleOwnerCannotOverwriteNewerClaim
INVARIANT NoUnconditionalClaimDelete
INVARIANT LostClaimNeverPublishesThroughGuardedPath
INVARIANT MergeAttemptsConverge
INVARIANT DivergentInputSetNeverMutates
CHECK_DEADLOCK FALSE
