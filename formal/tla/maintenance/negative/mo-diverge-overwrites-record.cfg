\* module: MCMaintenanceOwnership
\* Negative: a loser whose input set diverges from the winner overwrites the
\* terminal record instead of alarming and mutating nothing. The overwrite
\* re-writes identical content, so a content-only check would miss it; but the PUT
\* mints a fresh store version, moving VersionOf(RecordKey) off the latched recVer.
\* Must violate (exit 12) DivergentInputSetNeverMutates.
CONSTANTS
    Workers = {1, 2}
    Units = {1}
    Variants = {iA, iB}
    Canon = iA
    NoC = nc
    MaintTok = mt
    NoRec = norec
    H = 1
    Factor = 1
    MaxT = 2
    Phantom = FALSE
    PH = ph
    PhantomWeight = 100000
    AllowCrash = FALSE
    OwnerPublishOverwrite = FALSE
    HeartbeatMemoUsesCas = FALSE
    MemoOverstamp = FALSE
    DivergeOverwritesRecord = TRUE
    MissingPartReportsConverged = FALSE
SPECIFICATION MCSpec
VIEW MCView
INVARIANT OTypeOK
INVARIANT QueryVisibleDataCorrectUnderDuplicateOwnership
INVARIANT HeartbeatAndMemoNeverCas
INVARIANT MemoNeverExtendsFreshnessPastSnapshot
INVARIANT MergeAttemptsConverge
INVARIANT DivergentInputSetNeverMutates
CHECK_DEADLOCK FALSE
