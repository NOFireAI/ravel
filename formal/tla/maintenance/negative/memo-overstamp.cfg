\* module: MCMaintenanceOwnership
\* Negative: seeding skips the per-entry clamp, so a future/skewed entry
\* reads fresher than its source snapshot. Must violate (exit 12)
\* MemoNeverExtendsFreshnessPastSnapshot.
CONSTANTS
    Workers = {1, 2}
    Units = {1}
    Variants = {iA, iB}
    Canon = iA
    NoC = nc
    NoRec = norec
    H = 1
    Factor = 1
    MaxT = 2
    Phantom = FALSE
    PH = ph
    PhantomWeight = 100000
    AllowCrash = FALSE
    OwnerPublishOverwrite = FALSE
    HeartbeatMemoUsesCas = FALSE
    MemoOverstamp = TRUE
SPECIFICATION MCSpec
INVARIANT OTypeOK
INVARIANT QueryVisibleDataCorrectUnderDuplicateOwnership
INVARIANT HeartbeatAndMemoNeverCas
INVARIANT MemoNeverExtendsFreshnessPastSnapshot
CHECK_DEADLOCK FALSE
