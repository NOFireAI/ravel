\* module: MCMaintenanceOwnership
\* Negative: a phantom live member (a lingering heartbeat of a departed or
\* restarted worker, within the window, outranking every live worker) owns the
\* unit, so every live worker defers to a process that does not exist. Must
\* violate (exit 13) EveryEligibleUnitEventuallyAttempted: the zero-ownership
\* limitation.
CONSTANTS
    Workers = {1, 2}
    Units = {1}
    Variants = {iA, iB}
    Canon = iA
    NoC = nc
    NoRec = norec
    H = 1
    Factor = 1
    MaxT = 2
    Phantom = TRUE
    PH = ph
    PhantomWeight = 100000
    AllowCrash = FALSE
    OwnerPublishOverwrite = FALSE
    HeartbeatMemoUsesCas = FALSE
    MemoOverstamp = FALSE
SPECIFICATION MCFairSpec
PROPERTY EveryEligibleUnitEventuallyAttempted
CHECK_DEADLOCK FALSE
