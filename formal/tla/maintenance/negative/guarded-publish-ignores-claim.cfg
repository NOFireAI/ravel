\* module: MCCompactionClaims
\* Negative: the guarded (checkpoint) publish drops its HoldsClaim check and
\* publishes even when the claim is lost. Must violate (exit 12)
\* LostClaimNeverPublishesThroughGuardedPath.
CONSTANTS
    Workers = {1, 2}
    Units = {1}
    Variants = {iA, iB}
    NoC = nc
    Corrupt = corrupt
    Scr = scr
    NoRec = norec
    DeclaredLease = 1
    MaxObservedLease = 2
    MaxV = 6
    MaxTime = 2
    LivenessMode = FALSE
    LHolder = 1
    LThief = 2
    CompletionOverwrite = FALSE
    AllowClaimDelete = FALSE
    ClaimIsPublicationAuthority = FALSE
    GuardIgnoresClaim = TRUE
SPECIFICATION MCSpec
INVARIANT CTypeOK
INVARIANT ClaimGrantsNoPublicationAuthority
INVARIANT StaleOwnerCannotOverwriteNewerClaim
INVARIANT NoUnconditionalClaimDelete
INVARIANT AtMostOneThiefWinsAVersion
INVARIANT LostClaimNeverPublishesThroughGuardedPath
INVARIANT MergeAttemptsConverge
CHECK_DEADLOCK FALSE
