\* module: MCMaintenanceOwnership
\* Negative: a memo persistence write uses CasVersion on a self-owned key.
\* Must violate (exit 12) HeartbeatAndMemoNeverCas.
CONSTANTS
    Workers = {1, 2}
    Units = {1}
    Variants = {iA, iB}
    Canon = iA
    NoC = nc
    NoRec = norec
    H = 1
    Factor = 1
    MaxT = 2
    Phantom = FALSE
    PH = ph
    PhantomWeight = 100000
    AllowCrash = FALSE
    OwnerPublishOverwrite = FALSE
    HeartbeatMemoUsesCas = TRUE
    MemoOverstamp = FALSE
SPECIFICATION MCSpec
INVARIANT OTypeOK
INVARIANT QueryVisibleDataCorrectUnderDuplicateOwnership
INVARIANT HeartbeatAndMemoNeverCas
INVARIANT MemoNeverExtendsFreshnessPastSnapshot
CHECK_DEADLOCK FALSE
