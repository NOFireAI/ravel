\* module: MCMaintenanceOwnership
\* Negative: a resolution whose winner part vanished and is tombstoned (not
\* re-PUTtable) reports Converged instead of failing closed. It self-reports the
\* "Converged" label while the store witness shows the winner part absent. Must
\* violate (exit 12) MergeAttemptsConverge.
CONSTANTS
    Workers = {1, 2}
    Units = {1}
    Variants = {iA, iB}
    Canon = iA
    NoC = nc
    MaintTok = mt
    NoRec = norec
    H = 1
    Factor = 1
    MaxT = 2
    Phantom = FALSE
    PH = ph
    PhantomWeight = 100000
    AllowCrash = FALSE
    OwnerPublishOverwrite = FALSE
    HeartbeatMemoUsesCas = FALSE
    MemoOverstamp = FALSE
    DivergeOverwritesRecord = FALSE
    MissingPartReportsConverged = TRUE
SPECIFICATION MCSpec
VIEW MCView
INVARIANT OTypeOK
INVARIANT QueryVisibleDataCorrectUnderDuplicateOwnership
INVARIANT HeartbeatAndMemoNeverCas
INVARIANT MemoNeverExtendsFreshnessPastSnapshot
INVARIANT MergeAttemptsConverge
INVARIANT DivergentInputSetNeverMutates
CHECK_DEADLOCK FALSE
