\* module: MCCompactionClaims
\* Negative: a loser whose input set diverges from the winner overwrites the
\* terminal record instead of alarming and mutating nothing. The overwrite keeps
\* the same content, so record immutability still holds; the store version delta
\* (recOverwritten) moves. Must violate (exit 12) DivergentInputSetNeverMutates.
CONSTANTS
    Workers = {1, 2}
    Units = {1}
    Variants = {iA, iB}
    NoC = nc
    Corrupt = corrupt
    Scr = scr
    NoRec = norec
    DeclaredLease = 1
    MaxObservedLease = 2
    MaxV = 6
    MaxTime = 2
    LivenessMode = FALSE
    LHolder = 1
    LThief = 2
    CompletionOverwrite = FALSE
    AllowClaimDelete = FALSE
    ClaimIsPublicationAuthority = FALSE
    GuardIgnoresClaim = FALSE
    StealIgnoresCas = FALSE
    DivergeOverwritesRecord = TRUE
    MissingPartReportsConverged = FALSE
SPECIFICATION MCSpec
INVARIANT CTypeOK
INVARIANT ClaimGrantsNoPublicationAuthority
INVARIANT StaleOwnerCannotOverwriteNewerClaim
INVARIANT NoUnconditionalClaimDelete
INVARIANT AtMostOneThiefWinsAVersion
INVARIANT LostClaimNeverPublishesThroughGuardedPath
INVARIANT MergeAttemptsConverge
INVARIANT DivergentInputSetNeverMutates
CHECK_DEADLOCK FALSE
