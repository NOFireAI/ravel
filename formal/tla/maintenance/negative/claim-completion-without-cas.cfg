\* module: MCCompactionClaims
\* Negative: mark_completed uses Overwrite instead of CasVersion, so a stale
\* owner (its token no longer current) overwrites a newer claim. Must violate
\* (exit 12) StaleOwnerCannotOverwriteNewerClaim.
CONSTANTS
    Workers = {1, 2}
    Units = {1}
    Variants = {iA, iB}
    NoC = nc
    Corrupt = corrupt
    Scr = scr
    NoRec = norec
    DeclaredLease = 1
    MaxObservedLease = 2
    MaxV = 6
    MaxTime = 2
    LivenessMode = FALSE
    LHolder = 1
    LThief = 2
    CompletionOverwrite = TRUE
    AllowClaimDelete = FALSE
    ClaimIsPublicationAuthority = FALSE
    GuardIgnoresClaim = FALSE
SPECIFICATION MCSpec
INVARIANT CTypeOK
INVARIANT ClaimGrantsNoPublicationAuthority
INVARIANT StaleOwnerCannotOverwriteNewerClaim
INVARIANT NoUnconditionalClaimDelete
INVARIANT AtMostOneThiefWinsAVersion
INVARIANT LostClaimNeverPublishesThroughGuardedPath
INVARIANT MergeAttemptsConverge
CHECK_DEADLOCK FALSE
