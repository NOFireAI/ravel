\* module: MCCompactionClaims
\* Negative: when the claim is held the publish path overwrites the terminal
\* record instead of CreateIfAbsent, so a holder mutates the record to a
\* divergent variant. Must violate (exit 12) ClaimGrantsNoPublicationAuthority.
CONSTANTS
    Workers = {1, 2}
    Units = {1}
    Variants = {iA, iB}
    NoC = nc
    Corrupt = corrupt
    Scr = scr
    NoRec = norec
    DeclaredLease = 1
    MaxObservedLease = 2
    MaxV = 6
    MaxTime = 2
    LivenessMode = FALSE
    LHolder = 1
    LThief = 2
    CompletionOverwrite = FALSE
    AllowClaimDelete = FALSE
    ClaimIsPublicationAuthority = TRUE
    GuardIgnoresClaim = FALSE
    DivergeOverwritesRecord = FALSE
    MissingPartReportsConverged = FALSE
SPECIFICATION MCSpec
INVARIANT CTypeOK
INVARIANT ClaimGrantsNoPublicationAuthority
INVARIANT StaleOwnerCannotOverwriteNewerClaim
INVARIANT NoUnconditionalClaimDelete
INVARIANT LostClaimNeverPublishesThroughGuardedPath
INVARIANT MergeAttemptsConverge
CHECK_DEADLOCK FALSE
