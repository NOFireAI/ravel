\* module: MCCompactionClaims
\* Negative: the steal's duplicate-win guard drops the CAS-outcome conjunct, so
\* it counts a win from a steal whose CAS did not match the stored version. Two
\* thieves observing one version then both record a win for it. Must violate
\* (exit 12) AtMostOneThiefWinsAVersion. DeclaredLease = 0 (as in the smoke
\* model) so a claim re-expires within the MaxV budget and the second steal of
\* one observed version is reachable; see counterexamples/two-thieves-reachable.md.
CONSTANTS
    Workers = {1, 2}
    Units = {1}
    Variants = {iA, iB}
    NoC = nc
    Corrupt = corrupt
    Scr = scr
    NoRec = norec
    DeclaredLease = 0
    MaxObservedLease = 2
    MaxV = 6
    MaxTime = 2
    LivenessMode = FALSE
    LHolder = 1
    LThief = 2
    CompletionOverwrite = FALSE
    AllowClaimDelete = FALSE
    ClaimIsPublicationAuthority = FALSE
    GuardIgnoresClaim = FALSE
    StealIgnoresCas = TRUE
    DivergeOverwritesRecord = FALSE
    MissingPartReportsConverged = FALSE
SPECIFICATION MCSpec
INVARIANT CTypeOK
INVARIANT ClaimGrantsNoPublicationAuthority
INVARIANT StaleOwnerCannotOverwriteNewerClaim
INVARIANT NoUnconditionalClaimDelete
INVARIANT AtMostOneThiefWinsAVersion
INVARIANT LostClaimNeverPublishesThroughGuardedPath
INVARIANT MergeAttemptsConverge
CHECK_DEADLOCK FALSE
