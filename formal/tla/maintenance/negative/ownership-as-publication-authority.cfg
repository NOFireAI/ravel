\* module: MCMaintenanceOwnership
\* Negative: an in-view owner publishes the terminal record with Overwrite
\* instead of CreateIfAbsent, so a second publisher with a different variant
\* mutates the record away from the winner. Must violate (exit 12)
\* QueryVisibleDataCorrectUnderDuplicateOwnership.
CONSTANTS
    Workers = {1, 2}
    Units = {1}
    Variants = {iA, iB}
    Canon = iA
    NoC = nc
    NoRec = norec
    H = 1
    Factor = 1
    MaxT = 2
    Phantom = FALSE
    PH = ph
    PhantomWeight = 100000
    AllowCrash = FALSE
    OwnerPublishOverwrite = TRUE
    HeartbeatMemoUsesCas = FALSE
    MemoOverstamp = FALSE
SPECIFICATION MCSpec
INVARIANT OTypeOK
INVARIANT QueryVisibleDataCorrectUnderDuplicateOwnership
INVARIANT HeartbeatAndMemoNeverCas
INVARIANT MemoNeverExtendsFreshnessPastSnapshot
CHECK_DEADLOCK FALSE
