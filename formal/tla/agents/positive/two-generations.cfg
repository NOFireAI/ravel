\* module: MCAgentProtocol
\* Positive: the correct spec (every switch off) with timers on at two
\* generations, so a second generation, a reschedule that supersedes an armed
\* one, a cancel and a stale hint are all reachable. Checks the eleven
\* invariants; no liveness. One client, one input, two workers, MaxRevision 4,
\* MaxEpoch 2, with the smoke config's VIEW and SYMMETRY. Must pass.
CONSTANTS
    Tenants = {t1}
    Agents = {a1}
    Clients = {c1}
    Workers = {w1, w2}
    Inputs = {i1}
    RequestIds = {r1}
    Hashes = {h1}
    MaxRevision = 4
    MaxEpoch = 2
    MaxTimerGen = 2
    NoC = noc
    NoWorker = noworker
    NoHandle = nohandle
    NoCas = nocas
    TimerMsg = timermsg
    AckBeforeCas = FALSE
    HeadBeforeDependency = FALSE
    OverwriteStaleRoot = FALSE
    EpochCheckedOutsideCas = FALSE
    CursorWithoutResult = FALSE
    RequestHashMismatchAccepted = FALSE
    ReceiptDiscarded = FALSE
    StaleTimerGenerationFired = FALSE
    EarlyHintForgotten = FALSE
    StaleTurnRebase = FALSE
    RebaseIgnoresCancelRequest = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT OneLogicalCompletion
INVARIANT TurnCommitAtomic
INVARIANT NoLostConcurrentEnqueue
INVARIANT RequestIdentityStable
INVARIANT PublishedReferencesComplete
INVARIANT AcceptedImpliesRecoverable
INVARIANT NoStaleOwnerCommit
INVARIANT CancellationRespected
INVARIANT TimerGenerationDeliveredOnce
INVARIANT MonotonicIdentity
INVARIANT TenantIncarnationIsolation
CHECK_DEADLOCK FALSE
