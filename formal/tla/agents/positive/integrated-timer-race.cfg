\* module: MCAgentIntegrated
\* Positive: the correct spec (every switch off) with one timer generation,
\* so the timer's schedule, cancel, hint write, sweep read and fire race the
\* client's enqueue, its cancel and the turn commit on one HEAD. Checks the
\* fourteen invariants; no liveness. One worker and one epoch (the worker
\* crashes and restarts), at_least_once and manual. Two workers with the
\* timer on is the exhaustive config.
CONSTANTS
    Workers = {w1}
    Client = c1
    Policies = {"at_least_once", "manual"}
    MaxEpoch = 1
    MaxAttempt = 2
    MaxTimerGen = 1
    Payload = p1
    TimerMsg = tmsg
    NoC = noc
    NoWorker = noworker
    NoHandle = nohandle
    NoCas = nocas
    AckBeforeCas = FALSE
    ResolveTrustsUnknown = FALSE
    SweepOverwritesHead = FALSE
    DispatchBeforeIntent = FALSE
    CompleteIgnoresCancel = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT AcceptedImpliesRecoverable
INVARIANT PublishedReferencesComplete
INVARIANT RequestIdentityStable
INVARIANT OneLogicalCompletion
INVARIANT TurnCommitAtomic
INVARIANT NoStaleOwnerCommit
INVARIANT NoLostConcurrentEnqueue
INVARIANT MonotonicIdentity
INVARIANT TimerGenerationDeliveredOnce
INVARIANT StepTranscriptCompatible
INVARIANT DispatchRequiresCommittedAuthorization
INVARIANT PolicyControlsRedispatch
INVARIANT EffectResultFromExecution
INVARIANT CancellationRespected
CHECK_DEADLOCK FALSE
