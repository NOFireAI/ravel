\* Liveness model for AgentEffects under MCFairSpec, every switch off: the
\* input is eventually settled or waits on a blocked effect
\* (InputSettledOrEffectBlocked), with the safety invariants alongside. No
\* VIEW and no SYMMETRY (both are sound for invariants only), so it runs at
\* one worker and one epoch: the worker crashes and restarts instead of
\* being taken over. Two input hashes, so a drifted replay blocks the turn.
CONSTANTS
    Workers = {w1}
    Admin = admin
    Policies = {"provider_idempotency", "at_least_once", "manual"}
    Hashes = {h1, h2}
    MaxEpoch = 1
    MaxTurns = 2
    MaxAttempt = 2
    NoC = noc
    NoWorker = noworker
    NoCas = nocas
    DispatchBeforeIntent = FALSE
    AmbiguousManualAttemptRetried = FALSE
    StepInputDrift = FALSE
    AuthorizeIgnoresCancelRequest = FALSE
    LateResultOverwrites = FALSE
    CommitWhileInDoubt = FALSE
    ProviderReauthorizes = FALSE
    OlderResultRecorded = FALSE
    CancelledResultRecorded = FALSE
SPECIFICATION MCFairSpec
INVARIANT StepTranscriptCompatible
INVARIANT DispatchRequiresCommittedAuthorization
INVARIANT PolicyControlsRedispatch
INVARIANT EffectResultFromExecution
INVARIANT CancellationRespected
PROPERTY InputSettledOrEffectBlocked
CHECK_DEADLOCK FALSE
