\* Smoke model for AgentEffects: safety only, every switch off, all three
\* recovery policies (the policy is chosen in the initial state). Two workers
\* take the agent over from each other; two turns let a retryable failure
\* hand the transcript and journal to a retry; two attempts let a lost
\* response lead to a second authorization or a reconciliation. One input
\* hash: replay drift is off here and on in the exhaustive config.
\* VIEW and SYMMETRY are sound for invariants only (see MCAgentEffects).
CONSTANTS
    Workers = {w1, w2}
    Admin = admin
    Policies = {"provider_idempotency", "at_least_once", "manual"}
    Hashes = {h1}
    MaxEpoch = 2
    MaxTurns = 2
    MaxAttempt = 2
    NoC = noc
    NoWorker = noworker
    NoCas = nocas
    DispatchBeforeIntent = FALSE
    AmbiguousManualAttemptRetried = FALSE
    StepInputDrift = FALSE
    AuthorizeIgnoresCancelRequest = FALSE
    LateResultOverwrites = FALSE
    CommitWhileInDoubt = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT StepTranscriptCompatible
INVARIANT DispatchRequiresCommittedAuthorization
INVARIANT PolicyControlsRedispatch
INVARIANT EffectResultFromExecution
INVARIANT CancellationRespected
CHECK_DEADLOCK FALSE
