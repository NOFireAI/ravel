\* Liveness model for AgentIntegrated under MCFairSpec, every switch off: the
\* client is eventually answered (EnqueueEventuallyAnswered) and every
\* accepted input is eventually settled or waits on a blocked effect
\* (InputSettledOrEffectBlocked), with the safety invariants alongside. No
\* VIEW and no SYMMETRY (both are sound for invariants only), so it runs at
\* one worker and one epoch, and with no timer generation: the worker
\* crashes and restarts instead of being taken over.
CONSTANTS
    Workers = {w1}
    Client = c1
    Policies = {"provider_idempotency", "at_least_once", "manual"}
    MaxEpoch = 1
    MaxAttempt = 2
    MaxTimerGen = 0
    Payload = p1
    TimerMsg = tmsg
    NoC = noc
    NoWorker = noworker
    NoHandle = nohandle
    NoCas = nocas
    AckBeforeCas = FALSE
    ResolveTrustsUnknown = FALSE
    SweepOverwritesHead = FALSE
    DispatchBeforeIntent = FALSE
    CompleteIgnoresCancel = FALSE
SPECIFICATION MCFairSpec
INVARIANT AcceptedImpliesRecoverable
INVARIANT PublishedReferencesComplete
INVARIANT RequestIdentityStable
INVARIANT OneLogicalCompletion
INVARIANT TurnCommitAtomic
INVARIANT NoStaleOwnerCommit
INVARIANT NoLostConcurrentEnqueue
INVARIANT MonotonicIdentity
INVARIANT TimerGenerationDeliveredOnce
INVARIANT StepTranscriptCompatible
INVARIANT DispatchRequiresCommittedAuthorization
INVARIANT PolicyControlsRedispatch
INVARIANT EffectResultFromExecution
INVARIANT CancellationRespected
PROPERTY InputSettledOrEffectBlocked
PROPERTY EnqueueEventuallyAnswered
CHECK_DEADLOCK FALSE
