\* module: MCAgentIntegrated
\* Mutant: the client is answered once the payload object is written, before
\* the enqueue CAS returns. Must violate AcceptedImpliesRecoverable (exit 12).
\* Smoke bounds.
CONSTANTS
    Workers = {w1, w2}
    Client = c1
    Policies = {"provider_idempotency", "at_least_once", "manual"}
    MaxEpoch = 2
    MaxAttempt = 2
    MaxTimerGen = 0
    Payload = p1
    TimerMsg = tmsg
    NoC = noc
    NoWorker = noworker
    NoHandle = nohandle
    NoCas = nocas
    AckBeforeCas = TRUE
    ResolveTrustsUnknown = FALSE
    SweepOverwritesHead = FALSE
    DispatchBeforeIntent = FALSE
    CompleteIgnoresCancel = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT AcceptedImpliesRecoverable
CHECK_DEADLOCK FALSE
