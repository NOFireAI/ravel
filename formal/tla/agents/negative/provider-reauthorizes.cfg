\* module: MCAgentEffects
\* Mutant: a provider_idempotency worker that finds its attempt authorized
\* authorizes a fresh attempt instead of re-dispatching the same effect id
\* and attempt with no write. Must violate PolicyControlsRedispatch
\* (exit 12). Smoke bounds with the provider_idempotency policy only.
CONSTANTS
    Workers = {w1, w2}
    Admin = admin
    Policies = {"provider_idempotency"}
    Hashes = {h1}
    MaxEpoch = 2
    MaxTurns = 2
    MaxAttempt = 2
    NoC = noc
    NoWorker = noworker
    NoCas = nocas
    DispatchBeforeIntent = FALSE
    AmbiguousManualAttemptRetried = FALSE
    StepInputDrift = FALSE
    AuthorizeIgnoresCancelRequest = FALSE
    LateResultOverwrites = FALSE
    CommitWhileInDoubt = FALSE
    ProviderReauthorizes = TRUE
    OlderResultRecorded = FALSE
    CancelledResultRecorded = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT PolicyControlsRedispatch
CHECK_DEADLOCK FALSE
