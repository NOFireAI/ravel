\* module: MCAgentIntegrated
\* Mutant: after a lost enqueue response the client answers with the handle
\* the CAS would have returned, without re-reading HEAD for the receipt. Must
\* violate AcceptedImpliesRecoverable (exit 12). Timer race bounds: the CAS
\* can only fail when another writer (here the timer schedule) moves HEAD.
CONSTANTS
    Workers = {w1}
    Client = c1
    Policies = {"at_least_once", "manual"}
    MaxEpoch = 1
    MaxAttempt = 2
    MaxTimerGen = 1
    Payload = p1
    TimerMsg = tmsg
    NoC = noc
    NoWorker = noworker
    NoHandle = nohandle
    NoCas = nocas
    AckBeforeCas = FALSE
    ResolveTrustsUnknown = TRUE
    SweepOverwritesHead = FALSE
    DispatchBeforeIntent = FALSE
    CompleteIgnoresCancel = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT AcceptedImpliesRecoverable
CHECK_DEADLOCK FALSE
