\* module: MCAgentIntegrated
\* Probe: the client's input settles cancelled on a HEAD that also
\* delivered a timer generation. TimerCancelRaceUnreachable must be reported
\* violated (exit 12). Timer race bounds.
CONSTANTS
    Workers = {w1}
    Client = c1
    Policies = {"at_least_once", "manual"}
    MaxEpoch = 1
    MaxAttempt = 2
    MaxTimerGen = 1
    Payload = p1
    TimerMsg = tmsg
    NoC = noc
    NoWorker = noworker
    NoHandle = nohandle
    NoCas = nocas
    AckBeforeCas = FALSE
    ResolveTrustsUnknown = FALSE
    SweepOverwritesHead = FALSE
    DispatchBeforeIntent = FALSE
    CompleteIgnoresCancel = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT TimerCancelRaceUnreachable
CHECK_DEADLOCK FALSE
