\* module: MCAgentIntegrated
\* Mutant: the tool call goes out after the step is recorded and before its
\* intent and attempt are journaled. Must violate
\* DispatchRequiresCommittedAuthorization (exit 12). Smoke bounds.
CONSTANTS
    Workers = {w1, w2}
    Client = c1
    Policies = {"provider_idempotency", "at_least_once", "manual"}
    MaxEpoch = 2
    MaxAttempt = 2
    MaxTimerGen = 0
    Payload = p1
    TimerMsg = tmsg
    NoC = noc
    NoWorker = noworker
    NoHandle = nohandle
    NoCas = nocas
    AckBeforeCas = FALSE
    ResolveTrustsUnknown = FALSE
    SweepOverwritesHead = FALSE
    DispatchBeforeIntent = TRUE
    CompleteIgnoresCancel = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT DispatchRequiresCommittedAuthorization
CHECK_DEADLOCK FALSE
