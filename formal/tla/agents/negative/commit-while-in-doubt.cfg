\* module: MCAgentEffects
\* Mutant: a cancelled turn is committed while its manual effect is in
\* doubt (the kernel refuses with NoEffectInDoubt). Must violate
\* PolicyControlsRedispatch (exit 12). Smoke bounds with the manual policy
\* only.
CONSTANTS
    Workers = {w1, w2}
    Admin = admin
    Policies = {"manual"}
    Hashes = {h1}
    MaxEpoch = 2
    MaxTurns = 2
    MaxAttempt = 2
    NoC = noc
    NoWorker = noworker
    NoCas = nocas
    DispatchBeforeIntent = FALSE
    AmbiguousManualAttemptRetried = FALSE
    StepInputDrift = FALSE
    AuthorizeIgnoresCancelRequest = FALSE
    LateResultOverwrites = FALSE
    CommitWhileInDoubt = TRUE
    ProviderReauthorizes = FALSE
    OlderResultRecorded = FALSE
    CancelledResultRecorded = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT PolicyControlsRedispatch
CHECK_DEADLOCK FALSE
