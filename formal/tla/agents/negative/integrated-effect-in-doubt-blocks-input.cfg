\* module: MCAgentIntegrated
\* Liveness probe: every switch off, manual only, under MCFairSpec. A tool
\* step in doubt blocks the client's input and nothing here reconciles it,
\* so InputEventuallySettled (the liveness property without the blocked
\* terminals) must be violated (exit 13). Live bounds.
CONSTANTS
    Workers = {w1}
    Client = c1
    Policies = {"manual"}
    MaxEpoch = 1
    MaxAttempt = 2
    MaxTimerGen = 0
    Payload = p1
    TimerMsg = tmsg
    NoC = noc
    NoWorker = noworker
    NoHandle = nohandle
    NoCas = nocas
    AckBeforeCas = FALSE
    ResolveTrustsUnknown = FALSE
    SweepOverwritesHead = FALSE
    DispatchBeforeIntent = FALSE
    CompleteIgnoresCancel = FALSE
SPECIFICATION MCFairSpec
PROPERTY InputEventuallySettled
CHECK_DEADLOCK FALSE
