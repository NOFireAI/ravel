\* module: MCAgentIntegrated
\* Probe: under manual a lost provider response puts the tool step in doubt
\* and blocks the turn. BlockedEffectUnreachable must be reported violated
\* (exit 12). Smoke bounds, manual only.
CONSTANTS
    Workers = {w1, w2}
    Client = c1
    Policies = {"manual"}
    MaxEpoch = 2
    MaxAttempt = 2
    MaxTimerGen = 0
    Payload = p1
    TimerMsg = tmsg
    NoC = noc
    NoWorker = noworker
    NoHandle = nohandle
    NoCas = nocas
    AckBeforeCas = FALSE
    ResolveTrustsUnknown = FALSE
    SweepOverwritesHead = FALSE
    DispatchBeforeIntent = FALSE
    CompleteIgnoresCancel = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT BlockedEffectUnreachable
CHECK_DEADLOCK FALSE
