\* module: MCAgentIntegrated
\* Probe: under at_least_once a lost provider response leads to a second
\* attempt and the provider executes the tool call twice.
\* DuplicateExecutionUnreachable must be reported violated (exit 12).
\* Smoke bounds, at_least_once only.
CONSTANTS
    Workers = {w1, w2}
    Client = c1
    Policies = {"at_least_once"}
    MaxEpoch = 2
    MaxAttempt = 2
    MaxTimerGen = 0
    Payload = p1
    TimerMsg = tmsg
    NoC = noc
    NoWorker = noworker
    NoHandle = nohandle
    NoCas = nocas
    AckBeforeCas = FALSE
    ResolveTrustsUnknown = FALSE
    SweepOverwritesHead = FALSE
    DispatchBeforeIntent = FALSE
    CompleteIgnoresCancel = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT DuplicateExecutionUnreachable
CHECK_DEADLOCK FALSE
