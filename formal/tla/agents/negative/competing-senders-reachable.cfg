\* module: MCAgentProtocol
\* Probe: every switch off. A sender about to CAS a root that another
\* sender's enqueue already moved is reachable, so
\* CompetingSendersUnreachable must be violated (exit 12). Smoke bounds.
CONSTANTS
    Tenants = {t1}
    Agents = {a1}
    Clients = {c1, c2}
    Workers = {w1, w2}
    Inputs = {i1, i2}
    RequestIds = {r1, r2}
    Hashes = {h1, h2}
    MaxRevision = 6
    MaxEpoch = 2
    MaxTimerGen = 0
    NoC = noc
    NoWorker = noworker
    NoHandle = nohandle
    NoCas = nocas
    TimerMsg = timermsg
    AckBeforeCas = FALSE
    HeadBeforeDependency = FALSE
    OverwriteStaleRoot = FALSE
    EpochCheckedOutsideCas = FALSE
    CursorWithoutResult = FALSE
    RequestHashMismatchAccepted = FALSE
    ReceiptDiscarded = FALSE
    StaleTimerGenerationFired = FALSE
    EarlyHintForgotten = FALSE
    StaleTurnRebase = FALSE
    RebaseIgnoresCancelRequest = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT CompetingSendersUnreachable
CHECK_DEADLOCK FALSE
