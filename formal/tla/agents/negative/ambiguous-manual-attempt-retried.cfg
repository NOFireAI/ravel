\* module: MCAgentEffects
\* Mutant: an owner that reads a manual attempt authorized without a result
\* takes the idempotent AttemptAuthorized reply as permission and dispatches
\* the same attempt again. Must violate PolicyControlsRedispatch (exit 12).
\* Smoke bounds with the manual policy only.
CONSTANTS
    Workers = {w1, w2}
    Admin = admin
    Policies = {"manual"}
    Hashes = {h1}
    MaxEpoch = 2
    MaxTurns = 2
    MaxAttempt = 2
    NoC = noc
    NoWorker = noworker
    NoCas = nocas
    DispatchBeforeIntent = FALSE
    AmbiguousManualAttemptRetried = TRUE
    StepInputDrift = FALSE
    AuthorizeIgnoresCancelRequest = FALSE
    LateResultOverwrites = FALSE
    CommitWhileInDoubt = FALSE
    ProviderReauthorizes = FALSE
    OlderResultRecorded = FALSE
    CancelledResultRecorded = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT PolicyControlsRedispatch
CHECK_DEADLOCK FALSE
