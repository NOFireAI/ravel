\* module: MCAgentProtocol
\* Probe: every switch off, the stale-timer negative's bounds (MaxTimerGen 2).
\* A root whose armed or delivered timer is generation 2 is reachable, so
\* SecondGenerationUnreachable must be violated (exit 12). This is what makes
\* "the stale-timer negative reaches a replaced generation" a checked claim.
CONSTANTS
    Tenants = {t1}
    Agents = {a1}
    Clients = {c1}
    Workers = {w1, w2}
    Inputs = {i1}
    RequestIds = {r1}
    Hashes = {h1}
    MaxRevision = 4
    MaxEpoch = 2
    MaxTimerGen = 2
    NoC = noc
    NoWorker = noworker
    NoHandle = nohandle
    NoCas = nocas
    TimerMsg = timermsg
    AckBeforeCas = FALSE
    HeadBeforeDependency = FALSE
    OverwriteStaleRoot = FALSE
    EpochCheckedOutsideCas = FALSE
    CursorWithoutResult = FALSE
    RequestHashMismatchAccepted = FALSE
    ReceiptDiscarded = FALSE
    StaleTimerGenerationFired = FALSE
    EarlyHintForgotten = FALSE
    StaleTurnRebase = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT SecondGenerationUnreachable
CHECK_DEADLOCK FALSE
