\* module: MCAgentProtocol
\* Negative: the sweep deletes a hint it lists before the hint's generation
\* is due, so a due generation is never fired. Must violate (exit 13)
\* DueTimerEventuallyDelivered under MCFairSpec. No VIEW or SYMMETRY (both
\* are sound for invariants only); one client and one worker keep the
\* liveness run small.
CONSTANTS
    Tenants = {t1}
    Agents = {a1}
    Clients = {c1}
    Workers = {w1}
    Inputs = {i1}
    RequestIds = {r1}
    Hashes = {h1}
    MaxRevision = 4
    MaxEpoch = 1
    MaxTimerGen = 1
    NoC = noc
    NoWorker = noworker
    NoHandle = nohandle
    NoCas = nocas
    TimerMsg = timermsg
    AckBeforeCas = FALSE
    HeadBeforeDependency = FALSE
    OverwriteStaleRoot = FALSE
    EpochCheckedOutsideCas = FALSE
    CursorWithoutResult = FALSE
    RequestHashMismatchAccepted = FALSE
    ReceiptDiscarded = FALSE
    StaleTimerGenerationFired = FALSE
    EarlyHintForgotten = TRUE
    StaleTurnRebase = FALSE
SPECIFICATION MCFairSpec
PROPERTY DueTimerEventuallyDelivered
CHECK_DEADLOCK FALSE
