\* module: MCAgentEffects
\* Mutant: the result endpoint records a result from an attempt older than
\* the journaled one instead of answering LateResultIgnored. Must violate
\* EffectResultFromExecution (exit 12). Smoke bounds with the at_least_once
\* policy only, where a second attempt is reachable.
CONSTANTS
    Workers = {w1, w2}
    Admin = admin
    Policies = {"at_least_once"}
    Hashes = {h1}
    MaxEpoch = 2
    MaxTurns = 2
    MaxAttempt = 2
    NoC = noc
    NoWorker = noworker
    NoCas = nocas
    DispatchBeforeIntent = FALSE
    AmbiguousManualAttemptRetried = FALSE
    StepInputDrift = FALSE
    AuthorizeIgnoresCancelRequest = FALSE
    LateResultOverwrites = FALSE
    CommitWhileInDoubt = FALSE
    ProviderReauthorizes = FALSE
    OlderResultRecorded = TRUE
    CancelledResultRecorded = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT EffectResultFromExecution
CHECK_DEADLOCK FALSE
