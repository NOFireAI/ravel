\* module: MCAgentEffects
\* Mutant: the result endpoint records a late result over a completed
\* effect instead of answering LateResultIgnored. Must violate
\* StepTranscriptCompatible (exit 12). Smoke bounds with the at_least_once
\* policy only, where two executions of one effect are reachable.
CONSTANTS
    Workers = {w1, w2}
    Admin = admin
    Policies = {"at_least_once"}
    Hashes = {h1}
    MaxEpoch = 2
    MaxTurns = 2
    MaxAttempt = 2
    NoC = noc
    NoWorker = noworker
    NoCas = nocas
    DispatchBeforeIntent = FALSE
    AmbiguousManualAttemptRetried = FALSE
    StepInputDrift = FALSE
    AuthorizeIgnoresCancelRequest = FALSE
    LateResultOverwrites = TRUE
    CommitWhileInDoubt = FALSE
    ProviderReauthorizes = FALSE
    OlderResultRecorded = FALSE
    CancelledResultRecorded = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT StepTranscriptCompatible
CHECK_DEADLOCK FALSE
