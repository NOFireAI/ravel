\* module: MCAgentEffects
\* Mutant: the owner authorizes the journaled intent although the root
\* carries a cancel request on the turn. Must violate CancellationRespected
\* (exit 12). Smoke bounds.
CONSTANTS
    Workers = {w1, w2}
    Admin = admin
    Policies = {"provider_idempotency", "at_least_once", "manual"}
    Hashes = {h1}
    MaxEpoch = 2
    MaxTurns = 2
    MaxAttempt = 2
    NoC = noc
    NoWorker = noworker
    NoCas = nocas
    DispatchBeforeIntent = FALSE
    AmbiguousManualAttemptRetried = FALSE
    StepInputDrift = FALSE
    AuthorizeIgnoresCancelRequest = TRUE
    LateResultOverwrites = FALSE
    CommitWhileInDoubt = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT CancellationRespected
CHECK_DEADLOCK FALSE
