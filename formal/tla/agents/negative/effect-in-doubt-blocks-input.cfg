\* module: MCAgentEffects
\* Liveness probe: every switch off, manual only, under MCFairSpec. An
\* effect in doubt blocks its input until an admin reconciles it, and the
\* admin is not fair, so InputEventuallySettled (the liveness property
\* without the blocked terminals) must be violated (exit 13). Live bounds.
CONSTANTS
    Workers = {w1}
    Admin = admin
    Policies = {"manual"}
    Hashes = {h1}
    MaxEpoch = 1
    MaxTurns = 2
    MaxAttempt = 2
    NoC = noc
    NoWorker = noworker
    NoCas = nocas
    DispatchBeforeIntent = FALSE
    AmbiguousManualAttemptRetried = FALSE
    StepInputDrift = FALSE
    AuthorizeIgnoresCancelRequest = FALSE
    LateResultOverwrites = FALSE
    CommitWhileInDoubt = FALSE
    ProviderReauthorizes = FALSE
    OlderResultRecorded = FALSE
    CancelledResultRecorded = FALSE
SPECIFICATION MCFairSpec
PROPERTY InputEventuallySettled
CHECK_DEADLOCK FALSE
