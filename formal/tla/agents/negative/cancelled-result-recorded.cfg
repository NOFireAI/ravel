\* module: MCAgentEffects
\* Mutant: the result endpoint records a result for an effect whose input
\* was cancelled instead of answering LateResultIgnored. Must violate
\* CancellationRespected (exit 12). Smoke bounds with all three policies.
CONSTANTS
    Workers = {w1, w2}
    Admin = admin
    Policies = {"provider_idempotency", "at_least_once", "manual"}
    Hashes = {h1}
    MaxEpoch = 2
    MaxTurns = 2
    MaxAttempt = 2
    NoC = noc
    NoWorker = noworker
    NoCas = nocas
    DispatchBeforeIntent = FALSE
    AmbiguousManualAttemptRetried = FALSE
    StepInputDrift = FALSE
    AuthorizeIgnoresCancelRequest = FALSE
    LateResultOverwrites = FALSE
    CommitWhileInDoubt = FALSE
    ProviderReauthorizes = FALSE
    OlderResultRecorded = FALSE
    CancelledResultRecorded = TRUE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT CancellationRespected
CHECK_DEADLOCK FALSE
