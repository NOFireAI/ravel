\* module: MCAgentIntegrated
\* Probe: the enqueue response is lost and the client is answered by the
\* re-read that finds its receipt (Resolve). ResolvedUnreachable must be
\* reported violated (exit 12). Smoke bounds.
CONSTANTS
    Workers = {w1, w2}
    Client = c1
    Policies = {"provider_idempotency", "at_least_once", "manual"}
    MaxEpoch = 2
    MaxAttempt = 2
    MaxTimerGen = 0
    Payload = p1
    TimerMsg = tmsg
    NoC = noc
    NoWorker = noworker
    NoHandle = nohandle
    NoCas = nocas
    AckBeforeCas = FALSE
    ResolveTrustsUnknown = FALSE
    SweepOverwritesHead = FALSE
    DispatchBeforeIntent = FALSE
    CompleteIgnoresCancel = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT ResolvedUnreachable
CHECK_DEADLOCK FALSE
