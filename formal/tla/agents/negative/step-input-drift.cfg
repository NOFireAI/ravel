\* module: MCAgentEffects
\* Mutant: a replay that computes another input hash rewrites the step
\* record instead of blocking the turn. Must violate
\* StepTranscriptCompatible (exit 12). Smoke bounds with two input hashes.
CONSTANTS
    Workers = {w1, w2}
    Admin = admin
    Policies = {"provider_idempotency", "at_least_once", "manual"}
    Hashes = {h1, h2}
    MaxEpoch = 2
    MaxTurns = 2
    MaxAttempt = 2
    NoC = noc
    NoWorker = noworker
    NoCas = nocas
    DispatchBeforeIntent = FALSE
    AmbiguousManualAttemptRetried = FALSE
    StepInputDrift = TRUE
    AuthorizeIgnoresCancelRequest = FALSE
    LateResultOverwrites = FALSE
    CommitWhileInDoubt = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT StepTranscriptCompatible
CHECK_DEADLOCK FALSE
