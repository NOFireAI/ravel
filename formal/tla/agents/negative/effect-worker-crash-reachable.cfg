\* module: MCAgentEffects
\* Probe: every switch off. A worker crash with an operation in flight or a
\* provider response unrecorded is reachable, so CrashUnreachable must be
\* violated (exit 12). Smoke bounds.
CONSTANTS
    Workers = {w1, w2}
    Admin = admin
    Policies = {"provider_idempotency", "at_least_once", "manual"}
    Hashes = {h1}
    MaxEpoch = 2
    MaxTurns = 2
    MaxAttempt = 2
    NoC = noc
    NoWorker = noworker
    NoCas = nocas
    DispatchBeforeIntent = FALSE
    AmbiguousManualAttemptRetried = FALSE
    StepInputDrift = FALSE
    AuthorizeIgnoresCancelRequest = FALSE
    LateResultOverwrites = FALSE
    CommitWhileInDoubt = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT CrashUnreachable
CHECK_DEADLOCK FALSE
