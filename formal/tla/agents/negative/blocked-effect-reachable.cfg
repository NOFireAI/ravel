\* module: MCAgentEffects
\* Probe: every switch off, manual only. A manual attempt whose dispatcher
\* lost the response goes in doubt at the owner's next authorization, so
\* BlockedEffectUnreachable must be violated (exit 12). Smoke bounds.
CONSTANTS
    Workers = {w1, w2}
    Admin = admin
    Policies = {"manual"}
    Hashes = {h1}
    MaxEpoch = 2
    MaxTurns = 2
    MaxAttempt = 2
    NoC = noc
    NoWorker = noworker
    NoCas = nocas
    DispatchBeforeIntent = FALSE
    AmbiguousManualAttemptRetried = FALSE
    StepInputDrift = FALSE
    AuthorizeIgnoresCancelRequest = FALSE
    LateResultOverwrites = FALSE
    CommitWhileInDoubt = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT BlockedEffectUnreachable
CHECK_DEADLOCK FALSE
