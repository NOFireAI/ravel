\* module: MCAgentIntegrated
\* Mutant: the sweep fires the generation it read with an unconditional PUT
\* of the HEAD it read, not a CAS on that version. Must violate
\* NoLostConcurrentEnqueue (exit 12). Timer race bounds.
CONSTANTS
    Workers = {w1}
    Client = c1
    Policies = {"at_least_once", "manual"}
    MaxEpoch = 1
    MaxAttempt = 2
    MaxTimerGen = 1
    Payload = p1
    TimerMsg = tmsg
    NoC = noc
    NoWorker = noworker
    NoHandle = nohandle
    NoCas = nocas
    AckBeforeCas = FALSE
    ResolveTrustsUnknown = FALSE
    SweepOverwritesHead = TRUE
    DispatchBeforeIntent = FALSE
    CompleteIgnoresCancel = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT NoLostConcurrentEnqueue
CHECK_DEADLOCK FALSE
