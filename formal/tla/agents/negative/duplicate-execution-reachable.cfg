\* module: MCAgentEffects
\* Probe: every switch off, at_least_once only. A lost response followed by
\* a second authorization executes the effect twice at the provider, which
\* the policy allows, so DuplicateExecutionUnreachable must be violated
\* (exit 12). Smoke bounds.
CONSTANTS
    Workers = {w1, w2}
    Admin = admin
    Policies = {"at_least_once"}
    Hashes = {h1}
    MaxEpoch = 2
    MaxTurns = 2
    MaxAttempt = 2
    NoC = noc
    NoWorker = noworker
    NoCas = nocas
    DispatchBeforeIntent = FALSE
    AmbiguousManualAttemptRetried = FALSE
    StepInputDrift = FALSE
    AuthorizeIgnoresCancelRequest = FALSE
    LateResultOverwrites = FALSE
    CommitWhileInDoubt = FALSE
    ProviderReauthorizes = FALSE
    OlderResultRecorded = FALSE
    CancelledResultRecorded = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT DuplicateExecutionUnreachable
CHECK_DEADLOCK FALSE
