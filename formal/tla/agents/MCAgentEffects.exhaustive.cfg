\* Exhaustive safety model for AgentEffects: the smoke bounds with two input
\* hashes, so a handler replay may drift and block the turn. All three
\* policies, takeover, crash, lost responses, the result endpoint, cancel and
\* admin reconciliation are on. Liveness runs in MCAgentEffects.live.cfg,
\* which cannot use VIEW or SYMMETRY and so runs at one worker.
\* VIEW and SYMMETRY are sound for invariants only (see MCAgentEffects).
CONSTANTS
    Workers = {w1, w2}
    Admin = admin
    Policies = {"provider_idempotency", "at_least_once", "manual"}
    Hashes = {h1, h2}
    MaxEpoch = 2
    MaxTurns = 2
    MaxAttempt = 2
    NoC = noc
    NoWorker = noworker
    NoCas = nocas
    DispatchBeforeIntent = FALSE
    AmbiguousManualAttemptRetried = FALSE
    StepInputDrift = FALSE
    AuthorizeIgnoresCancelRequest = FALSE
    LateResultOverwrites = FALSE
    CommitWhileInDoubt = FALSE
    ProviderReauthorizes = FALSE
    OlderResultRecorded = FALSE
    CancelledResultRecorded = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT StepTranscriptCompatible
INVARIANT DispatchRequiresCommittedAuthorization
INVARIANT PolicyControlsRedispatch
INVARIANT EffectResultFromExecution
INVARIANT CancellationRespected
CHECK_DEADLOCK FALSE
