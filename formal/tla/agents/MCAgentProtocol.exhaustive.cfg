\* Exhaustive model for AgentProtocol: safety and liveness under MCFairSpec,
\* every switch off. No VIEW and no SYMMETRY: both are sound for invariants
\* only. One client and MaxRevision 4 keep the run near four minutes (362,907
\* distinct states, depth 27, measured 2026-10-27 with 2 workers); two
\* clients competing for one HEAD are checked by the smoke config, which has
\* timers off. Timers, takeover, crash and lost responses are on here.
CONSTANTS
    Tenants = {t1}
    Agents = {a1}
    Clients = {c1}
    Workers = {w1, w2}
    Inputs = {i1}
    RequestIds = {r1}
    Hashes = {h1}
    MaxRevision = 4
    MaxEpoch = 2
    MaxTimerGen = 1
    NoC = noc
    NoWorker = noworker
    NoHandle = nohandle
    NoCas = nocas
    TimerMsg = timermsg
    AckBeforeCas = FALSE
    HeadBeforeDependency = FALSE
    OverwriteStaleRoot = FALSE
    EpochCheckedOutsideCas = FALSE
    CursorWithoutResult = FALSE
    RequestHashMismatchAccepted = FALSE
    ReceiptDiscarded = FALSE
    StaleTimerGenerationFired = FALSE
    EarlyHintForgotten = FALSE
    StaleTurnRebase = FALSE
SPECIFICATION MCFairSpec
INVARIANT OneLogicalCompletion
INVARIANT TurnCommitAtomic
INVARIANT NoLostConcurrentEnqueue
INVARIANT RequestIdentityStable
INVARIANT PublishedReferencesComplete
INVARIANT AcceptedImpliesRecoverable
INVARIANT NoStaleOwnerCommit
INVARIANT CancellationRespected
INVARIANT TimerGenerationDeliveredOnce
INVARIANT MonotonicIdentity
INVARIANT TenantIncarnationIsolation
PROPERTY InputEventuallyResolved
PROPERTY DueTimerEventuallyDelivered
CHECK_DEADLOCK FALSE
