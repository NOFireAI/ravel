\* Exhaustive safety model for AgentIntegrated: the smoke bounds with one
\* timer generation, so takeover, the tool step under all three policies,
\* the client's cancel, and the timer's schedule, cancel, hint and sweep all
\* race on one HEAD. Liveness runs in MCAgentIntegrated.live.cfg.
\* VIEW and SYMMETRY are sound for invariants only (see MCAgentIntegrated).
CONSTANTS
    Workers = {w1, w2}
    Client = c1
    Policies = {"provider_idempotency", "at_least_once", "manual"}
    MaxEpoch = 2
    MaxAttempt = 2
    MaxTimerGen = 1
    Payload = p1
    TimerMsg = tmsg
    NoC = noc
    NoWorker = noworker
    NoHandle = nohandle
    NoCas = nocas
    AckBeforeCas = FALSE
    ResolveTrustsUnknown = FALSE
    SweepOverwritesHead = FALSE
    DispatchBeforeIntent = FALSE
    CompleteIgnoresCancel = FALSE
SPECIFICATION MCSpec
VIEW View
SYMMETRY WorkerSymmetry
INVARIANT AcceptedImpliesRecoverable
INVARIANT PublishedReferencesComplete
INVARIANT RequestIdentityStable
INVARIANT OneLogicalCompletion
INVARIANT TurnCommitAtomic
INVARIANT NoStaleOwnerCommit
INVARIANT NoLostConcurrentEnqueue
INVARIANT MonotonicIdentity
INVARIANT TimerGenerationDeliveredOnce
INVARIANT StepTranscriptCompatible
INVARIANT DispatchRequiresCommittedAuthorization
INVARIANT PolicyControlsRedispatch
INVARIANT EffectResultFromExecution
INVARIANT CancellationRespected
CHECK_DEADLOCK FALSE
