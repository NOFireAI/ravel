\* Smoke model for CatalogMVCC: safety only, small bounds, folder symmetry.
\* EnableDeletePathCorruption = TRUE: this is the config that exercises
\* CorruptHeadFailsClosedOnDeletePaths against all three fail-closed triggers
\* together (HEAD-status, covering-part, entry-identity). exhaustive.cfg sets
\* it FALSE to fit its 60-minute ceiling; see the comment there and
\* results.md (issue #1121 round four).
CONSTANTS
    Keys = {hk}
    Content = {hd, nc}
    NoContent = nc
    Clients = {f1}
    Hours = {0, 1}
    Records = {rA}
    CompIds = {g1}
    MaxClock = 3
    MaxOps = 2
    FoldSealDelay = 1
    MaintSealDelay = 0
    ProtectionHorizon = 1
    RetentionHorizon = 2
    LagBound = 1
    DedupBySignal = TRUE
    HeadNamesUnwrittenPart = FALSE
    CompactionSwapsRecord = FALSE
    ReconcileOnTick = FALSE
    SnapshotChangesMidAttempt = FALSE
    DropMetricsDedup = FALSE
    SweepSupersededNoHeadGate = FALSE
    LostCasProceedsOnStaleRead = FALSE
    CompactionLoserOverwrites = FALSE
    QueryFailsClosedOnMissingIndex = FALSE
    DeletePathIgnoresUnreadableHead = FALSE
    DeletePathIgnoresUnreadablePart = FALSE
    DeletePathIgnoresUndecodableEntry = FALSE
    FoldNamesEntryAboveWatermark = FALSE
    FoldIncludesTombstonedEntries = FALSE
    EnableDeletePathCorruption = TRUE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT HeadNamesOnlyCompleteParts
INVARIANT CompactionPreservesMultiset
INVARIANT CompactionRecordImmutable
INVARIANT ReconcileOnlyOnWatermarkAdvance
INVARIANT SnapshotEntriesBelowWatermark
INVARIANT PinnedSnapshotStableWithinAttempt
INVARIANT NoLiveCommitOmittedByLostCas
INVARIANT MissingIndexDegradesToListing
INVARIANT CorruptHeadFailsClosedOnDeletePaths
INVARIANT TombstonedBucketContributesNothing
INVARIANT SignalDedupContract
INVARIANT HeadNamedObjectNeverDeleted
