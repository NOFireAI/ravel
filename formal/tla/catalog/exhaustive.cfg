\* Exhaustive model for CatalogMVCC: every named safety invariant plus the
\* QueryTerminates liveness property under FairSpec. No symmetry, so liveness is
\* checked soundly. Two compaction identities keep the two-input-set dedup
\* conflict non-vacuous. A single folder keeps the fold-interleaving diameter
\* inside the 45-minute budget; the version-matched HEAD CAS is still exercised
\* without a second modeled folder, because DoRivalFoldWin lets a concurrent rival
\* advance the HEAD watermark and bump its object version under an in-flight fold,
\* so that fold finds its base version stale and takes the losing branch (HEAD
\* untouched, folder rebases). LateSupersessionEventuallyReflected is a recorded
\* shrink (finite-model liveness limitation, not checked here); see
\* counterexamples/late-supersession-shrink.md.
CONSTANTS
    Keys = {hk}
    Content = {hd, nc}
    NoContent = nc
    Clients = {f1}
    Hours = {0, 1}
    Records = {rA, rB}
    CompIds = {g1, g2}
    MaxClock = 3
    MaxOps = 2
    FoldSealDelay = 1
    MaintSealDelay = 0
    ProtectionHorizon = 1
    RetentionHorizon = 2
    LagBound = 1
    DedupBySignal = TRUE
    HeadNamesUnwrittenPart = FALSE
    CompactionSwapsRecord = FALSE
    ReconcileOnTick = FALSE
    SnapshotChangesMidAttempt = FALSE
    DropMetricsDedup = FALSE
    SweepSupersededNoHeadGate = FALSE
    LostCasProceedsOnStaleRead = FALSE
    CompactionLoserOverwrites = FALSE
    QueryFailsClosedOnMissingIndex = FALSE
    DeletePathIgnoresUnreadableHead = FALSE
    DeletePathIgnoresUnreadablePart = FALSE
    DeletePathIgnoresUndecodableEntry = FALSE
    FoldNamesEntryAboveWatermark = FALSE
    FoldIncludesTombstonedEntries = FALSE
CHECK_DEADLOCK FALSE
SPECIFICATION FairSpec
INVARIANT TypeOK
INVARIANT HeadNamesOnlyCompleteParts
INVARIANT CompactionPreservesMultiset
INVARIANT CompactionRecordImmutable
INVARIANT ReconcileOnlyOnWatermarkAdvance
INVARIANT SnapshotEntriesBelowWatermark
INVARIANT PinnedSnapshotStableWithinAttempt
INVARIANT NoLiveCommitOmittedByLostCas
INVARIANT MissingIndexDegradesToListing
INVARIANT CorruptHeadFailsClosedOnDeletePaths
INVARIANT TombstonedBucketContributesNothing
INVARIANT SignalDedupContract
INVARIANT HeadNamedObjectNeverDeleted
PROPERTY QueryTerminates
