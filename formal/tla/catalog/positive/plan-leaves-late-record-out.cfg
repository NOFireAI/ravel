\* module: MCCatalogMVCC
\* The late-commit fence (ADR-4561 R4) at the bounds of
\* negative/plan-takes-late-record.cfg, with PlanTakesLateRecord off. smoke.cfg
\* and exhaustive.cfg spend their two publishes on commits, or on one commit
\* and its compaction, so neither reaches a compaction of an hour that holds a
\* late record beside an on-time one. Here a third publish does:
\* negative/late-record-left-out-nonvacuity.cfg, over the same bounds, shows
\* a compaction record that leaves out a late record of its hour is reached.
\* Every catalog safety invariant is checked. One hour is enough for the
\* fence, which acts on each hour alone; at two hours the graph is 16168394
\* distinct states and 643 s on two workers, past the positive lane's 300 s.
CONSTANTS
    Keys = {hk}
    Content = {hd, nc}
    NoContent = nc
    Clients = {f1}
    Hours = {0}
    Records = {rA, rB}
    CompIds = {g1}
    MaxClock = 3
    MaxOps = 3
    FoldSealDelay = 1
    MaintSealDelay = 0
    ProtectionHorizon = 1
    RetentionHorizon = 2
    LagBound = 1
    DedupBySignal = TRUE
    HeadNamesUnwrittenPart = FALSE
    CompactionSwapsRecord = FALSE
    ReconcileOnTick = FALSE
    SnapshotChangesMidAttempt = FALSE
    DropMetricsDedup = FALSE
    SweepSupersededNoHeadGate = FALSE
    LostCasProceedsOnStaleRead = FALSE
    CompactionLoserOverwrites = FALSE
    QueryFailsClosedOnMissingIndex = FALSE
    DeletePathIgnoresUnreadableHead = FALSE
    DeletePathIgnoresUnreadablePart = FALSE
    DeletePathIgnoresUndecodableEntry = FALSE
    FoldNamesEntryAboveWatermark = FALSE
    FoldIncludesTombstonedEntries = FALSE
    PlanTakesLateRecord = FALSE
    EnableDeletePathCorruption = FALSE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT HeadNamesOnlyCompleteParts
INVARIANT CompactionPreservesMultiset
INVARIANT CompactionRecordImmutable
INVARIANT ReconcileOnlyOnWatermarkAdvance
INVARIANT SnapshotEntriesBelowWatermark
INVARIANT PinnedSnapshotStableWithinAttempt
INVARIANT NoLiveCommitOmittedByLostCas
INVARIANT MissingIndexDegradesToListing
INVARIANT CorruptHeadFailsClosedOnDeletePaths
INVARIANT TombstonedBucketContributesNothing
INVARIANT SignalDedupContract
INVARIANT DedupPreservesCoverage
INVARIANT HeadNamedObjectNeverDeleted
INVARIANT PlanLeavesLateRecordsOut
