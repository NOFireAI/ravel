\* module: MCCatalogMVCC
\* Carry-forward safety model: three hours so a valid HEAD can be folded at
\* successive watermarks, which makes the bounded incremental fold carry the prior
\* snapshot's low hours forward (IncrementalFoldEntries carry branch) instead of
\* collapsing to a full rescan the way the two-hour smoke bounds do. Both seal
\* delays are zero here so all three hours seal within a MaxClock of 3; the
\* compact-strictly-before-fold gap (FoldSealDelay = 1) is a smoke and exhaustive
\* concern and is orthogonal to carry-forward, which depends only on the fold
\* watermark advancing across successive folds. Exercises the full safety
\* invariant set under real carry-forward; a superseded input that has left the
\* reconcile window stays named by HEAD, and HeadNamedObjectNeverDeleted must
\* still hold because the object-granular HEAD-gated sweep keeps it. Safety only,
\* no fairness. Non-vacuity of the carry-forward branch itself is recorded by the
\* paired carryforward-nonvacuity control. See #7 in results.md.
CONSTANTS
    Keys = {hk}
    Content = {hd, nc}
    NoContent = nc
    Clients = {f1}
    Hours = {0, 1, 2}
    Records = {rA}
    CompIds = {g1}
    MaxClock = 3
    MaxOps = 2
    FoldSealDelay = 0
    MaintSealDelay = 0
    ProtectionHorizon = 1
    RetentionHorizon = 2
    LagBound = 2
    DedupBySignal = TRUE
    HeadNamesUnwrittenPart = FALSE
    CompactionSwapsRecord = FALSE
    ReconcileOnTick = FALSE
    SnapshotChangesMidAttempt = FALSE
    DropMetricsDedup = FALSE
    SweepSupersededNoHeadGate = FALSE
    LostCasProceedsOnStaleRead = FALSE
    CompactionLoserOverwrites = FALSE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT HeadNamesOnlyCompleteParts
INVARIANT CompactionPreservesMultiset
INVARIANT CompactionRecordImmutable
INVARIANT ReconcileOnlyOnWatermarkAdvance
INVARIANT SnapshotEntriesBelowWatermark
INVARIANT PinnedSnapshotStableWithinAttempt
INVARIANT NoLiveCommitOmittedByLostCas
INVARIANT MissingIndexDegradesToListing
INVARIANT CorruptHeadFailsClosedOnDeletePaths
INVARIANT TombstonedBucketContributesNothing
INVARIANT SignalDedupContract
INVARIANT HeadNamedObjectNeverDeleted
