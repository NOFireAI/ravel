\* module: MCCatalogMVCC
\* Overlapping-L1-output safety model (issue #1121 round six): a third record
\* and a wider MaxOps than smoke/exhaustive so the same record identity can be
\* committed into two different hours (DoCommit only checks the current
\* hour's l0 set) and separately compacted in each, giving two published L1
\* records whose out sets overlap (one names {rA, rB}, the other {rB, rC}) --
\* the case smoke.cfg and exhaustive.cfg cannot reach at their bounds. Full
\* safety invariant set, including SignalDedupContract and
\* DedupPreservesCoverage. Paired non-vacuity probe:
\* negative/overlap-nonvacuity.cfg, same bounds, checks NoOverlappingL1Output.
\* Safety only, no fairness.
CONSTANTS
    Keys = {hk}
    Content = {hd, nc}
    NoContent = nc
    Clients = {f1}
    Hours = {0, 1}
    Records = {rA, rB, rC}
    CompIds = {g1}
    MaxClock = 3
    MaxOps = 6
    FoldSealDelay = 1
    MaintSealDelay = 0
    ProtectionHorizon = 1
    RetentionHorizon = 2
    LagBound = 1
    DedupBySignal = TRUE
    HeadNamesUnwrittenPart = FALSE
    CompactionSwapsRecord = FALSE
    ReconcileOnTick = FALSE
    SnapshotChangesMidAttempt = FALSE
    DropMetricsDedup = FALSE
    SweepSupersededNoHeadGate = FALSE
    LostCasProceedsOnStaleRead = FALSE
    CompactionLoserOverwrites = FALSE
    QueryFailsClosedOnMissingIndex = FALSE
    DeletePathIgnoresUnreadableHead = FALSE
    DeletePathIgnoresUnreadablePart = FALSE
    DeletePathIgnoresUndecodableEntry = FALSE
    FoldNamesEntryAboveWatermark = FALSE
    FoldIncludesTombstonedEntries = FALSE
    EnableDeletePathCorruption = FALSE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT HeadNamesOnlyCompleteParts
INVARIANT CompactionPreservesMultiset
INVARIANT CompactionRecordImmutable
INVARIANT ReconcileOnlyOnWatermarkAdvance
INVARIANT SnapshotEntriesBelowWatermark
INVARIANT PinnedSnapshotStableWithinAttempt
INVARIANT NoLiveCommitOmittedByLostCas
INVARIANT MissingIndexDegradesToListing
INVARIANT CorruptHeadFailsClosedOnDeletePaths
INVARIANT TombstonedBucketContributesNothing
INVARIANT SignalDedupContract
INVARIANT DedupPreservesCoverage
INVARIANT HeadNamedObjectNeverDeleted
