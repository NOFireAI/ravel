\* module: MCCatalogMVCC
\* Design-flaw control (issue #1134): no switch is flipped. sweep_superseded
\* carries no HEAD gate, so with a zero protection horizon it deletes an L0
\* input that a still current HEAD names before the fold catches up. Must
\* violate HeadNamedObjectNeverDeleted (safety, exit 12). This is an EXPECTED
\* failure recording the #1134 design flaw, not a protocol the model claims to
\* hold; see counterexamples/free-lag-head-dangling.md.
CONSTANTS
    Keys = {hk}
    Content = {hd, nc}
    NoContent = nc
    Clients = {f1}
    Hours = {0, 1}
    Records = {rA, rB}
    CompIds = {g1}
    MaxClock = 4
    MaxOps = 4
    FoldSealDelay = 1
    MaintSealDelay = 0
    ProtectionHorizon = 0
    RetentionHorizon = 2
    LagBound = 3
    DedupBySignal = TRUE
    HeadNamesUnwrittenPart = FALSE
    CompactionSwapsRecord = FALSE
    ReconcileOnTick = FALSE
    SnapshotChangesMidAttempt = FALSE
    DropMetricsDedup = FALSE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT HeadNamedObjectNeverDeleted
