\* module: MCCatalogMVCC
\* Negative control: a query with no readable index (DoLoseIndexPart takes the
\* HEAD-named snapshot part out of snapParts while HEAD stays valid) serves an
\* empty result instead of degrading to the direct listing
\* (QueryFailsClosedOnMissingIndex). Must violate MissingIndexDegradesToListing
\* (safety, exit 12): a live record is dropped from the served result instead
\* of being listed.
CONSTANTS
    Keys = {hk}
    Content = {hd, nc}
    NoContent = nc
    Clients = {f1}
    Hours = {0, 1}
    Records = {rA, rB}
    CompIds = {g1}
    MaxClock = 3
    MaxOps = 3
    FoldSealDelay = 1
    MaintSealDelay = 0
    ProtectionHorizon = 1
    RetentionHorizon = 2
    LagBound = 1
    DedupBySignal = TRUE
    HeadNamesUnwrittenPart = FALSE
    CompactionSwapsRecord = FALSE
    ReconcileOnTick = FALSE
    SnapshotChangesMidAttempt = FALSE
    DropMetricsDedup = FALSE
    SweepSupersededNoHeadGate = FALSE
    LostCasProceedsOnStaleRead = FALSE
    CompactionLoserOverwrites = FALSE
    QueryFailsClosedOnMissingIndex = TRUE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT MissingIndexDegradesToListing
