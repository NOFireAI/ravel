\* module: MCCatalogMVCC
\* Non-vacuity control for CorruptHeadFailsClosedOnDeletePaths's entry-identity
\* trigger (issue #1121 round four: exhaustive.cfg now sets
\* EnableDeletePathCorruption = FALSE to fit its budget, so this probe pins
\* that DoPoisonEntry is still reachable wherever the constant is TRUE).
\* Checking NoEntryUndecodable: MUST be violated (exit 12). DoPoisonEntry has
\* no precondition beyond EnableDeletePathCorruption and its own one-shot
\* flag, so smoke's bounds are more than enough; the violation is reached in
\* one step from Init.
CONSTANTS
    Keys = {hk}
    Content = {hd, nc}
    NoContent = nc
    Clients = {f1}
    Hours = {0, 1}
    Records = {rA}
    CompIds = {g1}
    MaxClock = 3
    MaxOps = 2
    FoldSealDelay = 1
    MaintSealDelay = 0
    ProtectionHorizon = 1
    RetentionHorizon = 2
    LagBound = 1
    DedupBySignal = TRUE
    HeadNamesUnwrittenPart = FALSE
    CompactionSwapsRecord = FALSE
    ReconcileOnTick = FALSE
    SnapshotChangesMidAttempt = FALSE
    DropMetricsDedup = FALSE
    SweepSupersededNoHeadGate = FALSE
    LostCasProceedsOnStaleRead = FALSE
    CompactionLoserOverwrites = FALSE
    QueryFailsClosedOnMissingIndex = FALSE
    DeletePathIgnoresUnreadableHead = FALSE
    DeletePathIgnoresUnreadablePart = FALSE
    DeletePathIgnoresUndecodableEntry = FALSE
    FoldNamesEntryAboveWatermark = FALSE
    FoldIncludesTombstonedEntries = FALSE
    EnableDeletePathCorruption = TRUE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT NoEntryUndecodable
