\* module: MCCatalogMVCC
\* Negative control: a folder that loses the HEAD CAS proceeds on its stale read
\* and overwrites HEAD with its own snapshot (LostCasProceedsOnStaleRead) instead
\* of re-reading and retrying. A concurrent rival (DoRivalFoldWin) has already
\* advanced HEAD to a higher watermark, so the loser's overwrite regresses the
\* watermark below a commit the winner published. Must violate
\* NoLiveCommitOmittedByLostCas (safety, exit 12).
\*
\* Bounds differ from the smoke config so the regression is reachable: the
\* watermark must advance between the loser's fold start and its CAS. That needs
\* a third hour to seal in between (Hours = 0..2, MaxClock = 4) and a protection
\* horizon of 2 so the CAS may land one tick after the start.
CONSTANTS
    Keys = {hk}
    Content = {hd, nc}
    NoContent = nc
    Clients = {f1}
    Hours = {0, 1, 2}
    Records = {rA, rB}
    CompIds = {g1}
    MaxClock = 4
    MaxOps = 3
    FoldSealDelay = 1
    MaintSealDelay = 0
    ProtectionHorizon = 2
    RetentionHorizon = 2
    LagBound = 1
    DedupBySignal = TRUE
    HeadNamesUnwrittenPart = FALSE
    CompactionSwapsRecord = FALSE
    ReconcileOnTick = FALSE
    SnapshotChangesMidAttempt = FALSE
    DropMetricsDedup = FALSE
    SweepSupersededNoHeadGate = FALSE
    LostCasProceedsOnStaleRead = TRUE
    CompactionLoserOverwrites = FALSE
    QueryFailsClosedOnMissingIndex = FALSE
    DeletePathIgnoresUnreadableHead = FALSE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT NoLiveCommitOmittedByLostCas
