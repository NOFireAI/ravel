\* module: MCCatalogMVCC
\* Negative control: a compactor that loses the CreateIfAbsent race (the record
\* already exists) overwrites the winner's published record with its own, later,
\* recomputation instead of reading the winner back and adopting it
\* (CompactionLoserOverwrites breaks resolve_already_exists). Must violate
\* CompactionRecordImmutable (safety, exit 12): the immutable L1 object was
\* mutated after publish.
CONSTANTS
    Keys = {hk}
    Content = {hd, nc}
    NoContent = nc
    Clients = {f1}
    Hours = {0, 1}
    Records = {rA, rB}
    CompIds = {g1}
    MaxClock = 3
    MaxOps = 3
    FoldSealDelay = 1
    MaintSealDelay = 0
    ProtectionHorizon = 1
    RetentionHorizon = 2
    LagBound = 1
    DedupBySignal = TRUE
    HeadNamesUnwrittenPart = FALSE
    CompactionSwapsRecord = FALSE
    ReconcileOnTick = FALSE
    SnapshotChangesMidAttempt = FALSE
    DropMetricsDedup = FALSE
    SweepSupersededNoHeadGate = FALSE
    LostCasProceedsOnStaleRead = FALSE
    CompactionLoserOverwrites = TRUE
    QueryFailsClosedOnMissingIndex = FALSE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT CompactionRecordImmutable
