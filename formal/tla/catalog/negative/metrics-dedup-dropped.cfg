\* module: MCCatalogMVCC
\* Negative control: a metrics query stops deduping by identity at read
\* (DropMetricsDedup) while the signal is still metrics (DedupBySignal TRUE).
\* Must violate SignalDedupContract (safety, exit 12). Two compaction records
\* over the same hour both serve the same identity, so the raw source count
\* reaches two; only the dedup collapses it to one. CompIds has two members so
\* that conflict is reachable.
CONSTANTS
    Keys = {hk}
    Content = {hd, nc}
    NoContent = nc
    Clients = {f1}
    Hours = {0, 1}
    Records = {rA, rB}
    CompIds = {g1, g2}
    MaxClock = 4
    MaxOps = 4
    FoldSealDelay = 1
    MaintSealDelay = 0
    ProtectionHorizon = 1
    RetentionHorizon = 2
    LagBound = 1
    DedupBySignal = TRUE
    HeadNamesUnwrittenPart = FALSE
    CompactionSwapsRecord = FALSE
    ReconcileOnTick = FALSE
    SnapshotChangesMidAttempt = FALSE
    DropMetricsDedup = TRUE
    SweepSupersededNoHeadGate = FALSE
    LostCasProceedsOnStaleRead = FALSE
    CompactionLoserOverwrites = FALSE
    QueryFailsClosedOnMissingIndex = FALSE
    DeletePathIgnoresUnreadableHead = FALSE
    FoldNamesEntryAboveWatermark = FALSE
    FoldIncludesTombstonedEntries = FALSE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT SignalDedupContract
