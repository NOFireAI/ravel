\* module: MCCatalogMVCC
\* Non-vacuity control for the ADR-0020 retention-frontier reconcile. Checking
\* NoFrontierReconcile: MUST be violated (exit 12). A reachable second,
\* watermark-advancing fold picks a below-floor hour into its frontier set
\* while that hour is already tombstoned, proving the nondeterministic
\* frontier choice in DoFoldStart / DoRivalFoldWin is exercised and not dead
\* code, so TombstonedBucketContributesNothing's frontierReconciled disjunct
\* is not vacuous.
CONSTANTS
    Keys = {hk}
    Content = {hd, nc}
    NoContent = nc
    Clients = {f1}
    Hours = {0, 1, 2}
    Records = {rA}
    CompIds = {g1}
    MaxClock = 4
    MaxOps = 2
    FoldSealDelay = 0
    MaintSealDelay = 0
    ProtectionHorizon = 2
    RetentionHorizon = 2
    LagBound = 1
    DedupBySignal = TRUE
    HeadNamesUnwrittenPart = FALSE
    CompactionSwapsRecord = FALSE
    ReconcileOnTick = FALSE
    SnapshotChangesMidAttempt = FALSE
    DropMetricsDedup = FALSE
    SweepSupersededNoHeadGate = FALSE
    LostCasProceedsOnStaleRead = FALSE
    CompactionLoserOverwrites = FALSE
    QueryFailsClosedOnMissingIndex = FALSE
    DeletePathIgnoresUnreadableHead = FALSE
    DeletePathIgnoresUnreadablePart = FALSE
    DeletePathIgnoresUndecodableEntry = FALSE
    FoldNamesEntryAboveWatermark = FALSE
    FoldIncludesTombstonedEntries = FALSE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT NoFrontierReconcile
