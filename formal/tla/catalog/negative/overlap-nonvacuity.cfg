\* module: MCCatalogMVCC
\* Non-vacuity control for the overlapping-L1-output case (issue #1121 round
\* six). Same bounds as overlap.cfg, checking NoOverlappingL1Output (no two
\* published L1 records in different hours ever share an output identity).
\* This MUST be violated (exit 12): record rB is committed into hour 0 and
\* separately into hour 1 (DoCommit only checks the current hour's l0 set),
\* each hour compacts on its own, and the two resulting L1 records both carry
\* rB in their out set, so the overlap the fixed Dedup must handle is genuinely
\* reached at these bounds, not merely definable.
CONSTANTS
    Keys = {hk}
    Content = {hd, nc}
    NoContent = nc
    Clients = {f1}
    Hours = {0, 1}
    Records = {rA, rB, rC}
    CompIds = {g1}
    MaxClock = 3
    MaxOps = 6
    FoldSealDelay = 1
    MaintSealDelay = 0
    ProtectionHorizon = 1
    RetentionHorizon = 2
    LagBound = 1
    DedupBySignal = TRUE
    HeadNamesUnwrittenPart = FALSE
    CompactionSwapsRecord = FALSE
    ReconcileOnTick = FALSE
    SnapshotChangesMidAttempt = FALSE
    DropMetricsDedup = FALSE
    SweepSupersededNoHeadGate = FALSE
    LostCasProceedsOnStaleRead = FALSE
    CompactionLoserOverwrites = FALSE
    QueryFailsClosedOnMissingIndex = FALSE
    DeletePathIgnoresUnreadableHead = FALSE
    DeletePathIgnoresUnreadablePart = FALSE
    DeletePathIgnoresUndecodableEntry = FALSE
    FoldNamesEntryAboveWatermark = FALSE
    FoldIncludesTombstonedEntries = FALSE
    EnableDeletePathCorruption = FALSE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT NoOverlappingL1Output
