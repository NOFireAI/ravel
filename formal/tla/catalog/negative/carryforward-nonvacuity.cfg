\* module: MCCatalogMVCC
\* Non-vacuity control for the bounded incremental fold. Same three-hour bounds as
\* carryforward.cfg, checking NoCarryForward (no fold ever carries a low hour
\* forward). This MUST be violated (exit 12): a reachable second fold advances the
\* watermark and carries the prior snapshot's hour-0 entries forward through
\* IncrementalFoldEntries, so the carry branch does real work and the paired
\* carryforward.cfg safety pass over these bounds is not vacuous.
CONSTANTS
    Keys = {hk}
    Content = {hd, nc}
    NoContent = nc
    Clients = {f1}
    Hours = {0, 1, 2}
    Records = {rA}
    CompIds = {g1}
    MaxClock = 3
    MaxOps = 2
    FoldSealDelay = 0
    MaintSealDelay = 0
    ProtectionHorizon = 1
    RetentionHorizon = 2
    LagBound = 2
    DedupBySignal = TRUE
    HeadNamesUnwrittenPart = FALSE
    CompactionSwapsRecord = FALSE
    ReconcileOnTick = FALSE
    SnapshotChangesMidAttempt = FALSE
    DropMetricsDedup = FALSE
    SweepSupersededNoHeadGate = FALSE
    LostCasProceedsOnStaleRead = FALSE
    CompactionLoserOverwrites = FALSE
    QueryFailsClosedOnMissingIndex = FALSE
    DeletePathIgnoresUnreadableHead = FALSE
    FoldNamesEntryAboveWatermark = FALSE
    FoldIncludesTombstonedEntries = FALSE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT NoCarryForward
