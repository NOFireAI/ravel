\* module: MCCatalogMVCC
\* Negative control: a query's pinned snapshot is repointed in the middle of one
\* attempt (SnapshotChangesMidAttempt). Must violate
\* PinnedSnapshotStableWithinAttempt (safety, exit 12): the snapshot a query
\* pinned changed underneath it before the attempt finished.
CONSTANTS
    Keys = {hk}
    Content = {hd, nc}
    NoContent = nc
    Clients = {f1}
    Hours = {0, 1}
    Records = {rA, rB}
    CompIds = {g1}
    MaxClock = 3
    MaxOps = 3
    FoldSealDelay = 1
    MaintSealDelay = 0
    ProtectionHorizon = 1
    RetentionHorizon = 2
    LagBound = 1
    DedupBySignal = TRUE
    HeadNamesUnwrittenPart = FALSE
    CompactionSwapsRecord = FALSE
    ReconcileOnTick = FALSE
    SnapshotChangesMidAttempt = TRUE
    DropMetricsDedup = FALSE
    SweepSupersededNoHeadGate = FALSE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT PinnedSnapshotStableWithinAttempt
