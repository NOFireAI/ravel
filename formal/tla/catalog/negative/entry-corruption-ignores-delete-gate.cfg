\* module: MCCatalogMVCC
\* Negative control: the superseded-input sweep drops its entry-identity guard
\* (DeletePathIgnoresUndecodableEntry) and proceeds while the covering entry's
\* identity is undecodable. Must violate CorruptHeadFailsClosedOnDeletePaths
\* (safety, exit 12): lastDelete records a real object removal that ran with
\* entryUndecodable set, which the real reachability gate
\* (crates/ravel-maintain/src/reachability.rs::SnapshotReachability::object_gate
\* via snapshot_object) never allows.
CONSTANTS
    Keys = {hk}
    Content = {hd, nc}
    NoContent = nc
    Clients = {f1}
    Hours = {0, 1}
    Records = {rA, rB}
    CompIds = {g1}
    MaxClock = 5
    MaxOps = 4
    FoldSealDelay = 1
    MaintSealDelay = 0
    ProtectionHorizon = 1
    RetentionHorizon = 2
    LagBound = 1
    DedupBySignal = TRUE
    HeadNamesUnwrittenPart = FALSE
    CompactionSwapsRecord = FALSE
    ReconcileOnTick = FALSE
    SnapshotChangesMidAttempt = FALSE
    DropMetricsDedup = FALSE
    SweepSupersededNoHeadGate = FALSE
    LostCasProceedsOnStaleRead = FALSE
    CompactionLoserOverwrites = FALSE
    QueryFailsClosedOnMissingIndex = FALSE
    DeletePathIgnoresUnreadableHead = FALSE
    DeletePathIgnoresUnreadablePart = FALSE
    DeletePathIgnoresUndecodableEntry = TRUE
    FoldNamesEntryAboveWatermark = FALSE
    FoldIncludesTombstonedEntries = FALSE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT CorruptHeadFailsClosedOnDeletePaths
