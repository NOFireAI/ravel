\* module: MCCatalogMVCC
\* Non-vacuity control for CorruptHeadFailsClosedOnDeletePaths's HEAD-status
\* trigger (issue #1121 round four: EnableDeletePathCorruption now gates the
\* covering-part and entry-identity triggers out of exhaustive.cfg's Next, so
\* this probe pins that the third, ungated trigger DoCorruptHead is still
\* reachable on its own, independent of any config that also carries the
\* other two). Checking NoHeadCorrupted: MUST be violated (exit 12). Same
\* bounds as negative/corrupt-head-ignores-delete-gate.cfg, which needs a
\* completed fold (head.status = "valid") before DoCorruptHead is enabled.
CONSTANTS
    Keys = {hk}
    Content = {hd, nc}
    NoContent = nc
    Clients = {f1}
    Hours = {0, 1}
    Records = {rA, rB}
    CompIds = {g1}
    MaxClock = 5
    MaxOps = 4
    FoldSealDelay = 1
    MaintSealDelay = 0
    ProtectionHorizon = 1
    RetentionHorizon = 2
    LagBound = 1
    DedupBySignal = TRUE
    HeadNamesUnwrittenPart = FALSE
    CompactionSwapsRecord = FALSE
    ReconcileOnTick = FALSE
    SnapshotChangesMidAttempt = FALSE
    DropMetricsDedup = FALSE
    SweepSupersededNoHeadGate = FALSE
    LostCasProceedsOnStaleRead = FALSE
    CompactionLoserOverwrites = FALSE
    QueryFailsClosedOnMissingIndex = FALSE
    DeletePathIgnoresUnreadableHead = FALSE
    DeletePathIgnoresUnreadablePart = FALSE
    DeletePathIgnoresUndecodableEntry = FALSE
    FoldNamesEntryAboveWatermark = FALSE
    FoldIncludesTombstonedEntries = FALSE
    EnableDeletePathCorruption = FALSE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT NoHeadCorrupted
