\* module: MCCatalogMVCC
\* Non-vacuity control for the widened compaction-loser outcome alphabet
\* (finding 6, ADR-1113 round two). Checking NoCompactionLoserDivergence: MUST
\* be violated (exit 12). A commit lands in l0[H] after the winner publishes
\* but before a losing retry rereads the record (the maintenance-seal window
\* before fold-seal), so the loser's recomputed input set diverges from the
\* winner's stored one and lastCompact.outcome = "diverged", proving the
\* STORE-derived converged/diverged split in DoCompactLoser is exercised and
\* not dead code.
CONSTANTS
    Keys = {hk}
    Content = {hd, nc}
    NoContent = nc
    Clients = {f1}
    Hours = {0, 1}
    Records = {rA, rB}
    CompIds = {g1}
    MaxClock = 3
    MaxOps = 3
    FoldSealDelay = 1
    MaintSealDelay = 0
    ProtectionHorizon = 1
    RetentionHorizon = 2
    LagBound = 1
    DedupBySignal = TRUE
    HeadNamesUnwrittenPart = FALSE
    CompactionSwapsRecord = FALSE
    ReconcileOnTick = FALSE
    SnapshotChangesMidAttempt = FALSE
    DropMetricsDedup = FALSE
    SweepSupersededNoHeadGate = FALSE
    LostCasProceedsOnStaleRead = FALSE
    CompactionLoserOverwrites = FALSE
    QueryFailsClosedOnMissingIndex = FALSE
    DeletePathIgnoresUnreadableHead = FALSE
    FoldNamesEntryAboveWatermark = FALSE
    FoldIncludesTombstonedEntries = FALSE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT NoCompactionLoserDivergence
