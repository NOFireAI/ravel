\* module: MCCatalogMVCC
\* Negative control: a HEAD-gated delete pass drops its head.status guard
\* (DeletePathIgnoresUnreadableHead) and proceeds while HEAD is corrupt or
\* unsupported. Must violate CorruptHeadFailsClosedOnDeletePaths (safety, exit
\* 12): lastDelete records a real object removal that ran under an unreadable
\* HEAD, which the real reachability gate
\* (crates/ravel-maintain/src/reachability.rs::SnapshotReachability::ensure_head,
\* and crates/ravel-maintain/src/sweep.rs::sweep_unreferenced_catalog_objects::read_head_reference
\* for the sweep with no part/entry concept of its own)
\* never allows.
CONSTANTS
    Keys = {hk}
    Content = {hd, nc}
    NoContent = nc
    Clients = {f1}
    Hours = {0, 1}
    Records = {rA, rB}
    CompIds = {g1}
    MaxClock = 5
    MaxOps = 4
    FoldSealDelay = 1
    MaintSealDelay = 0
    ProtectionHorizon = 1
    RetentionHorizon = 2
    LagBound = 1
    DedupBySignal = TRUE
    HeadNamesUnwrittenPart = FALSE
    CompactionSwapsRecord = FALSE
    ReconcileOnTick = FALSE
    SnapshotChangesMidAttempt = FALSE
    DropMetricsDedup = FALSE
    SweepSupersededNoHeadGate = FALSE
    LostCasProceedsOnStaleRead = FALSE
    CompactionLoserOverwrites = FALSE
    QueryFailsClosedOnMissingIndex = FALSE
    DeletePathIgnoresUnreadableHead = TRUE
    DeletePathIgnoresUnreadablePart = FALSE
    DeletePathIgnoresUndecodableEntry = FALSE
    FoldNamesEntryAboveWatermark = FALSE
    FoldIncludesTombstonedEntries = FALSE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT CorruptHeadFailsClosedOnDeletePaths
