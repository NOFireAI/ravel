\* module: MCCatalogMVCC
\* Negative control: a fold's scan drops its own e[2] <= w bound
\* (FoldNamesEntryAboveWatermark), admitting an entry from an hour it has not
\* sealed through. Must violate SnapshotEntriesBelowWatermark (safety, exit
\* 12): a published HEAD names a commit above the watermark it claims, which
\* would let a reader trust an unsealed hour as visible
\* (crates/ravel-catalog/src/fold.rs::sealed_watermark_hour).
CONSTANTS
    Keys = {hk}
    Content = {hd, nc}
    NoContent = nc
    Clients = {f1}
    Hours = {0, 1}
    Records = {rA, rB}
    CompIds = {g1}
    MaxClock = 3
    MaxOps = 3
    FoldSealDelay = 1
    MaintSealDelay = 0
    ProtectionHorizon = 1
    RetentionHorizon = 2
    LagBound = 1
    DedupBySignal = TRUE
    HeadNamesUnwrittenPart = FALSE
    CompactionSwapsRecord = FALSE
    ReconcileOnTick = FALSE
    SnapshotChangesMidAttempt = FALSE
    DropMetricsDedup = FALSE
    SweepSupersededNoHeadGate = FALSE
    LostCasProceedsOnStaleRead = FALSE
    CompactionLoserOverwrites = FALSE
    QueryFailsClosedOnMissingIndex = FALSE
    DeletePathIgnoresUnreadableHead = FALSE
    FoldNamesEntryAboveWatermark = TRUE
    FoldIncludesTombstonedEntries = FALSE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT SnapshotEntriesBelowWatermark
