\* module: MCCatalogMVCC
\* Reproducing config for the recorded shrink in late-supersession-shrink.md. Runs
\* the LateSupersessionEventuallyReflected liveness property under FairSpec at the
\* bounds the note cites (Hours = {0, 1}, MaxClock = 4, FoldSealDelay = 1,
\* MaintSealDelay = 0, ProtectionHorizon = 1). TLC reports the property violated
\* with the stuttering trace the note describes: a compaction that lands in an
\* already-folded final hour has no later watermark-advancing fold to reflect it in
\* a bounded clock. This is a finite-model liveness limitation, not a defect (the
\* stale window is safe by SignalDedupContract). Not run by any harness lane; it
\* backs the note's claim so the shrink is reproducible rather than asserted. TLC
\* reports "Temporal properties were violated", not an invariant violation, so this
\* config does not belong in the negative lane (which matches invariant violations).
CONSTANTS
    Keys = {hk}
    Content = {hd, nc}
    NoContent = nc
    Clients = {f1}
    Hours = {0, 1}
    Records = {rA, rB}
    CompIds = {g1}
    MaxClock = 4
    MaxOps = 3
    FoldSealDelay = 1
    MaintSealDelay = 0
    ProtectionHorizon = 1
    RetentionHorizon = 2
    LagBound = 1
    DedupBySignal = TRUE
    HeadNamesUnwrittenPart = FALSE
    CompactionSwapsRecord = FALSE
    ReconcileOnTick = FALSE
    SnapshotChangesMidAttempt = FALSE
    DropMetricsDedup = FALSE
    SweepSupersededNoHeadGate = FALSE
    LostCasProceedsOnStaleRead = FALSE
    CompactionLoserOverwrites = FALSE
    QueryFailsClosedOnMissingIndex = FALSE
    DeletePathIgnoresUnreadableHead = FALSE
    DeletePathIgnoresUnreadablePart = FALSE
    DeletePathIgnoresUndecodableEntry = FALSE
    FoldNamesEntryAboveWatermark = FALSE
    FoldIncludesTombstonedEntries = FALSE
    EnableDeletePathCorruption = FALSE
CHECK_DEADLOCK FALSE
SPECIFICATION FairSpec
PROPERTY LateSupersessionEventuallyReflected
