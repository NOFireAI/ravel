\* module: MCCommitProtocol
\* Liveness. FairSpec adds weak fairness on the store retry and the flush task
\* only. The property is a disjunction: durable, or stopped with an explicit
\* failure, because the retry budget and the flush lifetime are bounded.
CONSTANTS
    Writers = {w1}
    Shards = {s1}
    Contents = {c1}
    MaxRetries = 1
    FlushLifetime = 3
    MaxTicks = 3
    Signal = "logs"
    HasIdemKey = FALSE
    CommitBeforeData = FALSE
    SkipHashCompare = FALSE
    AckAtEnqueue = FALSE
    MarkerAfterFirstShard = FALSE
    RetryDedups = FALSE
CHECK_DEADLOCK FALSE
SPECIFICATION FairSpec
PROPERTY EveryPinnedFlushSettles
