\* module: MCCommitProtocol
\* Obligation, not a bug: the flush-lifetime deadline must be REACHABLE at the
\* exhaustive bounds, so TLC must report AbandonUnreachable violated. A green
\* run would mean every property about abandonment is vacuous at these bounds.
\* The constants are exhaustive.cfg's, which is what the obligation is about.
CONSTANTS
    Writers = {w1}
    Shards = {s1, s2}
    Contents = {c1, c2}
    MaxRetries = 0
    FlushLifetime = 1
    MaxTicks = 2
    Signal = "logs"
    HasIdemKey = TRUE
    CommitBeforeData = FALSE
    SkipHashCompare = FALSE
    AckAtEnqueue = FALSE
    MarkerAfterFirstShard = FALSE
    RetryDedups = FALSE
    QueryReadsDataDirectly = FALSE
    CheckQuery = FALSE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT AbandonUnreachable
