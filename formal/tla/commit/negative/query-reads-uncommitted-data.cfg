\* module: MCCommitProtocol
\* Negative control: QueryReadsDataDirectly = TRUE. Every other constant
\* matches smoke.cfg. The switch makes RunQuery include a flush whose data
\* object is present but whose commit record is not, which a flush reaches
\* in the ordinary "data" phase, so NoUncommittedDataVisible must fail.
CONSTANTS
    Writers = {w1}
    Shards = {s1}
    Contents = {c1, c2}
    MaxRetries = 0
    FlushLifetime = 1
    MaxTicks = 1
    Signal = "logs"
    HasIdemKey = TRUE
    CommitBeforeData = FALSE
    SkipHashCompare = FALSE
    AckAtEnqueue = FALSE
    MarkerAfterFirstShard = FALSE
    RetryDedups = FALSE
    QueryReadsDataDirectly = TRUE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT NoUncommittedDataVisible
