\* module: MCCommitProtocol
\* Obligation, not a bug: logs and spans are at-least-once, so a retry after a
\* lost acknowledgement with no idempotency key MUST be able to leave two
\* durable commit records of one content, and TLC must report
\* DuplicateUnreachable violated. dedup-mutant.cfg is the same configuration
\* with RetryDedups set, which makes this control stop firing; that pair is
\* what proves the control is not vacuous.
CONSTANTS
    Writers = {w1, w2}
    Shards = {s1}
    Contents = {c1, c2}
    MaxRetries = 1
    FlushLifetime = 2
    MaxTicks = 1
    Signal = "logs"
    HasIdemKey = FALSE
    CommitBeforeData = FALSE
    SkipHashCompare = FALSE
    AckAtEnqueue = FALSE
    MarkerAfterFirstShard = FALSE
    RetryDedups = FALSE
    QueryReadsDataDirectly = FALSE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT DuplicateUnreachable
