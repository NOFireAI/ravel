\* module: MCCommitProtocol
\* Obligation, not a bug: Ravel offers no cross-shard atomicity, so a state
\* with one shard's commit durable and another's not MUST be reachable and TLC
\* must report NoCrossShardAtomicityUnreachable violated. A green run would
\* mean the model had lost the behaviour.
CONSTANTS
    Writers = {w1}
    Shards = {s1, s2}
    Contents = {c1, c2}
    MaxRetries = 0
    FlushLifetime = 1
    MaxTicks = 2
    Signal = "logs"
    HasIdemKey = TRUE
    CommitBeforeData = FALSE
    SkipHashCompare = FALSE
    AckAtEnqueue = FALSE
    MarkerAfterFirstShard = FALSE
    RetryDedups = FALSE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT NoCrossShardAtomicityUnreachable
