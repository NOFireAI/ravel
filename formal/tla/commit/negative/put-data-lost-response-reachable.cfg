\* module: MCCommitProtocol
\* Obligation, not a bug: PutDataLostResponse must be REACHABLE once
\* MaxRetries > 0, or the coverage smoke.cfg exists to add is vacuous. TLC
\* must report PutDataLostResponseUnreachable violated. The constants are
\* smoke.cfg's, which is what the obligation is about.
CONSTANTS
    Writers = {w1}
    Shards = {s1}
    Contents = {c1, c2}
    MaxRetries = 1
    FlushLifetime = 1
    MaxTicks = 1
    Signal = "logs"
    HasIdemKey = TRUE
    CommitBeforeData = FALSE
    SkipHashCompare = FALSE
    AckAtEnqueue = FALSE
    MarkerAfterFirstShard = FALSE
    RetryDedups = FALSE
    QueryReadsDataDirectly = FALSE
    CheckQuery = TRUE
    CheckToken = TRUE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT PutDataLostResponseUnreachable
