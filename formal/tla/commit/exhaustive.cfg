\* Exhaustive model: the smoke bounds plus the retry budget and a longer
\* flush lifetime, so a lost response, its retry, and the deadline all fit in
\* one behaviour. Safety only; the liveness property and the two reachability
\* obligations have their own configurations.
CONSTANTS
    Writers = {w1}
    Shards = {s1, s2}
    Contents = {c1, c2}
    MaxRetries = 1
    FlushLifetime = 2
    MaxTicks = 2
    Signal = "logs"
    HasIdemKey = TRUE
    CommitBeforeData = FALSE
    SkipHashCompare = FALSE
    AckAtEnqueue = FALSE
    MarkerAfterFirstShard = FALSE
    RetryDedups = FALSE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoCommitWithoutData
INVARIANT NoUncommittedDataVisible
INVARIANT StrictAckImpliesDurable
INVARIANT OneIdentityOneContent
INVARIANT SplitBrainStopsTheShard
INVARIANT RetrySamePinnedFlushIdempotent
INVARIANT NoPublishAfterAbandon
INVARIANT MarkerImpliesAllShardsDurable
INVARIANT PartialReportingMatchesSignal
