\* Two-shard, two-content safety coverage: the smallest bounds that still
\* give cross-shard visibility, the marker and partial-reporting
\* invariants, and OneIdentityOneContent's identity-reuse case their
\* required interleavings. MaxRetries=0 here (not 1): at MaxRetries=1 this
\* cfg's state graph does not converge inside the harness's 3600-second
\* budget, so retry interleavings are covered instead by
\* negative/at-least-once-duplicate-reachable.cfg and dedup-mutant.cfg,
\* both at MaxRetries=1. See results.md for the non-completion figures.
CONSTANTS
    Writers = {w1}
    Shards = {s1, s2}
    Contents = {c1, c2}
    MaxRetries = 0
    FlushLifetime = 1
    MaxTicks = 2
    Signal = "logs"
    HasIdemKey = TRUE
    CommitBeforeData = FALSE
    SkipHashCompare = FALSE
    AckAtEnqueue = FALSE
    MarkerAfterFirstShard = FALSE
    RetryDedups = FALSE
    QueryReadsDataDirectly = FALSE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoCommitWithoutData
INVARIANT NoUncommittedDataVisible
INVARIANT StrictAckImpliesDurable
INVARIANT OneIdentityOneContent
INVARIANT SplitBrainStopsTheShard
INVARIANT RetrySamePinnedFlushIdempotent
INVARIANT NoPublishAfterAbandon
INVARIANT MarkerImpliesAllShardsDurable
INVARIANT PartialReportingMatchesSignal
INVARIANT TokenNeverServesStale
