\* Smoke model: one writer, one shard, two contents, no retry budget and a
\* one-tick flush lifetime. Fast safety coverage of the single-shard action
\* set; exhaustive.cfg carries the two-shard interleavings, including
\* cross-shard visibility and the retry and deadline interleavings.
CONSTANTS
    Writers = {w1}
    Shards = {s1}
    Contents = {c1, c2}
    MaxRetries = 0
    FlushLifetime = 1
    MaxTicks = 1
    Signal = "logs"
    HasIdemKey = TRUE
    CommitBeforeData = FALSE
    SkipHashCompare = FALSE
    AckAtEnqueue = FALSE
    MarkerAfterFirstShard = FALSE
    RetryDedups = FALSE
    QueryReadsDataDirectly = FALSE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoCommitWithoutData
INVARIANT NoUncommittedDataVisible
INVARIANT StrictAckImpliesDurable
INVARIANT OneIdentityOneContent
INVARIANT SplitBrainStopsTheShard
INVARIANT RetrySamePinnedFlushIdempotent
INVARIANT NoPublishAfterAbandon
INVARIANT MarkerImpliesAllShardsDurable
INVARIANT PartialReportingMatchesSignal
INVARIANT TokenNeverServesStale
