\* Smoke model: one writer, two shards, two contents, no retry budget and a
\* one-tick flush lifetime. Fast safety coverage of the whole action set;
\* exhaustive.cfg adds the retry and deadline interleavings.
CONSTANTS
    Writers = {w1}
    Shards = {s1, s2}
    Contents = {c1, c2}
    MaxRetries = 0
    FlushLifetime = 1
    MaxTicks = 2
    Signal = "logs"
    HasIdemKey = TRUE
    CommitBeforeData = FALSE
    SkipHashCompare = FALSE
    AckAtEnqueue = FALSE
    MarkerAfterFirstShard = FALSE
    RetryDedups = FALSE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoCommitWithoutData
INVARIANT NoUncommittedDataVisible
INVARIANT StrictAckImpliesDurable
INVARIANT OneIdentityOneContent
INVARIANT SplitBrainStopsTheShard
INVARIANT RetrySamePinnedFlushIdempotent
INVARIANT NoPublishAfterAbandon
INVARIANT MarkerImpliesAllShardsDurable
INVARIANT PartialReportingMatchesSignal
