\* Smoke model: one writer, one shard, two contents, a one-retry budget and a
\* one-tick flush lifetime. Fast safety coverage of the single-shard action
\* set, now including the retry actions (PutDataLostResponse,
\* PutCommitLostResponse, TransientFailure), which are unreachable at
\* MaxRetries=0: this is the only configuration that checks the full safety
\* invariant list with retries enabled. exhaustive.cfg carries the two-shard
\* interleavings, including cross-shard visibility and the deadline
\* interleavings, at MaxRetries=0: at MaxRetries=1 its state graph does not
\* converge inside the harness budget. negative/at-least-once-duplicate-
\* reachable.cfg and dedup-mutant.cfg also run at MaxRetries=1, but only
\* against DuplicateUnreachable, not the full safety list.
CONSTANTS
    Writers = {w1}
    Shards = {s1}
    Contents = {c1, c2}
    MaxRetries = 1
    FlushLifetime = 1
    MaxTicks = 1
    Signal = "logs"
    HasIdemKey = TRUE
    CommitBeforeData = FALSE
    SkipHashCompare = FALSE
    AckAtEnqueue = FALSE
    MarkerAfterFirstShard = FALSE
    RetryDedups = FALSE
    QueryReadsDataDirectly = FALSE
    CheckQuery = TRUE
    CheckToken = TRUE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT NoCommitWithoutData
INVARIANT NoUncommittedDataVisible
INVARIANT StrictAckImpliesDurable
INVARIANT OneIdentityOneContent
INVARIANT SplitBrainStopsTheShard
INVARIANT RetrySamePinnedFlushIdempotent
INVARIANT NoPublishAfterAbandon
INVARIANT MarkerImpliesAllShardsDurable
INVARIANT PartialReportingMatchesSignal
INVARIANT TokenNeverServesStale
