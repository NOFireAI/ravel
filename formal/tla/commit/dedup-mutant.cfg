\* module: MCCommitProtocol
\* NOT a negative control: this is the mutation that proves
\* negative/at-least-once-duplicate-reachable.cfg is not vacuous. Identical to
\* it but for RetryDedups = TRUE, which makes the duplicate unreachable, so
\* TLC reports NO violation and exits 0. The harness's negative lane accepts
\* only a must-violate expectation, so this one is run by hand and its result
\* is recorded in results.md.
CONSTANTS
    Writers = {w1, w2}
    Shards = {s1}
    Contents = {c1, c2}
    MaxRetries = 1
    FlushLifetime = 2
    MaxTicks = 1
    Signal = "logs"
    HasIdemKey = FALSE
    CommitBeforeData = FALSE
    SkipHashCompare = FALSE
    AckAtEnqueue = FALSE
    MarkerAfterFirstShard = FALSE
    RetryDedups = TRUE
    QueryReadsDataDirectly = FALSE
    CheckQuery = FALSE
    CheckToken = FALSE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
INVARIANT DuplicateUnreachable
