\* module: MCLifecycleGC
\* Exhaustive configuration: the shipped model (every switch at its base value)
\* checked against FairSpec so the two liveness properties are exercised alongside
\* every safety invariant, over a larger clock horizon than smoke. Run directly
\* by the executor task that sized this file (issue #1122); see results.md.
\*
\* MaxClock = 4 does not complete: it was still growing past 2.19M states
\* generated / 550K distinct after 64s with no sign of quiescence. MaxClock = 3
\* completes the full state graph in well under a minute and still exceeds
\* smoke's MaxClock = 2, so it is the shipped bound. Reachability of the four
\* behaviours a shrink could hide (a rewrite and its supersession, a legal hold
\* that actually blocks a completion, the protection horizon gating a delete,
\* the .dreq hold blocking the request-marker sweep) is checked by probe at
\* this bound; see results.md, "Exhaustive".
\*
\* Liveness holds only when the fold and sweep retention windows agree (#1131);
\* both are 0 here. ProtectionHorizon satisfies the startup inequality
\* (1 >= 1 + 0 + 0).
CONSTANTS
    ProtectionHorizon = 1
    Grace = 0
    MaxQueryDuration = 1
    ClockSkew = 0
    FoldRetentionWindow = 0
    SweepRetentionWindow = 0
    DreqHorizonDelta = 1
    MaxClock = 3
    FullEnv = TRUE
    DeleteBeforeHorizon = FALSE
    RefreshFailureSweepsAnyway = FALSE
    SupersededSweepUngated = FALSE
    DreqIgnoresHeldInputs = FALSE
    RewriteIdentityOmitsRequests = FALSE
    RewriteKeepsErasedRecords = FALSE
    CompleteIgnoresServedSet = FALSE
    HorizonGuardsPinnedQueries = TRUE
CHECK_DEADLOCK FALSE
SPECIFICATION FairSpec
VIEW View
INVARIANT TypeOK
INVARIANT NoDeleteInsideProtectionWindow
INVARIANT HeldObjectNeverDeleted
INVARIANT RefreshFailureNeverSweeps
INVARIANT TombstoneExcludesBeforeDelete
INVARIANT TombstoneNotDeletedBeforeBucketEmpty
INVARIANT ErasedSubjectNeverServedAfterRequest
INVARIANT RewriteOutputsAreInputsMinusErased
INVARIANT CompletionImpliesNoPreRewriteExposure
INVARIANT CompletionRespectsLegalHold
INVARIANT DreqRemovalCannotResurrect
INVARIANT DreqSweepRespectsLegalHold
INVARIANT IdenticalInputSetsDoNotCollide
INVARIANT HeadNamedObjectNeverDeletedBySupersededSweep
PROPERTY EventuallySwept
PROPERTY EventuallyCompleted
