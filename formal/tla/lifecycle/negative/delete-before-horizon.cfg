\* module: MCLifecycleGC
\* Negative control: retention deletes without the protection-horizon gate
\* (DeleteBeforeHorizon). Must violate NoDeleteInsideProtectionWindow (safety,
\* exit 12): an object is deleted at a clock earlier than retired_at plus the
\* protection horizon.
CONSTANTS
    ProtectionHorizon = 1
    Grace = 0
    MaxQueryDuration = 1
    ClockSkew = 0
    BadProtectionHorizon = 0
    FoldRetentionWindow = 0
    SweepRetentionWindow = 0
    DreqHorizonDelta = 1
    MaxClock = 2
    FullEnv = FALSE
    DeleteBeforeHorizon = TRUE
    RefreshFailureSweepsAnyway = FALSE
    SupersededSweepUngated = FALSE
    DreqIgnoresHeldInputs = FALSE
    RewriteIdentityOmitsRequests = FALSE
    GcConfigViolatesInequality = FALSE
    HorizonGuardsPinnedQueries = TRUE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
VIEW View
INVARIANT TypeOK
INVARIANT NoDeleteInsideProtectionWindow
