\* module: MCLifecycleGC
\* Negative control: the compactor publishes a record set without checking the
\* listing for a live rewrite record (CompactionIgnoresRewrite), dropping the
\* CompactionOutcome::RewritePresent refusal that compact_bucket_scoped enforces
\* (crates/ravel-maintain/src/compact.rs, commit b997b7e1). Must violate
\* AtMostOneLiveRecordSetServed (safety, exit 12): the erasure rewrite publishes
\* rwA over raw1 with the erased records dropped and marks raw1 superseded, then
\* the compactor publishes cmpA over the same raw1 with nothing dropped, and both
\* record sets are live and cover the same superseded input at once. A snapshot
\* resolved onto cmpA serves the records rwA removed (ADR-0064 decision 3 point 5).
\*
\* This is the control that makes AtMostOneLiveRecordSetServed non-vacuous. With
\* the guard in place the invariant holds; with the guard alone removed it fires,
\* so the invariant is measuring the guard and not the model's shape.
\*
\* SerializeCompactionAndRewrite stays TRUE so the driver's per-bucket
\* serialisation is intact: the violation reached here is the ALREADY-DURABLE
\* case, which is exactly the case the shipped guard is documented to close
\* (commit cdce1722). Setting it FALSE would open a second, concurrent path and
\* the control would no longer isolate the guard.
\*
\* FullEnv is TRUE and the invariant list is the full smoke set (finding 5): the
\* switch breaks only the compaction guard, so it fires this invariant alone,
\* under the widest reachable environment, not a reduction chosen to dodge a
\* co-firing invariant.
CONSTANTS
    ProtectionHorizon = 1
    Grace = 0
    MaxQueryDuration = 1
    ClockSkew = 0
    FoldRetentionWindow = 0
    SweepRetentionWindow = 0
    DreqHorizonDelta = 1
    MaxClock = 2
    FullEnv = TRUE
    DeleteBeforeHorizon = FALSE
    RefreshFailureSweepsAnyway = FALSE
    SupersededSweepUngated = FALSE
    DreqIgnoresHeldInputs = FALSE
    RewriteIdentityOmitsRequests = FALSE
    RewriteKeepsErasedRecords = FALSE
    CompleteIgnoresServedSet = FALSE
    HorizonGuardsPinnedQueries = TRUE
    CompactionIgnoresRewrite = TRUE
    SerializeCompactionAndRewrite = TRUE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
VIEW View
INVARIANT TypeOK
INVARIANT NoDeleteInsideProtectionWindow
INVARIANT HeldObjectNeverDeleted
INVARIANT RefreshFailureNeverSweeps
INVARIANT TombstoneExcludesBeforeDelete
INVARIANT TombstoneNotDeletedBeforeBucketEmpty
INVARIANT ErasedSubjectNeverServedAfterRequest
INVARIANT RewriteOutputsAreInputsMinusErased
INVARIANT CompletionImpliesNoPreRewriteExposure
INVARIANT CompletionRespectsLegalHold
INVARIANT DreqRemovalCannotResurrect
INVARIANT DreqSweepRespectsLegalHold
INVARIANT IdenticalInputSetsDoNotCollide
INVARIANT HeadNamedObjectNeverDeletedBySupersededSweep
INVARIANT RawInputContentAssumedImmutable
INVARIANT AtMostOneLiveRecordSetServed
