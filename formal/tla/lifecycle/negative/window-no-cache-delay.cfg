\* module: MCLifecycleGC
\* Negative control (ADR-1133 decision 7): positive/window-gate.cfg with the
\* gate's HeadCacheTtl term dropped (WindowNoCacheDelay = TRUE) while a pin can
\* still be served a cached HEAD for HeadCacheTtl after the drop. A query pinned
\* on that cached HEAD outlives the shortened window. Must violate
\* NoDeleteInsideProtectionWindow (safety, exit 12). Every other constant, the
\* constraint and the invariant list are window-gate.cfg's.
\* counterexamples/window-no-cache-delay.md has the trace.
CONSTANTS
    ProtectionHorizon = 2
    Grace = 0
    MaxQueryDuration = 1
    ClockSkew = 1
    FoldRetentionWindow = 0
    SweepRetentionWindow = 0
    DreqHorizonDelta = 1
    MaxClock = 8
    FullEnv = FALSE
    DeleteBeforeHorizon = FALSE
    RefreshFailureSweepsAnyway = FALSE
    SupersededSweepUngated = FALSE
    DreqIgnoresHeldInputs = FALSE
    RewriteIdentityOmitsRequests = FALSE
    RewriteKeepsErasedRecords = FALSE
    CompleteIgnoresServedSet = FALSE
    HorizonGuardsPinnedQueries = FALSE
    CompactionIgnoresRewrite = FALSE
    SerializeCompactionAndRewrite = TRUE
    SealBound = 1
    CompletionIgnoresOpenBucket = FALSE
    WindowGate = TRUE
    HeadCacheTtl = 1
    WindowSingleSkew = FALSE
    WindowNoCacheDelay = TRUE
    MarkerIgnoresAnchor = FALSE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
VIEW View
CONSTRAINT WindowGateScope
INVARIANT TypeOK
INVARIANT NoDeleteInsideProtectionWindow
INVARIANT HeldObjectNeverDeleted
INVARIANT RefreshFailureNeverSweeps
INVARIANT TombstoneExcludesBeforeDelete
INVARIANT TombstoneNotDeletedBeforeBucketEmpty
INVARIANT HeadNamedObjectNeverDeletedBySupersededSweep
