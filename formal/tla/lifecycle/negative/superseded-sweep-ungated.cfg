\* module: MCLifecycleGC
\* Negative control: the superseded-input sweep drops its object-granular HEAD gate
\* (SupersededSweepUngated), so it deletes an input the current HEAD still names.
\* Must violate HeadNamedObjectNeverDeletedBySupersededSweep (safety, exit 12): a
\* superseded delete is witnessed with a non-empty head-named set.
CONSTANTS
    ProtectionHorizon = 1
    Grace = 0
    MaxQueryDuration = 1
    ClockSkew = 0
    BadProtectionHorizon = 0
    FoldRetentionWindow = 0
    SweepRetentionWindow = 0
    DreqHorizonDelta = 1
    MaxClock = 2
    FullEnv = FALSE
    DeleteBeforeHorizon = FALSE
    RefreshFailureSweepsAnyway = FALSE
    SupersededSweepUngated = TRUE
    DreqIgnoresHeldInputs = FALSE
    RewriteIdentityOmitsRequests = FALSE
    GcConfigViolatesInequality = FALSE
    HorizonGuardsPinnedQueries = TRUE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
VIEW View
INVARIANT TypeOK
INVARIANT HeadNamedObjectNeverDeletedBySupersededSweep
