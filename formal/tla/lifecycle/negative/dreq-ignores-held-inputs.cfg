\* module: MCLifecycleGC
\* Negative control: the .dreq sweep ignores a permitted pinned query still able to
\* reach a present object serving the subject (DreqIgnoresHeldInputs), so it deletes
\* the read-time erasure filter out from under that reader. Must violate
\* DreqRemovalCannotResurrect (safety, exit 12): with the .dreq gone the pinned read
\* serves the requested-for-erasure subject again.
CONSTANTS
    ProtectionHorizon = 1
    Grace = 0
    MaxQueryDuration = 1
    ClockSkew = 0
    FoldRetentionWindow = 0
    SweepRetentionWindow = 0
    DreqHorizonDelta = 1
    MaxClock = 2
    FullEnv = FALSE
    DeleteBeforeHorizon = FALSE
    RefreshFailureSweepsAnyway = FALSE
    SupersededSweepUngated = FALSE
    DreqIgnoresHeldInputs = TRUE
    RewriteIdentityOmitsRequests = FALSE
    RewriteKeepsErasedRecords = FALSE
    CompleteIgnoresServedSet = FALSE
    HorizonGuardsPinnedQueries = TRUE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
VIEW View
INVARIANT TypeOK
INVARIANT DreqRemovalCannotResurrect
