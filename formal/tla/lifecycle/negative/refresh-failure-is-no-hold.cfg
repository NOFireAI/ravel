\* module: MCLifecycleGC
\* Negative control: a failed legal-hold refresh does not skip the maintainer tick
\* (RefreshFailureSweepsAnyway), so a sweep runs while the refresh had failed. Must
\* violate RefreshFailureNeverSweeps (safety, exit 12): a deletion is witnessed
\* with the refresh in the failed state. FullEnv is TRUE so refreshFailed is
\* reachable.
CONSTANTS
    ProtectionHorizon = 1
    Grace = 0
    MaxQueryDuration = 1
    ClockSkew = 0
    BadProtectionHorizon = 0
    FoldRetentionWindow = 0
    SweepRetentionWindow = 0
    DreqHorizonDelta = 1
    MaxClock = 2
    FullEnv = TRUE
    DeleteBeforeHorizon = FALSE
    RefreshFailureSweepsAnyway = TRUE
    SupersededSweepUngated = FALSE
    DreqIgnoresHeldInputs = FALSE
    RewriteIdentityOmitsRequests = FALSE
    GcConfigViolatesInequality = FALSE
    HorizonGuardsPinnedQueries = TRUE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
VIEW View
INVARIANT TypeOK
INVARIANT RefreshFailureNeverSweeps
