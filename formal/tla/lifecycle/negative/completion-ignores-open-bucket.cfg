\* module: MCLifecycleGC
\* Negative control: completion drops the ack-open-bucket guard
\* (CompletionIgnoresOpenBucket), the guard that
\* crates/ravel-maintain/src/erasure_rewrite.rs::bucket_erasure_completion enforces
\* over the hours ack_open_ingest_hours derives and
\* services/ravel-server/src/maintain.rs::run_erasure_pass unions into the pass's
\* discovered hours (issue #1290). Must violate
\* CompletionCoversEveryBucketOpenAtRequest (safety, exit 12). The shortest trace
\* TLC reports breaks the first clause: the ingest bucket opens at clock 0 and is
\* open when the erasure request is acknowledged (in scope at the ack), the clock
\* ticks, the bucket is retired and dropped from HEAD, and completion writes .done
\* at clock 1 while that bucket is still unsealed, so the witness carries
\* openUnsealedInScope = TRUE. The second clause (a pre-ack record still served
\* from the ack-open bucket at completion, openLateServed) is shown load-bearing
\* by its own behaviour mutant rather than by this control, since TLC stops at the
\* shallowest violation; counterexamples/completion-ignores-open-bucket.md records
\* both. With the guard the completion blocks until the bucket seals and a rewrite
\* drops the record.
\*
\* This is the control that makes CompletionCoversEveryBucketOpenAtRequest
\* non-vacuous. FullEnv is TRUE and the invariant list is the full smoke set
\* (finding 5): the switch breaks only the completion guard, so it fires this
\* invariant alone, under the widest reachable environment.
CONSTANTS
    ProtectionHorizon = 1
    Grace = 0
    MaxQueryDuration = 1
    ClockSkew = 0
    FoldRetentionWindow = 0
    SweepRetentionWindow = 0
    DreqHorizonDelta = 1
    MaxClock = 2
    FullEnv = TRUE
    DeleteBeforeHorizon = FALSE
    RefreshFailureSweepsAnyway = FALSE
    SupersededSweepUngated = FALSE
    DreqIgnoresHeldInputs = FALSE
    RewriteIdentityOmitsRequests = FALSE
    RewriteKeepsErasedRecords = FALSE
    CompleteIgnoresServedSet = FALSE
    HorizonGuardsPinnedQueries = TRUE
    CompactionIgnoresRewrite = FALSE
    SerializeCompactionAndRewrite = TRUE
    SealBound = 1
    CompletionIgnoresOpenBucket = TRUE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
VIEW View
INVARIANT TypeOK
INVARIANT NoDeleteInsideProtectionWindow
INVARIANT HeldObjectNeverDeleted
INVARIANT RefreshFailureNeverSweeps
INVARIANT TombstoneExcludesBeforeDelete
INVARIANT TombstoneNotDeletedBeforeBucketEmpty
INVARIANT ErasedSubjectNeverServedAfterRequest
INVARIANT RewriteOutputsAreInputsMinusErased
INVARIANT RewriteTargetMatchesResolvedInputs
INVARIANT CompletionImpliesNoPreRewriteExposure
INVARIANT CompletionRespectsLegalHold
INVARIANT DreqRemovalCannotResurrect
INVARIANT DreqSweepRespectsLegalHold
INVARIANT IdenticalInputSetsDoNotCollide
INVARIANT HeadNamedObjectNeverDeletedBySupersededSweep
INVARIANT RawInputContentAssumedImmutable
INVARIANT AtMostOneLiveRecordSetServed
INVARIANT CompletionCoversEveryBucketOpenAtRequest
