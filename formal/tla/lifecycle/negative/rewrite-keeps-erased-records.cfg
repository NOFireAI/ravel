\* module: MCLifecycleGC
\* Negative control: the rewrite output keeps the records whose subject the applied
\* requests erased (RewriteKeepsErasedRecords), instead of dropping them. Must
\* violate RewriteOutputsAreInputsMinusErased (safety, exit 12): the materialised
\* output serves a subject that its applied requests erased.
CONSTANTS
    ProtectionHorizon = 1
    Grace = 0
    MaxQueryDuration = 1
    ClockSkew = 0
    FoldRetentionWindow = 0
    SweepRetentionWindow = 0
    DreqHorizonDelta = 1
    MaxClock = 2
    FullEnv = FALSE
    DeleteBeforeHorizon = FALSE
    RefreshFailureSweepsAnyway = FALSE
    SupersededSweepUngated = FALSE
    DreqIgnoresHeldInputs = FALSE
    RewriteIdentityOmitsRequests = FALSE
    RewriteKeepsErasedRecords = TRUE
    CompleteIgnoresServedSet = FALSE
    HorizonGuardsPinnedQueries = TRUE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
VIEW View
INVARIANT TypeOK
INVARIANT RewriteOutputsAreInputsMinusErased
