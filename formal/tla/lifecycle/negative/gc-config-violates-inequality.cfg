\* module: MCLifecycleGC
\* Negative control: the sys/gc record is initialised with a protection horizon that
\* fails the startup inequality (GcConfigViolatesInequality selects
\* BadProtectionHorizon). Must violate GcConfigSatisfiesHorizon (safety, exit 12):
\* protection_horizon is below max_query_duration + grace + clock_skew_allowance.
CONSTANTS
    ProtectionHorizon = 1
    Grace = 0
    MaxQueryDuration = 1
    ClockSkew = 0
    BadProtectionHorizon = 0
    FoldRetentionWindow = 0
    SweepRetentionWindow = 0
    DreqHorizonDelta = 1
    MaxClock = 2
    FullEnv = FALSE
    DeleteBeforeHorizon = FALSE
    RefreshFailureSweepsAnyway = FALSE
    SupersededSweepUngated = FALSE
    DreqIgnoresHeldInputs = FALSE
    RewriteIdentityOmitsRequests = FALSE
    GcConfigViolatesInequality = TRUE
    HorizonGuardsPinnedQueries = TRUE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
VIEW View
INVARIANT TypeOK
INVARIANT GcConfigSatisfiesHorizon
