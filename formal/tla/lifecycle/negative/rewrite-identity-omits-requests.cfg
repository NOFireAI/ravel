\* module: MCLifecycleGC
\* Negative control: the rewrite identity key drops the applied-request set
\* (RewriteIdentityOmitsRequests), so two rewrites over the same input set with
\* different applied requests collide. Must violate IdenticalInputSetsDoNotCollide
\* (safety, exit 12): the number of distinct keys is less than the number of
\* descriptors.
CONSTANTS
    ProtectionHorizon = 1
    Grace = 0
    MaxQueryDuration = 1
    ClockSkew = 0
    BadProtectionHorizon = 0
    FoldRetentionWindow = 0
    SweepRetentionWindow = 0
    DreqHorizonDelta = 1
    MaxClock = 2
    FullEnv = FALSE
    DeleteBeforeHorizon = FALSE
    RefreshFailureSweepsAnyway = FALSE
    SupersededSweepUngated = FALSE
    DreqIgnoresHeldInputs = FALSE
    RewriteIdentityOmitsRequests = TRUE
    GcConfigViolatesInequality = FALSE
    HorizonGuardsPinnedQueries = TRUE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
VIEW View
INVARIANT TypeOK
INVARIANT IdenticalInputSetsDoNotCollide
