\* module: MCLifecycleGC
\* Negative control (ADR-1133 decision 7): positive/window-gate.cfg with a
\* marker accepted whatever anchor it was written for
\* (MarkerIgnoresAnchor = TRUE, which also disables RenewMarker). A marker left
\* under the key for another anchor (StaleMarker) is already aged, so the gate
\* opens without any window having passed since this candidate was dropped. Must
\* violate NoDeleteInsideProtectionWindow (safety, exit 12). Every other
\* constant, the constraint and the invariant list are window-gate.cfg's.
\* counterexamples/marker-ignores-anchor.md has the trace.
CONSTANTS
    ProtectionHorizon = 2
    Grace = 0
    MaxQueryDuration = 1
    ClockSkew = 1
    FoldRetentionWindow = 0
    SweepRetentionWindow = 0
    DreqHorizonDelta = 1
    MaxClock = 8
    FullEnv = FALSE
    DeleteBeforeHorizon = FALSE
    RefreshFailureSweepsAnyway = FALSE
    SupersededSweepUngated = FALSE
    DreqIgnoresHeldInputs = FALSE
    RewriteIdentityOmitsRequests = FALSE
    RewriteKeepsErasedRecords = FALSE
    CompleteIgnoresServedSet = FALSE
    HorizonGuardsPinnedQueries = FALSE
    CompactionIgnoresRewrite = FALSE
    SerializeCompactionAndRewrite = TRUE
    SealBound = 1
    CompletionIgnoresOpenBucket = FALSE
    WindowGate = TRUE
    HeadCacheTtl = 1
    WindowSingleSkew = FALSE
    WindowNoCacheDelay = FALSE
    MarkerIgnoresAnchor = TRUE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
VIEW View
CONSTRAINT WindowGateScope
INVARIANT TypeOK
INVARIANT NoDeleteInsideProtectionWindow
INVARIANT HeldObjectNeverDeleted
INVARIANT RefreshFailureNeverSweeps
INVARIANT TombstoneExcludesBeforeDelete
INVARIANT TombstoneNotDeletedBeforeBucketEmpty
INVARIANT HeadNamedObjectNeverDeletedBySupersededSweep
