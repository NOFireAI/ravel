\* module: MCLifecycleGC
\* Negative control: completion skips the served-set check (CompleteIgnoresServedSet),
\* writing .done while the current HEAD still serves the subject. Must violate
\* CompletionImpliesNoPreRewriteExposure (safety, exit 12): a .done exists while a
\* head-named present object still serves the erased subject.
CONSTANTS
    ProtectionHorizon = 1
    Grace = 0
    MaxQueryDuration = 1
    ClockSkew = 0
    FoldRetentionWindow = 0
    SweepRetentionWindow = 0
    DreqHorizonDelta = 1
    MaxClock = 2
    FullEnv = FALSE
    DeleteBeforeHorizon = FALSE
    RefreshFailureSweepsAnyway = FALSE
    SupersededSweepUngated = FALSE
    DreqIgnoresHeldInputs = FALSE
    RewriteIdentityOmitsRequests = FALSE
    RewriteKeepsErasedRecords = FALSE
    CompleteIgnoresServedSet = TRUE
    HorizonGuardsPinnedQueries = TRUE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
VIEW View
INVARIANT TypeOK
INVARIANT CompletionImpliesNoPreRewriteExposure
