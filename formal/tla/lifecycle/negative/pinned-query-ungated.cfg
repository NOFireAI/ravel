\* module: MCLifecycleGC
\* Negative control: the retention delete gates on the protection horizon and
\* an unnamed HEAD but drops the in-window-pinned-query clause
\* (HorizonGuardsPinnedQueries = FALSE, candidate #1133). Must violate
\* NoDeleteInsideProtectionWindow (safety, exit 12): a reader pins the current
\* HEAD naming an object, a rewrite supersedes it, the horizon passes, the
\* next fold drops the object from HEAD, and the superseded sweep deletes it
\* while the pinned query is still inside its deadline. candidate-1133.cfg
\* is the manual, short-invariant-list record of this same finding in
\* results.md; this file is its permanent form under the full smoke invariant
\* list. FullEnv is TRUE and the invariant list is the full smoke set
\* (finding 5): the switch breaks only the pinned-query clause, so it fires
\* this invariant alone, under the widest reachable environment, not a
\* reduction chosen to dodge a co-firing invariant.
CONSTANTS
    ProtectionHorizon = 1
    Grace = 0
    MaxQueryDuration = 1
    ClockSkew = 0
    FoldRetentionWindow = 0
    SweepRetentionWindow = 0
    DreqHorizonDelta = 1
    MaxClock = 2
    FullEnv = TRUE
    DeleteBeforeHorizon = FALSE
    RefreshFailureSweepsAnyway = FALSE
    SupersededSweepUngated = FALSE
    DreqIgnoresHeldInputs = FALSE
    RewriteIdentityOmitsRequests = FALSE
    RewriteKeepsErasedRecords = FALSE
    CompleteIgnoresServedSet = FALSE
    HorizonGuardsPinnedQueries = FALSE
    CompactionIgnoresRewrite = FALSE
    SerializeCompactionAndRewrite = TRUE
    SealBound = 1
    CompletionIgnoresOpenBucket = FALSE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
VIEW View
INVARIANT TypeOK
INVARIANT NoDeleteInsideProtectionWindow
INVARIANT HeldObjectNeverDeleted
INVARIANT RefreshFailureNeverSweeps
INVARIANT TombstoneExcludesBeforeDelete
INVARIANT TombstoneNotDeletedBeforeBucketEmpty
INVARIANT ErasedSubjectNeverServedAfterRequest
INVARIANT RewriteOutputsAreInputsMinusErased
INVARIANT RewriteTargetMatchesResolvedInputs
INVARIANT CompletionImpliesNoPreRewriteExposure
INVARIANT CompletionRespectsLegalHold
INVARIANT DreqRemovalCannotResurrect
INVARIANT DreqSweepRespectsLegalHold
INVARIANT IdenticalInputSetsDoNotCollide
INVARIANT HeadNamedObjectNeverDeletedBySupersededSweep
INVARIANT RawInputContentAssumedImmutable
INVARIANT AtMostOneLiveRecordSetServed
INVARIANT CompletionCoversEveryBucketOpenAtRequest
