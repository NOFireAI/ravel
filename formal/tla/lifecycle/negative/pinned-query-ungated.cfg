\* module: MCLifecycleGC
\* Negative control (ADR-1133 decision 7), promoted from candidate-1133.cfg: the
\* shipped sweep delete gates on the protection horizon and an unnamed HEAD but
\* neither on an in-window pinned query (HorizonGuardsPinnedQueries = FALSE) nor
\* on the window gate (WindowGate = FALSE). A query pinned on the previous HEAD
\* may still need an object that a late fold lets the next sweep delete. Must
\* violate NoDeleteInsideProtectionWindow (safety, exit 12).
\*
\* Bounds and switches are candidate-1133.cfg's, plus the constants added since
\* it was written (SealBound and CompletionIgnoresOpenBucket for issue #1290, the
\* window gate's five for issue #2339), each at the value that leaves its
\* behaviour off. The invariant list stays short: the control is about the
\* pinned-query clause alone. counterexamples/pinned-query-ungated.md has the
\* trace.
CONSTANTS
    ProtectionHorizon = 1
    Grace = 0
    MaxQueryDuration = 1
    ClockSkew = 0
    FoldRetentionWindow = 0
    SweepRetentionWindow = 0
    DreqHorizonDelta = 1
    MaxClock = 2
    FullEnv = TRUE
    DeleteBeforeHorizon = FALSE
    RefreshFailureSweepsAnyway = FALSE
    SupersededSweepUngated = FALSE
    DreqIgnoresHeldInputs = FALSE
    RewriteIdentityOmitsRequests = FALSE
    RewriteKeepsErasedRecords = FALSE
    CompleteIgnoresServedSet = FALSE
    HorizonGuardsPinnedQueries = FALSE
    CompactionIgnoresRewrite = FALSE
    SerializeCompactionAndRewrite = TRUE
    SealBound = 1
    CompletionIgnoresOpenBucket = FALSE
    WindowGate = FALSE
    HeadCacheTtl = 0
    WindowSingleSkew = FALSE
    WindowNoCacheDelay = FALSE
    MarkerIgnoresAnchor = FALSE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
VIEW View
INVARIANT TypeOK
INVARIANT NoDeleteInsideProtectionWindow
