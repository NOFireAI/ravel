\* module: MCLifecycleGC
\* Candidate #1133: the shipped retention delete gates on horizon AND head-empty
\* but NOT on an in-window pinned query (HorizonGuardsPinnedQueries = FALSE). A
\* query pinned on the previous HEAD may still need an object that a late fold lets
\* the next sweep delete. Expected to violate NoDeleteInsideProtectionWindow
\* (safety, exit 12): a horizon-gated delete removes an object a permitted in-flight
\* query still needs.
\*
\* No lane runs this config; it is the manual investigation of candidate #1133
\* recorded in results.md. It still has to parse, so it carries every CONSTANT
\* the model declares, including the two added for issues #1221 and #1289 and
\* the two added in round thirteen for issue #1411. Its INVARIANT list stays
\* deliberately short: the candidate is about the retention delete gate alone,
\* and adding the other sixteen invariants would obscure which property the
\* run is asking about. Issue #1133's fix shipped in
\* crates/ravel-maintain/src/reachability.rs; the finding this file reproduces
\* is now also carried as a permanent negative control,
\* negative/pinned-query-ungated.cfg, under the full smoke invariant list.
CONSTANTS
    ProtectionHorizon = 1
    Grace = 0
    MaxQueryDuration = 1
    ClockSkew = 0
    FoldRetentionWindow = 0
    SweepRetentionWindow = 0
    DreqHorizonDelta = 1
    MaxClock = 2
    FullEnv = TRUE
    DeleteBeforeHorizon = FALSE
    RefreshFailureSweepsAnyway = FALSE
    SupersededSweepUngated = FALSE
    DreqIgnoresHeldInputs = FALSE
    RewriteIdentityOmitsRequests = FALSE
    RewriteKeepsErasedRecords = FALSE
    CompleteIgnoresServedSet = FALSE
    HorizonGuardsPinnedQueries = FALSE
    CompactionIgnoresRewrite = FALSE
    SerializeCompactionAndRewrite = TRUE
    SealBound = 1
    CompletionIgnoresOpenBucket = FALSE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
VIEW View
INVARIANT TypeOK
INVARIANT NoDeleteInsideProtectionWindow
