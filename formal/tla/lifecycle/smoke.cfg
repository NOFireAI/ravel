\* Smoke model for the lifecycle area (ADR-1113 D5, task T4): safety only, small
\* bounds, correct-model switch values. The horizon constants are the smallest
\* that keep the startup inequality tight (ph = mqd + grace + skew) and still let
\* the clock reach a retention delete, an erasure completion, a .dreq sweep and a
\* pinned-query race within MaxClock. FullEnv opens the adversarial head-read and
\* refresh churn; VIEW projects away the store's version and content bookkeeping so
\* orderings that differ only in the assigned version integer collapse. The
\* negative controls flip one switch each.
\*
\* MaxClock is 1 from round thirteen (issue #1411). The open ingest bucket's three
\* variables multiplied the reachable graph by about 8.5, and MaxClock = 2 grew to
\* 30.5M distinct states, past the 300 second smoke budget on a four-core runner.
\* Each negative control still fires its own target invariant at MaxClock = 1, so
\* the smaller bound still reaches every guarded behaviour; results.md, "Round
\* thirteen", records that run.
CONSTANTS
    ProtectionHorizon = 1
    Grace = 0
    MaxQueryDuration = 1
    ClockSkew = 0
    FoldRetentionWindow = 0
    SweepRetentionWindow = 0
    DreqHorizonDelta = 1
    MaxClock = 1
    FullEnv = TRUE
    DeleteBeforeHorizon = FALSE
    RefreshFailureSweepsAnyway = FALSE
    SupersededSweepUngated = FALSE
    DreqIgnoresHeldInputs = FALSE
    RewriteIdentityOmitsRequests = FALSE
    RewriteKeepsErasedRecords = FALSE
    CompleteIgnoresServedSet = FALSE
    HorizonGuardsPinnedQueries = TRUE
    CompactionIgnoresRewrite = FALSE
    SerializeCompactionAndRewrite = TRUE
    SealBound = 1
    CompletionIgnoresOpenBucket = FALSE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
VIEW View
INVARIANT TypeOK
INVARIANT NoDeleteInsideProtectionWindow
INVARIANT HeldObjectNeverDeleted
INVARIANT RefreshFailureNeverSweeps
INVARIANT TombstoneExcludesBeforeDelete
INVARIANT TombstoneNotDeletedBeforeBucketEmpty
INVARIANT ErasedSubjectNeverServedAfterRequest
INVARIANT RewriteOutputsAreInputsMinusErased
INVARIANT RewriteTargetMatchesResolvedInputs
INVARIANT CompletionImpliesNoPreRewriteExposure
INVARIANT CompletionRespectsLegalHold
INVARIANT DreqRemovalCannotResurrect
INVARIANT DreqSweepRespectsLegalHold
INVARIANT IdenticalInputSetsDoNotCollide
INVARIANT HeadNamedObjectNeverDeletedBySupersededSweep
INVARIANT RawInputContentAssumedImmutable
INVARIANT AtMostOneLiveRecordSetServed
INVARIANT CompletionCoversEveryBucketOpenAtRequest
