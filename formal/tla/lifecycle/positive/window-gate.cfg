\* module: MCLifecycleGC
\* ADR-1133 decision 7, positive check (issue #2339): the window gate alone keeps
\* a pinned query's objects safe. The oracle clause is off
\* (HorizonGuardsPinnedQueries = FALSE, the shipped delete), WindowGate is on, and
\* every term of the window is nonzero: MaxQueryDuration, HeadCacheTtl and
\* ClockSkew. ProtectionHorizon is the smallest value the startup inequality
\* allows (2 >= 1 + 0 + 1).
\*
\* The window is 1 + 1 + 4 * 1 = 6 ticks past the marker's reading, and the gate
\* opens when reading + 6 <= the deleting sweeper's clock. With the horizon at
\* clock 2, a marker written there opens the gate at clock 6 when the writer's
\* clock ran one behind, and at clock 7 when it was exact (the deleting
\* sweeper's clock one ahead in both). MaxClock = 8 lets both age fully.
\* results.md (issue #2339 round) records the runs that show the retention and
\* the superseded delete each taken.
\*
\* CONSTRAINT WindowGateScope prunes the erasure request, the open ingest bucket,
\* legal holds, an expired compaction lease, and anchors stamped after clock 0;
\* FullEnv FALSE keeps the HEAD read present and the refresh good. README.md
\* lists what the reduction leaves out.
CONSTANTS
    ProtectionHorizon = 2
    Grace = 0
    MaxQueryDuration = 1
    ClockSkew = 1
    FoldRetentionWindow = 0
    SweepRetentionWindow = 0
    DreqHorizonDelta = 1
    MaxClock = 8
    FullEnv = FALSE
    DeleteBeforeHorizon = FALSE
    RefreshFailureSweepsAnyway = FALSE
    SupersededSweepUngated = FALSE
    DreqIgnoresHeldInputs = FALSE
    RewriteIdentityOmitsRequests = FALSE
    RewriteKeepsErasedRecords = FALSE
    CompleteIgnoresServedSet = FALSE
    HorizonGuardsPinnedQueries = FALSE
    CompactionIgnoresRewrite = FALSE
    SerializeCompactionAndRewrite = TRUE
    SealBound = 1
    CompletionIgnoresOpenBucket = FALSE
    WindowGate = TRUE
    HeadCacheTtl = 1
    WindowThreeSkew = FALSE
    WindowNoCacheDelay = FALSE
    MarkerIgnoresAnchor = FALSE
CHECK_DEADLOCK FALSE
SPECIFICATION Spec
VIEW View
CONSTRAINT WindowGateScope
INVARIANT TypeOK
INVARIANT NoDeleteInsideProtectionWindow
INVARIANT HeldObjectNeverDeleted
INVARIANT RefreshFailureNeverSweeps
INVARIANT TombstoneExcludesBeforeDelete
INVARIANT TombstoneNotDeletedBeforeBucketEmpty
INVARIANT HeadNamedObjectNeverDeletedBySupersededSweep
