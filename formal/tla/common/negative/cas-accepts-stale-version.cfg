\* module: MCRavelObjectStore
\* Negative control: a CAS accepts a stale or absent version. Must violate
\* CasOutcomeMatchesEffect (safety, exit 12): the store changed while the
\* outcome the result function computed was PreconditionFailed.
CONSTANTS
    Keys = {k1, k2}
    Content = {c1, c2, nc}
    NoContent = nc
    Clients = {cl1, cl2}
    MaxOps = 3
    NoWrite = nw
    LostResponseDropsEffect = FALSE
    CasAcceptsStale = TRUE
    ListStalls = FALSE
SYMMETRY Symmetry
SPECIFICATION MCSpec
INVARIANT MCTypeOK
INVARIANT CreateIfAbsentWinnerUnique
INVARIANT CreateOutcomeMatchesEffect
INVARIANT CasOutcomeMatchesEffect
INVARIANT ReadAfterWrite
INVARIANT LostResponseEffectApplied
INVARIANT TransientLeavesNothing
INVARIANT DeleteIdempotent
INVARIANT MultipartInvisibleUntilComplete
INVARIANT ListingConsumersConsistent
