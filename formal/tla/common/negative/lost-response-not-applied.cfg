\* Negative control: a lost-response write drops its effect while the caller
\* treats the write as durable. Must violate ReadAfterWrite (safety, exit 12).
CONSTANTS
    Keys = {k1, k2}
    Content = {c1, c2, nc}
    NoContent = nc
    Clients = {cl1, cl2}
    MaxOps = 3
    NoWrite = nw
    NoKey = nokey
    LostResponseDropsEffect = TRUE
    CasAcceptsStale = FALSE
SYMMETRY Symmetry
SPECIFICATION MCSpec
INVARIANT MCTypeOK
INVARIANT CreateIfAbsentWinnerUnique
INVARIANT CasNeedsFreshVersion
INVARIANT ReadAfterWrite
INVARIANT DeleteIdempotent
INVARIANT MultipartInvisibleUntilComplete
