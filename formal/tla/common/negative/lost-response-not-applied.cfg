\* module: MCRavelObjectStore
\* Negative control: a lost-response write drops its effect while the caller
\* treats the write as durable. Must violate LostResponseEffectApplied (safety,
\* exit 12): the caller saw Failure but the durable effect never landed.
CONSTANTS
    Keys = {k1, k2}
    Content = {c1, c2, nc}
    NoContent = nc
    Clients = {cl1, cl2}
    MaxOps = 3
    NoWrite = nw
    LostResponseDropsEffect = TRUE
    CasAcceptsStale = FALSE
    ListStalls = FALSE
SYMMETRY Symmetry
SPECIFICATION MCSpec
INVARIANT MCTypeOK
INVARIANT CreateIfAbsentWinnerUnique
INVARIANT CreateOutcomeMatchesEffect
INVARIANT CasOutcomeMatchesEffect
INVARIANT LostResponseEffectApplied
INVARIANT ReadAfterWrite
INVARIANT TransientLeavesNothing
INVARIANT DeleteIdempotent
INVARIANT MultipartInvisibleUntilComplete
INVARIANT ListingConsumersConsistent
