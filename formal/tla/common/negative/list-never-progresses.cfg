\* module: MCRavelObjectStore
\* Negative control: the fair list action never progresses (ListStalls), so a
\* started listing can stutter forever without delivering its snapshot. Must
\* violate ListEventuallyComplete (temporal, exit 13). No symmetry: TLC does not
\* check liveness soundly under symmetry reduction.
CONSTANTS
    Keys = {k1, k2}
    Content = {c1, c2, nc}
    NoContent = nc
    Clients = {cl1, cl2}
    MaxOps = 3
    NoWrite = nw
    LostResponseDropsEffect = FALSE
    CasAcceptsStale = FALSE
    ListStalls = TRUE
SPECIFICATION FairSpec
PROPERTY ListEventuallyComplete
