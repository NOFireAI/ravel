\* Exhaustive model for RavelObjectStore: safety plus the ListEventuallyComplete
\* liveness property under FairSpec. No symmetry (kept sound alongside liveness),
\* wider budget.
CONSTANTS
    Keys = {k1, k2}
    Content = {c1, c2, nc}
    NoContent = nc
    Clients = {cl1, cl2}
    MaxOps = 3
    NoWrite = nw
    LostResponseDropsEffect = FALSE
    CasAcceptsStale = FALSE
SPECIFICATION FairSpec
INVARIANT MCTypeOK
INVARIANT CreateIfAbsentWinnerUnique
INVARIANT CreateOutcomeMatchesEffect
INVARIANT CasOutcomeMatchesEffect
INVARIANT ReadAfterWrite
INVARIANT LostResponseEffectApplied
INVARIANT TransientLeavesNothing
INVARIANT DeleteIdempotent
INVARIANT MultipartInvisibleUntilComplete
INVARIANT ListingConsumersConsistent
PROPERTY ListEventuallyComplete
