\* Smoke model for RavelObjectStore: safety only, small bounds, client symmetry.
CONSTANTS
    Keys = {k1, k2}
    Content = {c1, c2, nc}
    NoContent = nc
    Clients = {cl1, cl2}
    MaxOps = 3
    NoWrite = nw
    NoKey = nokey
    LostResponseDropsEffect = FALSE
    CasAcceptsStale = FALSE
SYMMETRY Symmetry
SPECIFICATION MCSpec
INVARIANT MCTypeOK
INVARIANT CreateIfAbsentWinnerUnique
INVARIANT CasNeedsFreshVersion
INVARIANT ReadAfterWrite
INVARIANT DeleteIdempotent
INVARIANT MultipartInvisibleUntilComplete
