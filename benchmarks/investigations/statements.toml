# Statement set for the selective-investigations harness (issue #3699,
# ADR-3692 decision 8). Each [[statement]] names:
#   id            stable identifier, used in calls.jsonl and results.json
#   table         "spans" | "logs" | "spans+logs" (join) | "hits" (control)
#   sql           the statement text, or "GET /api/traces/<trace_id>" for
#                 the trace-by-id endpoint (not POST /api/v1/sql)
#   states        state-matrix entries this statement runs in: any of
#                 "unfolded", "folded_no_leaves", "folded_leaves", "mixed",
#                 "many_parts" (T2, see run.sh step note)
#   truth_key     dotted path into truth.json this statement's answer is
#                 checked against (evaluate.py resolves it); "none" when
#                 the state varies the answer and no fixed truth applies
#   cold_only     true if this statement never runs a warm repeat
#   supported     false for a statement the current main build cannot run
#                 yet (recorded unsupported-on-this-build, never silently
#                 skipped -- see README.md "Unsupported statements")
#   acceptance    the ADR-3692 Acceptance table row number(s) this feeds

[[statement]]
id = "spans_lookup_no_range"
table = "spans"
sql = "GET /api/traces/{trace_id}"
states = ["unfolded", "folded_no_leaves", "folded_leaves"]
truth_key = "saved_trace_ids"
cold_only = false
supported = true
acceptance = [1]

[[statement]]
id = "spans_lookup_1h"
table = "spans"
sql = "SELECT trace_id, span_id, start_ts FROM spans WHERE trace_id = '{trace_id}' AND start_ts >= {start_ns} AND start_ts < {end_ns}"
states = ["unfolded", "folded_no_leaves", "folded_leaves"]
truth_key = "saved_trace_ids"
cold_only = false
supported = true
acceptance = [2, 3]

