# Statements of the selective investigations harness (issue #3699,
# ADR-3692 decision 8). box/run.sh runs every statement whose `states` list
# names the current state; evaluate.py compares each answer against
# truth.json's `answers[truth_key]` (or, for a statement or state whose
# oracle is the unfolded state, against the unfolded state's own answer) and
# judges it against bands.toml.
#
# Fields:
#   id         unique, used in calls.jsonl, results.<lane>.json and bands.toml
#   tenant     "inv" (the generated corpus, spans and logs in one tenant) or
#              "hits" (the ClickBench tenant; only when run.toml sets
#              hits = true). A many_parts_N state reads its own tenant, mpN,
#              whatever this says.
#   table      the table the statement reads first, for the report
#   kind       "trace_get": GET /api/traces/{trace}; "sql": POST /api/v1/sql
#   sql        the statement, with {placeholders} filled from truth.json by
#              box/lib/inv.py plan (see README.md "Placeholders")
#   truth_sub  "tail": placeholders, windows and truth keys come from the
#              mixed state's extra hour (truth.json sub.tail, answers
#              tail.*). A many_parts_N state uses sub many_parts_N for every
#              statement it runs.
#   requires   a truth.json field that must be non-null for the statement to
#              run; when it is null the call is recorded not-run with the
#              reason (the erasure victim does not exist at small scale)
#   oracle     "unfolded": the answer is judged against the unfolded state's
#              answer to the same statement and run, not against truth.json
#              alone (q20, whose expected answer is not generated). The
#              compaction and erasure states use this oracle for every
#              statement whatever this says.
#   corpus_id  for the hits tenant: the id of the entry in
#              benchmarks/clickbench/hits.corpus.json whose sql is run
#   window     "none" (no start: the whole tenant), "1h", "narrow" (5 min) or
#              "wide" (the corpus span plus one hour), each centred on the
#              anchor below
#   anchor     "trace" (the run's saved trace start) or "cell" (the middle of
#              the failing hour); unused for window = "none"
#   per_run    "saved_trace": cold run i reads saved trace i, so every cold
#              run asks for a different key; the warm repeat reads the last
#              cold run's trace, the data that call just pulled in
#   truth_key  key into truth.json's answers; {run} is the saved-trace index
#   truth_key_in  {state = key}: the truth key in those states instead, judged
#              against truth.json even where the state's oracle is the
#              unfolded answer
#   states     the states the statement runs in
#   cold_only  true: no warm repeat
#   control    true: one of the 43 ClickBench statements of the
#              nonselective control (ADR row 16)
#   unsupported_reason  set when this build cannot run the statement as the
#              ADR words it; run.sh still writes one calls.jsonl line per
#              state with outcome unsupported-on-this-build and this reason.
#              No statement sets it today.
#   expect_refusal_on_main  true: the statement is sent, and a refusal the
#              server returns (the 1,000- and 1,001-key IN lists against the
#              SQL complexity cap) is recorded as unsupported-on-this-build
#              with the response's status and text. A refusal of any other
#              statement is the problem `refused`.

[[statement]]
id = "spans_lookup_norange"
tenant = "inv"
table = "spans"
kind = "trace_get"
window = "none"
per_run = "saved_trace"
truth_key = "saved_trace.{run}.spans"
states = ["unfolded", "folded_no_leaves", "folded_leaves", "mixed", "many_parts_24", "many_parts_744",
          "many_parts_2160", "compaction_in_flight", "compaction_done", "erasure_in_flight"]
cold_only = false

[[statement]]
id = "spans_lookup_1h"
tenant = "inv"
table = "spans"
kind = "trace_get"
window = "1h"
anchor = "trace"
