# The erasure_in_flight state's victim row: present before the erasure,
# and gone while the request is pending, since a snapshot resolved after the
# request's ack filters its records (docs/catalog-and-mvcc.md, resolution
# step 6: "a query whose snapshot resolves after the request ack can never
# return matching records").
[[statement]]
id = "logs_erasure_victim"
tenant = "inv"
table = "logs"
kind = "sql"
sql = "SELECT trace_id FROM logs WHERE request_id = '{erasure_victim_rid}'"
window = "none"
requires = "erasure_victim"
truth_key = "erasure_victim.present"
truth_key_in = { erasure_in_flight = "erasure_victim.erased" }
states = ["unfolded", "erasure_in_flight"]
cold_only = true

# Journey B (ADR row 15, the journey's second step): the failing cell's logs.
[[statement]]
id = "journey_b"
tenant = "inv"
table = "logs"
kind = "sql"
sql = "SELECT count(*) AS n FROM logs WHERE trace_id IN (SELECT DISTINCT trace_id FROM spans WHERE service_name = '{cell_service}' AND status_code = 2 AND start_ts >= to_timestamp_nanos({cell_start_ns}) AND start_ts < to_timestamp_nanos({cell_end_ns}))"
window = "1h"
anchor = "cell"
truth_key = "failing_cell.logs_count"
states = ["unfolded", "folded_leaves", "mixed"]
cold_only = true

# Journey C (ADR row 14, the join baseline): logs joined to the first K
# root spans of the failing hour, K the build side (1, 102, 1,024, 10,240; truth.json marks a
# tier the corpus cannot fill as capped).
[[statement]]
id = "journey_c_1"
tenant = "inv"
table = "logs"
kind = "sql"
sql = "SELECT count(*) AS n FROM logs l JOIN spans s ON l.trace_id = s.trace_id WHERE s.parent_span_id IS NULL AND s.start_ts >= to_timestamp_nanos({jc_start_ns_1}) AND s.start_ts < to_timestamp_nanos({jc_cut_ns_1})"
window = "1h"
anchor = "cell"
truth_key = "journey_c.1"
states = ["unfolded", "folded_leaves", "mixed"]
cold_only = true

