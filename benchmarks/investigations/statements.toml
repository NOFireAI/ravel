# Journey B (ADR row 14, the join baseline): the failing cell's logs.
[[statement]]
id = "journey_b"
tenant = "inv"
table = "logs"
kind = "sql"
sql = "SELECT count(*) AS n FROM logs WHERE trace_id IN (SELECT DISTINCT trace_id FROM spans WHERE service_name = '{cell_service}' AND status_code = 2 AND start_ts >= to_timestamp_nanos({cell_start_ns}) AND start_ts < to_timestamp_nanos({cell_end_ns}))"
window = "1h"
anchor = "cell"
truth_key = "failing_cell.logs_count"
states = ["unfolded", "folded_leaves", "mixed"]
cold_only = true

# Journey C (ADR row 15): logs joined to the first K root spans of the
# failing hour, K the build side (1, 102, 1,024, 10,240; truth.json marks a
# tier the corpus cannot fill as capped).
[[statement]]
id = "journey_c_1"
tenant = "inv"
table = "logs"
kind = "sql"
sql = "SELECT count(*) AS n FROM logs l JOIN spans s ON l.trace_id = s.trace_id WHERE s.parent_span_id IS NULL AND s.start_ts >= to_timestamp_nanos({jc_start_ns_1}) AND s.start_ts < to_timestamp_nanos({jc_cut_ns_1})"
window = "1h"
anchor = "cell"
truth_key = "journey_c.1"
states = ["unfolded", "folded_leaves", "mixed"]
cold_only = true

