id = "spans_lookup_1h"
tenant = "inv"
table = "spans"
kind = "trace_get"
window = "1h"
anchor = "trace"
per_run = "saved_trace"
truth_key = "saved_trace.{run}.spans"
states = ["unfolded", "folded_no_leaves", "folded_leaves", "mixed", "many_parts"]
cold_only = false

