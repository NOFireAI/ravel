# Statements of the selective investigations harness (issue #3699,
# ADR-3692 decision 8). box/run.sh runs every statement whose `states` list
# names the current state; evaluate.py compares each answer against
# truth.json's `answers[truth_key]` and judges it against bands.toml.
#
# Fields:
#   id         unique, used in calls.jsonl, results.<lane>.json and bands.toml
#   tenant     "inv" (the generated corpus, spans and logs in one tenant) or
#              "hits" (the ClickBench tenant; only when run.toml sets
#              hits = true)
#   table      the table the statement reads first, for the report
#   kind       "trace_get": GET /api/traces/{trace}; "sql": POST /api/v1/sql
#   sql        the statement, with {placeholders} filled from truth.json by
#              box/lib/inv.py plan (see README.md "Placeholders")
#   corpus_id  for the hits tenant: the id of the entry in
#              benchmarks/clickbench/hits.corpus.json whose sql is run
#   window     "none" (no start: the whole tenant), "1h", "narrow" (5 min) or
#              "wide" (the corpus span), each centred on the anchor below
#   anchor     "trace" (the run's saved trace start) or "cell" (the middle of
#              the failing hour); unused for window = "none"
#   per_run    "saved_trace": cold run i reads saved trace i, so every cold
#              run asks for a different key; the warm repeat reads the last
#              cold run's trace, the data that call just pulled in
#   truth_key  key into truth.json's answers; {run} is the saved-trace index
#   states     the states the statement runs in
#   cold_only  true: no warm repeat
#   control    true: one of the 43 ClickBench statements of the
#              nonselective control (ADR row 16)
#   unsupported_reason  set when this build cannot run the statement as the
#              ADR words it; run.sh still writes one calls.jsonl line per
#              state with outcome unsupported-on-this-build and this reason

[[statement]]
id = "spans_lookup_norange"
tenant = "inv"
table = "spans"
kind = "trace_get"
window = "none"
per_run = "saved_trace"
truth_key = "saved_trace.{run}.spans"
states = ["unfolded", "folded_no_leaves", "folded_leaves", "mixed", "many_parts"]
cold_only = false

