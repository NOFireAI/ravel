# Sent as written. ravel-sql's complexity guard (complexity_guard.rs:640,
# :674-684) counts one unit per token start: an X'..' literal is an X run
# plus a quoted string, so an element with its comma costs 3, and a quoted
# '..' element with its comma costs 2. Against MAX_STATEMENT_COMPLEXITY =
# 1,000 (:257, checked at :380-381) and the 8 units of the rest of the
# statement, an X list holds at most 330 keys (3n + 8) and a quoted list at
# most 496 (2n + 8). The server's 400 and its text are recorded as
# unsupported-on-this-build; the 1,001-key list beside it is row 11's control.
[[statement]]
id = "spans_in_1000"
tenant = "inv"
table = "spans"
kind = "sql"
sql = "SELECT span_id FROM spans WHERE trace_id IN ({in_trace_ids_x_1000})"
window = "none"
truth_key = "in_trace_id.1000.spans"
states = ["unfolded", "folded_leaves"]
cold_only = true
expect_refusal_on_main = true

# Row 11's control: the 1,000-key list plus one key it does not hold, past
# the ceiling, so the key index must not serve it.
[[statement]]
id = "spans_in_1001"
tenant = "inv"
table = "spans"
kind = "sql"
sql = "SELECT span_id FROM spans WHERE trace_id IN ({in_trace_ids_x_1001})"
window = "none"
truth_key = "in_trace_id.1001.spans"
states = ["unfolded", "folded_leaves"]
cold_only = true
expect_refusal_on_main = true

