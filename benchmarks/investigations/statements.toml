# Nonselective control: run the ClickBench kit's own 43-statement corpus,
# unmodified, when run.toml sets control = true. Needs the `hits` tenant
# loaded exactly as the ClickBench kit loads it (see
# benchmarks/clickbench/hits.mapping.toml and the runbook's load step);
# this harness does not load `hits` itself.
[[statement]]
id = "control_hits_corpus"
table = "hits"
sql = "(see benchmarks/clickbench/hits.corpus.json, 43 statements, run unmodified)"
states = ["folded_leaves"]
truth_key = "none"
cold_only = true
supported = true
acceptance = [16]
