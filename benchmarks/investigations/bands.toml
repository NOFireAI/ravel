[[row]]
key = "adr3939_a7"
adr = "ADR-3939"
adr_row = "A7"
check = "A7. no-range lookup over every day part the run holds, logs request_id IN 100"
target = "at most 126 GETs per day part; days covered equal to min(days held, floor(2,048 / GETs per day))"
miss = "over 126 GETs per day part, or fewer days covered than that"
source = "predicted from box D rates"
# At the reduced rate (the harness-state amendment): with S the most slices
# one day part carries for request_id, the target per day part is
# T(S) + 100 leaf GETs (evaluate.py day_part_bound), so the total is at most
# that per part the state holds, and every day held is covered while
# 30 x (T(S) + 100) is at most the key-set ceiling's 66,560. A run whose S is
# under 3 is not-run for every figure that depends on it, not a pass. The
# total is judged against 30 x (T(S) + 100), the 30-day state's 30 day parts;
# a state holding other than 30 parts is not that state, so the total is
# not-run there rather than rescaled. The stats carry no per-part leaf GET
# breakdown (no keyIndex.perPart), so the per-part figure reads unsupported
# until they do.
requires_tenant = "dp30"
requires_states = ["day_parts_30"]

[[row.figure]]
name = "slices"
statement = "stamp"
state = "day_parts_30"
metric = "stamp.slices.logs.request_id"
lane = "counter"
target_if = "v >= 1"

[[row.figure]]
name = "per_day_bound"
statement = "derived"
state = "day_parts_30"
metric = "derived"
expr = "day_part_bound(m['adr3939_a7.slices'])"
lane = "counter"
not_run_unless = "m['adr3939_a7.slices'] >= 3"
not_run_reason = "the harness-state amendment needs S of at least 3 slices per day part on the 30-day state, so the multi-slice term is exercised"
target_if = "v >= 100"

[[row.figure]]
name = "leaf_gets_per_part"
statement = "logs_request_in_100_30d"
state = "day_parts_30"
metric = "cold.max.per_part.leaf_gets"
lane = "counter"
not_run_unless = "m['adr3939_a7.slices'] >= 3"
not_run_reason = "the harness-state amendment needs S of at least 3 slices per day part on the 30-day state, so the multi-slice term is exercised"
target_if = "v <= m['adr3939_a7.per_day_bound']"

[[row.figure]]
name = "parts_held"
statement = "stamp"
state = "day_parts_30"
metric = "stamp.covering_parts.logs"
lane = "counter"
target_if = "v >= 1"

[[row.figure]]
name = "leaf_gets"
statement = "logs_request_in_100_30d"
state = "day_parts_30"
metric = "cold.max.leaf_gets"
lane = "counter"
not_run_unless = "m['adr3939_a7.slices'] >= 3 and m['adr3939_a7.parts_held'] == 30"
not_run_reason = "the harness-state amendment needs S of at least 3 slices per day part on the 30-day state, so the multi-slice term is exercised, and that state holds 30 day parts, so the total is 30 x (T(S) + 100)"
target_if = "v <= 30 * m['adr3939_a7.per_day_bound']"

[[row.figure]]
name = "ceiling_gets"
statement = "derived"
state = "day_parts_30"
metric = "derived"
expr = "30 * m['adr3939_a7.per_day_bound']"
lane = "counter"
not_run_unless = "m['adr3939_a7.slices'] >= 3"
not_run_reason = "the harness-state amendment needs S of at least 3 slices per day part on the 30-day state, so the multi-slice term is exercised"
target_if = "v <= 66_560"

[[row.figure]]
name = "parts_covered"
statement = "logs_request_in_100_30d"
state = "day_parts_30"
metric = "cold.min.parts_covered"
lane = "counter"
not_run_unless = "m['adr3939_a7.slices'] >= 3"
not_run_reason = "the harness-state amendment needs S of at least 3 slices per day part on the 30-day state, so the multi-slice term is exercised"
target_if = "v == m['adr3939_a7.parts_held']"

[[row.figure]]
name = "parts_uncovered"
statement = "logs_request_in_100_30d"
state = "day_parts_30"
metric = "cold.max.parts_uncovered"
lane = "counter"
not_run_unless = "m['adr3939_a7.slices'] >= 3"
not_run_reason = "the harness-state amendment needs S of at least 3 slices per day part on the 30-day state, so the multi-slice term is exercised"
target_if = "v == 0"

[[row.figure]]
name = "rows_exact"
statement = "logs_request_in_100_30d"
state = "day_parts_30"
metric = "cold.rows_exact"
lane = "counter"
target_if = "v == 1"

