# The 1,001-key controls, one per table and key kind (evaluate.py
# control_1001). The 1,001-key twin is judged first: 0 when one of its cold
# calls carries a nonzero keyIndex figure, or was served with no keyIndex
# figure, no probe or scan GET and no block scanned; a refused twin call
# passes. Then the 1,000-key list: refused-by-guard when the SQL complexity
# guard refused it, unsupported-on-this-build when it was refused otherwise or
# carries no keyIndex.keysProbed and partsCovered, 0 when it probed another
# count or covered no part, else 1. A build from before ADR-3692's key set
# amendment refuses both lists (MAX_STATEMENT_COMPLEXITY = 1,000 at one unit
# per token), so on such a build all three read refused-by-guard
# (fixtures/local-smoke, pinned by test_control_1001_refused_by_guard_on_main).
