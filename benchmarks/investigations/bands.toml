[[row]]
key = "row_07"
adr_row = 7
check = "fold with the switch on, advancing fold over an unchanged tail plus one new hour"
target = "section GETs = 2 x new entries (plus one per entry whose footer exceeds 8 KiB) plus one GET per previous leaf; `key_index_build_passes` 1 (`G` and a pass factor on the section GETs: the pass-end slice amendment); peak fold RSS under 1.5 GB at the T12 spans corpus (20 M distinct keys, budget 8 M pairs, so 3 passes on the from-scratch build of the sealed part and the report says 3)"
miss = "section GETs over 2 x tail entries (a from-scratch rebuild), passes other than `ceil(pairs / budget)` (the #3704 amendment replaces this miss and the section GETs target), RSS over 2 GB"
source = "predicted; the from-scratch cost is the leaf build switch amendment's `2T`, measured by T12 as 1,656 = 2 x 828 on spans and 796 = 2 x 398 on logs, #2763 comment 6276877460"
requires_tenant = "inv"
# fold_advance is the fold the mixed state runs after its statements. New
# entries, previous leaves and the footer length come from the inspect
# stamps before (mixed) and after (fold_advance) that fold. The footer term
# reads the inspector's footer length of one census object as every new
# entry's; the miss reads "over" as at least, since a from-scratch rebuild
# is exactly 2 x tail entries.
#
# The section GETs are judged per build pass, the #3704 amendment's form as
# the pass-end slice amendment restates it: a build of G passes re-reads its
# new and still-uncovered entries' sections on every pass, so the target is
# 2 x (new + uncovered) x passes ranged GETs (plus one per such entry and
# pass whose footer exceeds 8 KiB), with the previous leaves read once per
# fold as key_index_leaf_gets, a fold report field of its own, equal to the
# previous leaves; the miss is 2 x tail entries per pass, 2 x tail x passes.
# A total compared with 2 x tail entries cannot tell a rebuild from extra
# passes: box D's logs advance read 22 new entries per pass over 27 passes,
# 1,188 ranged GETs, over 2 x 570 = 1,140 and still no rebuild. The second
# signal is the fold's own section count per pass, key_index_sections_read
# over key_index_build_passes, which a rebuild puts at the tail's entry
# count and an incremental advance at new + uncovered. Uncovered is the fold
# report's key_index_uncovered_entries, the entries no leaf covers after the
# fold summed over fields: each was read on every pass, and an entry
# uncovered for two fields counts twice, which can only widen the target.
# The report carries no per-field count, so the row cannot judge per field.
# The sum is safe against a rebuild: neither miss line reads it, and a figure
# whose miss holds is a miss whatever its target says.
#
# The target's passes are G, the pass-end slice amendment's greedy
# partition, bounded (evaluate.py g_bounds) from the fold report's
# key_index_pair_budget and key_index_field_pairs, each indexed field's total
# pairs with zero-pair fields included (evaluate.py G_INPUTS): with share
# s = max(1, budget // F), a field of P pairs takes between ceil(P / s) and
# 2 x ceil(P / s) - 1 groups, at least 1, and the build's passes hold between
# the largest low and the largest high bound over fields, missing outside.
# Per-field key8 runs would give G exactly but would make the fold hold every
# run in memory, which the pair budget exists to prevent. No fold report
# carries the inputs yet (issue #3948 adds them), so build_passes_low and
# build_passes_high read not-computable naming the missing inputs,
# build_passes, judged against them, reads not-computable too, and each
# leaves the run incomplete: row 7 cannot hold until the fold report carries
# G's inputs. build_passes has no miss_if: a rebuild whose passes fall
# between the bounds reads as within range there, and the per-pass section
# figures (section_gets, sections_per_pass) are what catch a rebuild. The
# passes still enter the section GETs and section reads per pass as the
# build reports them.
requires_states = ["mixed"]

[[row.figure]]
name = "spans_mixed_entries"
statement = "stamp"
state = "mixed"
metric = "stamp.entries.spans"
lane = "counter"
target_if = "v >= 1"

[[row.figure]]
