[[row]]
key = "row_15"
adr_row = 15
check = "the journey: failing traces of one service in 1 h (about 50), their logs by `trace_id IN`, their rows"
target = "total GETs at most resolve + 2 x covering parts on spans for the cell's traces + `1 + min(distinct buckets, 64)` per covering part on logs for the 50-key list (about 51 on a 13-bit leaf) + 50 x (footer + SKIP_IDX + block runs) on spans + the logs holders' block reads; under 5 s cold end to end; rows exact"
miss = "over 20 s, or any whole-object read of a non-holder"
source = "predicted from decisions 2 to 6"
requires_tenant = "inv"
requires_states = ["folded_leaves"]
# The three steps: failing_cell (the cell's failing traces), journey_b (their
# logs by trace_id IN) and spans_lookup_1h (one trace's rows). End to end is
# the sum of the three steps' cold p50. The GET budget transcribes the
# target's terms: each step's resolve GETs; 2 x the spans covering parts;
# (1 + min(traces, 64)) x the logs covering parts, the trace count bounding
# the distinct buckets; 3 GETs (footer, SKIP_IDX, one block run) per trace on
# spans; and the logs holders' block reads from truth.json: the cell's
