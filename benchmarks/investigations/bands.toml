lane = "counter"
target_if = "v >= 0"

[[row.figure]]
name = "spans_uncovered_entries"
statement = "fold"
state = "fold_advance"
metric = "fold.inv.spans.key_index_uncovered_entries"
lane = "counter"
target_if = "v >= 0"

[[row.figure]]
name = "spans_section_gets"
statement = "fold"
state = "fold_advance"
metric = "fold.inv.spans.key_index_ranged_gets"
lane = "counter"
target_if = "v <= (2 * (m['row_07.spans_new_entries'] + m['row_07.spans_uncovered_entries']) + ((m['row_07.spans_new_entries'] + m['row_07.spans_uncovered_entries']) if m['row_07.spans_footer_len'] > 8192 else 0)) * m['row_07.spans_build_passes']"
miss_if = "v >= 2 * m['row_07.spans_tail_entries'] * m['row_07.spans_build_passes']"
miss_reason = "from-scratch rebuild: section GETs = 2 x entry_count per pass"

[[row.figure]]
