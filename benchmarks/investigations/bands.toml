[[row]]
key = "row_03"
adr_row = 3
check = "spans lookup, 1 h window, cold, unfolded tail only"
target = "per candidate object the key is absent from: 3 GETs (footer at most 8 KiB in `probe`, prefix and one bucket in `keyIndex`) and at most 16 KB, no SKIP_IDX read; per holder: those plus SKIP_IDX and its block runs; `probe` wire at most 8,192 B per absent object; the count of objects SKIP_IDX dropped after a present key is reported; rows exact"
miss = "over 3 GETs on an absent object, `probe` over 16 KiB per object (the old 64 KiB read), or any `keyIndex` GET on an object whose footer names no KEY_IDX"
source = "predicted; T12 measured 65,536 B per object, #2763 comment 6276877460; restates the T12 acceptance amendment's spans rows"
requires_tenant = "inv"
requires_states = ["unfolded"]

[[row.figure]]
name = "absent_object_gets"
statement = "spans_lookup_1h"
state = "unfolded"
metric = "cold.max.per_object.absent_object_gets"
lane = "counter"
target_if = "v <= 3"

# Probe wire over the candidate objects: the unfolded spans data objects whose
# event range (stamps/unfolded.spans.ranges.json) overlaps the call's window,
# counted from the stamps, never from the call. A perObject breakdown must list
# that many entries. The GET count is not the denominator: an object probed in
# two GETs would halve the figure. It does not split absent
# objects from holders (that needs the per-object breakdown); a holder's
# probe is the same footer read.
[[row.figure]]
name = "probe_wire_per_object"
statement = "spans_lookup_1h"
state = "unfolded"
metric = "cold.max.probe_wire_per_object"
lane = "counter"
target_if = "v <= 8192"
miss_if = "v > 16384"

[[row.figure]]
name = "keyindex_gets_without_kidx"
statement = "spans_lookup_1h"
state = "unfolded"
metric = "cold.max.per_object.keyindex_gets_without_kidx"
lane = "counter"
target_if = "v == 0"

[[row.figure]]
name = "skip_idx_dropped_reported"
statement = "spans_lookup_1h"
state = "unfolded"
metric = "cold.max.skip_idx_dropped"
lane = "counter"
target_if = "v >= 0"

[[row.figure]]
name = "rows_exact"
statement = "spans_lookup_1h"
state = "unfolded"
metric = "cold.rows_exact"
lane = "counter"
target_if = "v == 1"

