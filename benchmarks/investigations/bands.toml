# One cell per (field, list size): the advanced_leaves p50 of the cold calls
# (cold.leaf_wall_p50_s) against the bound U + max(0.05 x U, 0.5 x IQR), U
# the unfolded p50 of the same statement and IQR the 75th less the 25th
# percentile of its unfolded cold wall times, both on this run's box. A
# cell any of whose cold calls left a covering part Uncovered (partsCovered
# 0, or partsUncovered, skippedByBudget, partsBeyondCeiling, leavesRejected
# or reservationsRefused above 0) is not-measured: not a hold, and the run's
# verdict is at best incomplete. The row is not-run, with the reason, when
# either state is absent.
