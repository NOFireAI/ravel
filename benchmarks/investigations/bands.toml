# ADR-3692 Acceptance rows 1 to 17, transcribed from
# docs/adrs/3692-selective-investigations-logs-traces.md ("Acceptance
# (pre-registered ...)"). The text of `check`, `target`, `miss` and `source`
# is the ADR's own cells, verbatim; the target_if and miss_if expressions are
# transcriptions of that text into figures this harness can extract, and
# where a transcription had to choose, the comment above the figure says
# what it chose. Each [[row.figure]] is one figure evaluate.py extracts from
# the run and judges:
#
#   name        the figure's name within the row
#   statement   a statements.toml id; "fold" for a fold-report figure; "stamp"
#               for a figure read from a per-state inspect or census stamp;
#               "derived" for a figure computed from other figures; "all"
#               for a whole-run figure; "control" for row 16's paired run
#   state       the state the figure is measured in (for a fold figure, the
#               transition whose report it reads, unless transition says)
#   transition  optional, fold figures only: the fold stamp to read when it is
#               not the state's own ("leaf_rebuild", the folded_leaves
#               state's --rebuild-key-index step)
#   metric      what evaluate.py extracts (README.md "Evaluation"):
#                 <temp>.max|min.<name>       a statement's call counters
#                 <temp>.rows_exact, <temp>.rows_match_state.<state>,
#                 <temp>.wall_p50_s, <temp>.control_1001
#                 stamp.<what>.<label>        stamps/STATE.LABEL.*.json
#                 leaf_share.<label>.<field>  that field's leaf bytes over the
#                                             label's census data bytes, in %
#                 census.<tenant>.<signal>.objects|bytes|objects_over_512k
#                 truth.<path>                an integer truth.json holds
#                 fold.<tenant>.<label>.<field>
#                 derived (with expr, over m: the figures defined above it)
#   expr        derived figures only: a Python expression over m
#   lane        "counter": judged on every lane; "timing": judged on the s3
#               lane only (decision 8: the local lane is counter-only), and
#               reported but not judged on the local lane
#   requires_states  optional, per figure: states the figure needs beyond its
#               own; a figure whose state is not live is not-run
#   target_if   Python expression over v (the figure) and m (every figure of
#               the run by id); false is a miss
#   miss_if     Python expression; true is a miss. A figure outside its target
#               is a miss whether or not miss_if holds (the ADR: "a figure
#               outside its band is a miss").
#   miss_reason optional: the reason a miss carries when miss_if holds
#
# A figure id is "<row key>.<name>". evaluate.py requires every figure of a
# row the run covers to be present exactly once: absent is `missing`, two
# inputs for it are `duplicate`, and a figure this build cannot produce is
# `unsupported-on-this-build` with the reason (only the allowlisted fields:
# the stats.keyIndex members, skipIdxDropped and the per-object and per-part
# breakdowns). A row whose tenant, state or lane the run did not include is
# `not-run` with the reason, and its figures are not required.

[[row]]
key = "row_01"
adr_row = 1
check = "spans lookup, no time range, folded with leaves, one covering part (the T12 tenant: 828 objects)"
target = "leaf GETs = 2; GETs for objects the leaf proves absent = 0; data GETs at most 2 + holders x (footer + SKIP_IDX + block runs), 8 or fewer for a 10-span trace in one object; wire under 300 KB; 10 rows; `partsCovered` 1"
miss = "over 20 GETs, over 1 MB, any `probe` GET on a pruned object, or a row count other than the unfolded answer's"
source = "predicted from ADR-2707 decision 5 against T12's 2,429 GETs and 55.7 MB, #2763 comment 6276877460"
requires_tenant = "inv"
requires_states = ["folded_leaves", "unfolded"]

# The Acceptance preamble: covering parts is the stamped part count.
[[row.figure]]
name = "covering_parts"
statement = "stamp"
state = "folded_leaves"
metric = "stamp.covering_parts.spans"
lane = "counter"
target_if = "v == 1"

[[row.figure]]
name = "leaf_gets"
statement = "spans_lookup_norange"
state = "folded_leaves"
metric = "cold.max.leaf_gets"
lane = "counter"
target_if = "v == 2 * m['row_01.covering_parts']"

[[row.figure]]
name = "absent_object_gets"
statement = "spans_lookup_norange"
state = "folded_leaves"
metric = "cold.max.per_object.absent_object_gets"
lane = "counter"
target_if = "v == 0"

[[row.figure]]
name = "data_gets"
statement = "spans_lookup_norange"
state = "folded_leaves"
metric = "cold.max.data_gets"
lane = "counter"
target_if = "v <= 8"

[[row.figure]]
name = "total_gets"
statement = "spans_lookup_norange"
state = "folded_leaves"
metric = "cold.max.total_gets"
lane = "counter"
miss_if = "v > 20"

[[row.figure]]
name = "wire_bytes"
statement = "spans_lookup_norange"
state = "folded_leaves"
metric = "cold.max.wire_bytes"
lane = "counter"
target_if = "v < 300_000"
miss_if = "v > 1_000_000"

[[row.figure]]
name = "rows_exact"
statement = "spans_lookup_norange"
state = "folded_leaves"
metric = "cold.rows_exact"
lane = "counter"
target_if = "v == 1"

[[row.figure]]
name = "rows_match_unfolded"
statement = "spans_lookup_norange"
state = "folded_leaves"
metric = "cold.rows_match_state.unfolded"
lane = "counter"
target_if = "v == 1"

[[row.figure]]
name = "parts_covered"
statement = "spans_lookup_norange"
state = "folded_leaves"
metric = "cold.max.parts_covered"
lane = "counter"
target_if = "v == m['row_01.covering_parts']"

