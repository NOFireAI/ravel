# Band file for the selective-investigations harness (issue #3699).
# Encodes ADR-3692 "Decision 8 / Acceptance", rows 1-17, verbatim from
# docs/adrs/3692-selective-investigations-logs-traces.md. Every key here
# must be present EXACTLY ONCE in a run's results.json, or evaluate.py
# fails with "missing <name>" / "duplicate <name>" rather than silently
# skipping the row (see evaluate.py: ONE presence-and-band check for
# every figure it reports).
#
# target/miss are evaluated by evaluate.py against the named results.json
# figure. lanes lists which lane(s) a row is judged on; a lane not listed
# there is reported for that row but never judged (ADR-3692 8, "Lanes").
# judged = false rows (14, 15, 17) are reported, never pass/failed.

[row_01_spans_lookup_no_range_folded_leaves]
figure = "spans_lookup_no_range.folded_leaves.p50_ms"
target = "value <= 5"
miss = "value > 5 for 3 consecutive runs"
lanes = ["local"]
judged = true

