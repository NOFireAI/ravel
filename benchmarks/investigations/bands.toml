[[row]]
key = "adr3939_w2"
adr = "ADR-3939"
adr_row = "W2"
check = "W2 one tombstoned hour in a sealed logs day, decision 5 alone"
target = "31 previous-leaf GETs, 0 section GETs for unchanged entries, at most 1.31 GB written"
miss = "any section GET for an unchanged entry"
source = "predicted; fold.rs `PreviousTail::from_head` and `feed_carried_key_index`"
# W2 is measured on the main SHA that carries C1 and not R2 (the
# harness-state amendment): after R2 a tombstoned hour in a sealed day takes
# the retired_hours path and is not re-encoded. The retired_hour state's fold
# (transition retired_hour) is the fold after the tombstone, and
# stamps/retired_hour.logs.fold_binary.json names its binary: sha,
# carries_c1, carries_r2 (box/run.sh state_retired_hour writes it from git
# ancestry against run.toml's [retired_hour] c1_sha and r2_sha). Without the
# stamp the binary figure is missing and every other figure is not-run until
# it says C1 without R2. The fold is `ravel-cli catalog fold
# --key-index-leaves --retention-default <R>`, whose --json report the three
# fold fields are read from; a field the report lacks reads unsupported on
# that build. A binary carrying R2 (or no C1) is one W2 is not
# measured on: the binary figure and the rest are not-run and listed not
# requested with the binary's SHA, never a miss, so a run on the R2 build
# that holds retired_hour for W3 and W8 is not failed by W2.
requires_tenant = "dp7"
requires_states = ["retired_hour"]

[[row.figure]]
name = "fold_binary_pre_r2"
statement = "stamp"
state = "retired_hour"
metric = "stamp.fold_binary_pre_r2.logs"
lane = "counter"
target_if = "v == 1"

[[row.figure]]
name = "previous_leaf_gets"
statement = "fold"
state = "retired_hour"
transition = "retired_hour"
metric = "fold.dp7.logs.key_index_leaf_gets"
lane = "counter"
not_run_unless = "m['adr3939_w2.fold_binary_pre_r2'] == 1"
not_run_reason = "W2 runs only on a fold binary that carries C1 and not R2 (the harness-state amendment), and the run stamps that binary's SHA"
target_if = "v == 31"

[[row.figure]]
name = "unchanged_section_gets"
statement = "fold"
