# Objects read past the probe are the probed objects the key index did not
# prune: the plan phase's segmentsOpened less pruning.segmentsPrunedByKeyIndex.
# The logs keyed plan counts every object whose KEY_IDX footer it probed as
# opened in the plan phase, absent key or not (log_fetcher.rs,
# plan_segment_keyed and probe_segment_keyed). The scan phase's segmentsOpened
# is not this figure: the plan does not probe an object at or under 512 KiB,
# so the scan can open objects no probe saw. Box C's q20: 523 objects, 26
# pruned by stats, 4 at or under 512 KiB, 493 probed, 492 of those pruned by
# the key index, so 1 here and 5 survivors in all; the scan opened 4 of the 5,
# and the stats do not name which.
#
# The figure is judged only when the plan opened exactly the probed objects:
# plan segmentsOpened == census objects_over_512k - pruning.segmentsPrunedByStats
# (box C: 519 - 26 = 493). The plan keeps objects at or under 512 KiB out
# only when it skips sub-bound plans (plan.rs, skips_sub_bound_plans);
# otherwise it opens them unprobed and they would count as survivors. When
# the equality fails, or the census carries no objects_over_512k for the
# statement's tenant and signal, the figure reads incomplete with the
# precondition as its reason, never a hold or a miss. A small object pruned by stats also breaks
# the equality (it is in segmentsPrunedByStats but not in objects_over_512k),
# which reads incomplete too: the safe direction.
[[row.figure]]
name = "objects_past_probe"
statement = "q20_hits"
state = "unfolded"
metric = "cold.max.probe_survivors"
lane = "counter"
target_if = "v == 1"

