# ADR-3939 Acceptance rows A1 to A7 and the added rows W1 to W8 and F1 to F3,
# transcribed from docs/adrs/3939-key-index-day-seal.md ("Acceptance
# (pre-registered ...)" and "Acceptance (added rows ...)"), cells verbatim as
# above. Each carries adr = "ADR-3939" and its ADR row label in adr_row. They
# run on the multi-day states of the harness-state amendment, day_parts_7,
# day_parts_30 and retired_hour, which box/run.sh builds (state_day_parts and
# state_retired_hour) on their own tenants: day_parts_7 and retired_hour on
# dp7, day_parts_30 on dp30, so their fold metrics read fold.dp7 and
# fold.dp30. A run.toml without them reports each row not-run, naming the
# state.

[[row]]
key = "adr3939_a1"
adr = "ADR-3939"
adr_row = "A1"
check = "A1. advance at a full-day tail, logs, switch on"
target = "at most 26 build passes, at most 1.4 GB leaf bytes written, fold peak RSS at most 2.0 GB"
miss = "more than 26 passes, over 1.4 GB, or over 2.0 GB RSS (predicted peak about 1.93 GB). An RSS miss with the passes and bytes in band is not fixed inside this decision: it opens a follow-up on a 6-hour seal span (costed above) or on the held previous-leaf rule"
source = "predicted; box D rates, comment 6700944105"
# The advance rows run on a tail loaded through the server after the
# 7-day state's fold (the harness-state amendment): the fold report of that
# advance, transition day_parts_7_advance on the day-part tenant. The
# passes are the report's key_index_build_passes, the bytes its leaf bytes
# written, the RSS the fold stamp's measured peak.
requires_tenant = "dp7"
requires_states = ["day_parts_7"]

[[row.figure]]
name = "build_passes"
statement = "fold"
state = "day_parts_7"
transition = "day_parts_7_advance"
metric = "fold.dp7.logs.key_index_build_passes"
lane = "counter"
target_if = "v <= 26"
miss_if = "v > 26"

