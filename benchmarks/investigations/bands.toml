# The over-cap controls, one per table and key kind (evaluate.py
# control_1025): 1,025 keys, one over decision 6's k = 1,024 (the Stage 1
# amendment). The guard admits the list (a flat list costs one unit plus one
# per 64 literals, up to 4,096 literals) and the planner carries no key set
# past 1,024 keys, so a correct build answers it with a scan: keysProbed 0,
# partsCovered 0, 0 leaf GETs (services/ravel-server/tests/sql_key_in.rs,
# in_list_rows_equal_the_union_of_equalities). The 1,025-key twin is judged
# first: 0 when one of its cold calls carries a nonzero keyIndex figure, or
# was served with no keyIndex figure, no probe or scan GET and no block
# scanned. Then the 1,000-key list: refused-by-guard when the SQL complexity
# guard refused it, unsupported-on-this-build when it was refused otherwise or
# carries no keyIndex.keysProbed and partsCovered, 0 when it probed another
# count or reported partsCovered 0 with no part in an Uncovered outcome, or
# when the twin was refused while it was admitted, else 1. A part Uncovered
# by budget (partsCovered 0, skippedByBudget 1, as on box C) still carried
# the 1,000-key set, so it passes. A build from before ADR-3692's key set amendment refuses
# both lists (MAX_STATEMENT_COMPLEXITY = 1,000 at one unit per token), so on
# such a build all three read refused-by-guard (fixtures/local-smoke, pinned
# by test_control_1025_refused_by_guard_on_main).
[[row.figure]]
name = "spans_control_1025"
statement = "spans_in_1000"
state = "folded_leaves"
metric = "cold.control_1025"
lane = "counter"
target_if = "v == 1"

