# The local lane's smoke run, whose outputs are committed under
# fixtures/local-smoke/ (issue #3699): every state and statement of the s3
# lane's flow against a loopback RustFS, at 1,000 traces and 2 cold runs, so
# it finishes on one small machine. Its figures prove the flow, not the bands:
# timing is judged on the s3 lane only. README.md "Local lane" gives the
# command.

[run]
lane = "local"
states = ["unfolded", "folded_no_leaves", "folded_leaves", "mixed", "many_parts"]
cold_runs = 2
warm_runs = 1
hits = false
scales = [1]
baseline = false
mixed_wait_max_minutes = 70

[corpus]
traces = 1000
hours = 2
seed = 7
spans_per_trace = 10
logs_per_trace = 5

[server]
tenant = "inv"
shards = 2
memory_budget_bytes = 1000000000

[unsupported_states]
many_parts = "ravel-cli load has no --ingest-hour-stride on this build, so the many-parts state (one part per ingest hour across the corpus) cannot be built"

[prices]
get_per_1000 = 0.0004
get_per_1000_source = "AWS S3 Standard pricing, us-east-1: GET, SELECT and all other requests, $0.0004 per 1,000 requests"
put_per_1000 = 0.005
put_per_1000_source = "AWS S3 Standard pricing, us-east-1: PUT, COPY, POST, LIST requests, $0.005 per 1,000 requests"
storage_gb_month = 0.023
storage_gb_month_source = "AWS S3 Standard pricing, us-east-1: first 50 TB per month, $0.023 per GB"
instance_per_hour = 0.612
instance_per_hour_source = "AWS EC2 on-demand pricing, us-east-1, Linux: c6a.4xlarge $0.612 per hour"

[cost]
lookups_per_part_month = 1000
lookups_per_part_month_source = "assumption: 1,000 selective lookups per snapshot part per month, ADR-3692 gives no frequency"
amortise_months = 1
