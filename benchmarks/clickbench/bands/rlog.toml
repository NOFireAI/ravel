# Bands for the ClickBench kit's RLOG lane (benchmarks/clickbench/kit,
# ADR-2867 change 2): the 43 statements of hits.corpus.json over HTTP against
# a ravel-server on the box, cold then hot.
#
# The kit's lib/kit.py reads this file and refuses a missing key, a key it does
# not know and a removed key, each named. run.toml's band_sections selects which
# sections a run is judged by; a placeholder value is refused only in a selected
# section. The healthz_*, adr1170_* and box_speed_* keys are the exception:
# each may be left out or left a placeholder in any section, and the band is
# then skipped, so they are opt-in.
#
# Hot is a statement's best of its second and third tries (min_ms) and cold
# its first try (cold_ms), the figures the runbook's analyse.py sums.

# Arm B judged against arm A by fetch.sh. Both arms must be comparable first:
# the same dataset, mapping and corpus digests, CPU model, RustFS version,
# audit mode, query window length and resolved server settings.
[relative]
# Statements both arms must answer, out of 43. An arm that answered none
# misses whatever this says. Set it to 43 minus the known deadline misses
# listed here, each with its reason; this file lists none, so it is 43.
min_both_answered = 43
# Each statement both arms answered must return the same row count on B as on
# A; a difference is a miss naming the statement. No key: there is no
# tolerance.
# Pooled error ratio (failed or wrong-answer calls over all calls of the
# benchmark phase only; concurrent has its own band below, and q29_probe and
# perf calls are not counted) at most arm A's plus this.
error_pooled_max_delta = 0.02
# Concurrent queries per second: arm B's qps_pooled (the mean of its rounds'
# QPS, each round's successful calls over its nominal duration, a round with
# calls but no success counted as 0 and only a round with no call left out) at
# least this times arm A's. Inconclusive when the concurrent phase did not run
# on both arms or arm A had no successful call. Basis: the 0.95 this file carried before the concurrent phase existed,
# kept by issue #2873.
qps_min_ratio = 0.95
# Concurrent error ratio: arm B's error_ratio_weighted (failed calls over all
# concurrent calls, summed across rounds; a call fails unless it got a 2xx
# answer and its transfer completed, curl exit 0) at most arm A's plus this.
# The figure is weighted by attempts: during an outage a connection's calls
# fail fast and it makes many more of them, so the figure depends on how
# quickly failures return, and this bound must be calibrated on that basis.
# The results.json concurrent block also reports error_ratio_mean_of_rounds,
# the mean of each round's ratio, only for comparison with earlier readouts;
# no band judges it. Inconclusive when the phase did not run on both arms.
# Basis: issue #2873, the same 0.02 as error_pooled_max_delta.
concurrent_error_pooled_max_delta = 0.02
# q29 probe: arm B's min_s (the fastest timed run, warmup excluded) at most
# this times arm A's. Inconclusive when the probe did not run on both arms or
# a run failed on arm A; a failed run on arm B is a miss. Basis: issue #2873,
# the same 1.15 as hot_statement_max_ratio.
q29_probe_max_ratio = 1.15
# Each statement's hot time at most max(ratio x A's, floor), so noise on a
# sub-floor statement is not a miss.
hot_statement_max_ratio = 1.15
hot_statement_floor_s = 0.2
# Hot and cold sums over the statements both arms answered, each at most this
# times arm A's. A statement arm A answered and arm B did not is a miss of its
# own, named.
hot_sum_max_ratio = 1.05
cold_sum_max_ratio = 1.05
# Optional: the box speed band, checked before any other relative band. Arm
# B's load user CPU seconds over arm A's (provenance.box_speed, stamped by
# box/run.sh from the load step's /usr/bin/time; kit.py box_speed_stamp) must
# lie in [box_speed_min_ratio, box_speed_max_ratio]. Both arms load the same
# rows, so a ratio outside it says the boxes ran at different speeds: the row
# is INVALID and fetch.sh exits 5 (kit.py box_speed_relative; cases "box
# speed" in kit/kit.test.sh). A missing stamp on either arm is inconclusive.
# run.toml's box_speed_band = false makes the row report-only, for a run whose
# loader change is expected to move the load's CPU by more than this band.
# Set both or neither; a placeholder or a missing key skips the band.
# Basis: issue #3490 and #3486 comment 6513957016: five boxes running the
# same binary loaded with 5,974 to 6,092 s of user CPU (a spread of 1.020,
# inside the band whichever two are paired), and the slow box, whose hot sum
# read 54.67 s where others read 48.79 to 49.28 s, used 6,367 s, 1.045 to
# 1.066 times theirs. 1.05 refuses the slow box paired with any box that
# loaded in under 6,064 s (6,367 / 1.05), the fastest included; paired with
# the slowest, 6,092 s, it reads 1.045 and passes.
box_speed_min_ratio = 0.95
box_speed_max_ratio = 1.05
# Optional: GET /healthz latency on port 4318 (the query listener) and 4319
# (the health listener), sampled every 250 ms with a 2 s client timeout during
# the benchmark phase and each concurrent round (those run.toml's
# healthz_phases names, default both); a timeout or a non-200 counts
# as a 2000 ms sample. Arm B's p99 per phase at most this times arm A's, over
# the phases both arms ran. A placeholder or a missing key skips the band.
healthz_p99_max_ratio_4318 = "FILL-IN-ON-REFERENCE-MACHINE"
healthz_p99_max_ratio_4319 = "FILL-IN-ON-REFERENCE-MACHINE"
# Optional: ADR-1170's memory gap, judged on arm B only. For each gated ok
# /metrics scrape of each concurrent round (out/concurrent/round-N/healthz/
# metrics.jsonl in the arm's evidence.tgz), gap = allocated - cache fetch -
# cache catalog - reserved sql - reserved fetch + handoff overlap, all
# mode="all" series, allocated being
# ravel_process_allocator_bytes{allocator="jemalloc",stat="allocated"}. That is
# ADR-1170 decisions 3 and 4's allocator bytes minus unique tracked bytes, with
# allocated in place of the ADR's stat="resident" (issue #3204). Each cache
# term is the family's untiered series, else its tier="ram" series (a server
# given --cache-dir), else 0 when only its tier="disk" series is present,
# since disk-tier bytes are not heap. Per round and
# pooled, the share of B's gated ok scrapes whose gap is above
# adr1170_gap_max_bytes is at most adr1170_gap_share_above_max. Arm A's figures
# print as context and are never judged. Unanswered scrapes, ungated ones
# (taken with the gate down, outside the timed window) and bad ones (answered
# with a non-200 or a transport error) are skipped and counted; an ok scrape on
# B missing any of the six gauges (a cache family with no series in any
# tier), or a B round with no gated ok scrape, makes
# fetch exit 2. Inconclusive when B ran no
# concurrent phase or run.toml's healthz_phases leaves concurrent out. A
# placeholder or a missing key skips the band.
# Basis: 2 GiB is ADR-1170's overhead reserve, still its provisional
# placeholder, and 0.0 allows no scrape above it (issues #3204 and #3181).
# Until the #3181 fixes land, every kit run against main is expected to miss
# this band.
adr1170_gap_max_bytes = 2147483648
adr1170_gap_share_above_max = 0.0

# One arm judged on its own by the box itself. Fill these in on the reference
# machine, then select "absolute" in run.toml's band_sections.
[absolute]
hot_sum_s_max = "FILL-IN-ON-REFERENCE-MACHINE"
cold_sum_s_max = "FILL-IN-ON-REFERENCE-MACHINE"
# Pooled error ratio over the benchmark phase's calls only, as above.
error_pooled_max = "FILL-IN-ON-REFERENCE-MACHINE"
# Concurrent qps_pooled at least this, error_ratio_weighted at most this, and
# the q29 probe's min_s in seconds at most this. error_ratio_weighted is
# weighted by attempts, as concurrent_error_pooled_max_delta above says, and
# its bound must be calibrated on that basis. Each is inconclusive when its
# phase did not run. Basis: none yet; each is set from the reference machine's
# first paired run (issue #2873), and until then a run that selects
# "absolute" is refused.
concurrent_qps_min = "FILL-IN-ON-REFERENCE-MACHINE"
concurrent_error_pooled_max = "FILL-IN-ON-REFERENCE-MACHINE"
q29_probe_s_max = "FILL-IN-ON-REFERENCE-MACHINE"
# Optional: each phase's /healthz p99 in milliseconds on port 4318 and 4319 at
# most this, sampled as the relative healthz bands above say. A placeholder or
# a missing key skips the band, even with "absolute" selected.
healthz_p99_ms_max_4318 = "FILL-IN-ON-REFERENCE-MACHINE"
healthz_p99_ms_max_4319 = "FILL-IN-ON-REFERENCE-MACHINE"

# Each statement's hot time in seconds, keyed by its id's qNN prefix. A
# statement that did not answer misses its band.
[absolute.hot_s_max]
q01 = "FILL-IN-ON-REFERENCE-MACHINE"
q02 = "FILL-IN-ON-REFERENCE-MACHINE"
