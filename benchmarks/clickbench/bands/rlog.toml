# its second and third tries, cold its first, the definitions this file's
# header gives. "null" is a figure the published run did not answer; it has no
# band. concurrent_qps is the file's concurrent_qps. The kit's copies of these
# files are benchmarks/clickbench/kit/testdata/published/v0.28.0/.

