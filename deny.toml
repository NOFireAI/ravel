[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # RUSTSEC-2025-0141: bincode 1.3.3 is unmaintained. It is a runtime
  # dependency of the PromQL parser, not a build-time-only one:
  # promql-parser's lrpar/lrlex serialize the grammar and state tables
  # with bincode when the parser is generated at build time, and the
  # generated parser deserializes them again at runtime, on parser
  # construction inside the shipped binary (lrpar's
  # ctbuilder::_reconstitute). The path is reachable in production, but
  # its only input is the table bytes the build script baked into the
  # binary; no attacker-controlled data ever reaches bincode. That
  # compile-time-fixed input, not unreachability, is why the advisory is
  # acceptable to ignore. No fixed bincode 1.x exists; revisit when
  # promql-parser drops the lrpar bincode dependency.
  "RUSTSEC-2025-0141",
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
# tiny-keccak 2.0.2 is CC0-1.0 (public-domain equivalent). It enters
# only through ahash's hashing constants (ahash <- arrow-array <- arrow).
# Scoped so the global allow list above stays tight.
exceptions = [
  { name = "tiny-keccak", allow = ["CC0-1.0"] },
]

[bans]
multiple-versions = "warn"
# Internal path dependencies were versionless, which cargo-deny counts
# as wildcards. They now carry explicit version fields in the workspace
# Cargo.toml, so no wildcard fires here while registry wildcards stay denied.
# (allow-wildcard-paths does not apply: these crates are not publish = false.)
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
