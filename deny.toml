[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # RUSTSEC-2025-0141: bincode 1.3.3 is unmaintained. It is a runtime
  # dependency of the PromQL parser, not a build-time-only one:
  # promql-parser's lrpar/lrlex serialize the grammar and state tables
  # with bincode when the parser is generated at build time, and the
  # generated parser deserializes them again at runtime, on parser
  # construction inside the shipped binary (lrpar's
  # ctbuilder::_reconstitute). The path is reachable in production, but
  # its only input is the table bytes the build script baked into the
  # binary; no attacker-controlled data ever reaches bincode. That
  # compile-time-fixed input, not unreachability, is why the advisory is
  # acceptable to ignore. No fixed bincode 1.x exists; revisit when
  # promql-parser drops the lrpar bincode dependency.
  "RUSTSEC-2025-0141",
  # RUSTSEC-2024-0436: paste 1.0.15 is unmaintained (repo archived).
  # `cargo tree -i paste --depth 1 --all-features` shows three entry
  # points: arrow-flight, parquet (services/ravel-cli's bulk-import
  # loader, ADR-0089), and tikv-jemalloc-ctl (dev-dependency only). All
  # three use it purely as a proc-macro for compile-time identifier
  # concatenation. paste has no runtime API surface at all: it expands
  # entirely during macro invocation and contributes nothing to the
  # compiled binary or its runtime behavior, so "unmaintained" has no
  # runtime security implication here, unlike a crate that ships code
  # that executes. No safe upgrade exists (the advisory's own suggested
  # forks, pastey and with_builtin_macros, are not drop-in and none of
  # the three depends on either); revisit if they drop paste upstream.
  "RUSTSEC-2024-0436",
  # RUSTSEC-2026-0194 and RUSTSEC-2026-0195: quick-xml 0.26.0 and 0.39.4
  # (two versions, both affected; quick-xml 0.41.0 fixes both) enter
  # through two separate direct parents, checked mechanically by
  # scripts/guards/check-quick-xml-entry-points.sh:
  #
  # - quick-xml 0.26.0 enters through inferno 0.11.21's SVG rendering
  #   (inferno <- pprof, `flamegraph` feature), which both ravel-bench and
  #   services/ravel-cli pull behind their own off-by-default `profiling`
  #   feature (see the matching `inferno` CDDL-1.0 license exception
  #   below).
  # - quick-xml 0.39.4 enters through object_store 0.13.2's own `aws`
  #   feature, which crates/ravel-bench/Cargo.toml turns on directly
  #   (`object_store = { version = "0.13", optional = true, features =
  #   ["aws"] }`), gated by ravel-bench's own off-by-default
  #   `parquet-baseline` feature. NOT through parquet's `object_store`
  #   feature: that feature only adds parquet's own (optional) dependency
  #   on the object_store crate for its async reader, without `aws` or any
  #   other cloud feature, and pulls no quick-xml on its own
  #   (`cargo tree --locked -p ravel-cli -i object_store@0.13.2` shows
  #   object_store 0.13.2 reachable through both parquet and datafusion,
  #   but `cargo tree --locked -p ravel-cli -i quick-xml@0.39.4` exits 101,
  #   "did not match any packages": quick-xml only enters once
  #   ravel-bench's own `aws` feature is turned on, via
  #   `--features parquet-baseline`). Not through inferno either:
  #   pprof/inferno never links this copy of object_store.
  #
  # Both advisories describe CPU/memory exhaustion from parsing
  # attacker-controlled, untrusted XML with many attributes or namespace
  # declarations on a single start tag. Neither reachable input is
  # attacker-controlled here: inferno's quick-xml usage only parses and
  # writes flamegraph SVG built from locally generated pprof sample data
  # (symbol names and stack frames from the same process). object_store's
  # quick-xml usage parses ListObjectsV2 and error response bodies from
  # the S3-compatible endpoints this bench-only reader is configured to
  # talk to, which are remote HTTP responses, not locally generated data;
  # the ignore does not rest on that XML being trusted, only on the
  # shipped-build unreachability below.
  #
  # The ignore rests on ravel-bench being `publish = false` with no
  # production caller, and on no shipped binary's feature set turning on
  # `object_store`/`cloud` for this DataFusion-side 0.13 copy: the root
  # Dockerfile's four release builds (ravel-server --features
  # sql,flight-sql,otap; ravel-cli; ravel-operator;
  # ravel-ingest-router) never pass `profiling` or `parquet-baseline`.
  # ravel-object-store's own object_store dependency is 0.14.1, which
  # resolves quick-xml 0.41.0 and is unaffected.
  #
  # No object_store 0.13.x release beyond 0.13.2 exists yet (parquet's own
  # dependency on it is a caret range, so a patch bump would resolve
  # automatically). Inferno itself is not the blocker for quick-xml
  # 0.26.0: inferno 0.12.7 and later already declare `quick-xml = "^0.41"`.
  # The live blocker is pprof: every pprof release from 0.12 through 0.15
  # still requires `inferno = "0.11"`, so nothing in this workspace can
  # reach an inferno past 0.11.x without a pprof release that moves to
  # inferno 0.12, followed by a workspace bump of both. Revisit when
  # pprof does that, or when a fixed object_store 0.13.x appears.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
# tiny-keccak 2.0.2 is CC0-1.0 (public-domain equivalent). It enters
# only through ahash's hashing constants (ahash <- arrow-array <- arrow).
# Scoped so the global allow list above stays tight.
#
# inferno 0.11.x is CDDL-1.0. It enters only through pprof's `flamegraph`
# feature (inferno <- pprof), which both ravel-bench and services/ravel-cli
# pull behind their own off-by-default `profiling` feature. ravel-bench is
# `publish = false` with no production caller; ravel-cli is a shipped
# binary, but its default build (the root Dockerfile's `cargo build
# --release --locked -p ravel-cli`, no --features) never turns `profiling`
# on, so inferno never reaches the shipped image either. Scoped to the
# crate name so the global allow list stays tight and CDDL-1.0 is not
# permitted for any other dependency.
exceptions = [
  { name = "tiny-keccak", allow = ["CC0-1.0"] },
  { name = "inferno", allow = ["CDDL-1.0"] },
]

[bans]
multiple-versions = "warn"
# Internal path dependencies were versionless, which cargo-deny counts
# as wildcards. They now carry explicit version fields in the workspace
# Cargo.toml, so no wildcard fires here while registry wildcards stay denied.
# (allow-wildcard-paths does not apply: these crates are not publish = false.)
wildcards = "deny"
# Backstop for the RUSTSEC-2026-0194/-0195 ignore above: if either wrapper
# ever resolves a quick-xml older than 0.41 through some OTHER path than the
# two named above, or a third wrapper starts pulling one in, this fails the
# build instead of silently widening the ignore's blast radius.
deny = [{ crate = "quick-xml:<0.41", wrappers = ["inferno", "object_store"] }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
