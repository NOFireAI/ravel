[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # RUSTSEC-2025-0141: bincode 1.3.3 is unmaintained. It is a runtime
  # dependency of the PromQL parser, not a build-time-only one:
  # promql-parser's lrpar/lrlex serialize the grammar and state tables
  # with bincode when the parser is generated at build time, and the
  # generated parser deserializes them again at runtime, on parser
  # construction inside the shipped binary (lrpar's
  # ctbuilder::_reconstitute). The path is reachable in production, but
  # its only input is the table bytes the build script baked into the
  # binary; no attacker-controlled data ever reaches bincode. That
  # compile-time-fixed input, not unreachability, is why the advisory is
  # acceptable to ignore. No fixed bincode 1.x exists; revisit when
  # promql-parser drops the lrpar bincode dependency.
  "RUSTSEC-2025-0141",
  # RUSTSEC-2024-0436: paste 1.0.15 is unmaintained (repo archived). It
  # enters only through parquet (services/ravel-cli's bulk-import loader,
  # ADR-0089), which uses it purely as a proc-macro for compile-time
  # identifier concatenation. paste has no runtime API surface at all: it
  # expands entirely during macro invocation and contributes nothing to
  # the compiled binary or its runtime behavior, so "unmaintained" has no
  # runtime security implication here, unlike a crate that ships code
  # that executes. No safe upgrade exists (the advisory's own suggested
  # forks, pastey and with_builtin_macros, are not drop-in and parquet
  # does not depend on either); revisit if parquet drops paste upstream.
  "RUSTSEC-2024-0436",
  # arrayref: every published version satisfying blake3's `^0.3.5`
  # requirement (0.3.5 through 0.3.9, the crates.io max as of 2026-08-20)
  # is yanked. No RUSTSEC advisory exists for this yank; it is a plain
  # crates.io yank with no stated reason, not a known vulnerability.
  # blake3 1.8.6 (latest) still depends on the same `^0.3.5` range, so no
  # dependency bump avoids it, and downgrading to the last non-yanked
  # 0.3.4 fails blake3's requirement. arrayref is a small, stable
  # array-reference macro crate with no history of security advisories;
  # accepting the currently-locked 0.3.9 (last version published before
  # the yank) carries no known additional risk. Revisit when blake3 or
  # arrayref publish a release that resolves this without a yanked
  # dependency.
  "arrayref",
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
# tiny-keccak 2.0.2 is CC0-1.0 (public-domain equivalent). It enters
# only through ahash's hashing constants (ahash <- arrow-array <- arrow).
# Scoped so the global allow list above stays tight.
exceptions = [
  { name = "tiny-keccak", allow = ["CC0-1.0"] },
]

[bans]
multiple-versions = "warn"
# Internal path dependencies were versionless, which cargo-deny counts
# as wildcards. They now carry explicit version fields in the workspace
# Cargo.toml, so no wildcard fires here while registry wildcards stay denied.
# (allow-wildcard-paths does not apply: these crates are not publish = false.)
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
