[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # a11-F06 (RUSTSEC-2025-0141): bincode 1.3.3 is unmaintained. It enters the
  # graph only as a build-time transitive dependency of promql-parser's
  # lrpar/lrlex parser generator; there is no runtime use and no upgrade is
  # available. Revisit when promql-parser drops the lrpar bincode dependency.
  "RUSTSEC-2025-0141",
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
# a11-F08: tiny-keccak 2.0.2 is CC0-1.0 (public-domain equivalent). It enters
# only through ahash's hashing constants (ahash <- arrow-array <- arrow).
# Scoped so the global allow list above stays tight.
exceptions = [
  { name = "tiny-keccak", allow = ["CC0-1.0"] },
]

[bans]
multiple-versions = "warn"
# a11-F07: internal path dependencies were versionless, which cargo-deny counts
# as wildcards. They now carry explicit version fields in the workspace
# Cargo.toml, so no wildcard fires here while registry wildcards stay denied.
# (allow-wildcard-paths does not apply: these crates are not publish = false.)
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
