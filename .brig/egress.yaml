# The hosts the Ravel sandbox reaches directly. GitHub and Anthropic go
# through the routes in github.yaml and claude.yaml, not this list.
# See docs/internal/dev-in-brig.md.
apiVersion: brig.sh/v1alpha1
kind: Policy
metadata:
  name: ravel-egress
  description: Default-deny egress for the Ravel dev target, with crates.io, the Rust toolchain host and the npm registry allowed
spec:
  egress:
    default: deny
    allow:
      # The image carries the registry for the Cargo.lock it was built from.
      # These two serve the crates a newer lockfile adds.
      - host: index.crates.io
      - host: static.crates.io
      # A rust-toolchain.toml newer than the image: rustup installs it on the
      # first cargo command.
      - host: static.rust-lang.org
      # npm ci for the TypeScript SDK, past what the image's cache holds.
      - host: registry.npmjs.org
