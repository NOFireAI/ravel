name: bench-compare

# ADR-0070 tier B: a criterion smoke compare of the pure-CPU bench set against
# the committed baseline under bench/baselines/, posting a PR comment.
#
# Owner decision, 2026-09-19 (ADR-0070 amendment): this repository gets no
# self-hosted GitHub Actions runner. It is public, and a self-hosted runner
# executes workflow code from forked pull requests unless every entry point is
# gated; the `ravel-reference` label this job was written against will not be
# registered. The job below is disabled (`if: false`) rather than left
# pointing at that label: an unregistered label does not skip a job, it queues
# it for about 24 hours and then fails it, which on workflow_dispatch would
# just be a slower way of doing nothing. `runs-on: ubuntu-latest` is a syntax
# placeholder only -- the job never reaches it while `if: false` holds -- not a
# decision to run the comparison there. A GitHub-hosted runner is not a
# drop-in replacement: ADR-0070 decision 3 treats a criterion timing number as
# only comparable to a baseline taken on the same, non-noisy hardware, which a
# shared hosted runner is not.
#
# The comparison logic itself (scripts/bench-tier-b.sh, scripts/bench-compare.py)
# is unchanged and still runnable by hand or from a workstation; only this
# workflow's ability to run it in CI is gated off. Restoring it needs an
# owner's decision on where it runs (a re-registered self-hosted reference
# runner, or a GitHub-hosted runner against infrastructure -- e.g. an object
# store -- the workflow provisions itself) before `if: false` comes out.
#
# It is ADVISORY by default even when runnable: `bench-tier-b.sh compare`
# without `--enforce` exits 0 regardless of the result, so this lane never
# blocks a merge. It posts a comment and stops there. The machinery to BLOCK
# exists and is reachable: a manual dispatch with `enforce=true` runs the
# compare with `--enforce`, which fails the job on a regression past the
# threshold. Per ADR-0070 that enforcing mode is gated on a probation window
# (see the ADR amendment for issue #533) and must not be wired onto a
# pull_request trigger without an owner's decision. This file deliberately
# keeps the automatic path advisory, and per the 2026-09-19 amendment stays
# workflow_dispatch-only: nothing here runs on every pull request, so nothing
# here can gate a merge.
#
# CARGO_TERM_COLOR is intentionally NOT set to always here (unlike the other
# bench lanes): the compare reads criterion JSON, and a colored terminal would
# only risk leaking ANSI codes into logs. The compare never greps stdout.
on:
  workflow_dispatch:
    inputs:
      enforce:
        description: "Fail the job on a regression past the threshold (probation only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bench-compare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench-compare:
    # Disabled: no self-hosted runner is registered on this repository (owner
    # decision, 2026-09-19; ADR-0070 amendment). Restoring this job is an
    # owner decision on where it runs, not a mechanical edit; see the header
    # comment. The rest of this `if` is the pre-existing same-repository guard
    # (this repository is public, so a fork can open a pull request, and this
    # job checks out the head and runs cargo bench from it with a token that
    # has pull-requests: write; running fork code is arbitrary code execution
    # on whatever runs this job). It stays in place, dead code for now under
    # `false &&`, so it does not need re-deriving whenever this job is
    # re-enabled and a pull_request trigger returns.
    if: >-
      false &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    # Placeholder only: the job never reaches a runner while `if: false`
    # holds above. Not a decision to run the comparison on a GitHub-hosted
    # runner -- see the header comment for what restoring this needs.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This job holds pull-requests: write for the comment it posts, and
          # `gh pr comment` reads GH_TOKEN from the environment rather than
          # .git/config. The bench build runs dependency build scripts, so the
          # token must not be readable on disk while they run.
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - name: Run the tier B compare (advisory unless dispatched with enforce)
        id: compare
        env:
          # Only a manual dispatch can enforce; the pull_request path is always
          # advisory. github.event.inputs.enforce is empty on non-dispatch runs.
          ENFORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.enforce == true }}
          # Pinned, not left to the script defaults. RAVEL_BENCH_MAX_SERIES is
          # part of the segment_encode bench id, so a compare run at a different
          # cardinality than the baseline was recorded at produces a bench id
          # that matches nothing: the arm reads as MISSING on one side and as an
          # ignored extra on the other, and drops out of the comparison without
          # failing anything. These must equal the values in the baseline's
          # _meta.knobs.
          BENCH_SAMPLE_SIZE: "10"
          BENCH_WARMUP: "1"
          BENCH_MEASURE: "3"
          RAVEL_BENCH_MAX_SERIES: "2000"
        run: |
          if [ "$ENFORCE" = "true" ]; then
            scripts/bench-tier-b.sh compare bench/baselines/tier-b.json --enforce
          else
            scripts/bench-tier-b.sh compare bench/baselines/tier-b.json
          fi
      - name: Post the comparison as a PR comment
        # Only on pull_request events, and even if an enforcing run failed, so
        # the numbers are always visible.
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f .gate-logs/bench-compare.md ]; then
            gh pr comment "$PR_NUMBER" --body-file .gate-logs/bench-compare.md
          else
            echo "::warning::no bench-compare.md produced; the compare step did not run to completion"
          fi
