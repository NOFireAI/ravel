name: interop-nightly

# Nightly home for the four #[ignore] Docker-backed interop tests under
# services/ravel-server/tests/ (issue #1716):
#
#   remote_write_prometheus_e2e.rs: real_prometheus_rw1_remote_write_is_queryable,
#                                    real_prometheus_rw2_remote_write_is_queryable
#   flight_sql_e2e.rs:               flight_sql_against_rustfs_returns_rows_and_isolates_tenants
#   otap_collector_e2e.rs:           real_collector_otelarrow_export_is_queryable
#
# None of these run in ci.yml: each needs a real Docker daemon pulling a real
# third-party image, which is exactly what `#[ignore]` and the in-process
# sibling suites (remote_write.rs, flight_sql.rs, otap_grpc.rs) exist to avoid
# paying on every push and pull request. GitHub-hosted `ubuntu-latest` runners
# carry a usable Docker daemon and network egress that the fleet executors this
# repo also runs on do not (see each test file's module doc), so this lane is
# the only place these four tests execute at all.
#
# Not a required check and not gated on any PR: triggers are `schedule` and
# `workflow_dispatch` only, matching the house style in fuzz-nightly.yml and
# quickstart-published.yml.
on:
  workflow_dispatch:
  schedule:
    # Daily, 06:09 UTC. Off the :00/:30 mark and distinct from every other
    # nightly/weekly cron in this directory (0 3, 17 4 Mon, 19 7 Sun, 21 5,
    # 13 2, 17 3, 29 6 Sun, 43 5, 37 4) so this lane's run does not contend
    # with another one.
    - cron: "9 6 * * *"

# Workflow-level floor: `contents: read`, what actions/checkout and the cargo
# build need and nothing more. `issues: write` is NOT granted here. It is
# granted on the `report` job alone, which is the only job that files or
# comments on the tracking issue and the only job that runs no third-party
# code (fuzz-nightly.yml's split, and for the same reason: `interop` runs
# dependency build scripts, cargo-fetched crates, and three third-party Docker
# images, all with the job's token in the environment).
permissions:
  contents: read

jobs:
  interop:
    runs-on: ubuntu-latest
    # Every step below executes third-party code with the job's token in the
    # environment: dependency build scripts for the `flight-sql`/`otap`
    # feature graph and four pulled Docker images (Prometheus, RustFS, the AWS
    # CLI, the OTel Collector Contrib distribution). `persist-credentials:
    # false` on the checkout keeps that token out of .git/config where any of
    # that code could read it.
    permissions:
      contents: read
    # Cold feature build (flight-sql pulls in ravel-sql/datafusion, otap pulls
    # in ravel-otap/arrow) plus three image pulls and four Docker-backed
    # tests; generous headroom over the warm-cache steady state.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/free-disk-space
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - name: Install nextest
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Restore everywhere, save only on main: a cache written on a
          # schedule/workflow_dispatch run off main is readable only by a
          # later run of this same workflow, and this workflow only ever runs
          # off main (see the `on:` triggers above), so saving unconditionally
          # would be fine too; matching ci.yml's condition anyway keeps the
          # rule in one place.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # One nextest invocation covers all four tests: each of the three test
      # binaries here contains only the ignored test(s) named in the header
      # comment above (two in remote_write_prometheus_e2e, one each in the
      # other two), so `--run-ignored all` runs exactly those four and nothing
      # else, with no `-E` filter needed to exclude some other default test.
      # `flight-sql` and `otap` are both required: flight_sql_e2e.rs is
      # `#![cfg(feature = "flight-sql")]` and otap_collector_e2e.rs is
      # `#![cfg(feature = "otap")]`; remote_write_prometheus_e2e.rs carries no
      # feature gate and is unaffected by either being on.
      # `--no-capture` surfaces each test's own progress output (container
      # startup, health-check polling) in the log; `--color never` overrides
      # cargo's default TTY-detected coloring so the pass-count grep in the
      # next step is not fed ANSI escapes around the digits and words of the
      # summary line (see ci.yml's contract-suite steps for the same rule).
      - name: Run the four Docker-backed interop tests
        run: |
          set -o pipefail
          cargo nextest run --locked -p ravel-server --features flight-sql,otap \
            --test remote_write_prometheus_e2e \
            --test flight_sql_e2e \
            --test otap_collector_e2e \
            --run-ignored all --no-capture --color never 2>&1 \
            | tee interop-output.txt
      # nextest's summary reads e.g. "4 tests run: 4 passed, 0 skipped" (see
      # ci.yml's contract-suite steps for the same libtest-vs-nextest wording
      # note). Grepping the tee'd file rather than trusting `cargo nextest`'s
      # own exit code catches the same class of silent miss those steps guard
      # against: a build that skips a test through some feature-gate mistake
      # would still exit 0 with fewer than four tests reported.
      - name: Assert the four interop tests ran
        run: |
          if ! grep -qE "4 tests run: 4 passed" interop-output.txt; then
            echo "::error::interop-nightly did not report 4 tests run: 4 passed"
            exit 1
          fi

  # Failure routing, deliberately a separate job: this is the only place that
  # needs `issues: write`, and it is the only job that runs no third-party
  # code. It checks nothing out, installs nothing and uses no action, so the
  # write token is never in the environment of a build script or a
  # Docker-backed test. `gh` is preinstalled on ubuntu-latest and the issue
  # body is built inline, so no `uses:` step is required here. Modelled on
  # fuzz-nightly.yml's `report` job.
  report:
    needs: interop
    # `needs: interop` alone would skip this job, because a dependent of a
    # failed job is skipped by default. The condition has to be explicit, and
    # it has to name a status-check function: an `if:` containing none of
    # always()/failure()/cancelled() still gets an implicit success() ANDed
    # in, which would never be true here. Testing the job result rather than
    # a step-level `if: failure()` also covers `interop` being killed by its
    # own timeout-minutes, which reports `failure` but runs no further step of
    # its own. The condition deliberately does not fire on 'cancelled': a
    # cancellation is human-initiated, not an interop finding.
    if: ${{ always() && needs.interop.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    # Serialize THIS job only, across runs, so the read-then-create below
    # cannot race: a scheduled run and a workflow_dispatch run failing close
    # together would otherwise both see an empty issue list and both create
    # one, breaking the single-issue dedup contract. cancel-in-progress stays
    # false so a run already filing is not cancelled by a newer failing run;
    # the newer run waits for it and re-reads the open issues, so whichever
    # run survives comments on or creates the tracking issue as needed.
    concurrency:
      group: interop-nightly-report
      cancel-in-progress: false
    steps:
      # A red run files a labelled tracking issue linking this run, or
      # comments on the existing open one so a recurring failure does not open
      # a fresh issue every night.
      - name: File or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh has no git remote to infer the
          # repository from and every call would fail without this.
          GH_REPO: ${{ github.repository }}
          ISSUE_LABEL: interop-nightly
          # Deterministic (no run id): both the issue title and the dedup
          # key, so a recurring failure maps to one open issue instead of one
          # per night.
          MARKER: "Nightly Docker interop lane is red"
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh label create "$ISSUE_LABEL" \
            --color BFD4F2 \
            --description "Nightly Docker-backed interop test failures (issue #1716)" \
            2>/dev/null || true
          existing=$(gh issue list --state open --label "$ISSUE_LABEL" \
            --json number,title \
            --jq 'map(select(.title | contains(env.MARKER))) | .[0].number // empty') || existing=""
          body=$(cat <<EOF
          The nightly Docker-backed interop lane failed.

          - Run: $run_url

          This lane runs the four \`#[ignore]\` Docker-backed interop tests
          under services/ravel-server/tests/ (remote_write_prometheus_e2e.rs's
          two Prometheus remote-write tests, flight_sql_e2e.rs's RustFS Flight
          SQL test, otap_collector_e2e.rs's OTel Collector OTAP test) with
          \`cargo nextest run --run-ignored all\`, against pinned mirror
          images (quay.io/prometheus/prometheus, ghcr.io/rustfs/rustfs,
          public.ecr.aws/aws-cli/aws-cli,
          ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib).
          A failure here means a real interop regression, an expired image
          pin, or a Docker/network problem on the runner.

          See the run's log for the failing test and its output.
          EOF
          )
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "commented on existing issue #$existing"
          else
            gh issue create --title "$MARKER" --label "$ISSUE_LABEL" --body "$body"
          fi
