# Nightly TLA+ exhaustive model check (ADR-1113).
#
# The per-PR tla job in ci.yml runs the fast lane (smoke + negative +
# traceability) only when a formal/ or harness change is in the diff. This
# workflow runs the full exhaustive lane (full safety plus liveness, no
# symmetry reduction) over every area every night, since exhaustive is too
# slow for the per-PR budget. A red run here is a real invariant break or a
# state-count regression, never a retry: TLC is deterministic for a fixed
# config.
#
# Areas run as a matrix, one job per area (issue #1358): every area used to
# run sequentially inside one job, and a single slow area (maintenance)
# exceeding its per-config budget put the whole job over its own
# timeout-minutes. Each area now gets its own job and its own 160-minute
# ceiling, and fail-fast is off so one area's failure or timeout does not
# cancel the others mid-run. check-tla.sh's own per-config TLC budget still
# applies inside each job (3600s default, overridable per cfg via bands.tsv's
# budget_s column); an area can run more than one exhaustive config
# sequentially (maintenance runs two), so the job ceiling must bound the sum
# of that area's budgets, not any single config's. Maintenance is the
# largest: 5400s (MCMaintenanceOwnership.exhaustive.cfg's budget_s) + 3600s
# (MCCompactionClaims.exhaustive.cfg's default) = 9000s = 150 minutes, so
# 160 minutes leaves 10 minutes of headroom. check-tla.test.sh's (u) case
# sums each area's exhaustive budgets from its bands.tsv and asserts this
# value stays at least 10 minutes above the largest sum, so a future budget
# change that outgrows this ceiling fails the test instead of timing out
# silently on the next nightly run.
#
# The area list below is the same list scripts/check-tla.sh's discover_areas
# would find under formal/tla (every directory carrying a smoke config);
# scripts/check-tla.test.sh asserts the two stay in sync, so a new area
# cannot be silently skipped by the nightly matrix.
#
# workflow_dispatch exists to verify the job on a pushed branch (no local gate
# can execute a workflow) and to run it ad hoc.
name: tla-nightly

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

concurrency:
  group: tla-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  exhaustive:
    strategy:
      fail-fast: false
      matrix:
        area: [agents, catalog, commit, common, lifecycle, maintenance, resharding]
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      # The TLC jar through the pinned-tool cache (D3, ADR-4034), placed where
      # check-tla.sh's ensure_jar looks for it so it finds the cache hit and
      # skips its own fetch. These values must match scripts/check-tla.sh's
      # TLA_VERSION/TLA_JAR_SHA256/TLA_JAR_URL exactly: that sha256 stays the
      # trust anchor, this cache only saves seven matrix legs' worth of
      # download per run.
      - name: Fetch pinned TLC jar
        uses: ./.github/actions/fetch-pinned-tool
        with:
          name: tla2tools
          version: "1.7.4"
          url: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          sha256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
          dest: .cache/tla/tla2tools-1.7.4.jar
      # Nothing above enforces that this step's version/dest agree with
      # scripts/check-tla.sh's own TLA_VERSION pin: if they drift apart, the
      # cache silently does nothing (ensure_jar looks for a jar that was never
      # placed) and every leg pays for a fresh download instead of failing
      # loud. Derive the expected path from the script itself and fail if it
      # is not there.
      - name: Confirm the fetched jar matches check-tla.sh's expected path
        run: |
          set -u
          expected_version="$(sed -nE 's/^TLA_VERSION="([^"]+)"$/\1/p' scripts/check-tla.sh | head -1)"
          if [ -z "$expected_version" ]; then
            echo "::error::could not read TLA_VERSION from scripts/check-tla.sh"
            exit 1
          fi
          expected=".cache/tla/tla2tools-${expected_version}.jar"
          if [ ! -f "$expected" ]; then
            echo "::error::scripts/check-tla.sh expects the jar at $expected (TLA_VERSION=$expected_version); this workflow's fetch-pinned-tool version/dest has drifted from the script's pin"
            exit 1
          fi
          expected_sha="$(sed -nE 's/^TLA_JAR_SHA256="([^"]+)"$/\1/p' scripts/check-tla.sh | head -1)"
          got_sha="$(sha256sum "$expected" | awk '{print $1}')"
          if [ -z "$expected_sha" ] || [ "$got_sha" != "$expected_sha" ]; then
            echo "::error::$expected has sha256 $got_sha but scripts/check-tla.sh pins TLA_JAR_SHA256=${expected_sha:-unreadable}; this workflow's sha256 has drifted from the script's pin"
            exit 1
          fi
      - name: Exhaustive model check
        # State CI's resource choice rather than inheriting the script's
        # laptop-safe default of 2 workers: `auto` is the previous behaviour
        # on these dedicated runners, where claiming every core is fine and
        # the default of 2 is too slow for the exhaustive budget.
        env:
          RAVEL_TLA_WORKERS: auto
        run: scripts/check-tla.sh exhaustive -a ${{ matrix.area }}
      - name: Upload TLC logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tla-nightly-logs-${{ matrix.area }}
          path: .cache/tla/logs
          if-no-files-found: ignore
