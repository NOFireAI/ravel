name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Share compiled objects across the six workspace-compiling jobs via the
      # GitHub Actions cache backend. rust-cache only restores the dependency
      # registry; sccache reuses the built artifacts themselves.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo nextest run --workspace --cargo-profile ci
      # nextest does not run doctests; keep them covered separately.
      - name: Doctests
        run: cargo test --doc --workspace

  # The SQL surface (ticket B3, issue #22). Two things the `check` job cannot
  # cover:
  #
  # 1. `POST /api/v1/sql` is behind ravel-server's `sql` cargo feature, so
  #    `cargo clippy --workspace --all-targets` and `cargo test --workspace`
  #    never compile the handler, its error-to-HTTP redaction boundary, or
  #    services/ravel-server/tests/sql_endpoint.rs at all.
  # 2. The layer-2 differential gate
  #    (crates/ravel-sql/tests/differential.rs) is only as strong as the
  #    number of proptest cases it runs. `check` runs it at the in-file
  #    default; this job runs it with an elevated case count so the NaN,
  #    signed-zero, denormal, duplicate-timestamp and multi-segment-overlap
  #    space is explored properly.
  #
  # docs/arrow-datafusion-plan.md section 2 requires the gate to be a
  # required test in ravel-sql CI and to re-run on every DataFusion version
  # bump; the golden cases in that file pin DataFusion's min/max NaN and
  # signed-zero semantics, so a bump that changes them fails here.
  sql:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (sql feature)
        run: cargo clippy -p ravel-server --features sql --all-targets -- -D warnings
      - name: SQL endpoint tests
        run: cargo nextest run -p ravel-server --features sql
      - name: Differential correctness gate
        env:
          # Well above the in-file default so CI explores far more of the
          # float edge-case and multi-segment-overlap space than a local run.
          PROPTEST_CASES: 512
        run: cargo nextest run -p ravel-sql --test differential

  # Supply-chain gate (finding a11-F01). deny.toml encodes an advisory,
  # license, ban, and source policy that `make audit` runs locally but no
  # CI job enforced, so a new advisory, banned license, or unknown source
  # could merge to main undetected while CI signalled "clean". This job
  # runs `cargo deny check`, which covers all four sub-checks; the
  # advisories check subsumes cargo-audit, so cargo-audit is not run
  # separately. cargo-deny is provisioned from a pinned action rather than
  # `cargo install` to avoid a from-source build on every run. The gate
  # passes because deny.toml is green (F06-F08 fixed): the bincode
  # advisory is scoped-ignored, tiny-keccak's CC0-1.0 is a scoped license
  # exception, and internal path deps are version-pinned.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: cargo deny check
        run: cargo deny check

  # Corrupt-input mutation fuzzing for the byte parsers (issue #82, audit
  # finding a11-F05). Runs the stable-only proptest mutation targets for the
  # RSEG codecs (varint, gorilla, delta-varint), the RSEG footer/section
  # reader, and the OTAP Arrow IPC decode path with an elevated but bounded
  # case count for deeper exploration than the default `check` run. These
  # decoders read untrusted stored bytes and must return typed errors, never
  # panic. cargo-fuzz/libfuzzer need nightly and are deliberately not used;
  # this stays on the pinned stable toolchain.
  fuzz:
    runs-on: ubuntu-latest
    env:
      # Bounded case count keeps wall-clock in check while exploring far more
      # of the corrupt-input space than the 256-case default.
      PROPTEST_CASES: 4096
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Fuzz RSEG codecs (varint, gorilla, delta-varint)
        run: cargo nextest run -p ravel-segment --lib fuzz_mutation
      - name: Fuzz RSEG footer/section reader
        run: cargo nextest run -p ravel-segment --test fuzz_mutation
      - name: Fuzz OTAP Arrow IPC decode
        run: cargo nextest run -p ravel-otap --test fuzz_mutation

  # Runs the object-store contract suite (docs/object-store-contract.md)
  # against a real MinIO endpoint. Without this job the `minio_contract`
  # test in crates/ravel-object-store/tests/contract.rs early-returns
  # (RAVEL_MINIO_URL unset), so the only durable backend Ravel ships against
  # -- S3 -- gets zero CI coverage and an S3Store regression passes green
  # (finding a11-F02). This job is required: object storage is the source of
  # truth, so a break in the S3 adapter must fail CI, not be waved through.
  #
  # MinIO is launched with `docker run` rather than a GitHub Actions service
  # container because the minio/minio image needs a `server /data` command,
  # which the `services:` syntax cannot supply. The image and default
  # credentials mirror deploy/docker-compose/minio.yml's role.
  object-store-contract:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
      - name: Wait for MinIO to be live
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live; then
              echo "MinIO is live"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO did not become healthy in time"
          docker logs minio || true
          exit 1
      - name: Create the contract-suite bucket
        run: |
          docker run --rm --network host --entrypoint sh minio/mc:latest -c "
            mc alias set local http://localhost:9000 minioadmin minioadmin &&
            mc mb -p local/ravel-object-store-test"
      # The contract suite's S3/MinIO case is gated on RAVEL_MINIO_URL; set it
      # (and the credentials/bucket the docker run above provisioned) so the
      # gated test executes instead of skipping.
      - name: Run object-store contract suite against MinIO
        env:
          RAVEL_MINIO_URL: http://localhost:9000
          RAVEL_MINIO_BUCKET: ravel-object-store-test
          RAVEL_MINIO_ACCESS_KEY: minioadmin
          RAVEL_MINIO_SECRET_KEY: minioadmin
          RAVEL_MINIO_REGION: us-east-1
        run: |
          set -o pipefail
          # nextest equivalent of `--test contract minio_contract -- --exact`:
          # `--test contract` selects the binary and `-E 'test(=minio_contract)'`
          # matches that one test name exactly. `--no-capture` replaces libtest's
          # `--nocapture` so the guard's skip line still reaches stdout. nextest
          # writes its run summary to stderr, so 2>&1 keeps it in the tee'd file.
          # `--color never` overrides the workspace-wide CARGO_TERM_COLOR=always
          # for this one command: nextest otherwise wraps the digits and words
          # of its summary line in ANSI escapes even when piped, which breaks
          # the pass-count grep below.
          cargo nextest run -p ravel-object-store --test contract \
            -E 'test(=minio_contract)' --no-capture --color never 2>&1 \
            | tee contract-output.txt
          # Prove the suite actually ran against MinIO rather than taking the
          # RAVEL_MINIO_URL-unset early return. If the guard printed its skip
          # line, or nextest did not report exactly one passing test, fail the
          # job even though `cargo nextest` itself exited 0 on a clean skip.
          if grep -q "skipping MinIO contract test" contract-output.txt; then
            echo "::error::minio_contract skipped despite RAVEL_MINIO_URL set"
            exit 1
          fi
          # nextest summary reads e.g. "1 test run: 1 passed, 0 skipped"
          # (singular "test" when exactly one ran), not libtest's
          # "test result: ok. 1 passed".
          if ! grep -qE "1 tests? run: 1 passed" contract-output.txt; then
            echo "::error::minio_contract did not run (expected 1 passed)"
            exit 1
          fi
      - name: Stop MinIO
        if: always()
        run: docker rm -f minio || true

  # PromQL differential test (issue #124, docs/promql-evaluator-plan.md
  # section 5, ADR-0021 decisions 4-5): checks Ravel's PromQL evaluator
  # against a pinned real Prometheus binary for bit-exact correctness on
  # the selector and error corpora in crates/ravel-promql-difftest/corpus.
  #
  # scripts/fetch-prometheus.sh verifies the downloaded archive's sha256
  # before extracting it and refuses to proceed otherwise. The pinned
  # checksums are the real published digests from
  # https://github.com/prometheus/prometheus/releases/tag/v3.13.1's
  # sha256sums.txt (issue #141), so this job fetches and verifies the real
  # binary and runs the differential comparison rather than skipping.
  promql-difftest:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - name: Fetch pinned Prometheus binary
        id: fetch-prometheus
        run: echo "bin_path=$(scripts/fetch-prometheus.sh)" >> "$GITHUB_OUTPUT"
      - name: Run PromQL differential test
        env:
          RAVEL_DIFFTEST: "1"
          RAVEL_DIFFTEST_PROM_BIN: ${{ steps.fetch-prometheus.outputs.bin_path }}
        run: |
          set -o pipefail
          # nextest equivalent of `--test difftest_selectors -- --exact --nocapture`.
          # The original had no positional test-name filter (the binary holds
          # exactly one test), so no `-E` filter is needed here. `--no-capture`
          # keeps the guard's skip line on stdout; 2>&1 keeps nextest's
          # stderr summary in the tee'd file. `--color never` overrides the
          # workspace-wide CARGO_TERM_COLOR=always for this one command:
          # nextest otherwise wraps the digits and words of its summary line
          # in ANSI escapes even when piped, which breaks the pass-count grep
          # below.
          cargo nextest run -p ravel-promql-difftest --test difftest_selectors \
            --no-capture --color never 2>&1 | tee difftest-output.txt
          # Prove the gated test actually ran against the pinned binary
          # rather than taking its RAVEL_DIFFTEST-unset early return.
          if grep -q "skipping: set RAVEL_DIFFTEST" difftest-output.txt; then
            echo "::error::differential test skipped despite RAVEL_DIFFTEST set"
            exit 1
          fi
          # nextest summary reads "1 test run: 1 passed, 0 skipped", not
          # libtest's "test result: ok. 1 passed".
          if ! grep -qE "1 tests? run: 1 passed" difftest-output.txt; then
            echo "::error::differential test did not run (expected 1 passed)"
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Measure coverage
        run: |
          cargo llvm-cov --workspace --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov --workspace --summary-only --json --output-path coverage.json
      # Updates the badge data gist read by the README's shields.io endpoint
      # badge. Only on pushes to main, since the badge reflects main's state
      # and pull_request runs (including from forks) never see GIST_PAT.
      - name: Update coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
        run: python3 scripts/update-coverage-badge.py
