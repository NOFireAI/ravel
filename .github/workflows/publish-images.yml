name: publish-images

# ADR-0037. Publishes ravel-server and ravel-operator from the root
# Dockerfile to GHCR. Deliberately its own workflow, not a job added to
# ci.yml: this is the only job in the repo that holds packages: write, and
# it never runs on a plain push to main (see ADR-0037 decision 4 for why
# the root Dockerfile's single COPY-then-build layer makes GHA caching
# ineffective there, and why that would make this the most expensive job
# in the repo on every commit).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase rather than interpolating
  # ${{ github.repository_owner }}, which renders the org name's actual
  # case (NOFireAI) and Docker rejects non-lowercase repository names.
  IMAGE_OWNER: nofireai

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [server, operator]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space

      - name: Determine tags
        id: tags
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ravel-${{ matrix.target }}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            major="${version%%.*}"
            minor="${version%.*}"
            tags="$image:$version,$image:$minor,$image:$major,$image:latest"
          else
            short_sha="${GITHUB_SHA:0:7}"
            tags="$image:manual-$short_sha"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=publish-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.target }}
