name: metricsbench-nightly

# Scheduled MetricsBench lane (issues #939 and #940, ADR-0927).
#
# Runs deploy/metricsbench/run.sh against the full compose stack (RustFS,
# Prometheus, VictoriaMetrics, Mimir and Ravel from a pinned image): it
# replays the sample stream into all four engines over Remote Write 1.0,
# reads each one back, runs the PromQL corpus against all four with
# Prometheus as the oracle, validates the resulting report, and samples every
# container's memory. The whole out-dir (stamps.json, ingest.json,
# effective-config.json, provenance.json, report.json, memory.jsonl,
# memory-summary.json, compose.log and each step's log) is uploaded, so a
# run is reproducible from what it stamped.
#
# Profile: `ci`. MetricsBench pins three orthogonal comparable profiles
# (cardinality/history/churn) plus the CI-sized `ci` profile (ADR-0927
# decision 11). The comparable profiles range from 360,000,000 to
# 1,728,000,000 samples and cannot run inside a GitHub-hosted runner, and
# RustFS is explicitly NOT an acceptable substrate for a performance or cost
# claim (ADR-0927 decision 10): removing per-request fees is exactly what
# hides a request-count defect, so only the real-S3 lane (bench-s3.yml)
# produces publishable numbers. This lane is a RustFS diagnostic/correctness
# run, so it uses the `ci` profile, whose artifact carries its own
# non-comparability marker.
#
# NON-BLOCKING by construction (ADR-0070, ADR-0075): this workflow triggers
# only on a schedule and on manual dispatch, never on push/pull_request/
# merge_group, so it can never gate a merge. A red nightly run signals a
# problem without blocking anyone.
on:
  workflow_dispatch:
  schedule:
    # Daily, 02:13 UTC. Off-peak and off the :00/:30 marks, and distinct from
    # every other scheduled lane in this repo (sim-nightly 03:17, k8s-nightly
    # 03:00, tla-nightly 04:37, supply-chain-nightly 05:43, bench-s3 weekly
    # Mon 04:17, quickstart-published weekly 06:29) so the scheduled runs do
    # not contend.
    - cron: "13 2 * * *"

# One scheduled run at a time; a manual dispatch does not cancel one already
# in flight.
concurrency:
  group: metricsbench-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metricsbench-rustfs:
    runs-on: ubuntu-latest
    # 60 minutes. A cold release build of the three bins takes most of the
    # old 30-minute budget on its own; run.sh then pulls five images, waits
    # for each of four engines in turn (METRICSBENCH_READY_TRIES below bounds
    # each wait to 2.5 minutes, 10 in all), replays the ci profile (120,000
    # samples) into four engines, and runs 20 corpus entries x 6 passes x 3
    # reps against four engines, each query capped at 120 s.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing after this checkout runs git against the remote, so the
          # workflow token has no reason to sit in .git/config where a
          # dependency build script could read it.
          persist-credentials: false
      - uses: ./.github/actions/free-disk-space
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the MetricsBench ingest, query and report bins
        run: |
          cargo build --release --locked -p ravel-bench \
            --bin metricsbench_ingest --bin metricsbench_query \
            --bin metricsbench_report
      - name: Run the ci profile end to end
        env:
          # The first published ravel-server image carrying the
          # --max-series/--max-samples flags ravel.yml passes. run.sh refuses
          # a reference without a digest, and stamps the source commit
          # alongside it rather than trusting the binary's own version.
          RAVEL_IMAGE_REF: ghcr.io/nofireai/ravel-server:manual-0bf5fed@sha256:42116db1a8b2b0da52b5bc71219678d9b32d42aefb61ba46152ba9f9968d5ca7
          RAVEL_SOURCE_COMMIT: 0bf5fedb2834df7dc87f8086701dd289b049efb0
          # 75 tries 2 s apart per engine. run.sh's default of 300 is per
          # engine too, and four engines down would take 40 minutes, past the
          # job timeout, which cancels the out-dir upload below.
          METRICSBENCH_READY_TRIES: "75"
        run: |
          # No --anchor-ms: run.sh derives the window from the clock, ending
          # 10 minutes before the run on the 15 s grid, because ravel-server
          # drops a sample older than its 45-day --max-ingest-lag and the
          # read-back would then fail. stamps.json records the anchor and
          # that it came from the clock. Success is run.sh's exit code.
          deploy/metricsbench/run.sh \
            --profile ci \
            --ravel-image "$RAVEL_IMAGE_REF" \
            --ravel-source-commit "$RAVEL_SOURCE_COMMIT" \
            --bin-dir target/release \
            --out-dir metricsbench-out
      - name: Validate the run's own report
        run: ./target/release/metricsbench_report validate metricsbench-out/report.json
      - name: Report-schema gate rejects a malformed report (fail-closed)
        run: |
          # The existing report-schema validator (metricsbench_report render,
          # ADR-0927) is the fail-closed gate a report consumer runs: it
          # deserializes and validates a report artifact and exits non-zero on
          # a malformed one. This step proves the gate is wired and rejects a
          # malformed report; the step above proves it accepts this run's.
          # Correctness is decided by the exit code, never by scanning
          # output: this repo's own error strings and test names contain the
          # words "failed"/"error"/"refused"/"panic" while passing, so a
          # keyword scan is not a valid success signal.
          printf '{"not":"a MetricsBench report"}' > malformed-report.json
          code=0
          ./target/release/metricsbench_report render \
            --report malformed-report.json || code=$?
          if [ "$code" -eq 0 ]; then
            echo "::error::report-schema gate accepted a malformed report (expected non-zero exit)"
            exit 1
          fi
          echo "report-schema gate rejected the malformed report as required (exit $code)"
      - name: Upload the MetricsBench run directory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metricsbench-rustfs-run
          path: metricsbench-out/
          if-no-files-found: error
          retention-days: 90
