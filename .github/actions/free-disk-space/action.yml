name: Free disk space
description: >-
  Remove preinstalled SDKs, toolchains, and cached images that the Ravel
  build never uses, reclaiming runner disk before a workspace compile.
inputs:
  background:
    description: >-
      When "true", run the same deletes in a detached process and return at
      once, so the job does not wait for space it only needs at link time.
      Never set it on a job that pulls or runs a container image: the image
      prune would then run beside the pull and can delete the image the job
      just fetched.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      env:
        FREE_DISK_BACKGROUND: ${{ inputs.background }}
      run: |
        reclaim() {
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf "${ANDROID_HOME:-/usr/local/lib/android}" || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true
        }
        if [ "$FREE_DISK_BACKGROUND" = "true" ]; then
          # Output goes to a file, not the step's pipe, so the step ends when
          # this shell does and not when the deletes do. The disk-usage
          # action's report phase prints the file.
          log="${RUNNER_TEMP:?RUNNER_TEMP is not set}/free-disk-space.log"
          ( reclaim ) > "$log" 2>&1 &
          echo "reclaiming disk in the background; output in $log"
        else
          reclaim
        fi
