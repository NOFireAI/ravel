name: Free disk space
description: >-
  Remove preinstalled SDKs, toolchains, and cached images that the Ravel
  build never uses, reclaiming runner disk before a workspace compile.
inputs:
  background:
    description: >-
      When "true", delete the SDK directories in a detached process and
      return at once, so the job does not wait for space it only needs at
      link time. The image prune is skipped in this mode: a prune running
      beside a later pull can delete the image the job just fetched, so a
      job that needs the image space reclaimed keeps the default.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      env:
        FREE_DISK_BACKGROUND: ${{ inputs.background }}
      run: |
        remove_sdks() {
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf "${ANDROID_HOME:-/usr/local/lib/android}" || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
        }
        if [ "$FREE_DISK_BACKGROUND" = "true" ]; then
          # Output goes to a file, not the step's pipe, so the step ends when
          # this shell does and not when the deletes do.
          ( remove_sdks ) > "${RUNNER_TEMP}/free-disk-space.log" 2>&1 &
          disown
          echo "removing preinstalled SDKs in the background"
        else
          remove_sdks
          docker image prune -af || true
        fi
