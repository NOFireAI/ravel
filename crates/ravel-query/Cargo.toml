[package]
name = "ravel-query"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ravel-types = { workspace = true }
ravel-segment = { workspace = true }
ravel-logseg = { workspace = true }
ravel-catalog = { workspace = true }
ravel-promql = { workspace = true }
ravel-object-store = { workspace = true }
ravel-cache = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
promql-parser = { workspace = true }
humantime = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# OIDC tenant resolution (ADR-0042 decision 6): JWT validation and the JWKS
# fetch behind OidcResolver/OidcJwksCache (crates/ravel-query/src/http/tenant.rs).
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
# Process-id generation for the fleet-global query concurrency ceiling
# (ADR-0061 decision 2, query_admission.rs): a v4 UUID names the one snapshot
# key this process owns, mirroring how ravel-ingest's admission reconciliation
# generates its process id. Already a workspace dependency (previously a
# dev-dependency here); promoted to a normal dependency, not a new external one.
uuid = { workspace = true }

[dev-dependencies]
ravel-commit = { workspace = true }
# Builds `ErasureRequest`/`ErasurePredicateMatcher` protobuf values so the
# engine tests populate `Snapshot::pending_erasure` and drive the real
# `snapshot_erasure_predicates` mapping (EJ-T3, #753). Workspace-internal
# crate; the same one `ravel_catalog::Snapshot::pending_erasure` is typed on.
ravel-proto = { workspace = true }
# Already a normal dependency (ADR-0046 read cache); also needed in the
# integration tests to build a RAM `Cache` and prove selective-erasure
# exclusion runs on cache-served bytes (EJ-T3, tests/log_fetcher.rs).
ravel-cache = { workspace = true }
# Path dev-dependency (not a workspace dep): the differential compaction
# proof (tests/differential_compaction.rs) drives P4's real compactor to
# produce write_v4 L1 parts. ravel-maintain does not depend on ravel-query,
# so this is acyclic.
ravel-maintain = { path = "../ravel-maintain", version = "0.1.0" }
proptest = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true, features = ["util"] }
uuid = { workspace = true }
criterion = { workspace = true }
async-trait = { workspace = true }
# Query-path tracing-span capture (ADR-0044 decision 5, issue #642): the e2e
# span test installs a scoped fmt subscriber over a buffer and asserts each
# phase span fires. Version comes from [workspace.dependencies].
tracing-subscriber = { workspace = true }
# The OIDC resolver tests build a local oct (HMAC) JWKS: base64url-encode the
# signing secret into the JWK `k` field. No network, no keypair generation.
base64 = { workspace = true }

[[bench]]
name = "fetch_soa_vs_fetch"
harness = false

[[bench]]
name = "bytes_slice_vs_copy"
harness = false

[[bench]]
name = "merge_kway_vs_materialized"
harness = false

[lints]
workspace = true
