[package]
name = "ravel-query"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ravel-types = { workspace = true }
# Shared tenant-resolution primitives (ADR-0080 decision 3). ravel-query
# re-exports these from `http` as its own public API surface
# (TenantResolver and the concrete resolvers used by AppState); the
# implementation lives here so ravel-server and ravel-ingest-router share one
# copy.
ravel-tenant-resolve = { workspace = true }
ravel-segment = { workspace = true }
ravel-logseg = { workspace = true }
# RSPAN span segment reader/record types for the distributed Spans fetch path
# (#285). The span fetcher promoted from ravel-sql
# (`crate::span_fetcher::SpanSegmentFetcher`) reads RSPAN objects through
# `RspanReader`/`SpanRecord`/`SpanQuery`, exactly as the `spans` SQL table does.
# ravel-rspan is a low-level format crate that does not depend on ravel-query,
# so this edge is acyclic; it mirrors the existing ravel-logseg dependency the
# log fetch path uses.
ravel-rspan = { workspace = true }
ravel-catalog = { workspace = true }
ravel-promql = { workspace = true }
# ADR-0071 distributed read fan-out: the frozen queryfrag wire
# messages (ravel.queryfrag.v1). The `distrib` codec maps the in-memory
# fetch shapes to and from these. Was a dev-dependency here; promoted to a
# normal dependency because the distributed fetch path holds them on the
# production read path.
ravel-proto = { workspace = true }
ravel-object-store = { workspace = true }
ravel-cache = { workspace = true }
# The evidential query-audit sink (QueryAuditSink/AuditEvent) the PromQL HTTP
# handlers submit through and await durability on (ADR-0062 §2a).
# ravel-maintain does not depend on ravel-query, so this edge is
# acyclic; it was previously a path dev-dependency here and is now a normal
# one because the sink is held by AppState on the production read path.
ravel-maintain = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
promql-parser = { workspace = true }
humantime = { workspace = true }
bytes = { workspace = true }
# Independent per-block crc32c verification in the RLOG block-range fetcher
# (ADR-0107 decision 3): the admitting funnel verifies each block's stored
# `block_crc32c` before admission and re-verifies it on a cache hit. Already a
# workspace dependency (ravel-logseg, ravel-segment, ravel-cache use it);
# promoted to a direct dependency of this crate, not a new external one.
crc32c = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# ADR-0071 distributed read fan-out: the queryfrag gRPC surface.
# `prost` for the message codec, `tonic`/`tonic-prost` for the SeriesFetch
# service (generated by build.rs). This is a transient inter-process wire
# contract, not a persistent stored format; no stored byte changes.
prost = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
# Object-safe async trait for the local/remote slice-fetcher seam so the merge
# layer holds one `dyn SliceFetcher`. Was a dev-dependency; promoted to normal.
async-trait = { workspace = true }
# Process-id generation for the fleet-global query concurrency ceiling
# (ADR-0061 decision 2, query_admission.rs): a v4 UUID names the one snapshot
# key this process owns, mirroring how ravel-ingest's admission reconciliation
# generates its process id. Already a workspace dependency (previously a
# dev-dependency here); promoted to a normal dependency, not a new external one.
uuid = { workspace = true }
# Keyed BLAKE3 MAC over the distributed-read commit token claims
# (src/distrib/codec.rs) and the content hash of fetched objects
# (src/distrib/mod.rs). Already a workspace dependency (used by ravel-catalog);
# promoted to a normal dependency of this crate.
blake3 = { workspace = true }

[build-dependencies]
# ADR-0071: compile proto/queryfrag_service.proto into the SeriesFetch
# gRPC stubs. protox is the pure-Rust compiler used everywhere in this repo (no
# protoc), matching ravel-proto's and ravel-otap's build scripts.
prost-build = { workspace = true }
tonic-prost-build = { workspace = true }
protox = { workspace = true }

[dev-dependencies]
ravel-commit = { workspace = true }
# Already a normal dependency (ADR-0046 read cache); also needed in the
# integration tests to build a RAM `Cache` and prove selective-erasure
# exclusion runs on cache-served bytes (tests/log_fetcher.rs).
ravel-cache = { workspace = true }
# Path dev-dependency (not a workspace dep): the differential compaction
# proof (tests/differential_compaction.rs) drives P4's real compactor to
# produce write_v4 L1 parts. ravel-maintain does not depend on ravel-query,
# so this is acyclic.
ravel-maintain = { path = "../ravel-maintain", version = "0.10.0" }
proptest = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true, features = ["util"] }
uuid = { workspace = true }
criterion = { workspace = true }
# Query-path tracing-span capture (ADR-0044 decision 5): the e2e
# span test installs a scoped fmt subscriber over a buffer and asserts each
# phase span fires. Version comes from [workspace.dependencies].
tracing-subscriber = { workspace = true }

[[bench]]
name = "fetch_soa_vs_fetch"
harness = false

[[bench]]
name = "bytes_slice_vs_copy"
harness = false

[[bench]]
name = "merge_kway_vs_materialized"
harness = false

[lints]
workspace = true
