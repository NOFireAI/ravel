[package]
name = "ravel-sql"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# Test targets are declared explicitly below; see the `[[test]]` section.
autotests = false

[lints]
workspace = true

[dependencies]
ravel-types = { workspace = true }
ravel-segment = { workspace = true }
ravel-catalog = { workspace = true }
# `redact_catalog` classifies `SnapshotFormatError::DecodeJob` by its
# `CpuGateError` cause, the same way the PromQL surface does. ravel-catalog and
# ravel-query already depend on it, so this adds no crate to the build graph.
ravel-cpu-gate = { workspace = true }
# Was dev-only (the endpoint tests publish real commit records rather than
# hand-building `Snapshot`s) and is now also a library dependency: the
# ADR-0873 decision 2 defect metric lives in
# `ravel_commit::declared_stats`, labelled by carrier, and the `.cstat` reader
# in `logs_scan` is the carrier whose refusals only this crate can report.
# Splitting that metric in two would mean two things to scrape for one defect
# class. ravel-commit does not depend on ravel-sql, and ravel-catalog already
# depends on it, so this adds no cycle and no new crate to the build graph.
ravel-commit = { workspace = true }
ravel-query = { workspace = true }
ravel-promql = { workspace = true }
ravel-object-store = { workspace = true }
# The query-audit writer (ADR-0042 decision 4). The Flight SQL
# statement path writes one `Signal::Audit` record per executed statement
# through `ravel_maintain::write_query_audit`, the same writer the HTTP
# `POST /api/v1/sql` endpoint uses, so a tenant's Flight query activity is
# durably logged and cannot be forged or suppressed. Optional, pulled in only
# with `flight-sql`: the audit hook lives in the `flight` module, which that
# feature gates. ravel-maintain does not depend on ravel-sql, so this adds no
# dependency cycle.
ravel-maintain = { workspace = true, optional = true }
# The `logs` table uses the RLOG record/predicate/tokenizer types
# directly (Predicate, FieldSel, LogRecord, AttrValue, tokenizer::tokens);
# ravel-query re-exports the LogSegmentFetcher surface but not these logseg
# types, so ravel-logseg is a direct dependency here.
ravel-logseg = { workspace = true }
# The `spans` table reads RSPAN span segments through the
# ravel-rspan reader/record/query types (RspanReader, SpanQuery, SpanRecord,
# ScanStats, SpanSegError) directly; ravel-query has no span fetcher yet
# (ADR-0041 phase 5 is the SQL table alone), so ravel-rspan is a direct
# dependency here, the same way ravel-logseg is for the `logs` table.
ravel-rspan = { workspace = true }
# The process-wide memory accountant (ADR-1170 decision 1).
# `TenantMemoryAccountant` is the adapter over it: every tenant charge the
# `TenantDelegatingPool` makes is forwarded to the same `MemoryBudget`, so the
# per-tenant ceilings nest inside one process ceiling instead of multiplying by
# the number of active tenants. A leaf crate with no dependency beyond std, so
# this adds no cycle and no external supply-chain surface.
ravel-memory = { workspace = true }
# Parquet tables queried in place (ADR-2040). ravel-pqtable resolves a tenant's
# manifests and grants from Ravel's own store; ravel-parquet is the DataFusion
# Parquet provider, reader and single-URL store registry, and the one crate
# that links datafusion-datasource-parquet. Both are workspace crates.
ravel-pqtable = { workspace = true }
ravel-parquet = { workspace = true }

# DataFusion pulls its own matching arrow (accessed via `datafusion::arrow`),
# so this crate never depends on the workspace `arrow` pin directly. See the
# module docs for the arrow 58 vs workspace-59 pinning note.
#
# `sql` is the only feature enabled on top of `default-features = false`: it
# supplies `datafusion-sql` (the sqlparser front end and the SQL-to-LogicalPlan
# planner) that the `/api/v1/sql` endpoint parses and plans with. The flag does
# keep the facade's file-format factories off: no parquet/csv/avro/json format
# is registered in any session, so a `CREATE EXTERNAL TABLE` that slipped the
# parse gate has nothing to bind to, and crypto is off (no md5/sha256 in the
# live surface). The Parquet reader that does link, through ravel-parquet
# above, is reachable only through a `ParquetTableProvider` the executor
# registers for a resolved Parquet table (ADR-2040 D3, D4).
#
# `default-features = false` is NOT the control over the expression packs, and
# must not be read as one. datafusion 54 declares `datafusion-functions`,
# `-aggregate`, `-table`, and `-window` as MANDATORY dependencies with their own
# default features on; a flag on this facade edge cannot subtract a mandatory
# sub-crate's defaults. So the full string, unicode, datetime, math, regex, and
# encoding scalar packs, all default aggregates and window functions, and the
# `range`/`generate_series` table functions all resolve regardless of this flag.
# `datafusion-functions-nested` is linked too (a mandatory dependency of
# `datafusion-sql`) but its functions are never registered, gated off by the
# `nested_expressions` feature this flag does leave off.
#
# The enforcement mechanism for the SQL function surface is therefore NOT this
# manifest: it is the per-registry allowlist enumeration in
# `crate::session::build_session` plus the drift test
# (`admitted_and_excluded_cover_all_registries_for_every_table`), which
# deregister every function outside the admitted set and fail closed when an
# upgrade adds a new one (ADR-0097).
datafusion = { version = "54", default-features = false, features = ["sql"] }

# Free-space measurement (`rustix::fs::statvfs`); see the workspace root's
# entry. The spill root's owner lock is std's `File::try_lock`, no dependency.
rustix = { workspace = true }

# `url::Url` appears in the `ObjectStoreRegistry` trait signature, which
# ravel-sql implements to install a registry that holds no stores at all in
# every session that reads no Parquet table (ADR-0013 security invariant 1, as
# ADR-2040 D4 replaces it for Parquet sessions).
# datafusion does not re-export `url`, so it is named directly here; the crate
# is already in the workspace lockfile as a transitive dependency of
# object_store, so this adds no new supply-chain surface.
url = "2"

# Flight SQL transport for the `flight` module, off unless `flight-sql` is on.
# It carries its own arrow 58, the same major datafusion 54 resolves, so the
# Flight encoders and the scan pipeline's `RecordBatch`es are the same types.
arrow-flight = { workspace = true, optional = true }
# The rest of the `flight-sql` set, all of them already workspace pins and all
# of them off in the default build:
#  - `tonic` supplies `Request`/`Response`/`Status`/`MetadataMap`, which appear
#    in every `FlightSqlService` signature. arrow-flight does not re-export it.
#  - `prost` supplies the `Message` trait used to encode a Flight SQL command
#    into the opaque `Ticket` bytes the protocol dispatches on.
#  - `bytes` supplies the `Bytes` the Flight protobuf fields are typed as. It
#    is an unconditional dependency below, since the Parquet resolve's
#    `ObjectStoreBackend` wrapper (crate::parquet) names it too.
#  - `uuid` types `SegmentPin::writer_id`, one of the `SegmentRef` fields the
#    snapshot-pinning ticket carries.
#  - `blake3` keys the ticket's integrity MAC; already a
#    workspace pin, used the same way `content_hash` fields are hashed
#    elsewhere in the workspace, just keyed here instead of unkeyed.
#  - `rand` generates the ticket's in-process MAC key once at construction.
# `tls-ring` is on so `FlightWorkerSliceClient` can take the
# `ClientTlsConfig` the server builds for the dedicated fragment listener
# (ADR-1689 decision 1). ravel-server already enables the same feature, so it
# adds nothing to the lockfile.
tonic = { workspace = true, optional = true, features = ["tls-ring"] }
prost = { workspace = true, optional = true }
bytes = { workspace = true }
uuid = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
# `tracing` is unconditional, not gated behind `flight-sql`: base-build paths
# (spill, output) log through it, besides the Flight error boundary, which
# records the full, unredacted error (the same discipline the HTTP endpoint
# follows).
tracing = { workspace = true }
# Unconditional: `page_plan` (base build) renders binary resume values as hex.
hex = { workspace = true }
# `ravel-proto` is a hard dependency, not gated behind `flight-sql`: ADR-0850's
# metadata-only aggregate path (`logs_scan`/`metadata_agg`) reads
# `ravel_catalog::LoadedColumnStats`, whose per-segment entries are the raw
# `ravel_proto::catalog::v1::{ColumnStat, ColumnStatsSegment, ColumnValue}`
# types, in the base (non-flight) build. When `flight-sql` is also on,
# `flight_ticket::FlightTicket::snapshot` reuses this same dependency for
# `ErasureRequest`/`ErasurePredicateMatcher` (ADR-0064 decision 3); that need
# does not make this entry conditional, it is simply a second consumer.
ravel-proto = { workspace = true }

[features]
# The snapshot-pinning ticket codec alone (ADR-1374 decision 9): the
# `flight_ticket` module (`FlightTicket`, `TicketKey`, `SegmentPin`, ...) with
# no `arrow-flight` and no Flight transport at all. `ravel-mcp`'s cursor codec
# (ADR-1374 D5) reuses this module's types and its keyed-MAC pattern, and an
# `mcp` build must never pull in Flight (ADR-1374 D9's CI build check). Only
# `uuid` (segment writer ids) and `blake3` (the MAC and `derive_ticket_key`)
# are needed for that module; everything else it touches (ravel-catalog,
# ravel-proto, ravel-query, ravel-types, this crate's own `declared` module)
# is already an unconditional dependency.
pin-codec = ["dep:uuid", "dep:blake3"]

# Flight SQL transport. Off by default: it links arrow-flight and tonic on top
# of datafusion, and the Flight surface is opt-in per deployment
# (ADR-0013 structural isolation).
# Gates the `flight` module (the future FlightSqlService). `flight_ticket`
# itself is gated by `pin-codec` above, which this feature enables so a
# Flight build still gets the codec.
#
# The feature matrix writes this as "flight-sql implies sql". This
# crate has no `sql` feature to imply: its SQL surface is unconditional
# (datafusion is a hard dependency, and the `sql` in its feature list is
# datafusion's own feature, not one of ours). The implication is stated where a
# `sql` feature actually exists, in services/ravel-server, whose `flight-sql`
# enables its `sql`.
flight-sql = [
    "pin-codec",
    "dep:arrow-flight",
    "dep:tonic",
    "dep:prost",
    "dep:rand",
    "dep:ravel-maintain",
]

[dev-dependencies]
# test-util for `#[tokio::test(start_paused = true)]`: the explain deadline
# test holds a commit-record GET open and asserts the typed
# `DeadlineExceeded`, which needs the runtime's injected clock rather than a
# real 50 ms wait on a loaded machine. Same workspace pin, one added feature.
tokio = { workspace = true, features = ["test-util"] }
proptest = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
# Dev-only: the distributed Flight acceptance test
# (tests/flight_distributed.rs) hand-crafts an old-version (v3)
# ticket envelope with a MAC that is valid under the service's in-process key,
# so the decode rejects it on the version byte (not the MAC). Computing that MAC
# needs the same keyed BLAKE3 the codec uses; blake3 is already a workspace pin.
blake3 = { workspace = true }
# Dev-only: the Flight SQL request-span test (tests/flight_span.rs) captures
# `tracing` output through a `MakeWriter` and asserts the `flight_sql_statement`
# span's bounded fields (ADR-0044 section 5), the same way
# services/ravel-server's own span tests do.
tracing-subscriber = { workspace = true }
# Dev-only: the `alerts` table's own tests build fixtures by hand-encoding
# RLOG attrs matching the assumed `ravel-alerting` convention, never checked
# against that crate's actual writer. This dependency lets one test build a
# fixture through the real `ravel_alerting::write_alert_record` path instead,
# so a future drift between the two (a renamed attr key, a changed generation
# type) is caught here rather than only discovered once both are wired
# together at runtime.
ravel-alerting = { workspace = true }
# Dev-only: the metric-scan cache-warm test wires a real ADR-0046 read cache
# into `SegmentFetcher` to prove exclusion still fires on cache-served bytes.
# Already a workspace pin used elsewhere (ravel-query depends on it);
# ravel-sql's non-test code has no need for it.
ravel-cache = { workspace = true }
# Dev-only: the batch-building benches (benches/samples_scan.rs and
# benches/logs_scan.rs, ADR-0099 decision 7).
criterion = { workspace = true }
# Dev-only: the allocation upper bound for batch building
# (tests/scan_batch_allocations.rs) installs stats_alloc's instrumented global
# allocator and measures one drain in a `Region`. The workspace forbids
# `unsafe_code`, including in tests, so allocation counting must go through a
# dependency that owns the `unsafe impl GlobalAlloc` itself; this is the same
# version and pattern crates/ravel-otap/benches/decode.rs uses.
stats_alloc = "0.1.10"
# Dev-only: tests/logs_columnar.rs assembles one RLOG object the writer cannot
# produce (a declared `Str` column cell that is not UTF-8) by rebuilding two of
# the writer's sections around ravel-logseg's own encoders, which means stamping
# the section table's checksums. Same workspace pin ravel-logseg itself uses.
crc32c = { workspace = true }
# Dev-only: tests/logs_columnar.rs asserts a declared `Str` fixture's value set
# actually encodes as `Enc::Dict`/`Enc::Plain` (the codec function the RLOG
# writer stages a dynamic string column with), so a shift in the distinct-ratio
# heuristic fails the dict-page tests loudly instead of silently. Already a
# workspace pin (ravel-logseg depends on it); no new supply-chain surface.
ravel-codec = { workspace = true }
# Dev-only: the `spans.events` acceptance test (tests/spans_provider.rs) builds
# its `_events_raw` fixture out of real `opentelemetry.proto.trace.v1.Span.Event`
# messages, encoded exactly the way `ravel_otlp::traces_normalize::encode_blob`
# encodes them at ingest, rather than hand-assembling protobuf bytes that only
# resemble what a sender sends. A drift between Ravel's event decoder and the
# actual OTLP wire shape then fails here instead of on real traffic. Both are
# workspace pins already in the lockfile through ravel-otlp.
opentelemetry-proto = { workspace = true }
prost = { workspace = true }
# Dev-only: the spill tests (tests/spill.rs, crate::spill's own unit tests)
# need a real, writable directory to configure as the spill root and a
# read-only one to prove the `spill_unavailable` refusal. Already a workspace
# pin, and already in the lockfile as a datafusion dependency.
tempfile = { workspace = true }

# Dev-only: tests/parquet_tables.rs writes the Parquet files its tables are
# made of. The major ravel-parquet already links for DataFusion 54, so it adds
# no lockfile entry.
parquet = { version = "58", default-features = false, features = ["arrow"] }

# Integration tests link into as few binaries as correctness allows (issue
# #2523): tests/it.rs compiles most files under tests/ as modules of one
# binary. The targets below keep their own binary, each for a stated reason.
[[test]]
name = "it"
path = "tests/it.rs"

# Run by name with `--test` from CI, docs and their own module docs.
[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "differential"
path = "tests/differential.rs"

# Each installs a `#[global_allocator]`, and a binary can have one.
# group_by_reservation_lag is also run by name.
[[test]]
name = "group_by_reservation_lag"
path = "tests/group_by_reservation_lag.rs"

[[test]]
name = "dedup_finalize_allocation"
path = "tests/dedup_finalize_allocation.rs"

[[test]]
name = "dedup_finalize_allocation_many_series_one_segment"
path = "tests/dedup_finalize_allocation_many_series_one_segment.rs"

[[test]]
name = "dedup_finalize_allocation_single_series"
path = "tests/dedup_finalize_allocation_single_series.rs"

[[test]]
name = "logs_scan_allocations"
path = "tests/logs_scan_allocations.rs"

[[test]]
name = "scan_batch_allocations"
path = "tests/scan_batch_allocations.rs"

# Exact deltas on a process-wide monotonic tally, which tests in another file
# of the same process could move.
[[test]]
name = "declared_stat_cstat_drops"
path = "tests/declared_stat_cstat_drops.rs"

# Assert captured `tracing` output. `tracing` caches a callsite's interest
# process-wide, so another file's test reaching the same callsite with no
# subscriber can suppress the line asserted on.
[[test]]
name = "flight_span"
path = "tests/flight_span.rs"

# Its opt-in stress test replaces the process-wide panic hook, which would
# swallow the panic output of every other test running in the process.
[[test]]
name = "group_by_string_keys"
path = "tests/group_by_string_keys.rs"

[[bench]]
name = "samples_scan"
harness = false

[[bench]]
name = "logs_scan"
harness = false
