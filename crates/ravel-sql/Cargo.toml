[package]
name = "ravel-sql"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
ravel-types = { workspace = true }
ravel-segment = { workspace = true }
ravel-catalog = { workspace = true }
ravel-query = { workspace = true }
ravel-promql = { workspace = true }
ravel-object-store = { workspace = true }
# The query-audit writer (ADR-0042 decision 4, issue #395). The Flight SQL
# statement path writes one `Signal::Audit` record per executed statement
# through `ravel_maintain::write_query_audit`, the same writer the HTTP
# `POST /api/v1/sql` endpoint uses, so a tenant's Flight query activity is
# durably logged and cannot be forged or suppressed. Optional, pulled in only
# with `flight-sql`: the audit hook lives in the `flight` module, which that
# feature gates. ravel-maintain does not depend on ravel-sql, so this adds no
# dependency cycle.
ravel-maintain = { workspace = true, optional = true }
# The `logs` table (issue #239) uses the RLOG record/predicate/tokenizer types
# directly (Predicate, FieldSel, LogRecord, AttrValue, tokenizer::tokens);
# ravel-query re-exports the LogSegmentFetcher surface but not these logseg
# types, so ravel-logseg is a direct dependency here.
ravel-logseg = { workspace = true }
# The `spans` table (issue #356) reads RSPAN span segments through the
# ravel-rspan reader/record/query types (RspanReader, SpanQuery, SpanRecord,
# ScanStats, SpanSegError) directly; ravel-query has no span fetcher yet
# (ADR-0041 phase 5 is the SQL table alone), so ravel-rspan is a direct
# dependency here, the same way ravel-logseg is for the `logs` table.
ravel-rspan = { workspace = true }

# DataFusion pulls its own matching arrow (accessed via `datafusion::arrow`),
# so this crate never depends on the workspace `arrow` pin directly. See the
# module docs and the B1 report for the arrow 58 vs workspace-59 pinning note.
#
# `sql` is the only feature enabled on top of `default-features = false`: it is
# what supplies `datafusion-sql` (the sqlparser front end and the SQL-to-
# LogicalPlan planner) that the `/api/v1/sql` endpoint parses and plans with.
# Everything the default feature set would otherwise add stays off, and that is
# deliberate: no parquet/csv/avro/json file formats, no compression codecs, no
# nested/regex/crypto expression packs. A file-format factory that is not linked
# cannot be reached by a `CREATE EXTERNAL TABLE` that slipped a parse gate
# (docs/arrow-datafusion-plan.md section 2 security invariant 1, review F16).
datafusion = { version = "54", default-features = false, features = ["sql"] }

# `url::Url` appears in the `ObjectStoreRegistry` trait signature, which
# ravel-sql implements to install a registry that holds no stores at all
# (security invariant 1: "the SQL RuntimeEnv registers no object store").
# datafusion does not re-export `url`, so it is named directly here; the crate
# is already in the workspace lockfile as a transitive dependency of
# object_store, so this adds no new supply-chain surface.
url = "2"

# Flight SQL transport for the `flight` module, off unless `flight-sql` is on.
# It carries its own arrow 58, the same major datafusion 54 resolves, so the
# Flight encoders and the scan pipeline's `RecordBatch`es are the same types.
arrow-flight = { workspace = true, optional = true }
# The rest of the `flight-sql` set, all of them already workspace pins and all
# of them off in the default build:
#  - `tonic` supplies `Request`/`Response`/`Status`/`MetadataMap`, which appear
#    in every `FlightSqlService` signature. arrow-flight does not re-export it.
#  - `prost` supplies the `Message` trait used to encode a Flight SQL command
#    into the opaque `Ticket` bytes the protocol dispatches on.
#  - `bytes` supplies the `Bytes` the Flight protobuf fields are typed as.
#  - `uuid` types `SegmentPin::writer_id`, one of the `SegmentRef` fields the
#    snapshot-pinning ticket carries.
#  - `tracing` records the full, unredacted error at the Flight error
#    boundary, the same discipline the HTTP endpoint follows.
#  - `blake3` keys the ticket's integrity MAC (issue #185); already a
#    workspace pin, used the same way `content_hash` fields are hashed
#    elsewhere in the workspace, just keyed here instead of unkeyed.
#  - `rand` generates the ticket's in-process MAC key once at construction.
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }

[features]
# Flight SQL transport. Off by default: it links arrow-flight and tonic on top
# of datafusion, and the Flight surface is opt-in per deployment
# (docs/arrow-datafusion-plan.md section 3, ADR-0013 structural isolation).
# Gates the `flight` module (the future FlightSqlService, issue #152) and the
# `flight_ticket` module (the snapshot-pinning ticket codec, issue #150).
#
# The feature matrix in section 3 writes this as "flight-sql implies sql". This
# crate has no `sql` feature to imply: its SQL surface is unconditional
# (datafusion is a hard dependency, and the `sql` in its feature list is
# datafusion's own feature, not one of ours). The implication is stated where a
# `sql` feature actually exists, in services/ravel-server, whose `flight-sql`
# enables its `sql`.
flight-sql = [
    "dep:arrow-flight",
    "dep:tonic",
    "dep:prost",
    "dep:bytes",
    "dep:uuid",
    "dep:tracing",
    "dep:blake3",
    "dep:rand",
    "dep:ravel-maintain",
]

[dev-dependencies]
proptest = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
# Dev-only: the distributed Flight acceptance test
# (tests/flight_distributed.rs, issue #866) hand-crafts an old-version (v3)
# ticket envelope with a MAC that is valid under the service's in-process key,
# so the decode rejects it on the version byte (not the MAC). Computing that MAC
# needs the same keyed BLAKE3 the codec uses; blake3 is already a workspace pin.
blake3 = { workspace = true }
# Dev-only: the Flight SQL request-span test (tests/flight_span.rs) captures
# `tracing` output through a `MakeWriter` and asserts the `flight_sql_statement`
# span's bounded fields (ADR-0044 section 5), the same way
# services/ravel-server's own span tests do.
tracing-subscriber = { workspace = true }
# The endpoint-level tests drive a real `Catalog`, so they publish real
# commit records rather than hand-building `Snapshot`s.
ravel-commit = { workspace = true }
# Dev-only: the `alerts` table's own tests build fixtures by hand-encoding
# RLOG attrs matching the assumed `ravel-alerting` convention, never checked
# against that crate's actual writer. This dependency lets one test build a
# fixture through the real `ravel_alerting::write_alert_record` path instead,
# so a future drift between the two (a renamed attr key, a changed generation
# type) is caught here rather than only discovered once both are wired
# together at runtime.
ravel-alerting = { workspace = true }
# Dev-only: the ADR-0064 selective-erasure regression tests (issue #829) build
# `Snapshot.pending_erasure` fixtures directly with the real commit proto
# types, and the metric-scan cache-warm test wires a real ADR-0046 read cache
# into `SegmentFetcher` to prove exclusion still fires on cache-served bytes.
# Both are already workspace pins used elsewhere (ravel-query depends on both);
# ravel-sql's non-test code has no need for either.
ravel-proto = { workspace = true }
ravel-cache = { workspace = true }
