[package]
name = "ravel-segment-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# cargo-fuzz requires the fuzz project to be its own workspace root so the
# nightly/sanitizer build flags do not leak into the main workspace. An empty
# [workspace] table detaches it from the parent workspace at crates/*.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
# `arbitrary` splits one fuzz buffer into the several independent byte slices a
# catalog decoder takes (footer + section bodies). `prost` decodes the untrusted
# `Footer` protobuf that every catalog decoder is handed. Both are pinned to the
# versions already used across the main workspace (prost 0.14) but declared here
# only, never in the root Cargo.toml.
arbitrary = { version = "1", features = ["derive"] }
prost = "0.14"

[dependencies.ravel-segment]
path = ".."

[[bin]]
name = "parse_footer"
path = "fuzz_targets/parse_footer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_catalog_v4"
path = "fuzz_targets/decode_catalog_v4.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_catalog_matching_v4"
path = "fuzz_targets/decode_catalog_matching_v4.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_catalog_v5"
path = "fuzz_targets/decode_catalog_v5.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sparse_probe"
path = "fuzz_targets/sparse_probe.rs"
test = false
doc = false
bench = false
