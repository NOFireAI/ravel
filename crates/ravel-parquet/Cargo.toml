[package]
name = "ravel-parquet"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "DataFusion table provider over Ravel Parquet tables (ADR-2040 D3)."

[dependencies]
ravel-pqtable = { workspace = true }
ravel-query = { workspace = true }
ravel-memory = { workspace = true }
ravel-cache = { workspace = true }
ravel-object-store = { workspace = true }
ravel-types = { workspace = true }
# The workspace has no datafusion pin; ravel-sql names "55.2" directly too.
# Without its `parquet` feature: the Parquet reader comes from
# datafusion-datasource-parquet below.
datafusion = { version = "55.2", default-features = false }
datafusion-datasource-parquet = { version = "55.2", default-features = false }
# The object_store major datafusion 55 is built on, beside the workspace's
# 0.14, for the adapter between the two.
object_store = { version = "0.13", default-features = false }
# The parquet major datafusion-datasource-parquet 55 is built on, with the
# features it already enables, for footer decoding and `AsyncFileReader`.
parquet = { version = "59", default-features = false, features = ["arrow", "async"] }
# The base64 major parquet 59 decodes an embedded `ARROW:schema` with, and
# the flatbuffers major its arrow-ipc verifies it with, so the footer check
# reads that value byte for byte as the decoder does.
base64 = { version = "0.22", default-features = false, features = ["std"] }
flatbuffers = { version = "25", default-features = false, features = ["std"] }
# `url::Url` appears in the `ObjectStoreRegistry` trait signature and
# datafusion does not re-export it; ravel-sql names it the same way.
url = "2"
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# `MemoryStore::insert_foreign`, to seed keys no store operation can write.
ravel-object-store = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
