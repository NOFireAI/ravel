# ---------------------------------------------------------------------------
# Divergences: valid statements Ravel answers differently from the release.
# ---------------------------------------------------------------------------

[[divergence]]
id = "attribute-fallback"
name = "an unmapped field reads an attribute key"
description = "A field name that is not a native column or a typed attribute column resolves to the log record's attribute of that key, read as a keyword, and reads null where a record lacks it (ADR-2887 D10 rule 4). The release reports an unknown column."
evidence = "crates/ravel-sql/tests/esql/binder.rs::an_attribute_reads_null_when_absent"
no_entry = "The release refuses a statement that names an unmapped field, so an example showing the divergence has no release answer to compare Ravel's with."

[[divergence]]
id = "shadowing"
name = "@timestamp and message shadow attributes"
description = "@timestamp and message always name the record's timestamp and body; an attribute with either key is not reachable under that name."
evidence = "crates/ravel-sql/tests/esql/manifest.rs::timestamp_and_message_shadow_attributes_of_the_same_name"
no_entry = "The logs fixture carries no attribute named @timestamp or message, so no example run on it can reach a shadowed attribute."

[[divergence]]
id = "clock-bound"
name = "no rows after the query clock without an upper bound"
description = "A statement with no upper bound on @timestamp and no request end returns no record later than the query clock (the ADR-2887 D11 amendment)."
evidence = "crates/ravel-sql/tests/esql/window.rs::a_lower_bound_alone_returns_rows_up_to_the_clock_on_every_layout"
no_entry = "Every record of the logs fixture is earlier than its query clock, so no example run on it returns a record the bound removes."

[[divergence]]
id = "depth-limit"
name = "expression depth limit of 24"
description = "A statement that binds to an expression deeper than 24 is refused with a verification error."
evidence = "crates/ravel-sql/tests/esql/limits.rs::an_expression_past_the_depth_limit_is_refused"
no_entry = "No example binds to an expression deeper than 24."

[[divergence]]
id = "stage-limit"
name = "plan stage limit of 10"
description = "A statement with more than 10 processing commands is refused with a verification error."
evidence = "crates/ravel-sql/tests/esql/limits.rs::a_statement_past_the_stage_limit_is_refused"
no_entry = "No example has more than 10 processing commands."

[[divergence]]
id = "row-cap"
name = "10,000-row result cap"
description = "A final LIMIT above 10,000 is lowered to 10,000."
evidence = "crates/ravel-sql/tests/esql/limits.rs::a_final_limit_above_the_ceiling_is_lowered_to_it"
no_entry = "The logs fixture has six records, so no example returns more than 10,000 rows."

[[divergence]]
id = "overflow-null"
name = "overflow and division by zero give null without a warning"
description = "Integer overflow, division by zero and remainder by zero give null, and the response carries no warning for them."
evidence = "crates/ravel-sql/tests/esql/manifest.rs::an_overflow_gives_null_without_a_warning"
no_entry = "No example overflows or divides by zero."

[[divergence]]
id = "integer-literal"
name = "an integer literal is a long"
description = "An integer literal that fits in 32 bits is typed long, where the release types it integer."
evidence = "crates/ravel-sql/tests/esql/manifest.rs::an_integer_literal_is_typed_long"

[[divergence]]
id = "from-columns"
name = "FROM lists the native columns in a fixed order"
description = "FROM without KEEP returns the native columns in Ravel's fixed order (@timestamp, observed_ts, severity_num, severity_text, message, trace_id, span_id, flags, dur, region), where the release lists the mapped fields sorted by name."
evidence = "crates/ravel-sql/tests/esql/manifest.rs::from_lists_the_native_columns_in_a_fixed_order"

[[divergence]]
id = "now-type"
name = "NOW() is a date_nanos"
description = "NOW() is typed date_nanos, where the release types it date at millisecond precision."
evidence = "crates/ravel-sql/tests/esql/manifest.rs::now_is_typed_date_nanos"
