# ES|QL release manifest: the released language of the Elasticsearch 9.5 line
# (ADR-2887 D1).
#
# This file was written from knowledge of the published ES|QL language
# reference for the 9.5 line. No part of the Elasticsearch source tree was
# fetched, opened, copied or paraphrased to write it: not its grammar, its
# function registry, its documentation sources or its test fixtures. It has
# NOT been reconciled with the released 9.5.5 binary (ADR-2887 D3), so an
# entry can be missing, misnamed, or carry the wrong preview flag; an entry
# whose release status is in doubt carries `unverified = true` and a comment
# saying why.
#
# `docs/esql-conformance.md` is generated from this file:
#
#     REGEN_ESQL_CONFORMANCE=1 cargo test -p ravel-esql --test conformance
#
# Tables:
#
# [release]        The release line, the release of it the expected answers
#                  describe (binary), and whether this file has been
#                  reconciled with that released binary.
# [[entry]]        One released form: a source or processing command, a
#                  directive, a syntax variant, a function, a function or
#                  command alias, an operator, a type or a parameter form.
#                  Every released entry is in every denominator of the report.
# [[development]]  A command that exists only in development builds, with the
#                  same fields as an entry. Excluded from every denominator.
# [[negative]]     An invalid statement that must be refused. Counted on its
#                  own line of the report, never in a positive figure.
# [[transport]]    An option of the Elasticsearch query endpoint, scored by
#                  transport compatibility.
# [[divergence]]   A place where Ravel's answer to a valid statement differs
#                  from the release's, with the test that pins Ravel's. Its
#                  id is what an entry's divergence field names. Every
#                  divergence is named by at least one released entry, or
#                  carries no_entry: the reason no released entry's example
#                  can show it.
#
# Entry fields:
#
# kind      source_command, processing_command, directive, syntax, function,
#           alias, operator, type or parameter.
# name      The form's name, upper-case for keywords and functions. Unique
#           per kind.
# family    Functions only: scalar, aggregate, grouping, conversion,
#           multivalue, date, string, math, ip, spatial, search or
#           time_series.
# aliases   The names of the alias entries that resolve to this entry.
# alias_of  Aliases only: the entry the alias resolves to.
# preview   Whether the release marks the form technical preview.
# example   One statement that uses the form, run against the `logs` fixture
#           of the ravel-sql ES|QL tests where it reads `FROM logs`.
# grammar   own: the parser has a rule of its own for the form. call, cast,
#           field: the parser reads the example only through the generic
#           call rule name(args), the generic cast rule value::type, or as a
#           plain field reference, none of which checks the entry's name.
#           Syntax coverage counts own entries only.
# parser    supported: the example parses. refused: the parser recognises the
#           form and refuses it with a typed error. absent: the parser does
#           not know it, and fails as on any invalid text.
# binder    supported: the example binds. refused: the binder refuses it with
#           a typed error. absent: the binder never sees it, because the
#           parser does not accept the example.
# executor  supported: the example prepares and runs. refused: the statement
#           is refused with a typed error at some layer. absent: it fails
#           without one.
# columns, rows, order, warnings
#           Released, executor-supported entries only: the answer the 9.5.5
#           release gives for the example on the fixture, written by hand
#           from the published language reference (ADR-2887 D3). columns
#           lists name:type in order. Each row is a bracketed list of
#           cells: null, true, false, a number (a double when written with
#           a fraction or an exponent) or a double-quoted string; a date
#           is the string the release renders. order is exact when the
#           example fixes the whole order, multiset when it fixes none,
#           key COLUMNS when it sorts on those columns and leaves ties
#           unordered, and any N when it keeps N rows without fixing which
#           (the answer has N rows, each one of those listed). The answers
#           assume the release reads an index that maps the fixture's ten
#           native columns at the types Ravel gives them and maps no
#           `service` field, and evaluates NOW() at the fixture's query
#           clock.
# divergence
#           The id of the known divergence that makes Ravel's answer differ
#           from the release's. The entry then counts as divergent: in the
#           denominator, not compatible. Its answer is still compared in
#           full: the test undoes exactly that divergence in Ravel's answer
#           and requires the result to be the release's answer, and fails
#           an entry whose answer matches without the undo. from-columns
#           reorders Ravel's columns by name into the release's order, the
#           cells moving with them, and applies only to an answer whose
#           columns are all among the ten FROM gives, arrive in FROM's
#           fixed order, and are sorted by name in the release's answer; an
#           entry naming it with any other column does not load.
#           integer-literal reads a long column as
#           integer where the release's column is integer; now-type reads a
#           date_nanos column as date where the release's column is date,
#           rendered to the millisecond. No other divergence can be named.
# refusal   Binder-refused entries only: the text the binder's typed
#           refusal names the form by, when it is not the name in brackets.
#           A refused source command is named "this source command", so
#           its refusal is the text the command starts with. An expression
#           kind the binder has no binding for is named "this expression",
#           which names no form, so such a refusal counts only where it
#           starts exactly at the entry's own expression and refuses no
#           expression enclosing it and no operand starting with it.
# refused_by
#           Binder-refused entries only: the released entry the binder
#           refuses first, because the example cannot reach this form
#           without it. The refusal must name that entry instead.
# needs     A backend or data resource the form needs, when it needs one.
# evidence  The test that proves the entry's states, as path::test.
# unverified  The release status of the form is in doubt (see its comment).
#
# A layer never claims more than the layer before it: a binder state other
# than absent needs a parsed example, and a supported executor needs a
# supported binder.

[release]
line = "9.5"
binary = "9.5.5"
reconciled = false

