[package]
name = "ravel-esql"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# A pure front end (ADR-2887): text in, syntax tree or typed error out. The
# lexer, structural guard and parser are written in-crate. ravel-promql is
# here only for its guarded parser, which checks the query of a PROMQL source
# command at parse time.
[dependencies]
ravel-promql = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# Cross-checks the manifest reader against a full TOML parser, in tests only.
toml = "1"

[lints]
workspace = true
