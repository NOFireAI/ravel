[package]
name = "ravel-codec"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared segment codecs: the encoding tag registry, the blocked token bloom filter, the normative word tokenizer, and the KEY_IDX exact-key section grammar."

[dependencies]
thiserror = { workspace = true }
blake3 = { workspace = true }
crc32c = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
# The tokenizer allocation pin (tests/tokenizer_alloc_pin.rs). Pinned to the
# 0.1.10 the other crates' allocation tests use; the workspace forbids
# `unsafe_code`, so a hand-rolled counting allocator will not compile.
stats_alloc = "0.1.10"

[lints]
workspace = true
