[package]
name = "ravel-logseg"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Per-block bloom-construction timing (issue #1516; ADR-0104 decision 1 for the
# feature-gated monotonic seam, decision 2 for the `bloom` stage itself). Off
# by default: with it off, `WriteStats` carries no bloom timing field and no
# `Instant` is read in the block-write loop, so the crate compiles and behaves
# exactly as today. On, `RlogWriter` measures each block's `BloomBuilder`
# insert-plus-`finish` window and reports the per-object sum and block count
# through `WriteStats::bloom_total_ns` and `WriteStats::bloom_blocks` for
# `ravel-ingest` to fold into its `LogStage::Bloom` accumulator. Enabled
# transitively by `ravel-ingest/stage-timing`.
stage-timing = []
# Test-only (issue #2548): adds `RlogWriter::with_unchecked_stream_attrs`, which
# lets a test store a `stream_attrs` blob the reader cannot decode so the
# reader's refusal can be exercised. Off by default; only dev-dependencies may
# enable it, never a production crate.
test-support = []
# Reference-only row builder (ADR-2467 decision 3; issue #2564). Off by
# default: production encode of row input goes through the columnar builder
# (`build_object_columnar`) unconditionally, and `build_object`/`resolve_row`/
# `ResolvedRow`/`write_block`/`row_column`/`winner_value`/`chunk_blocks`/
# `row_estimate`/`permute` would otherwise be dead code with the row path gone
# from every production caller. On, `RlogWriter::finish_row_reference[_with_stats]`
# builds through the row path directly, for the differential tests that hold
# the two builders to the same bytes. Enabled via a self dev-dependency below
# so `cargo test`/`cargo bench` in this crate see it without an explicit
# `--features` flag; `ravel-sql`'s dev-dependencies and `ravel-bench`'s regular
# dependency on this crate enable it the same way for their own row-reference
# call sites. No shipped binary enables it.
row-reference = []

[dependencies]
bytes = { workspace = true }
ravel-codec = { workspace = true }
ravel-proto = { workspace = true }
ravel-types = { workspace = true }
thiserror = { workspace = true }
zstd = { workspace = true }
crc32c = { workspace = true }
blake3 = { workspace = true }
prost = { workspace = true }

[dev-dependencies]
# Self dev-dependency to turn on `row-reference` for this crate's own tests and
# benches without an explicit `--features` flag on every `cargo test`/`cargo
# bench` invocation: cargo unifies features across the dependency graph of one
# build, so a dev-only edge back onto the same crate with the feature set
# switches it on for `cfg(test)` and the `[[bench]]`/`[[test]]` targets alike,
# while leaving the feature off for anything depending on the library target
# (`ravel-logseg = { workspace = true }` elsewhere never requests it, so a
# `cargo build -p ravel-logseg` or any shipped binary's own feature set is
# unaffected). `required-features` was the alternative; it was not used here
# because it only gates whether a target compiles given features already
# requested on the command line, so `cargo test -p ravel-logseg` would still
# need an explicit `--features row-reference` to run the gated tests, exactly
# the manual step this is meant to remove.
ravel-logseg = { path = ".", features = ["row-reference"] }
proptest = { workspace = true }
criterion = { workspace = true }
# Peak-live-bytes measurement for the columnar writer memory test. Pinned to
# the same 0.1.10 the ravel-sql/ravel-otlp allocation tests already use; the
# workspace forbids `unsafe_code`, so a hand-rolled counting allocator will not
# compile and the instrumented global allocator this crate provides is used
# instead (issue #682).
stats_alloc = "0.1.10"

[lints]
workspace = true

[lib]
# Only the criterion `[[bench]]` targets below understand `cargo bench`'s
# `--quick` flag; leaving the lib's own `bench = true` default would make
# `cargo bench -p ravel-logseg -- --quick` also run its unit tests under the
# plain libtest harness, which rejects that flag (mirrors ravel-bench).
bench = false

[[bench]]
name = "logseg_encode"
harness = false

[[bench]]
name = "logseg_scan"
harness = false

[[bench]]
name = "wide_gather"
harness = false

# Not a criterion target: it times the pre- and post-#1135 stamp itself so it
# can fail when the speedup it prints leaves its band. It ignores the flags the
# criterion targets take rather than rejecting them.
[[bench]]
name = "stamp_declared"
harness = false
