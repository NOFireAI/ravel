[package]
name = "ravel-maintain"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Test-only (ADR-4233 decision 9): turns on the segment crates' drill
# versions so maintenance runs at an active version other than the build's
# current one. Off by default; scripts/guards/check-release-profile.sh refuses
# it in the published-image build and in any default or non-dev feature set.
format-drill = [
  "ravel-segment/format-drill",
  "ravel-logseg/format-drill",
  "ravel-rspan/format-drill",
]

# ADR-4326: the Antithesis assertions and the test-only mutant switches at
# this crate's sites, forwarded so ravel-server and ravel-cli turn them on for
# the whole build. Off by default and in no published build
# (scripts/guards/check-release-profile.sh).
antithesis = ["ravel-invariant/antithesis"]
antithesis-mutants = ["ravel-invariant/antithesis-mutants"]

[dependencies]
# ADR-4326 assertion and mutant macros; with no feature on they expand to
# nothing.
ravel-invariant = { workspace = true }
ravel-types = { workspace = true }
ravel-proto = { workspace = true }
ravel-fleet = { workspace = true }
ravel-object-store = { workspace = true }
ravel-segment = { workspace = true }
ravel-logseg = { workspace = true }
ravel-rspan = { workspace = true }
ravel-catalog = { workspace = true }
ravel-commit = { workspace = true }
ravel-ingest = { workspace = true }
# `park_lease`: `compat activate` parks every tenant's alert lease when rlog is
# activated (ADR-4233 decision 4).
ravel-alerting = { workspace = true }
# The ADR-1702 read gate maintenance decodes and encodes run on.
ravel-cpu-gate = { workspace = true }
prost = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
blake3 = { workspace = true }
crc32c = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
# statvfs for the two-level merge's scratch headroom check (ADR-3853 D2).
rustix = { workspace = true }

[dev-dependencies]
# The dev edge only adds `test-support`, so a test can store a key no
# operation can address (`MemoryStore::insert_foreign`, ADR-4233 decision 6).
ravel-object-store = { workspace = true, features = ["test-support"] }
ravel-segment = { workspace = true }
# test-util for `#[tokio::test(start_paused = true)]`: the write-budget
# deadline tests race a held PUT against a paused clock.
tokio = { workspace = true, features = ["test-util"] }
proptest = { workspace = true }
# Already a normal dependency; the dev edge only adds `test-support`, so a test
# can store a `stream_attrs` blob the writer refuses
# (`RlogWriter::with_unchecked_stream_attrs`, issue #2554).
ravel-logseg = { workspace = true, features = ["test-support"] }
# Captures the warn line compaction emits for a skipped input.
tracing-subscriber = { workspace = true }
# Builds the points an ingest router flushes in the format-floor acceptance
# test (ADR-1746), whose audit half runs this crate's census.
ravel-otlp = { workspace = true }
criterion = { workspace = true }
rand = { workspace = true }
# The workspace forbids `unsafe_code`, so the allocation bench counts through
# this crate's instrumented global allocator instead of a hand-rolled one
# (the same pin six other workspace crates use).
stats_alloc = "0.1.10"
# A high-water heap peak for the postings memory bench (issue #3263):
# `HeapStats::max_bytes` is a running maximum kept inside the allocator,
# which stats_alloc does not track, without `unsafe` in this crate.
dhat = "0.3.3"

[lints]
workspace = true

[[bench]]
name = "compaction_grouping"
harness = false

[[bench]]
name = "compaction_grouping_alloc"
harness = false

[[bench]]
name = "rlog_postings"
harness = false

[[bench]]
name = "rlog_postings_alloc"
harness = false

[[bench]]
name = "rlog_postings_dhat"
harness = false

[[bench]]
name = "rlog_postings_share"
harness = false
