[package]
name = "ravel-object-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Ravel object store contract, reference in-memory backend, fault-injecting wrapper, and S3 adapter."

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
object_store = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
crc32c = { workspace = true }
# S3 returns a stored upload checksum base64-encoded in `x-amz-checksum-*`;
# the read-side verification in crates/ravel-object-store/src/s3/checksum.rs
# (ADR-1696 decision 2) decodes it before recomputing the digest.
base64 = { workspace = true }
# Serde derive for the durable `sys/qualification` record (ADR-0050 section 6),
# relocated here from ravel-cli so ravel-server and ravel-cli share one
# definition, and for S3Config::credentials_file's rotating-credentials JSON
# (ADR-0072 decision 1, crates/ravel-object-store/src/s3/credentials.rs).
serde = { workspace = true }
# JSON decode for S3Config::credentials_file (ADR-0072 decision 1): a
# production dependency now, not just the dev-only JSON-shape regression test
# serde_json was here for before.
serde_json = { workspace = true }
# HTTP client for the EC2 IMDSv2 instance-role credential provider (ADR-0106,
# crates/ravel-object-store/src/s3/instance_role.rs): two plain-HTTP calls to
# the link-local metadata endpoint. Version pinned once in the workspace so all
# crates resolve the same reqwest.
reqwest = { workspace = true }
# SigV4 HMAC-SHA256 and SHA-256 for the read-only bucket-protection control
# plane (ADR-1727 decision 1, crates/ravel-object-store/src/s3/bucket_config.rs).
# Already in the graph under object_store; a direct dependency here so the
# hand-rolled signer needs no RustCrypto crate and no AWS SDK.
ring = { workspace = true }
# Reads the S3 bucket-configuration XML responses the same control plane fetches
# (?versioning, ?lifecycle, ?replication, ?object-lock, ?retention). 0.41 is the
# release outside the two advisories deny.toml tracks.
quick-xml = { workspace = true }

[features]
# Test-only hooks on the reference backends, off in every production build:
# `MemoryStore::corrupt_stored_byte` (ADR-1696 decision 5). Crates whose tests
# use them enable this in their dev-dependencies.
test-support = []

[dev-dependencies]
# This crate's own integration tests (tests/contract.rs) use the test-support
# hooks; a self dev-dependency is how an integration test binary enables a
# feature of the crate it tests.
ravel-object-store = { path = ".", features = ["test-support"] }
tempfile = { workspace = true }
# Test-only fake S3 HTTP endpoint (tests/s3_http_faults.rs): drives S3Store
# through its endpoint override against a server that returns 503/429/SlowDown,
# drops a connection mid-response, and fails one part of a multipart upload, so
# the retry/backoff/multipart paths are exercised over real HTTP rather than
# only through synthetic StoreError values.
axum = { workspace = true }
# Property test of the addressable-key predicate against `Path::from`
# (ADR-2637).
proptest = { workspace = true }

[lints]
workspace = true
