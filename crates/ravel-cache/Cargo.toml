[package]
name = "ravel-cache"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Content-addressed, single-flighted, S3-FIFO read cache: RAM and local-disk tiers (ADR-0046)."

[dependencies]
bytes = { workspace = true }
crc32c = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# test-util for `#[tokio::test(start_paused = true)]`: the single-flight
# collapse test orders two concurrent fetches by timer, which is deterministic
# only on a paused clock.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
