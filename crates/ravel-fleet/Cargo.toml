[package]
name = "ravel-fleet"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Fleet-membership primitives: heartbeat live-set and rendezvous ownership shared by maintain and query workers (ADR-0065, ADR-0071)."

[features]
# ADR-4326: the Antithesis assertions and the test-only mutant switches at
# this crate's sites, forwarded so ravel-server and ravel-cli turn them on for
# the whole build. Off by default and in no published build
# (scripts/guards/check-release-profile.sh).
antithesis = ["ravel-invariant/antithesis"]
antithesis-mutants = ["ravel-invariant/antithesis-mutants"]

[dependencies]
# ADR-4326 assertion and mutant macros; with no feature on they expand to
# nothing.
ravel-invariant = { workspace = true }
ravel-types = { workspace = true }
ravel-object-store = { workspace = true }
ravel-proto = { workspace = true }
prost = { workspace = true }
futures = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
