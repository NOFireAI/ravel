[package]
name = "ravel-commit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# ADR-4326: the Antithesis assertions and the test-only mutant switches at
# this crate's sites, forwarded so ravel-server and ravel-cli turn them on for
# the whole build. Off by default and in no published build
# (scripts/guards/check-release-profile.sh).
antithesis = ["ravel-invariant/antithesis"]
antithesis-mutants = ["ravel-invariant/antithesis-mutants"]

[dependencies]
# ADR-4326 assertion and mutant macros; with no feature on they expand to
# nothing. A path dependency pinned to a version so cargo-deny does not count
# it as a wildcard.
ravel-invariant = { path = "../ravel-invariant", version = "0.33.0" }
ravel-types = { workspace = true }
ravel-proto = { workspace = true }
ravel-object-store = { workspace = true }
prost = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
crc32c = { workspace = true }
blake3 = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# MemoryStore::corrupt_stored_byte for the ADR-1696 acceptance tests in
# src/publish.rs.
ravel-object-store = { workspace = true, features = ["test-support"] }
proptest = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
# For the IAM-template reachability tests only: the fleet heartbeat key
# constructors are the ground truth those tests build witnesses from, and
# ravel-fleet does not depend on ravel-commit, so this direction is acyclic.
ravel-fleet = { workspace = true }
# The same, for the Ravel Agents key constructors (ADR-3331 decision 2);
# ravel-agents-core does not depend on ravel-commit either.
ravel-agents-core = { workspace = true }

[lints]
workspace = true
