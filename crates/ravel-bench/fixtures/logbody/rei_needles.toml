# Pre-registration for the logbody_report REI arm (issue #3709, ADR-3692
# Plan row T11). Written before any run of the arm over these corpora; the
# needles were chosen from the LogHub template lists and each spelling was
# checked to occur in its corpus, without counting the lines or blocks that
# hold it. Read by `logbody_report --rei-needles` and checked by
# `ravel_bench::logbody::spec`.
#
# Per corpus: the corpus file inside its LogHub archive (Zenodo record
# 8196385), the records per block the run must use, five template needles
# (the decision's needles) and one id needle (the negative control), and a
# band [low, high] for every figure the arm prints. A run exits non-zero on a
# figure missing, printed twice, or outside its band.
#
# Pattern syntax: literal runs separated by `.*` (any bytes within one line).
#
# Band basis (predicted, 2026-11-04, before the first run):
# - lines and blocks are exact: wc -l of the file (plus one where the file
#   has no final newline), and the block count the writer cuts at
#   block_records per block in objects of 32 blocks.
# - compressed_bytes: RLOG objects at zstd level 3, predicted 5x to 30x below
#   the raw file size.
# - zstd_cpu_s: zstd level 3 at 30 to 3000 MB/s over the bodies.
# - trigram: 3 bytes per distinct trigram per block, predicted 5 % to 500 %
#   of compressed bytes; its build sorts every trigram of every block,
#   predicted 1x to 50x the zstd encode.
# - selected: the byte cap is 5 % of compressed bytes, and a few hundred
#   candidate grams with block postings are predicted under 1 %; its build is
#   one pass over the bodies with a table lookup per candidate trigram hit,
#   predicted 0.05x to 5x the zstd encode.
# - needle survival: a gram is a substring of the needle, so it occurs in at
#   least every block holding the needle, and the selected arm keeps only
#   grams in at most 10 % of blocks. A needle held by more than 10 % of
#   blocks therefore survives in every block on the selected arm. "rare"
#   below predicts a needle held by few blocks: selected survival at most
#   0.25. "common" predicts one held by most blocks: survival at least 0.5 on
#   both arms. "open" is no prediction of block spread: survival in [0, 1].
# - id needles: the selected arm's grams come from the template needles
#   only, so an id survives in every block unless a template gram is a
#   substring of it (none of these is); the trigram set keeps nearly every
#   block for an id (#2977 comment 6221085174: 1,363 of 1,365 HDFS blocks for
#   a block id), with wider bands where blocks are small or ids clustered.

schema = 1

# ---------------------------------------------------------------------------

[[corpus]]
name = "hdfs"
file = "HDFS.log"
source = "https://zenodo.org/records/8196385/files/HDFS_v1.zip"
block_records = 8192

[corpus.bands]
lines = [11175629, 11175629]
blocks = [1365, 1365]
compressed_bytes = [50e6, 600e6]
zstd_cpu_s = [0.5, 60]

[corpus.bands.trigram]
index_bytes = [5e6, 1.5e9]
index_bytes_share = [0.05, 5.0]
build_cpu_s = [1, 300]
build_cpu_over_zstd = [1, 50]

[corpus.bands.selected]
index_bytes = [2, 3e6]
index_bytes_share = [0, 0.01]
build_cpu_s = [0.05, 120]
build_cpu_over_zstd = [0.05, 5]
grams_selected = [0, 2000]

[corpus.bands.template.trigram]
blocks_surviving = [1, 1365]
survival_share = [0, 1]
false_positives = [0, 1365]
false_positive_share = [0, 1]

[corpus.bands.template.selected]
blocks_surviving = [1, 1365]
survival_share = [0, 1]
false_positives = [0, 1365]
false_positive_share = [0, 1]

[corpus.bands.id.trigram]
blocks_surviving = [1229, 1365]
survival_share = [0.9, 1]
false_positives = [1000, 1365]
false_positive_share = [0.9, 1]

[corpus.bands.id.selected]
blocks_surviving = [1229, 1365]
survival_share = [0.9, 1]
false_positives = [1000, 1365]
false_positive_share = [0.9, 1]

[[corpus.needle]]
id = "pending-replication-timeout"
kind = "template"
pattern = "PendingReplicationMonitor timed out block"
reason = "rare. Template E29, a NameNode replication timeout; few lines in the corpus. The camel-case name gives trigrams (gRe, nMo) no other template has, so the trigram set may prune it as well."
bands = { literal_run_bytes = [41, 41], true_holders = [1, 1365], selected = { survival_share = [0, 0.25] }, trigram = { survival_share = [0, 0.5] } }

[[corpus.needle]]
id = "delete-error"
kind = "template"
pattern = "Unexpected error trying to delete block"
reason = "rare. Template E20, a DataNode delete failure: rare and bursty. Its words are common English, so the trigram set is predicted to keep more blocks than the selected grams."
bands = { literal_run_bytes = [39, 39], true_holders = [1, 1365], selected = { survival_share = [0, 0.25] } }

[[corpus.needle]]
id = "serving-exception"
kind = "template"
pattern = "Got exception while serving"
reason = "open. Template E4, a DataNode read failure tied to client behaviour; no prior on how many blocks hold it."
bands = { literal_run_bytes = [27, 27], true_holders = [1, 1365] }

[[corpus.needle]]
id = "not-in-any-file"
kind = "template"
pattern = "does not belong to any file"
reason = "rare. Templates E24 and E28, addStoredBlock and blockMap updates for a block already deleted; the shared tail of both."
bands = { literal_run_bytes = [27, 27], true_holders = [1, 1365], selected = { survival_share = [0, 0.25] } }

[[corpus.needle]]
id = "verification-succeeded"
kind = "template"
pattern = "Verification succeeded for"
reason = "common. Template E2, the periodic DataBlockScanner line; predicted in most blocks, so no gram of it is under the 10 % threshold. The needle the arm cannot help."
bands = { literal_run_bytes = [26, 26], true_holders = [1, 1365], selected = { survival_share = [0.5, 1] }, trigram = { survival_share = [0.5, 1] } }

[[corpus.needle]]
id = "block-id"
kind = "id"
pattern = "blk_-1608999687919862906"
reason = "negative control: the block id on the corpus's first line, digits that recur across blocks."
bands = { literal_run_bytes = [24, 24], true_holders = [1, 136] }

