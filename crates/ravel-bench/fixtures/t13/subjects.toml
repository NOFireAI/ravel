# T13 pre-registration (issue #3711, epic #3692, ADR-3692 WP4).
#
# Committed alone, before any LogHub run. Every run parameter is read from
# here; `--param` on the command line is a check, refused on drift before the
# corpus is read. A figure carries `predict` and a `band` that can miss, or
# `unpredicted` with the reason no prediction is made. Later edits are new
# commits that say what moved and why.
#
# Corpora: LogHub (Zenodo 8196385), HDFS.log and BGL.log, checked by sha256.
#
# Prediction basis. The figures were calibrated on a generated HDFS-shaped
# corpus (3,000,000 lines, 144.8 B mean line, not LogHub; not checked in) at
# commit 31c52bb's code, then scaled to the LogHub inputs:
#   HDFS: 141.2 B mean line, about 15.6 B/row as a body+ts RLOG object
#         (21.5 B/row with the structural arm's trace_id column);
#   BGL:  156.5 B mean line, about 16.1 B/row (22 B/row with trace_id).
# Calibration figures the predictions lean on: structural ratio/bytes 1.072,
# ratio/gets 1, ratio/wall 0.474, structural uncomp 699,073 B of 12,455,785;
# sidecar over_postings 3.94, cpu_ratio 1.5065 (noisy, 1.47..1.53 across
# runs), bloom-guided miss 1,413,093 B and 3.058 GETs, sidecar miss
# 66,725 B and 2 GETs, bloom false positives 107 blocks over 150 pairs.
#
# Structural arm parameters. object_min/max_bytes is the 10 MB object the
# issue names (10..11 MiB). matched_rows 10 and latency_ms 30 are the issue's.
# coalesce_gap 1,887,437 is the production fetcher's effective gap
# (DEFAULT_LOG_REQUEST_COST_BYTES), so both plans coalesce under the same
# rule; floor_gap/* reports the 64 KiB floor alongside. mini_block_bytes 8192
# and 4 bytes of index per mini-block follow Lance's 8 KiB mini-block target.
# runs 5, medians reported.
#
# Sidecar arm parameters. object_rows 524,288 (64 blocks of 8192) matches the
# production writer's block size; HDFS takes 10 objects (5,242,880 lines) to
# keep one run under the executor's 600 s command limit, BGL 9 objects (its
# whole file holds 9 full ones). sidecar_stride 64 terms per block and a
# 64 KiB suffix probe; a rare token is one on at most 3 rows, 30 sampled with
# seed 13. scale_raw_bytes 1e11 is the issue's 100 GB.
#
# Expected decisions: structural NO-GO (bytes ratio about 1.07: at the
# production gap the ten target blocks coalesce into one range spanning the
# object, and Lance's saving needs a gap the request cost forbids); sidecar
# NO-GO (over_postings well above 1.2 because the sidecar is row-granular
# and postings are block-granular; cpu_ratio near the 1.5 bar either way).
#
# Object size against the plan whole-object bound (9,437,185 B): the sidecar
# objects are predicted at about 8.2 MB, below it, so the production default
# path and the crossover-off path are predicted at one whole-object GET per
# (token, object) pair, and plan_route_bytes_per_object at the object size
# with no suffix. An object above the bound misses those bands.

