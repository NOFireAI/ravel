# Pre-registration for string_fingerprint_report (issue #3710, ADR-3692 Plan
# row T12). Written before any corpus run. Read by
# `string_fingerprint_report` and checked by
# `ravel_bench::string_fingerprint::spec`.
#
# Interpretation decisions (good-faith readings of ambiguous task language;
# see also the three documented in string_fingerprint/mod.rs's module doc):
# - LogHub body columns carry Contains (LIKE) predicates only. A whole-row
#   Equals predicate against a raw log line is not groundable without the
#   corpus text: every real line embeds a timestamp or other per-row value,
#   so no literal line is known to recur. ClickBench's four Str columns
#   carry a mix: URL and Title keep Contains (the only Set L predicates
#   that exist against them, see below), SearchPhrase and Referer carry
#   Equals (an exact value match is a realistic predicate shape for them,
#   and the task names all four columns while only two have a documented
#   LIKE predicate).
# - ADR-2773 (docs/adrs/2773-hot-path-materialization.md) names "Set L" as
#   {q21, q22, q23, q24}, the LIKE declared-string scans. Its only real
#   literal predicates are `URL LIKE '%google%'` (q21/q22/q24) and
#   `Title LIKE '%Google%'` (q23). SearchPhrase and Referer appear in Set L
#   only in GROUP BY / ORDER BY / COUNT DISTINCT / REGEXP_REPLACE contexts,
#   never in a LIKE or equality filter; there is no grounded real literal
#   for either column anywhere in this repo. Their predicates below are
#   explicitly marked illustrative/unverified, not drawn from Set L.
#
# Network access was unavailable to this session: none of the four LogHub
# corpora (Zenodo record 8196385) or the ClickBench `hits.parquet` file
# could be downloaded, so no run has produced real figures against this
# file. See the final report for the NOT RUN (blocked) status.
#
# Band basis (predicted, 2026-11-05, before the first run):
# - LogHub lines/blocks/compressed_bytes/zstd_cpu_s bands, block_records,
#   and the fingerprint_* analogues of the "selected" arm's bands are
#   copied from crates/ravel-bench/fixtures/logbody/rei_needles.toml
#   (issue #3709 / T11), which operates on these same four corpus files
#   through the same BlockText/Pattern types: a corpus fact true there is
#   true here. `lines` there becomes this file's exact `contains.cells_total`
#   bound for a predicate whose bloom arm is inapplicable (the code sets
#   cells_tested = cells_total in that case, so both are exact), and the
#   loose bound otherwise (cells_tested <= cells_total when bloom narrows
#   the scan, a structural fact independent of corpus content).
# - Every LogHub predicate pattern below is either a verbatim needle from
#   rei_needles.toml (already checked by T11 to occur in its corpus) or a
#   literal substring of one. A Pattern match requires each of its literal
#   runs to appear verbatim in the matching line, so a substring of a
#   verified-occurring needle is itself verified to occur at least once:
#   true_holders bands use a floor of 1 on that basis, open above it (an
#   exact count needs the corpus, which this session could not fetch).
# - ClickBench `blocks` assumes block_records = 8192 against the ~100M-row,
#   8,424-object reference tenant in docs/query-engine.md; a column's text
#   export may not match that row count exactly, so the band is wide.
#   compressed_bytes, zstd_cpu_s, and the fingerprint_* bands for ClickBench
#   are fully open: this tool reads pre-exported row text, and exporting
#   the real `hits.parquet` columns was both out of scope (Parquet decoding
#   is not part of this task) and blocked (no network this session), so no
#   per-column size or CPU fact is grounded yet.
# - true_holders for ClickBench URL/Title "google"/"Google" predicates use a
#   floor of 1: ADR-2773 documents these as real Set L predicates that
#   return rows against the reference tenant. All other ClickBench
#   predicates (the unseen URL/Title substrings, and every SearchPhrase and
#   Referer predicate) are illustrative placeholders with no grounded
#   occurrence; their true_holders bands are fully open starting at 0, and
#   a human must replace the literal content with values observed in the
#   real corpus before the real run.
# - saturation_blocks_long / saturation_false_positive_share: fully open for
#   every column. No prior exists for long-row distribution in any of
#   these corpora without fetching them.

schema = 1

