# Pre-registration for the string fingerprint experiment (issue #3710,
# ADR-3692 work package 4, Plan row T12). Written before any real
# measurement was run, per the project's measurement discipline: every
# figure below is a prediction, not a fit, with one exception. After the
# first run, the `lines` bands of `openssh_body` and `apache_body` moved up
# by one (655,146 to 655,147 and 56,481 to 56,482): the predictions were
# `wc -l` counts, and the report counts records, which is one more when a
# file's last line has no trailing newline. No decision bar moved.
#
# Every subject writes its corpus as a declared `Str` attribute column named
# "value" (never the record body), with `block_records = 8192` (the
# production `RlogConfig::default().block_target_records`) so block counts
# and the bloom/contains baselines are measured at a realistic block size,
# not the tiny fixture size `test_subjects.toml` uses for its own plumbing
# test. `block_max_bytes` defaults to 8 MiB, i.e. about 1024 bytes/record at
# this block size; every subject's lines are well under that, so block
# counts below are predicted as `ceil(lines / 8192)` and not expected to be
# perturbed by the byte cap.
#
# `gram_len = 3`, `df_threshold = 0.5`, `budget_share = 0.01` uniformly: the
# budget share is set to the GO_BYTES_BAR itself (0.01), so the learned
# vocabulary is built to target the same 1% bar `decide()` checks it against.
#
# Corpora (4 LogHub body subjects):
#   Source: Zenodo record 8196385 (Loghub, CC-BY-4.0), confirmed live via the
#   Zenodo API at measurement time.
#     HDFS_v1.zip  186,645,559 bytes, sha256 04f919f2185821f23f045dca611a7586429bdabc601bd7b43f30005f8e289b01 -> HDFS.log    (11,175,629 lines, 1,577,982,906 bytes)
#     BGL.zip       57,489,019 bytes, sha256 d67fd82a711aea0157a9b83175892c6ee60e384a2ddf5bc51f39118453816da8 -> BGL.log     (4,747,963 lines, 743,185,031 bytes)
#     SSH.tar.gz     4,596,666 bytes, sha256 296610a35773f58b7c295e5407fc5ccdf48beb3c544fc14a6309addf904a2712 -> SSH.log     (655,147 lines (wc -l reports 655,146: the file has no trailing newline), 73,417,506 bytes)
#     Apache.tar.gz    262,905 bytes, sha256 f2cb5014453c8a0f71596838e1639a2131ff6d360839ad280409f621a6cac452 -> Apache.log  (56,482 lines (wc -l reports 56,481: the file has no trailing newline), 5,135,876 bytes)
#   Every archive's sha256 above is over the downloaded archive itself, not
#   its extracted contents.
#   Every LogHub subject below runs its FULL corpus (no --max-lines cap):
#   all four are tractable well within a single bounded run.
#
# Corpus (4 ClickBench subjects):
#   Source: https://datasets.clickhouse.com/hits_compatible/hits.parquet,
#   the public "hits_compatible" file the ClickBench benchmark
#   (https://github.com/ClickHouse/ClickBench) documents. This repository
#   carries no pinned URL/sha256/row-count for this file anywhere
#   (crates/ravel-bench/src/clickbench_parquet/ only ever builds a synthetic
#   fixture for its own tests); this is the well-known public source, and
#   the sha256/size below are what was actually observed on download, not a
#   pre-existing pinned value. FLAGGED in the task's final report as a gap
#   in the inherited task context.
#     hits.parquet  14,779,976,446 bytes, sha256 a390f6cb782f6aaef278c72fc1dd86c4f30bc843ebab3c159e9bd4d45ddb079f
#   SCOPE REDUCTION, also flagged in the final report: the full file is
#   ~100M rows; at the measured real throughput (~34s per 1,000,000 rows of
#   one column, written at realistic block_records=8192), one column's full
#   scan is on the order of an hour, which does not fit this session's
#   per-command execution budget (a background shell command here is not
#   guaranteed to survive much past 10 minutes) without a multi-hour,
#   multi-invocation chase. Every ClickBench subject below instead measures
#   a --max-lines 10000000 PREFIX of the column (the first 10,000,000 rows
#   of the file, about 10% of the real corpus) -- a real, not fabricated,
#   sample of real production-shaped data, clearly short of the full-corpus
#   run the original task likely intended.
schema = 1

