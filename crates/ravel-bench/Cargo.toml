[package]
name = "ravel-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ravel-types = { workspace = true }
ravel-proto = { workspace = true }
ravel-segment = { workspace = true }
ravel-otlp = { workspace = true }
ravel-ingest = { workspace = true }
ravel-object-store = { workspace = true }
ravel-catalog = { workspace = true }
ravel-commit = { workspace = true }
ravel-promql = { workspace = true }
ravel-query = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
blake3 = { workspace = true }
crc32c = { workspace = true }
lz4_flex = { workspace = true }
zstd = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
stats_alloc = "0.1.10"
# Gated behind `parquet-baseline` (off by default). arrow reuses the
# workspace pin (identical to ravel-otap's); parquet is pinned lockstep to
# the same major and is a new external dependency (see issue #97 report).
# `async` + `object_store` give the read-side accounting harness (phase b)
# the async Parquet reader over an object store; `object_store` and
# `futures` reuse the workspace pins already used by ravel-object-store.
arrow = { workspace = true, optional = true }
parquet = { version = "59", optional = true, features = ["async", "object_store"] }
# The read-side Parquet reader is driven through the `object_store` version
# `parquet` itself depends on (0.13), NOT the workspace pin (0.14), so the
# counting wrapper implements the same `ObjectStore` trait the async reader
# consumes. This is a bench-only second version, isolated to this crate; the
# RSEG path still goes through ravel-object-store (0.14) unchanged.
object_store = { version = "0.13", optional = true, features = ["aws"] }
futures = { workspace = true, optional = true }
# Gated behind `flight-egress` (off by default; issue #154). The egress bench
# drives the real Flight SQL service and the JSON encoder in-process, so it
# links ravel-sql with its `flight-sql` feature (which pulls datafusion, arrow
# 58, and arrow-flight) plus the transport types the DoGet path speaks.
# ravel-sql is an internal path crate not yet listed in the workspace
# `[workspace.dependencies]`, so it is named by path here; every other dep
# below reuses a workspace pin.
ravel-sql = { path = "../ravel-sql", version = "0.1.0", optional = true, features = ["flight-sql"] }
arrow-flight = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }

[features]
# Parquet baseline harness (issue #97). Off by default: the standard build
# and gates never compile arrow/parquet/object_store or the gated bins.
# Phase a (write-side `parquet_baseline`) and phase b (read-side
# `read_path_accounting`) share this one feature. `async-trait` moved to a
# required dependency when `catalog_resolve_bench` needed it for a plain
# (non-Parquet) `ObjectStoreBackend` impl, so it is no longer listed here.
parquet-baseline = [
    "dep:arrow",
    "dep:parquet",
    "dep:object_store",
    "dep:futures",
]
# Flight SQL vs JSON result-egress bench (issue #154). Off by default: it links
# ravel-sql/datafusion/arrow-flight on top of the standard build, so the plain
# gates never compile it or the `flight_sql_egress` bin.
flight-egress = [
    "dep:ravel-sql",
    "dep:arrow-flight",
    "dep:tonic",
    "dep:prost",
    "dep:futures",
]

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[lib]
# Only the criterion `[[bench]]` targets below understand `cargo bench`'s
# `--quick` flag; leaving the lib's own `bench = true` default would make
# `cargo bench -p ravel-bench -- --quick` also run its unit tests under the
# plain libtest harness, which rejects that flag.
bench = false

[[bin]]
name = "ingest_bench"
path = "src/bin/ingest_bench.rs"
bench = false

[[bin]]
name = "codec_bakeoff"
path = "src/bin/codec_bakeoff.rs"
bench = false

[[bin]]
name = "profile_hotspots"
path = "src/bin/profile_hotspots.rs"
bench = false

[[bin]]
name = "section_bytes_report"
path = "src/bin/section_bytes_report.rs"
bench = false

[[bin]]
name = "segment_alloc_profile"
path = "src/bin/segment_alloc_profile.rs"
bench = false

[[bin]]
name = "catalog_resolve_bench"
path = "src/bin/catalog_resolve_bench.rs"
bench = false

[[bin]]
name = "selective_read_accounting"
path = "src/bin/selective_read_accounting.rs"
bench = false

[[bin]]
name = "parquet_baseline"
path = "src/bin/parquet_baseline.rs"
required-features = ["parquet-baseline"]
bench = false

[[bin]]
name = "read_path_accounting"
path = "src/bin/read_path_accounting.rs"
required-features = ["parquet-baseline"]
bench = false

[[bin]]
name = "flight_sql_egress"
path = "src/bin/flight_sql_egress.rs"
required-features = ["flight-egress"]
bench = false

[[test]]
name = "read_accounting"
path = "tests/read_accounting.rs"
bench = false

[[test]]
name = "gorilla_vs_raw"
path = "tests/gorilla_vs_raw.rs"
bench = false

[[test]]
name = "alignment_measurement"
path = "tests/alignment_measurement.rs"
bench = false

[[test]]
name = "codec_roundtrip"
path = "tests/codec_roundtrip.rs"
bench = false

[[test]]
name = "catalog_byte_gates"
path = "tests/catalog_byte_gates.rs"
bench = false

[[bench]]
name = "segment_encode"
harness = false

[[bench]]
name = "segment_decode_full"
harness = false

[[bench]]
name = "segment_decode_selective"
harness = false

[[bench]]
name = "series_id_hash"
harness = false

[[bench]]
name = "matcher_scaling"
harness = false

[lints]
workspace = true
