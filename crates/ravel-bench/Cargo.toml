[package]
name = "ravel-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ravel-types = { workspace = true }
ravel-proto = { workspace = true }
ravel-segment = { workspace = true }
ravel-otlp = { workspace = true }
ravel-ingest = { workspace = true }
ravel-object-store = { workspace = true }
ravel-catalog = { workspace = true }
ravel-commit = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
blake3 = { workspace = true }
crc32c = { workspace = true }
lz4_flex = { workspace = true }
zstd = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
stats_alloc = "0.1.10"
# Gated behind `parquet-baseline` (off by default). arrow reuses the
# workspace pin (identical to ravel-otap's); parquet is pinned lockstep to
# the same major and is a new external dependency (see issue #97 report).
arrow = { workspace = true, optional = true }
parquet = { version = "59", optional = true }

[features]
# Write-side Parquet baseline harness (issue #97 phase a). Off by default:
# the standard build and gates never compile arrow/parquet or the
# parquet_baseline bin.
parquet-baseline = ["dep:arrow", "dep:parquet"]

[dev-dependencies]
criterion = { workspace = true }

[lib]
# Only the criterion `[[bench]]` targets below understand `cargo bench`'s
# `--quick` flag; leaving the lib's own `bench = true` default would make
# `cargo bench -p ravel-bench -- --quick` also run its unit tests under the
# plain libtest harness, which rejects that flag.
bench = false

[[bin]]
name = "ingest_bench"
path = "src/bin/ingest_bench.rs"
bench = false

[[bin]]
name = "profile_hotspots"
path = "src/bin/profile_hotspots.rs"
bench = false

[[bin]]
name = "segment_alloc_profile"
path = "src/bin/segment_alloc_profile.rs"
bench = false

[[bin]]
name = "parquet_baseline"
path = "src/bin/parquet_baseline.rs"
required-features = ["parquet-baseline"]
bench = false

[[test]]
name = "gorilla_vs_raw"
path = "tests/gorilla_vs_raw.rs"
bench = false

[[test]]
name = "alignment_measurement"
path = "tests/alignment_measurement.rs"
bench = false

[[bench]]
name = "segment_encode"
harness = false

[[bench]]
name = "segment_decode_full"
harness = false

[[bench]]
name = "segment_decode_selective"
harness = false

[[bench]]
name = "series_id_hash"
harness = false

[lints]
workspace = true
