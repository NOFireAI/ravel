[package]
name = "ravel-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
ravel-types = { workspace = true }
ravel-proto = { workspace = true }
ravel-codec = { workspace = true }
ravel-segment = { workspace = true }
ravel-logseg = { workspace = true }
ravel-otlp = { workspace = true }
ravel-ingest = { workspace = true }
ravel-object-store = { workspace = true }
ravel-catalog = { workspace = true }
ravel-commit = { workspace = true }
ravel-maintain = { workspace = true }
ravel-promql = { workspace = true }
prost = { workspace = true }
ravel-query = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
blake3 = { workspace = true }
crc32c = { workspace = true }
lz4_flex = { workspace = true }
zstd = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The distrib crossover bench spins in-process `tonic` loopback
# `SeriesFetch` workers to drive the real ADR-0071 distributed fan-out, exactly
# as ravel-query's own acceptance test does. `tonic` (default features: the
# server transport plus the client `channel`) is already a workspace pin used by
# ravel-query/ravel-server; here it is a plain dependency of the standard build,
# not gated, since the crossover bin and its smoke test are part of the default
# gate. No new external crate enters the workspace.
tonic = { workspace = true }
stats_alloc = "0.1.10"
# Gated behind `parquet-baseline` (off by default). arrow reuses the
# workspace pin (identical to ravel-otap's); parquet is pinned lockstep to
# the same major and is a new external dependency.
# `async` + `object_store` give the read-side accounting harness (phase b)
# the async Parquet reader over an object store; `object_store` and
# `futures` reuse the workspace pins already used by ravel-object-store.
arrow = { workspace = true, optional = true }
parquet = { version = "59", optional = true, features = ["async", "object_store"] }
# The read-side Parquet reader is driven through the `object_store` version
# `parquet` itself depends on (0.13), NOT the workspace pin (0.14), so the
# counting wrapper implements the same `ObjectStore` trait the async reader
# consumes. This is a bench-only second version, isolated to this crate; the
# RSEG path still goes through ravel-object-store (0.14) unchanged.
object_store = { version = "0.13", optional = true, features = ["aws"] }
futures = { workspace = true, optional = true }
# Gated behind `flight-egress` (off by default). The egress bench
# drives the real Flight SQL service and the JSON encoder in-process, so it
# links ravel-sql with its `flight-sql` feature (which pulls datafusion, arrow
# 58, and arrow-flight) plus the transport types the DoGet path speaks.
# ravel-sql is an internal path crate not yet listed in the workspace
# `[workspace.dependencies]`, so it is named by path here; every other dep
# below reuses a workspace pin.
ravel-sql = { path = "../ravel-sql", version = "0.10.0", optional = true, features = ["flight-sql"] }
# Gated behind `sql-latency`. The spans-scan bench lane (`src/spans_scan.rs`)
# writes its RSPAN corpus with the real span writer and drives `SpansScanExec`
# directly, so it needs the writer/record types (`RspanWriter`, `SpanRecord`,
# `SpanEvent`, `reconstruct_events_raw`) and `SpanQuery` that ravel-sql does not
# re-export. Reuses the workspace pin; ravel-sql already links ravel-rspan, so
# no second copy enters the workspace.
ravel-rspan = { workspace = true, optional = true }
arrow-flight = { workspace = true, optional = true }
# Gated behind `sql-latency` (off by default). The groupby scaling bench reads
# the real physical plan (`displayable`, `ExecutionPlan::output_partitioning`)
# to record what each swept combination actually did, so it needs datafusion in
# scope. Not a new external crate to the workspace: ravel-sql already pins and
# links datafusion 54 with the same version/features, so feature unification
# resolves this to that same instance rather than a second copy.
datafusion = { version = "54", default-features = false, features = ["sql"], optional = true }
# Gated behind `sql-latency`. The logs scan-partitioning scaling bench
# (`logs_scan_scaling`) wires ADR-0046's read cache into `LogSegmentFetcher` so
# it can report the object-store request count with and without the cache's
# single-flight coalescing. Reuses the workspace pin ravel-query/ravel-sql
# already link; no new external crate enters the workspace.
ravel-cache = { workspace = true, optional = true }
# Gated behind `profiling` (off by default). CPU flamegraph lane for the
# ingest and query bench bins (issue #365). pprof is a NEW external
# dependency, NOT a workspace pin; its `flamegraph` feature pulls `inferno`
# for the SVG writer, and the default `cpp` feature supplies the unwinder and
# symbol demangling. It builds and its SVG test passes on both Linux and
# macOS (darwin).
#
# It is an OPTIONAL regular dependency, not a dev-dependency: Cargo forbids an
# optional dev-dependency, and the lane must be reachable from the `[[bin]]`
# targets (dev-dependencies are visible only to tests/benches/examples, never
# to bins or the lib). Optional + feature-gated keeps it out of a default
# build exactly as the arrow/parquet lane above does.
pprof = { version = "0.15", optional = true, features = ["flamegraph"] }

[features]
# Parquet baseline harness. Off by default: the standard build
# and gates never compile arrow/parquet/object_store or the gated bins.
# Phase a (write-side `parquet_baseline`) and phase b (read-side
# `read_path_accounting`) share this one feature. `async-trait` moved to a
# required dependency when `catalog_resolve_bench` needed it for a plain
# (non-Parquet) `ObjectStoreBackend` impl, so it is no longer listed here.
parquet-baseline = [
    "dep:arrow",
    "dep:parquet",
    "dep:object_store",
    "dep:futures",
]
# Flight SQL vs JSON result-egress bench. Off by default: it links
# ravel-sql/datafusion/arrow-flight on top of the standard build, so the plain
# gates never compile it or the `flight_sql_egress` bin.
# `tonic` is a plain (non-optional) dependency now (the distrib crossover bench
# needs it), so it is no longer listed here as a `dep:` activation.
flight-egress = [
    "dep:ravel-sql",
    "dep:arrow-flight",
    "dep:futures",
]
# CPU flamegraph lane (issue #365). Off by default: a default build and the
# plain gates never link `pprof`/`inferno`. When on, the ingest and query
# bench bins wrap their measured region in a sampler when
# `RAVEL_BENCH_PROFILE_SVG` names an output path (see `src/profiling.rs`).
profiling = ["dep:pprof"]
# Per-stage ingest timing (ADR-0104 decision 2b). Off by default: the shipping
# `ingest_bench` bin compiles and runs in BOTH modes and only emits the
# stage-breakdown field with this on, so no default gate stops covering the bin
# and the default build never fails on a cfg-gated seam. Forwards to
# `ravel-ingest/stage-timing`, which compiles the monotonic `Instant` seam into
# the metrics/logs actors. Adds no new external dependency.
stage-timing = ["ravel-ingest/stage-timing"]
# The ADR-0100 decision 3 SQL corpus (`src/sql_corpus.rs`) and, once #428
# lands, the `sql_latency_bench` harness that runs it. Off by default: the
# corpus gate reads `ravel_sql::conformance::registry()`, so it activates the
# same optional `ravel-sql` entry `flight-egress` uses (no second entry, so no
# second datafusion/arrow activation) and the plain gates never compile it.
sql-latency = ["dep:ravel-sql", "dep:datafusion", "dep:ravel-cache", "dep:ravel-rspan", "dep:futures"]
# The `sql_latency_bench --flight` lane (issue #680): the same corpus executed
# through a running `ravel-server`'s Flight SQL endpoint instead of an
# in-process executor. Off by default. No new external crate: `arrow-flight`
# is already the optional dependency `flight-egress` activates, at the same
# workspace pin, and `ravel-sql` is already linked with its `flight-sql`
# feature by the `sql-latency` entry above, so the client type and the service
# it talks to come from one arrow-flight instance.
flight-lane = ["sql-latency", "dep:arrow-flight", "dep:futures"]

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
# Corpus-loader tests write malformed and well-formed corpus files to a temp
# directory that cleans itself up; workspace pin, no new external crate.
tempfile = { workspace = true }

[lib]
# Only the criterion `[[bench]]` targets below understand `cargo bench`'s
# `--quick` flag; leaving the lib's own `bench = true` default would make
# `cargo bench -p ravel-bench -- --quick` also run its unit tests under the
# plain libtest harness, which rejects that flag.
bench = false

